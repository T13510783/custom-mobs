  <!--
    The Joker (Arthur Fleck, fan model, vanilla+ humanoid): crimson suit, mustard waistcoat, green shirt, clown paint.
    - Shared UI from ../_shared/: viewer.css (look) + viewer.js (expression menu, MobViewer.face(dt)).
    - Rig: head 8x8x8 right on the torso top (no neck), body 8x12x4, 2-bone arms (arm_/forearm_) and legs
      (leg_/knee_), feet at y = 0. Coat tails hang on the thighs; hair locks, back hair and coat tails are springs.
    - Face: the painted eyes, brows and mouth are thin planes on the head front, so they blink, glance, frown and
      grin. Blue painted eyelids slide over the eyes. Mouth = the standard type (lip line + teeth plate).
    - Animations: 1 Idle, 2 Idle 2 (laughing fit), 3 Walk (street strut), 4 Attack (revolver), 5 Dance (the stairs).
      Follow mouse (eye button), Show bones (B), reset camera (R). Extra Joker expressions: Grin, Laugh, Smug, Manic.
    - Test modes: #cliptest, #rest, #shot-<anim>-<variant>-<sec>[-<cam>[-<expression>]] (variant: always 0).
  -->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────── Setup ─────────
   Rig units are texels; the mob root is scaled by 1/16 so 16 texels = 1 block. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const filt = (dt, rate) => 1 - Math.exp(-dt * rate);   // per-frame smoothing factor (frame-rate independent)
const softLim = (x, l) => l * Math.tanh(x / l);        // soft limit: no hard corner at the edge
const pos2 = (x) => (x > 0 ? x * x : 0);                // max(0, x)^2: smooth where it starts
const softAbs = (x, e) => Math.sqrt(x * x + e * e) - e; // |x| without the corner at 0
const softPos = (x, e) => 0.5 * (x + Math.sqrt(x * x + e * e));          // max(0, x) without the corner
const softplus = (x, k) => k * Math.log1p(Math.exp(Math.min(50, x / k))); // smooth floor at 0

/* ───────── Palette ───────── */

/**
 * COLOR PALETTE — Matched directly to the Arthur Fleck / Joker reference photos:
 * - Crimson/Burgundy tailored suit jacket & trousers
 * - Golden-mustard waistcoat (vest)
 * - Emerald/Teal green patterned dress shirt
 * - Chalky white face paint, crimson smile/nose/brows, slate-blue eye diamonds & tear drip
 * - Swept-back mossy/olive green hair
 * - Two-tone brown vintage wingtip dress shoes
 */
const PALETTE = {
    // Face paint & skin
    paintLight: '#f0f2f5',
    paintBase:  '#e2e5ea',
    paintShade: '#cbd0d8',
    paintDark:  '#b0b7c2',
    skinLight:  '#dca588',
    skinBase:   '#c98d6e',
    skinShade:  '#a86f52',
    skinDark:   '#87543b',

    // Clown makeup accents
    makeupRedLight: '#cc2424',
    makeupRedBase:  '#a61717',
    makeupRedDark:  '#780e0e',
    makeupBlueLight:'#26799e',
    makeupBlueBase: '#185875',
    makeupBlueDark: '#0f3c52',
    eyeDark:        '#1d242b',
    eyeSclera:      '#d9dee3',

    // Mossy / Olive green hair
    hairHighlight: '#6b9c3e',
    hairLight:     '#527d2c',
    hairBase:      '#3c611e',
    hairShade:     '#2b4714',
    hairDark:      '#1c300c',

    // Crimson Red Suit
    suitHighlight: '#cf2d2d',
    suitLight:     '#b52121',
    suitBase:      '#9c1919',
    suitShade:     '#7d1212',
    suitDark:      '#5e0c0c',
    suitDeep:      '#420707',

    // Golden-Mustard Waistcoat (Vest)
    vestHighlight: '#f2b12e',
    vestLight:     '#e09b1b',
    vestBase:      '#c78310',
    vestShade:     '#a3670a',
    vestDark:      '#7d4c05',

    // Emerald-Teal Dress Shirt
    shirtHighlight:'#20876e',
    shirtLight:    '#166e58',
    shirtBase:     '#105745',
    shirtShade:    '#0b4032',
    shirtDark:     '#072b21',

    // Vintage Brown Wingtip Shoes
    shoeHighlight: '#855331',
    shoeLight:     '#693f22',
    shoeBase:      '#4d2c16',
    shoeDark:      '#2b170b',
    shoeSole:      '#170d06'
};

/* ───────── Texture + box factory ─────────
   Crisp pixel-art CanvasTextures (NearestFilter): one texture per box face, 1 texel = 1 pixel. */
function createPixelTexture(w, h, drawFn) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Helper functions passed to the drawing callback
    const api = {
        ctx, w, h,
        fill(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, w, h); },
        rect(x, y, rw, rh, color) { ctx.fillStyle = color; ctx.fillRect(x, y, rw, rh); },
        px(x, y, color) { ctx.fillStyle = color; ctx.fillRect(x, y, 1, 1); },
        noise(x, y, rw, rh, colors, density = 0.35, seedOffset = 0) {
            for (let ix = x; ix < x + rw; ix++) {
                for (let iy = y; iy < y + rh; iy++) {
                    const hash = Math.sin((ix * 12.9898 + iy * 78.233 + seedOffset) * 43758.5453);
                    const frac = hash - Math.floor(hash);
                    if (frac < density) {
                        ctx.fillStyle = colors[Math.floor((frac / density) * colors.length)];
                        ctx.fillRect(ix, iy, 1, 1);
                    }
                }
            }
        }
    };
    drawFn(api);

    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

/**
 * 6 materials for a box of [w, h, d] texels. Face order of BoxGeometry:
 * 0: right (+X), 1: left (-X), 2: top (+Y), 3: bottom (-Y), 4: front (+Z), 5: back (-Z).
 * options.crop = { full, y0 }: a limb segment. Its side faces are painted at the full limb height and show only
 *   rows y0 .. y0 + h, so the two segments of an arm or leg show exactly the one 12-high texture together.
 * options.override = { face: painter }: replaces single faces (the hidden inner ends of a segment).
 */
function createBoxMaterials(w, h, d, facePainters, options = {}) {
    const tw = Math.max(1, Math.round(w));
    const th = Math.max(1, Math.round(h));
    const td = Math.max(1, Math.round(d));
    const dims = [[td, th], [td, th], [tw, td], [tw, td], [tw, th], [tw, th]];
    const keys = ['right', 'left', 'top', 'bottom', 'front', 'back'];
    const crop = options.crop;

    return keys.map((key, idx) => {
        const [fw, fh] = dims[idx];
        const painter = (options.override && options.override[key]) || facePainters[key] || facePainters.all || ((p) => p.fill('#ff00ff'));
        let tex;
        if (crop && (idx < 2 || idx > 3) && !(options.override && options.override[key])) {
            tex = createPixelTexture(fw, crop.full, painter);
            tex.repeat.set(1, fh / crop.full);                   // canvas row 0 = top of the face (flipY)
            tex.offset.set(0, 1 - (crop.y0 + fh) / crop.full);
        } else tex = createPixelTexture(fw, fh, painter);
        return new THREE.MeshStandardMaterial({
            map: tex,
            roughness: Math.max(0.7, options.roughness ?? 0.82),  // >= 0.7: no glossy strips (mod has no gloss)
            metalness: options.metalness ?? 0.05,
            emissive: options.emissive ? new THREE.Color(options.emissive) : new THREE.Color(0x000000),
            emissiveIntensity: options.emissive ? 1 : 0,
            transparent: !!options.transparent,
            alphaTest: options.alphaTest || 0
        });
    });
}

// A box of [w, h, d] texels with painted faces
function createVoxelBox(w, h, d, facePainters, options = {}) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), createBoxMaterials(w, h, d, facePainters, options));
    mesh.castShadow = options.castShadow ?? true;
    mesh.receiveShadow = options.receiveShadow ?? true;
    return mesh;
}

/* ───────── Painters ───────── */

/**
 * PROCEDURAL 16x16 PIXEL ART PAINTERS FOR THE JOKER
 */
const JokerTextures = {
    // 1. HEAD (8x8x8 pixels)
    head: {
        front(p) {
            // Base skin around edges & jawline
            p.fill(PALETTE.skinBase);
            p.rect(0, 0, 8, 1, PALETTE.hairBase); // Top hairline edge
            p.px(0, 0, PALETTE.hairShade);
            p.px(7, 0, PALETTE.hairShade);

            // Chalky white greasepaint covering face (with organic uneven edges)
            p.rect(1, 0, 6, 7, PALETTE.paintBase);
            p.rect(0, 1, 8, 5, PALETTE.paintBase);
            p.rect(2, 7, 4, 1, PALETTE.paintShade); // Chin paint

            // Subtle chalky shading & forehead wrinkles
            p.rect(2, 0, 4, 1, PALETTE.paintLight);
            p.px(1, 1, PALETTE.paintShade);
            p.px(6, 1, PALETTE.paintShade);
            p.px(0, 5, PALETTE.paintShade);
            p.px(7, 5, PALETTE.paintShade);

            // Skin peeking at lower jaw corners
            p.px(0, 6, PALETTE.skinShade);
            p.px(7, 6, PALETTE.skinShade);
            p.px(0, 7, PALETTE.skinDark);
            p.px(1, 7, PALETTE.skinBase);
            p.px(6, 7, PALETTE.skinBase);
            p.px(7, 7, PALETTE.skinDark);

            // Row 1: greasepaint under the red brows. The brows are face planes (brow_ bones, same 2 red pixels each),
            // so a raised or frowning brow never shows a second painted copy under it.
            p.rect(1, 1, 2, 1, PALETTE.paintBase);
            p.rect(5, 1, 2, 1, PALETTE.paintBase);

            // Teal-blue eye diamonds (Rows 2, 3, 4)
            // Upper diamond points (Row 2)
            p.px(1, 2, PALETTE.makeupBlueBase);
            p.px(2, 2, PALETTE.makeupBlueLight);
            p.px(5, 2, PALETTE.makeupBlueLight);
            p.px(6, 2, PALETTE.makeupBlueBase);

            // Eyes row (Row 3)
            p.px(1, 3, PALETTE.eyeSclera);
            p.px(2, 3, PALETTE.eyeDark);
            p.px(5, 3, PALETTE.eyeDark);
            p.px(6, 3, PALETTE.eyeSclera);

            // Lower blue diamond points under eyes (Row 4)
            p.px(1, 4, PALETTE.makeupBlueDark);
            p.px(2, 4, PALETTE.makeupBlueBase);
            p.px(5, 4, PALETTE.makeupBlueBase);
            p.px(6, 4, PALETTE.makeupBlueDark);

            // Iconic smeared blue tear streak dripping down left eye (viewer's right, x=5, y=5)
            p.px(5, 5, PALETTE.makeupBlueLight);

            // Red painted nose (Row 4, center x=3,4)
            p.px(3, 4, PALETTE.makeupRedLight);
            p.px(4, 4, PALETTE.makeupRedBase);

            // Wide smeared crimson smile (Rows 5, 6, 7)
            // Cheek upturns (Row 5)
            p.px(1, 5, PALETTE.makeupRedLight);
            p.px(6, 5, PALETTE.makeupRedLight);
            // Main mouth & lips (Row 6)
            p.px(1, 6, PALETTE.makeupRedBase);
            p.px(2, 6, PALETTE.makeupRedDark);
            p.px(3, 6, PALETTE.makeupRedDark);
            p.px(4, 6, PALETTE.makeupRedDark);
            p.px(5, 6, PALETTE.makeupRedDark);
            p.px(6, 6, PALETTE.makeupRedBase);
            // Lower lip smear (Row 7)
            p.px(3, 7, PALETTE.makeupRedBase);
            p.px(4, 7, PALETTE.makeupRedBase);
        },
        right(p) {
            // Skin & ear + swept back green hair
            p.fill(PALETTE.skinBase);
            p.rect(0, 0, 8, 2, PALETTE.hairBase);
            p.rect(3, 0, 5, 7, PALETTE.hairBase);
            p.noise(3, 0, 5, 7, [PALETTE.hairLight, PALETTE.hairShade, PALETTE.hairDark], 0.55, 11);
            // White paint edge near front of face (left side of right face)
            p.rect(0, 1, 1, 5, PALETTE.paintShade);
            // Ear detail
            p.px(2, 3, PALETTE.skinShade);
            p.px(2, 4, PALETTE.skinDark);
        },
        left(p) {
            p.fill(PALETTE.skinBase);
            p.rect(0, 0, 8, 2, PALETTE.hairBase);
            p.rect(0, 0, 5, 7, PALETTE.hairBase);
            p.noise(0, 0, 5, 7, [PALETTE.hairLight, PALETTE.hairShade, PALETTE.hairDark], 0.55, 22);
            // White paint edge near front of face (right side of left face)
            p.rect(7, 1, 1, 5, PALETTE.paintShade);
            // Ear detail
            p.px(5, 3, PALETTE.skinShade);
            p.px(5, 4, PALETTE.skinDark);
        },
        top(p) {
            // Swept-back green hair strands
            p.fill(PALETTE.hairBase);
            for (let x = 0; x < 8; x++) {
                const c = (x % 2 === 0) ? PALETTE.hairLight : PALETTE.hairShade;
                p.rect(x, 0, 1, 8, c);
            }
            p.noise(0, 0, 8, 8, [PALETTE.hairHighlight, PALETTE.hairDark], 0.35, 33);
            // Forehead white edge at front bottom of top face
            p.rect(2, 7, 4, 1, PALETTE.paintBase);
        },
        back(p) {
            p.fill(PALETTE.hairBase);
            for (let x = 0; x < 8; x++) {
                p.rect(x, 0, 1, 8, (x % 2 === 0) ? PALETTE.hairShade : PALETTE.hairBase);
            }
            p.noise(0, 0, 8, 8, [PALETTE.hairLight, PALETTE.hairDark, PALETTE.hairHighlight], 0.5, 44);
        },
        bottom(p) {
            p.fill(PALETTE.skinDark);
            p.rect(2, 0, 4, 3, PALETTE.paintDark);
        }
    },

    // 2. HAIR LOCKS (Reusable mossy green wavy texture)
    hairLayer: {
        all(p) {
            p.fill(PALETTE.hairBase);
            for (let x = 0; x < p.w; x++) {
                if (x % 2 === 0) p.rect(x, 0, 1, p.h, PALETTE.hairShade);
            }
            p.noise(0, 0, p.w, p.h, [PALETTE.hairHighlight, PALETTE.hairLight, PALETTE.hairDark], 0.55, 77);
        }
    },

    // 3. TORSO BASE (8x12x4) — Shows Emerald Green Shirt + Golden Waistcoat + Red Trousers Waist
    torso: {
        front(p) {
            // Base golden-mustard waistcoat
            p.fill(PALETTE.vestBase);
            p.noise(0, 0, 8, 10, [PALETTE.vestLight, PALETTE.vestShade], 0.35, 101);

            // Deep Emerald-Teal patterned shirt at upper chest & neck (y = 0..4)
            p.rect(2, 0, 4, 3, PALETTE.shirtBase);
            p.rect(3, 3, 2, 2, PALETTE.shirtBase);
            // Subtle circular pattern highlights on green shirt
            p.px(2, 0, PALETTE.shirtHighlight);
            p.px(4, 1, PALETTE.shirtHighlight);
            p.px(3, 2, PALETTE.shirtLight);
            p.px(4, 3, PALETTE.shirtHighlight);
            // Open neck skin at very top center
            p.rect(3, 0, 2, 1, PALETTE.skinShade);

            // Shirt collar shading
            p.px(2, 2, PALETTE.shirtDark);
            p.px(5, 2, PALETTE.shirtDark);

            // Waistcoat V-neck border highlights
            p.px(2, 3, PALETTE.vestHighlight);
            p.px(5, 3, PALETTE.vestHighlight);
            p.px(3, 5, PALETTE.vestHighlight);
            p.px(4, 5, PALETTE.vestLight);

            // Waistcoat center seam & buttons (y = 5..9)
            p.rect(4, 5, 1, 5, PALETTE.vestShade);
            p.px(3, 5, PALETTE.vestDark);
            p.px(3, 7, PALETTE.vestDark);
            p.px(3, 9, PALETTE.vestDark);

            // Waistcoat pockets & shading
            p.rect(1, 7, 2, 1, PALETTE.vestDark);
            p.rect(5, 7, 2, 1, PALETTE.vestDark);

            // Bottom V-cut notches of the yellow vest exposing the red trousers underneath (y = 10..11)
            p.rect(0, 10, 8, 2, PALETTE.suitBase);
            p.rect(3, 10, 2, 2, PALETTE.suitDark); // Center notch between vest points
            // Two golden vest points hanging down at x=1..2 and x=5..6 on row 10
            p.rect(1, 10, 2, 1, PALETTE.vestBase);
            p.rect(5, 10, 2, 1, PALETTE.vestBase);
            p.px(2, 11, PALETTE.vestShade);
            p.px(5, 11, PALETTE.vestShade);
        },
        back(p) {
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, 8, 12, [PALETTE.suitLight, PALETTE.suitShade], 0.4, 102);
            // Center back seam of suit jacket
            p.rect(4, 0, 1, 12, PALETTE.suitShade);
            // Green collar edge at top
            p.rect(2, 0, 4, 1, PALETTE.shirtShade);
        },
        right(p) {
            p.fill(PALETTE.suitShade);
            p.noise(0, 0, 4, 12, [PALETTE.suitBase, PALETTE.suitDark], 0.4, 103);
        },
        left(p) {
            p.fill(PALETTE.suitShade);
            p.noise(0, 0, 4, 12, [PALETTE.suitBase, PALETTE.suitDark], 0.4, 104);
        },
        top(p) {
            p.fill(PALETTE.shirtBase);
            p.rect(0, 0, 2, 4, PALETTE.suitBase);
            p.rect(6, 0, 2, 4, PALETTE.suitBase);
        },
        bottom(p) {
            p.fill(PALETTE.suitDark);
        }
    },

    // 4. SUIT JACKET OUTER PANELS & LAPELS
    suitPanel: {
        front(p) {
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, p.w, p.h, [PALETTE.suitLight, PALETTE.suitShade], 0.35, 201);
            // Subtle inner lapel highlight along inner edge
            p.rect(0, 0, 1, p.h, PALETTE.suitHighlight);
            // Pocket welt detail
            if (p.h >= 10) {
                p.rect(0, 8, p.w, 1, PALETTE.suitDark);
                p.rect(0, 9, p.w, 1, PALETTE.suitHighlight);
            }
        },
        all(p) {
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, p.w, p.h, [PALETTE.suitLight, PALETTE.suitShade, PALETTE.suitDark], 0.4, 202);
        }
    },

    // 5. ARMS (4x12x4) — Red Suit Sleeve + Emerald Green Cuff + Painted/Skin Hands
    arm: {
        all(p) {
            // Suit sleeve top (y = 0..8)
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, p.w, 9, [PALETTE.suitLight, PALETTE.suitShade], 0.4, 301);
            p.rect(0, 8, p.w, 1, PALETTE.suitDark);

            // Emerald green patterned shirt cuff peeking out at wrist (y = 9)
            p.rect(0, 9, p.w, 1, PALETTE.shirtLight);
            p.px(1, 9, PALETTE.shirtHighlight);
            p.px(3, 9, PALETTE.shirtShade);

            // Hand skin & knuckles (y = 10..11)
            p.rect(0, 10, p.w, 2, PALETTE.skinBase);
            p.rect(0, 11, p.w, 1, PALETTE.skinShade);
            p.px(1, 10, PALETTE.skinLight);
        },
        top(p) {
            p.fill(PALETTE.suitLight);
            p.noise(0, 0, 4, 4, [PALETTE.suitBase, PALETTE.suitHighlight], 0.35, 302);
        },
        bottom(p) {
            p.fill(PALETTE.skinDark);
        }
    },

    // 6. LEGS (4x12x4) — Crimson Suit Trousers + Vintage Brown Leather Wingtip Shoes
    leg: {
        front(p) {
            // Crimson trousers (y = 0..9)
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, 4, 10, [PALETTE.suitLight, PALETTE.suitShade], 0.35, 401);
            // Crisp vertical trouser crease down center
            p.rect(1, 0, 1, 9, PALETTE.suitHighlight);
            p.rect(3, 0, 1, 10, PALETTE.suitShade);

            // Vintage two-tone brown dress shoes (y = 10..11)
            p.rect(0, 10, 4, 2, PALETTE.shoeBase);

    M[i] = d0 * d1 <= 0 ? 0 : 2 * d0 * d1 / (d0 + d1);

    if (t <= T[0]) return V[0];
    if (t >= T[n - 1]) return V[n - 1];

    const h = T[i] - T[i - 1], u = (t - T[i - 1]) / h, u2 = u * u, u3 = u2 * u;

/* ───────── Animations ─────────

   Signs: x + = limb back / head chin down / shin back, arm z outward (right -, left +), y + = turn to his left. */
const FACE_KEYS = ['brow', 'tilt', 'smile', 'open', 'teeth', 'squint', 'wide', 'glance', 'look', 'laugh', 'arch', 'shut'];

const ANIMS = {
  // 1 · Idle: brooding Arthur. Slumped, uneven shoulders, head low, slow breathing; a nervous tic at ~4.1 s
  idle: { T: 6, fn(t, Q) {

  // 2 · Idle 2: the laughing fit. A giggle grows into a full fit (shoulders shake, head tossed), his left hand comes

  idle2: { T: 8, fn(t, Q) {

    const bob = 0.07 * L * (0.5 + 0.5 * ha);                    // knees give with each laugh: the hips bounce
    Q.r.leg_right = [-0.04 - bob, 0, -0.03]; Q.r.knee_right = [0.06 + 2 * bob, 0, 0];

    Q.f.squint = 0.4 * L + 0.5 * C; Q.f.brow = 0.25 * L - 0.1 * C; Q.f.look = 0.25 * L - 0.5 * C; Q.f.open = 0.05;

  // 3 · Walk: the street strut (reference: joker_street_strut.jpg). Swaggering hips, right hand up gesturing with

    Q.r.arm_left = [0.05 + 0.04 * s, 0.1, 0.1]; Q.r.forearm_left = [-0.36, 0, 0];   // hand in the trouser pocket

  // 4 · Attack: revolver draw, aim, BANG with recoil + muzzle flash, giggling recovery
  attack: { T: ATK_T, fn(t, Q) {

    Q.r.arm_right = [-0.45 + 0.35 * cB, 0, -1.15 - 0.45 * sB];
    Q.r.arm_left = [-0.45 - 0.35 * cB, 0, 1.15 - 0.45 * sB];
    Q.r.forearm_right = [-0.3 - 0.25 * (0.5 + 0.5 * Math.sin(B - 1.1)), 0, -0.2 * Math.sin(B - 1.3)];
    Q.r.forearm_left = [-0.3 - 0.25 * (0.5 - 0.5 * Math.sin(B - 1.1)), 0, -0.2 * Math.sin(B - 1.3)];
    Q.r.leg_right = [-0.95 * kr + 0.25 * kl - 0.1 * land, 0, -0.22 * kr];
    Q.r.leg_left = [-0.95 * kl + 0.25 * kr - 0.1 * land, 0, 0.22 * kl];

/* ───────── Sim (state) ───────── */
const S = {
  anim: 'idle', t: 0, prev: null, prevT: 0, blend: 1, time: 0, frozen: false,
  face: Object.fromEntries(FACE_KEYS.map((k) => [k, 0])),
  blink: { t: -1, wait: 1.6, again: false },
  sacc: { v: 0, target: 0, wait: 1.2 },                         // small random eye glances (saccades)
  follow: { on: true, has: false, tYaw: 0, tPitch: 0, yaw: 0, pitch: 0, eye: 0, w: 1 },
  spring: { side: { a: 0, v: 0 }, fwd: { a: 0, v: 0 }, back: { a: 0, v: 0 }, flare: { a: 0, v: 0 } },
  lag: { right: 0, left: 0 }, prevLeg: { right: 0, left: 0 },
  ph: [0, 0, 0], prevRootY: 0, prevRootX: 0, prevRootV: 0,
  gun: 0, lastT: 0, flashT: 1, pushR: 0, pushL: 0,
};
const mkPose = () => ({ r: {}, f: Object.fromEntries(FACE_KEYS.map((k) => [k, 0])), root: [0, 0, 0], yaw: 0, fw: 1, gun: 0 });
const poseA = mkPose(), poseB = mkPose();
function evalAnim(name, t, Q) {
  for (const k in Q.r) delete Q.r[k];
  for (const k of FACE_KEYS) Q.f[k] = 0;
  Q.root[0] = Q.root[1] = Q.root[2] = 0; Q.yaw = 0; Q.fw = 1; Q.gun = 0;
  ANIMS[name].fn(t % ANIMS[name].T, Q);
}
function selectAnim(name) {
  if (!ANIMS[name] || name === S.anim) return;
  S.prev = S.anim; S.prevT = S.t; S.anim = name; S.t = 0; S.blend = 0; S.lastT = 0;
  document.querySelectorAll('.anim-btn').forEach((b) => b.classList.toggle('active', b.dataset.anim === name));
}
function stepSpring(s, target, dt, k, d) { s.v += ((target - s.a) * k - s.v * d) * dt; s.a += s.v * dt; }

/* ───────── Ground ─────────
   The hip height comes from the leg angles: the lowest shoe corner (smooth min over the corners of both feet) is
   put on the floor, so feet never sink or float, without hard clamps. */
const FOOT = [[-2, -6, -2], [2, -6, -2], [-2, -6, 2], [2, -6, 2]];   // shoe bottom corners in knee space
const _c = new THREE.Vector3(), _ys = new Array(8).fill(0);
function footLow() {
  root.updateMatrixWorld(true);
  let i = 0;
  for (const s of ['right', 'left']) for (const c of FOOT) { _c.set(...c).applyMatrix4(R[`knee_${s}`].matrixWorld); _ys[i++] = _c.y * 16; }
  const m = Math.min(..._ys); let sum = 0;
  for (const y of _ys) sum += Math.exp(-(y - m) / 0.015);
  return m - 0.015 * Math.log(sum);                             // smooth min (heel/toe hand-over without a corner)
}
let groundRest = 0;                                             // footLow() of the rest pose: rest stays at exactly y = 0

/* ───────── Step: pose, follow, expression, springs, face ───────── */
function step(dt) {
  S.time += dt; S.t += dt; S.prevT += dt;
  S.blend = Math.min(1, S.blend + dt / 0.3);
  const w = S.blend * S.blend * (3 - 2 * S.blend), mixing = S.prev && w < 1;    // smooth crossfade between animations
  evalAnim(S.anim, S.t, poseA);
  if (mixing) evalAnim(S.prev, S.prevT, poseB);
  const k = mixing ? w : 1, lerp = (b, a) => b + (a - b) * k, P = mixing ? poseB : poseA;
  for (const n in bones) { const b = bones[n]; b.position.copy(b.userData.rest); b.rotation.set(...b.userData.rr); }
  const names = new Set([...Object.keys(poseA.r), ...(mixing ? Object.keys(poseB.r) : [])]);
  for (const n of names) {
    const a = poseA.r[n] || [0, 0, 0], b = (mixing && poseB.r[n]) || [0, 0, 0];
    bones[n].rotation.set(lerp(b[0], a[0]), lerp(b[1], a[1]), lerp(b[2], a[2]));
  }
  root.rotation.y = lerp(P.yaw, poseA.yaw);
  root.position.set(lerp(P.root[0], poseA.root[0]) / 16, 0, lerp(P.root[2], poseA.root[2]) / 16);
  const fo = {};
  for (const f of FACE_KEYS) fo[f] = lerp(P.f[f], poseA.f[f]);
  const fw = lerp(P.fw, poseA.fw);

  // Feet on the floor: hip height from the leg angles (+ the animation's hop)
  root.position.y = (groundRest - footLow() + lerp(P.root[1], poseA.root[1])) / 16;

  // Head + eyes follow the mouse; off -> they ease back to the animation's pose (never snap)
  const F = S.follow, on = F.on && F.has;
  F.w += ((on ? fw : 0) - F.w) * filt(dt, 5);
  F.yaw += (F.tYaw - F.yaw) * filt(dt, 6); F.pitch += (F.tPitch - F.pitch) * filt(dt, 6);
  F.eye += ((on ? F.tYaw / 0.85 : 0) * fw - F.eye) * filt(dt, 10);
  const H = R.head.rotation;
  H.y += F.yaw * F.w; H.x += F.pitch * F.w;

  // Forced expression from the shared menu: eases over the animation's face + head pose
  const xf = window.MobViewer ? window.MobViewer.face(dt) : null;
  if (xf && xf.w > 1e-4) {
    const mix = (c, v) => { fo[c] += (v - fo[c]) * xf.w; };
    const X = xf.x || {}, xv = (c) => X[c] || 0;               // page channels of the Joker's extra expressions
    mix('brow', 0.9 * xf.brow); mix('tilt', xf.tilt); mix('smile', xf.smile); mix('open', 0.8 * xf.open);
    mix('teeth', clamp(0.9 * Math.max(0, xf.smile) * (1 - xv('noteeth')) + xv('teeth'), 0, 1));
    mix('squint', 0.7 * Math.max(0, -xf.eyes)); mix('wide', Math.max(0, xf.eyes)); mix('glance', 0); mix('look', 0.6 * xf.look);
    mix('laugh', xv('laugh')); mix('arch', xv('arch')); mix('shut', 0);
    H.x += window.MobViewer.head.pitch; H.z += window.MobViewer.head.roll;
  }
  // No neck: soft limits keep the dip into the torso and shoulders small. Turn max 0.6 rad; chin down 0.12, up 0.08
  // (the back corners sit over the arms), roll 0.06 rad. A turned head tilts less: its corner hangs over the shoulder
  // and tilting would dip it in.
  H.y = softLim(H.y, 0.6); const yy = Math.tanh((H.y / 0.4) ** 2), fac = 1 - yy;
  H.x = H.x > 0 ? softLim(H.x, 0.12 * fac + 0.01) : softLim(H.x, 0.08 * fac + 0.01);
  H.z = softLim(H.z, 0.06 * (1 - 0.9 * yy) + 0.005);

  // Revolver: grows in the fist on the draw (never pops); muzzle flash on the shot
  S.gun += (lerp(P.gun, poseA.gun) - S.gun) * filt(dt, 18);
  R.gun.scale.setScalar(Math.max(0.001, S.gun)); R.gun.visible = S.gun > 0.003;
  if (S.anim === 'attack') {
    const tt = S.t % ATK_T;
    if (tt >= ATK_SHOT && (S.lastT < ATK_SHOT || S.lastT > tt)) S.flashT = 0;
    S.lastT = tt;
  }
  S.flashT += dt;
  const fl = bump(S.flashT, 0.05, 0.05);
  flash.visible = fl > 0.01 && R.gun.visible; flash.scale.setScalar(Math.max(0.001, fl)); flash.rotation.z = S.flashT * 30;

  springs(dt);
  updateFace(dt, fo, F);
  updateSmoke(dt);

  blob.position.x = root.position.x; blob.position.z = root.position.z;
}

/* ───────── Physics: hair locks, back hair, coat tails ─────────
   Springs driven by the body's motion, always clamped (soft limits). Side locks only swing outward and back, the
   back hair only backward: never into the head. A raised shoulder pushes its side lock back (and the back hair with
   it), so the locks never cut through the shoulder. */
// How far (texels) the top corners of an upper arm rise above their rest height (arm-bone rotation only)
const _sq = new THREE.Vector3();

      if (!list[i].m.parent.visible || list[i].m.parent.scale.x < 0.5) continue;    // hidden revolver
      ca.setFromMatrixPosition(list[i].m.matrixWorld);
      for (let j = 0; j < list.length; j++) {

if (hash.startsWith('cliptest')) { S.frozen = true; setTimeout(clipTest, 0); }
else if (hash === 'rest') { S.frozen = true; restPose(); dumpFrame('full'); }
else if (hash.startsWith('shot-')) {
  const [, anim, , sec, cam, expr] = hash.split('-');
  document.head.insertAdjacentHTML('beforeend', '<style>#dock,#topRight,#expr{display:none!important}</style>');   // clean still: no UI
  resetSim(ANIMS[anim] ? anim : 'idle', 0.18, 0.1);
  if (expr && window.MobViewer) window.MobViewer.set(expr);
  for (let t = 0; t < (+sec || 0); t += 1 / 120) step(1 / 120);
  S.frozen = true; dumpFrame(cam || 'full');
}

/* ───────── Loop: 120 FPS when the screen can (measured over ~30 frames), else 60 ───────── */
let last = performance.now(), acc = 0, rate = 60, probe = [], lastRaf = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (probe.length < 30) { if (lastRaf) probe.push(now - lastRaf); lastRaf = now; if (probe.length === 30) { probe.sort((a, b) => a - b); rate = 1000 / probe[15] >= 110 ? 120 : 60; } }
  acc += now - last; last = now;
  if (acc < 1000 / rate - 1) return;                             // lock to the chosen rate
  const dt = Math.min(acc / 1000, 0.1); acc = 0;
  if (S.frozen) return;
  followTarget(now);
  step(dt);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 0.7);
    const k = 1 - (1 - camTween.t) ** 3;
    camera.position.lerpVectors(camTween.p, HOME.pos, k); controls.target.lerpVectors(camTween.q, HOME.tgt, k);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  updateRigView();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>

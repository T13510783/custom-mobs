  <!--
    The Joker (Arthur Fleck, fan model, vanilla+ humanoid): crimson suit, mustard waistcoat, green shirt, clown paint.
    - Shared UI from ../_shared/: viewer.css (look) + viewer.js (expression menu, MobViewer.face(dt)).
    - Rig: head 8x8x8 right on the torso top (no neck), body 8x12x4, 2-bone arms (arm_/forearm_) and legs
      (leg_/knee_), feet at y = 0. Wavy hair (first look): side locks + flares, back curtain (springs), coat tails.
    - Face (first look): white paint, skin at the jaw corners and sides. The painted eyes, brows and mouth are thin
      planes on the head front, so they blink, glance, frown and grin. Blue painted eyelids slide over the eyes.
      Mouth on row 6, one piece: smile / frown / smirk move the whole line (Homelander type), the jaw drops, teeth rows.
    - Animations: 1 Idle (smoking), 2 Idle 2 (restless), 3 Walk (3 walks take turns), 4 Attack (revolver), 5 Dance
      (the stairs), 6 Laugh (maniac). Follow mouse (eye), Show bones (B), cigarette mouth / hand / away (C), reset (R).
      Extra Joker expressions: Grin, Laugh, Smug, Manic, Normal, Blank, Snarl.
    - Test modes: #cliptest[-hand|-off], #rest, #shot-<anim>-<cig>-<sec>[-<cam>[-<expression>]] (cig: 0 mouth, h hand, o off).
  -->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────── Setup ─────────
   Rig units are texels; the mob root is scaled by 1/16 so 16 texels = 1 block. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const filt = (dt, rate) => 1 - Math.exp(-dt * rate);   // per-frame smoothing factor (frame-rate independent)
const softLim = (x, l) => l * Math.tanh(x / l);        // soft limit: no hard corner at the edge
const pos2 = (x) => (x > 0 ? x * x : 0);                // max(0, x)^2: smooth where it starts
const softAbs = (x, e) => Math.sqrt(x * x + e * e) - e; // |x| without the corner at 0
const softPos = (x, e) => 0.5 * (x + Math.sqrt(x * x + e * e));          // max(0, x) without the corner
const softplus = (x, k) => k * Math.log1p(Math.exp(Math.min(50, x / k))); // smooth floor at 0

/* ───────── Palette ───────── */

/**
 * COLOR PALETTE — Matched directly to the Arthur Fleck / Joker reference photos:
 * - Crimson/Burgundy tailored suit jacket & trousers
 * - Golden-mustard waistcoat (vest)
 * - Emerald/Teal green patterned dress shirt
 * - Chalky white face paint, crimson smile/nose/brows, slate-blue eye diamonds & tear drip
 * - Swept-back mossy/olive green hair
 * - Two-tone brown vintage wingtip dress shoes
 */
const PALETTE = {
    // Face paint & skin
    paintLight: '#f0f2f5',
    paintBase:  '#e2e5ea',
    paintShade: '#cbd0d8',
    paintDark:  '#b0b7c2',
    skinLight:  '#dca588',
    skinBase:   '#c98d6e',
    skinShade:  '#a86f52',
    skinDark:   '#87543b',

    // Clown makeup accents
    makeupRedLight: '#cc2424',
    makeupRedBase:  '#a61717',
    makeupRedDark:  '#780e0e',
    makeupBlueLight:'#26799e',
    makeupBlueBase: '#185875',
    makeupBlueDark: '#0f3c52',
    eyeDark:        '#1d242b',
    eyeSclera:      '#d9dee3',

    // Mossy / Olive green hair
    hairHighlight: '#6b9c3e',
    hairLight:     '#527d2c',
    hairBase:      '#3c611e',
    hairShade:     '#2b4714',
    hairDark:      '#1c300c',

    // Crimson Red Suit
    suitHighlight: '#cf2d2d',
    suitLight:     '#b52121',
    suitBase:      '#9c1919',
    suitShade:     '#7d1212',
    suitDark:      '#5e0c0c',
    suitDeep:      '#420707',

    // Golden-Mustard Waistcoat (Vest)
    vestHighlight: '#f2b12e',
    vestLight:     '#e09b1b',
    vestBase:      '#c78310',
    vestShade:     '#a3670a',
    vestDark:      '#7d4c05',

    // Emerald-Teal Dress Shirt
    shirtHighlight:'#20876e',
    shirtLight:    '#166e58',
    shirtBase:     '#105745',
    shirtShade:    '#0b4032',
    shirtDark:     '#072b21',

    // Vintage Brown Wingtip Shoes
    shoeHighlight: '#855331',
    shoeLight:     '#693f22',
    shoeBase:      '#4d2c16',
    shoeDark:      '#2b170b',
    shoeSole:      '#170d06'
};

/* ───────── Texture + box factory ─────────
   Crisp pixel-art CanvasTextures (NearestFilter): one texture per box face, 1 texel = 1 pixel. */
function createPixelTexture(w, h, drawFn) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Helper functions passed to the drawing callback
    const api = {
        ctx, w, h,
        fill(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, w, h); },
        rect(x, y, rw, rh, color) { ctx.fillStyle = color; ctx.fillRect(x, y, rw, rh); },
        px(x, y, color) { ctx.fillStyle = color; ctx.fillRect(x, y, 1, 1); },
        noise(x, y, rw, rh, colors, density = 0.35, seedOffset = 0) {
            for (let ix = x; ix < x + rw; ix++) {
                for (let iy = y; iy < y + rh; iy++) {
                    const hash = Math.sin((ix * 12.9898 + iy * 78.233 + seedOffset) * 43758.5453);
                    const frac = hash - Math.floor(hash);
                    if (frac < density) {
                        ctx.fillStyle = colors[Math.floor((frac / density) * colors.length)];
                        ctx.fillRect(ix, iy, 1, 1);
                    }
                }
            }
        }
    };
    drawFn(api);

    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}

/**
 * 6 materials for a box of [w, h, d] texels. Face order of BoxGeometry:
 * 0: right (+X), 1: left (-X), 2: top (+Y), 3: bottom (-Y), 4: front (+Z), 5: back (-Z).
 * options.crop = { full, y0 }: a limb segment. Its side faces are painted at the full limb height and show only
 *   rows y0 .. y0 + h, so the two segments of an arm or leg show exactly the one 12-high texture together.
 * options.override = { face: painter }: replaces single faces (the hidden inner ends of a segment).
 */
function createBoxMaterials(w, h, d, facePainters, options = {}) {
    const tw = Math.max(1, Math.round(w));
    const th = Math.max(1, Math.round(h));
    const td = Math.max(1, Math.round(d));
    const dims = [[td, th], [td, th], [tw, td], [tw, td], [tw, th], [tw, th]];
    const keys = ['right', 'left', 'top', 'bottom', 'front', 'back'];
    const crop = options.crop;

    return keys.map((key, idx) => {
        const [fw, fh] = dims[idx];
        const painter = (options.override && options.override[key]) || facePainters[key] || facePainters.all || ((p) => p.fill('#ff00ff'));
        let tex;
        if (crop && (idx < 2 || idx > 3) && !(options.override && options.override[key])) {
            tex = createPixelTexture(fw, crop.full, painter);
            tex.repeat.set(1, fh / crop.full);                   // canvas row 0 = top of the face (flipY)
            tex.offset.set(0, 1 - (crop.y0 + fh) / crop.full);
        } else tex = createPixelTexture(fw, fh, painter);
        return new THREE.MeshStandardMaterial({
            map: tex,
            roughness: Math.max(0.7, options.roughness ?? 0.82),  // >= 0.7: no glossy strips (mod has no gloss)
            metalness: options.metalness ?? 0.05,
            emissive: options.emissive ? new THREE.Color(options.emissive) : new THREE.Color(0x000000),
            emissiveIntensity: options.emissive ? 1 : 0,
            transparent: !!options.transparent,
            alphaTest: options.alphaTest || 0
        });
    });
}

// A box of [w, h, d] texels with painted faces
function createVoxelBox(w, h, d, facePainters, options = {}) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), createBoxMaterials(w, h, d, facePainters, options));
    mesh.castShadow = options.castShadow ?? true;
    mesh.receiveShadow = options.receiveShadow ?? true;
    return mesh;
}

/* ───────── Painters ───────── */

/**
 * PROCEDURAL 16x16 PIXEL ART PAINTERS FOR THE JOKER
 */
const JokerTextures = {
    // 1. HEAD (8x8x8 pixels)
    head: {
        front(p) {
            // First look (user pick, 2026-10-16), whole face white (user, 2026-10-16): chalky greasepaint over every
            // pixel below the green hairline, cheeks, jaw corners and chin included; only soft grey shading at the edges
            p.fill(PALETTE.paintBase);
            p.rect(0, 0, 8, 1, PALETTE.hairBase);            // top hairline edge
            p.px(0, 0, PALETTE.hairShade);
            p.px(7, 0, PALETTE.hairShade);
            p.rect(1, 0, 6, 1, PALETTE.paintBase);
            p.rect(2, 0, 4, 1, PALETTE.paintLight);          // chalky shading
            p.px(1, 1, PALETTE.paintShade);
            p.px(6, 1, PALETTE.paintShade);
            p.px(0, 5, PALETTE.paintShade);                  // jaw edges a shade darker (reads as the face's round)
            p.px(7, 5, PALETTE.paintShade);
            p.px(0, 6, PALETTE.paintShade);
            p.px(7, 6, PALETTE.paintShade);
            p.rect(1, 7, 6, 1, PALETTE.paintShade);          // chin
            p.px(0, 7, PALETTE.paintDark);
            p.px(7, 7, PALETTE.paintDark);

            // Row 1: greasepaint under the red brows. The brows are face planes (brow_ bones, same 2 red pixels each),
            // so a raised or frowning brow never shows a second painted copy under it.
            p.rect(1, 1, 2, 1, PALETTE.paintBase);
            p.rect(5, 1, 2, 1, PALETTE.paintBase);

            // Teal-blue eye diamonds (Rows 2, 3, 4)
            p.px(1, 2, PALETTE.makeupBlueBase);              // upper points (row 2)
            p.px(2, 2, PALETTE.makeupBlueLight);
            p.px(5, 2, PALETTE.makeupBlueLight);
            p.px(6, 2, PALETTE.makeupBlueBase);
            p.px(1, 3, PALETTE.eyeSclera);                   // eyes (row 3)
            p.px(2, 3, PALETTE.eyeDark);
            p.px(5, 3, PALETTE.eyeDark);
            p.px(6, 3, PALETTE.eyeSclera);
            p.px(1, 4, PALETTE.makeupBlueDark);              // lower points (row 4)
            p.px(2, 4, PALETTE.makeupBlueBase);
            p.px(5, 4, PALETTE.makeupBlueBase);
            p.px(6, 4, PALETTE.makeupBlueDark);
            p.px(5, 5, PALETTE.makeupBlueLight);             // smeared tear streak under his left eye

            // Red painted nose (Row 4, center x=3,4)
            p.px(3, 4, PALETTE.makeupRedLight);
            p.px(4, 4, PALETTE.makeupRedBase);

            // Crimson mouth: row 6 (the mouth rig sits on it) + lower lip smear (row 7). Cheeks stay white (user,
            // 2026-10-16): no red upturns or corner pixels beside the mouth.
            p.rect(2, 6, 4, 1, PALETTE.makeupRedDark);
            p.px(3, 7, PALETTE.makeupRedBase);
            p.px(4, 7, PALETTE.makeupRedBase);
        },
        // Sides (first look): swept-back green hair on the top 2 rows and the back 5 columns (same clumpy noise as the
        // locks); the face part in front of the hair is white greasepaint too (whole face white), the ear a grey shade
        right(p) {
            p.fill(PALETTE.paintShade);
            p.rect(0, 0, 8, 2, PALETTE.hairBase);
            p.rect(3, 0, 5, 7, PALETTE.hairBase);
            p.noise(3, 0, 5, 7, [PALETTE.hairLight, PALETTE.hairShade, PALETTE.hairDark], 0.55, 11);
            p.rect(0, 2, 1, 6, PALETTE.paintBase);           // x 0 = front edge
            p.rect(0, 7, 3, 1, PALETTE.paintDark);           // jaw underside edge
            p.px(2, 3, PALETTE.paintDark);                   // ear
            p.px(2, 4, PALETTE.paintDark);
        },
        left(p) {
            p.fill(PALETTE.paintShade);
            p.rect(0, 0, 8, 2, PALETTE.hairBase);
            p.rect(0, 0, 5, 7, PALETTE.hairBase);
            p.noise(0, 0, 5, 7, [PALETTE.hairLight, PALETTE.hairShade, PALETTE.hairDark], 0.55, 22);
            p.rect(7, 2, 1, 6, PALETTE.paintBase);           // x 7 = front edge
            p.rect(5, 7, 3, 1, PALETTE.paintDark);           // jaw underside edge
            p.px(5, 3, PALETTE.paintDark);                   // ear
            p.px(5, 4, PALETTE.paintDark);
        },
        top(p) {
            // Swept-back green hair strands
            p.fill(PALETTE.hairBase);
            for (let x = 0; x < 8; x++) {
                const c = (x % 2 === 0) ? PALETTE.hairLight : PALETTE.hairShade;
                p.rect(x, 0, 1, 8, c);
            }
            p.noise(0, 0, 8, 8, [PALETTE.hairHighlight, PALETTE.hairDark], 0.35, 33);
            // Forehead white edge at front bottom of top face
            p.rect(2, 7, 4, 1, PALETTE.paintBase);
        },
        back(p) {
            p.fill(PALETTE.hairBase);
            for (let x = 0; x < 8; x++) {
                p.rect(x, 0, 1, 8, (x % 2 === 0) ? PALETTE.hairShade : PALETTE.hairBase);
            }
            p.noise(0, 0, 8, 8, [PALETTE.hairLight, PALETTE.hairDark, PALETTE.hairHighlight], 0.5, 44);
        },
        bottom(p) {
            p.fill(PALETTE.paintDark);                       // painted chin underside, all white paint in shade
        }
    },

    // 2. HAIR LOCKS (Reusable mossy green wavy texture: crown, side locks, flares, back hair)
    hairLayer: {
        all(p) {
            p.fill(PALETTE.hairBase);
            for (let x = 0; x < p.w; x++) {
                if (x % 2 === 0) p.rect(x, 0, 1, p.h, PALETTE.hairShade);
            }
            p.noise(0, 0, p.w, p.h, [PALETTE.hairHighlight, PALETTE.hairLight, PALETTE.hairDark], 0.55, 77);
        }
    },

    // 3. TORSO BASE (8x12x4) — Shows Emerald Green Shirt + Golden Waistcoat + Red Trousers Waist
    torso: {
        front(p) {
            // Base golden-mustard waistcoat
            p.fill(PALETTE.vestBase);
            p.noise(0, 0, 8, 10, [PALETTE.vestLight, PALETTE.vestShade], 0.35, 101);

            // Deep Emerald-Teal patterned shirt at upper chest & neck (y = 0..4)
            p.rect(2, 0, 4, 3, PALETTE.shirtBase);
            p.rect(3, 3, 2, 2, PALETTE.shirtBase);
            // Subtle circular pattern highlights on green shirt
            p.px(2, 0, PALETTE.shirtHighlight);
            p.px(4, 1, PALETTE.shirtHighlight);
            p.px(3, 2, PALETTE.shirtLight);
            p.px(4, 3, PALETTE.shirtHighlight);
            // Open neck skin at very top center
            p.rect(3, 0, 2, 1, PALETTE.skinShade);

            // Shirt collar shading
            p.px(2, 2, PALETTE.shirtDark);
            p.px(5, 2, PALETTE.shirtDark);

            // Waistcoat V-neck border highlights
            p.px(2, 3, PALETTE.vestHighlight);
            p.px(5, 3, PALETTE.vestHighlight);
            p.px(3, 5, PALETTE.vestHighlight);
            p.px(4, 5, PALETTE.vestLight);

            // Waistcoat center seam & buttons (y = 5..9)
            p.rect(4, 5, 1, 5, PALETTE.vestShade);
            p.px(3, 5, PALETTE.vestDark);
            p.px(3, 7, PALETTE.vestDark);
            p.px(3, 9, PALETTE.vestDark);

            // Waistcoat pockets & shading
            p.rect(1, 7, 2, 1, PALETTE.vestDark);
            p.rect(5, 7, 2, 1, PALETTE.vestDark);

            // Bottom V-cut notches of the yellow vest exposing the red trousers underneath (y = 10..11)
            p.rect(0, 10, 8, 2, PALETTE.suitBase);
            p.rect(3, 10, 2, 2, PALETTE.suitDark); // Center notch between vest points
            // Two golden vest points hanging down at x=1..2 and x=5..6 on row 10
            p.rect(1, 10, 2, 1, PALETTE.vestBase);
            p.rect(5, 10, 2, 1, PALETTE.vestBase);
            p.px(2, 11, PALETTE.vestShade);
            p.px(5, 11, PALETTE.vestShade);
        },
        back(p) {
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, 8, 12, [PALETTE.suitLight, PALETTE.suitShade], 0.4, 102);
            // Center back seam of suit jacket
            p.rect(4, 0, 1, 12, PALETTE.suitShade);
            // Green collar edge at top
            p.rect(2, 0, 4, 1, PALETTE.shirtShade);
        },
        right(p) {
            p.fill(PALETTE.suitShade);
            p.noise(0, 0, 4, 12, [PALETTE.suitBase, PALETTE.suitDark], 0.4, 103);
        },
        left(p) {
            p.fill(PALETTE.suitShade);
            p.noise(0, 0, 4, 12, [PALETTE.suitBase, PALETTE.suitDark], 0.4, 104);
        },
        top(p) {
            p.fill(PALETTE.shirtBase);
            p.rect(0, 0, 2, 4, PALETTE.suitBase);
            p.rect(6, 0, 2, 4, PALETTE.suitBase);
        },
        bottom(p) {
            p.fill(PALETTE.suitDark);
        }
    },

    // 4. SUIT JACKET OUTER PANELS & LAPELS
    suitPanel: {
        front(p) {
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, p.w, p.h, [PALETTE.suitLight, PALETTE.suitShade], 0.35, 201);
            // Subtle inner lapel highlight along inner edge
            p.rect(0, 0, 1, p.h, PALETTE.suitHighlight);
            // Pocket welt detail
            if (p.h >= 10) {
                p.rect(0, 8, p.w, 1, PALETTE.suitDark);
                p.rect(0, 9, p.w, 1, PALETTE.suitHighlight);
            }
        },
        all(p) {
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, p.w, p.h, [PALETTE.suitLight, PALETTE.suitShade, PALETTE.suitDark], 0.4, 202);
        }
    },

    // 5. ARMS (4x12x4) — Red Suit Sleeve + Emerald Green Cuff + Painted/Skin Hands
    arm: {
        all(p) {
            // Suit sleeve top (y = 0..8)
            p.fill(PALETTE.suitBase);
            p.noise(0, 0, p.w, 9, [PALETTE.suitLight, PALETTE.suitShade], 0.4, 301);
            p.rect(0, 8, p.w, 1, PALETTE.suitDark);

            // Emerald green patterned shirt cuff peeking out at wrist (y = 9)
            p.rect(0, 9, p.w, 1, PALETTE.shirtLight);
            p.px(1, 9, PALETTE.shirtHighlight);
            p.px(3, 9, PALETTE.shirtShade);

            // Hand skin & knuckles (y = 10..11)
            p.rect(0, 10, p.w, 2, PALETTE.skinBase);
            p.rect(0, 11, p.w, 1, PALETTE.skinShade);
            p.px(1, 10, PALETTE.skinLight);
        },
        top(p) {
            p.fill(PALETTE.suitLight);
            p.noise(0, 0, 4, 4, [PALETTE.suitBase, PALETTE.suitHighlight], 0.35, 302);
        },
        bottom(p) {
            p.fill(PALETTE.skinDark);
        }
    },

    // 6. LEGS (4x12x4) — Crimson Suit Trousers + Vintage Brown Leather Wingtip Shoes
    leg: {
        front(p) {

/* ───────── Curves ─────────
   Keyframe tracks [[t, v], ...] through a monotone cubic (Fritsch-Butland tangents): smooth, flows
   through the keys, never overshoots (no surprise clipping), flat at the first/last key (seamless loop). */
function curve(keys) {
  const n = keys.length, T = keys.map((k) => k[0]), V = keys.map((k) => k[1]), M = new Array(n).fill(0);
  for (let i = 1; i < n - 1; i++) {
    const d0 = (V[i] - V[i - 1]) / (T[i] - T[i - 1]), d1 = (V[i + 1] - V[i]) / (T[i + 1] - T[i]);
    M[i] = d0 * d1 <= 0 ? 0 : 2 * d0 * d1 / (d0 + d1);
  }
  return (t) => {
    if (t <= T[0]) return V[0];
    if (t >= T[n - 1]) return V[n - 1];
    let i = 1; while (t > T[i]) i++;
    const h = T[i] - T[i - 1], u = (t - T[i - 1]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * V[i - 1] + (u3 - 2 * u2 + u) * h * M[i - 1] + (-2 * u3 + 3 * u2) * V[i] + (u3 - u2) * h * M[i];
  };
}
// {'bone.x': keys, 'f.channel': keys, gun: keys} -> evaluators that add into a pose Q
function tracks(spec) {
  return Object.entries(spec).map(([k, keys]) => {
    const f = curve(keys), [b, a] = k.split('.');
    if (b === 'gun') return (t, Q) => { Q.gun = f(t); };
    if (b === 'spin') return (t, Q) => { Q.spin = f(t); };
    if (b === 'f') return (t, Q) => { Q.f[a] += f(t); };
    const i = 'xyz'.indexOf(a);
    return (t, Q) => { (Q.r[b] || (Q.r[b] = [0, 0, 0]))[i] += f(t); };
  });
}

  const d = clamp(k.u.length(), 1.5, L1 + L2 - 0.05); k.u.normalize();
  const a1 = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));   // shoulder angle (law of cosines)
  k.p.set(...pole); k.p.addScaledVector(k.u, -k.p.dot(k.u)).normalize();          // pole across the shoulder->fist line
  k.a.copy(k.u).multiplyScalar(Math.cos(a1)).addScaledVector(k.p, Math.sin(a1));   // upper arm direction
  k.c.copy(k.u).multiplyScalar(d).addScaledVector(k.a, -L1).normalize();           // elbow -> fist
  k.qa.setFromUnitVectors(k.down, k.a); k.e.setFromQuaternion(k.qa, 'ZYX');
  const ax = k.e.x, ay = k.e.y, az = k.e.z;
  k.c.applyQuaternion(k.qi.copy(k.qa).invert());                                   // forearm direction in upper-arm space
  // forearm: the shortest turn from "folded straight forward" (an elbow never points back, so this never flips)
  k.qf.setFromUnitVectors(k.fwd, k.c).multiply(k.fold); k.e.setFromQuaternion(k.qf, 'ZYX');
  return [ax, ay, az, k.e.x, k.e.y, k.e.z];
}
// Euler angles unwrapped by ± 2π to the side of ref: blends take the short way, no full-turn flip between frames
const wrapNear = (v, r) => v - TAU * Math.round((v - r) / TAU);
// Blend an IK gesture over the FK pose of one arm (w 0..1, smooth curves only). The fist travels from where the FK
// pose has it to the target on a path bowed forward (it never cuts through the chest), solved by IK all the way;
// each bone eases from the FK rotation to that solution as a rotation (slerp), so at w = 0 it is exactly the FK pose.
const _gb = { q0: new THREE.Quaternion(), q1: new THREE.Quaternion(), e: new THREE.Euler(0, 0, 0, 'ZYX'), f: new THREE.Vector3(), tg: [0, 0, 0] };
function gesture(Q, side, w, t, pole) {
  if (w <= 1e-4) return;
  const A = Q.r[`arm_${side}`] || (Q.r[`arm_${side}`] = [0, 0, 0]), F = Q.r[`forearm_${side}`] || (Q.r[`forearm_${side}`] = [0, 0, 0]);
  const k = _gb;
  k.q0.setFromEuler(k.e.set(A[0], A[1], A[2], 'ZYX')); k.q1.setFromEuler(k.e.set(F[0], F[1], F[2], 'ZYX'));
  k.f.set(0, -L2, 0).applyQuaternion(k.q1); k.f.y -= L1; k.f.applyQuaternion(k.q0);
  k.f.x += side === 'right' ? -6 : 6; k.f.y += SH_Y;                                 // FK fist position (torso space)
  const far = Math.hypot(t[0] - k.f.x, t[1] - k.f.y, t[2] - k.f.z);
  const bulge = 4 * w * (1 - w) * 2.5 * far * far / (far * far + 16), sx = side === 'right' ? -1 : 1;
  for (let i = 0; i < 3; i++) k.tg[i] = k.f.getComponent(i) + (t[i] - k.f.getComponent(i)) * w;
  k.tg[0] += 0.3 * sx * bulge; k.tg[2] += bulge;
  const g = armIK(side, k.tg, pole), b = 1 - (1 - w) ** 3;
  for (const [E, o] of [[A, 0], [F, 3]]) {
    k.q0.setFromEuler(k.e.set(E[0], E[1], E[2], 'ZYX')); k.q1.setFromEuler(k.e.set(g[o], g[o + 1], g[o + 2], 'ZYX'));
    k.q0.slerp(k.q1, b); k.e.setFromQuaternion(k.q0, 'ZYX');
    E[0] = wrapNear(k.e.x, E[0]); E[1] = wrapNear(k.e.y, E[1]); E[2] = wrapNear(k.e.z, E[2]);
  }
}

/* ───────── Animations ─────────
   Each anim: fn(t, Q) fills bone rotations Q.r[bone] = [x, y, z] (rad), hip drift Q.root = [x, y, z] (texels; y is
   added on top of the ground contact), whole-body turn Q.yaw, face channels Q.f, head-follow weight Q.fw, the
   revolver Q.gun (0..1) and its twirl Q.spin (rad). Lengths T are whole 1/120 s frames. Smooth curves only.
   Signs: x + = limb back / head chin down / shin back, arm z outward (right -, left +), y + = turn to his left. */
const FACE_KEYS = ['brow', 'tilt', 'smile', 'open', 'teeth', 'squint', 'wide', 'glance', 'look', 'laugh', 'arch', 'shut', 'smoke',
  'pupil', 'cheek', 'furrow', 'clench'];
// laugh = laughing (mouth flaps ~3.6 per second, teeth, eyes squeezed); arch = one raised brow + one-sided smirk (his
// left); shut = eyes closed (bliss); smoke = exhaling smoke (lips pushed together, puffs from the mouth); pupil = pupil
// size (-1 pinpricks .. 1 wide); cheek = lower lids rise (a real smile / laugh squeezes the eyes from below);
// furrow = brows pull together and down (anger); clench = teeth bared and gritted (snarl)
const ANIM_ORDER = ['idle', 'idle2', 'walk', 'attack', 'dance', 'laugh'];
const sstep = (x) => { const u = clamp(x, 0, 1); return u * u * (3 - 2 * u); };          // smoothstep: flat at both ends
const win = (t, a, b, e) => sstep((t - a) / e + 0.5) - sstep((t - b) / e + 0.5);          // 0 -> 1 around a, back to 0 around b

// weight to the other leg, a nervous tic, a small one-sided smirk. 12 s.

// blank stare, then a small smirk. 10 s.
const I2_LOOK = curve([[0, 0], [0.4, 0], [1.0, 0.45], [1.9, 0.45], [2.5, -0.45], [3.3, -0.45], [3.9, 0], [10, 0]]);

// 3 · Walk: three walks that take turns (4 steps each, 0.9 s crossfade), all on the same step rhythm so they blend:
// A the street strut (right hand up, left hand in the pocket), B Arthur's slouch (hands in both pockets, head down,
// short steps, blank), C the swagger (chin up, loose arms swinging wide, big steps, grin).
const WALK_T = 16.5, WSEG = 5.5, WFADE = 0.9;
function walkW(t) {
  const S_ = (x) => sstep(x / WFADE + 0.5);
  const a = S_(t) - S_(t - WSEG) + S_(t - 3 * WSEG), b = S_(t - WSEG) - S_(t - 2 * WSEG);
  return [a, b, 1 - a - b];
}

/* ───────── Clip test (#cliptest) ─────────
   Per frame (20 Hz, one full loop after a warm-up loop), every animation, mouse at the center, edges and corners:
   a 5x5 grid of points on every face of cube A goes into cube B's local space; points deeper than 0.06 texel inside
   B count. Parts already layered at rest (shells, collars, hair) may only go 0.15 deeper than at rest. Joint pairs

const JOINTS = new Set([['body', 'head'], ['head', 'cig'], ['head', 'hair_right'], ['head', 'hair_left'], ['head', 'hair_back'],
  ['forearm_right', 'gun'], ['forearm_right', 'cig_hand'],
  ['forearm_right', 'cig'],                                        // the drag: the fist holds the cigarette at the mouth
  ...['right', 'left'].flatMap((s) => [[`arm_${s}`, 'body'], [`arm_${s}`, `forearm_${s}`], ['body', `leg_${s}`], [`knee_${s}`, `leg_${s}`],

  const list = built.map((m) => { const g = m.geometry.parameters;
    return { m, bone: m.parent.name, half: [g.width / 2, g.height / 2, g.depth / 2], name: `${m.parent.name}[${g.width}x${g.height}x${g.depth}]` }; });

      out.push([hx, a * hy, b * hz], [-hx, a * hy, b * hz], [a * hx, hy, b * hz], [a * hx, -hy, b * hz], [a * hx, b * hy, hz], [a * hx, b * hy, -hz]); }
    return out.map((p) => new THREE.Vector3(...p)); });

    const res = new Map();
    for (let i = 0; i < list.length; i++) {
      if (!list[i].m.parent.visible || list[i].m.parent.scale.x < 0.5) continue;    // hidden revolver
      ca.setFromMatrixPosition(list[i].m.matrixWorld);
      for (let j = 0; j < list.length; j++) {
        if (i === j || list[i].bone === list[j].bone || !list[j].m.parent.visible || list[j].m.parent.scale.x < 0.5) continue;
        cb.setFromMatrixPosition(list[j].m.matrixWorld);

      let since = 1;
      for (let t = 0; t < T; t += dt) {

          const joint = isJoint(a.bone, b.bone);

        }

  document.body.appendChild(out);
}

// Test modes. The "variant" field picks the cigarette: 0 = mouth, h = hand, o = put away (#shot-walk-h-3, #cliptest-hand)
const hash = decodeURIComponent(location.hash.slice(1));
if (hash.startsWith('cliptest')) { S.frozen = true; setTimeout(() => clipTest(hash.split('-')[1] || 'mouth'), 0); }
else if (hash === 'rest') { S.frozen = true; restPose(); dumpFrame('full'); }
else if (hash.startsWith('shot-')) {
  const [, anim, vi, sec, cam, expr] = hash.split('-');
  document.head.insertAdjacentHTML('beforeend', '<style>#dock,#topRight,#expr{display:none!important}</style>');   // clean still: no UI
  setCig(vi === 'h' ? 'hand' : vi === 'o' ? 'off' : 'mouth');
  resetSim(ANIMS[anim] ? anim : 'idle', 0.18, 0.1);
  if (expr && window.MobViewer) window.MobViewer.set(expr);
  for (let t = 0; t < (+sec || 0); t += 1 / 120) step(1 / 120);
  S.frozen = true; dumpFrame(cam || 'full');
}

/* ───────── Loop: 120 FPS when the screen can (measured over ~30 frames), else 60 ───────── */
let last = performance.now(), acc = 0, rate = 60, probe = [], lastRaf = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (probe.length < 30) { if (lastRaf) probe.push(now - lastRaf); lastRaf = now; if (probe.length === 30) { probe.sort((a, b) => a - b); rate = 1000 / probe[15] >= 110 ? 120 : 60; } }
  acc += now - last; last = now;
  if (acc < 1000 / rate - 1) return;                             // lock to the chosen rate
  const dt = Math.min(acc / 1000, 0.1); acc = 0;
  if (S.frozen) return;
  followTarget(now);
  step(dt);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 0.7);
    const k = 1 - (1 - camTween.t) ** 3;
    camera.position.lerpVectors(camTween.p, HOME.pos, k); controls.target.lerpVectors(camTween.q, HOME.tgt, k);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  updateRigView();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Michael Myers — 16x16 Vanilla+ 3D Model Viewer</title>
  <style>
    :root {
      --bg-dark: #0f1115;
      --pill-bg: rgba(18, 21, 27, 0.86);
      --pill-border: rgba(255, 255, 255, 0.09);
      --text-main: #e6e9f0;
      --text-dim: #8a93a6;
      --accent: #c85a1e;
      --accent-glow: rgba(200, 90, 30, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text-main);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 42%, #171c24 0%, #0f1115 74%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Ultra-minimal floating bottom pill bar */
    .hud-bottom {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      z-index: 20;
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .hud-bottom::-webkit-scrollbar {
      display: none;
    }

    .anim-btn,
    .outfit-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .anim-btn:hover,
    .outfit-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .anim-btn:active,
    .outfit-btn:active {
      transform: scale(0.96);
    }

    .anim-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #c85a1e 0%, #7d320d 100%);
      box-shadow: 0 2px 14px var(--accent-glow), 0 0 0 1px rgba(255, 185, 130, 0.25) inset;
    }

    .outfit-btn.active {
      color: #eef3fa;
      background: rgba(120, 148, 180, 0.22);
      box-shadow: 0 0 0 1px rgba(155, 185, 220, 0.42) inset;
    }

    .swatch-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.28);
      flex-shrink: 0;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.10);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.18s ease, background 0.18s ease, transform 0.18s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.11);
      transform: rotate(-18deg);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- Error tracker for headless verification -->
  <script>
    window.__errors = [];
    window.addEventListener('error', (e) => {
      window.__errors.push(e.message || String(e));
    });
    window.addEventListener('unhandledrejection', (e) => {
      window.__errors.push(e.reason ? (e.reason.message || String(e.reason)) : 'unhandled rejection');
    });
  </script>

  <!-- Three.js r128 + OrbitControls with local fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
    onerror="var s=document.createElement('script');s.src='../../mod/build/viewer-libs/three.min.js';document.head.appendChild(s);"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
    onerror="var s=document.createElement('script');s.src='../../mod/build/viewer-libs/OrbitControls.js';document.head.appendChild(s);"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-bottom" role="toolbar" aria-label="Animation, outfit, and camera controls">
    <!-- 4 Selectable Animations -->
    <button class="anim-btn active" data-anim="idle" type="button">Idle</button>
    <button class="anim-btn" data-anim="walk" type="button">Walk</button>
    <button class="anim-btn" data-anim="attack" type="button">Attack</button>
    <button class="anim-btn" data-anim="special" type="button">Special</button>

    <div class="divider"></div>

    <!-- 4 Iconic Michael Myers Outfits -->
    <button class="outfit-btn active" data-outfit="h2018" type="button" title="Halloween 2018 Aged Mask & Charcoal Coveralls (Ref 1 & 2)">
      <span class="swatch-dot" style="background:#b8b4aa"></span>2018 Haddonfield
    </button>
    <button class="outfit-btn" data-outfit="classic78" type="button" title="1978 Original 'The Shape' Stark White Mask & Spruce Coveralls (Ref 3)">
      <span class="swatch-dot" style="background:#e6e9f0"></span>1978 The Shape
    </button>
    <button class="outfit-btn" data-outfit="kills" type="button" title="Halloween Kills Scorched Mask & Bloodied Coveralls">
      <span class="swatch-dot" style="background:#7a3828"></span>Scorched 2021
    </button>
    <button class="outfit-btn" data-outfit="ghost" type="button" title="1978 Bedsheet Ghost Disguise with Bob's Glasses">
      <span class="swatch-dot" style="background:#cfd6e3"></span>Ghost Sheet
    </button>

    <div class="divider"></div>

    <button class="icon-btn" id="reset-camera" type="button" title="Reset Camera (R)" aria-label="Reset Camera">
      <svg viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
        <path d="M3 3v5h5" />
      </svg>
    </button>
  </div>

  <script>
    window.onload = function () {
      const container = document.getElementById('canvas-container');

      /* ───────── Scene, Camera, Renderer (1 unit = 1 texel, 16 texels = 1 block) ───────── */
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f1115);
      scene.fog = new THREE.FogExp2(0x0f1115, 0.0058);

      const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 400);
      const DEFAULT_CAM_POS = new THREE.Vector3(24, 24, 52);
      const DEFAULT_TARGET = new THREE.Vector3(0, 15.5, 0);
      camera.position.copy(DEFAULT_CAM_POS);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.075;
      controls.target.copy(DEFAULT_TARGET);
      controls.minDistance = 18;
      controls.maxDistance = 125;
      controls.maxPolarAngle = Math.PI * 0.505;
      controls.update();

      /* ───────── Haddonfield Foggy Night & Moonlight Rim Lighting (Ref 2 & Ref 3) ───────── */
      const hemiLight = new THREE.HemisphereLight(0xc8d8f0, 0x181920, 0.72);
      hemiLight.position.set(0, 50, 0);
      scene.add(hemiLight);

      // Cold streetlamp / moonlight key light casting stark Myers mask shadows (Ref 1 & Ref 3)
      const keyLight = new THREE.DirectionalLight(0xeef4ff, 1.28);
      keyLight.position.set(24, 46, 28);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 8;
      keyLight.shadow.camera.far = 120;
      const d = 26;
      keyLight.shadow.camera.left = -d;
      keyLight.shadow.camera.right = d;
      keyLight.shadow.camera.top = d;
      keyLight.shadow.camera.bottom = -d;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      // Strong backlit halo rim light matching `MichaelMyers2018.jpg` forest backlight!
      const rimLight = new THREE.DirectionalLight(0xfff4d6, 0.92);
      rimLight.position.set(-18, 34, -28);
      scene.add(rimLight);

      // Subtle cool blue night fill from left
      const fillLight = new THREE.DirectionalLight(0x6e8cb8, 0.38);
      fillLight.position.set(-22, 16, 22);
      scene.add(fillLight);

      // Dynamic Halloween Jack-O'-Lantern Candle PointLight (glows during Special!)
      const pumpkinLight = new THREE.PointLight(0xff7718, 0.0, 42, 1.8);
      pumpkinLight.position.set(4.5, 4.0, 7.5);
      scene.add(pumpkinLight);

      // Soft ground shadow catcher at y = 0
      const groundGeo = new THREE.PlaneGeometry(180, 180);
      const groundMat = new THREE.ShadowMaterial({ opacity: 0.46 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      scene.add(ground);

      /* ───────── Deterministic 16x16 Pixel-Art Texture Engine ───────── */
      function hash2D(x, y, seed = 1) {
        let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 1442695041);
        n = (n ^ (n >>> 13)) >>> 0;
        n = Math.imul(n, 1274126177) >>> 0;
        return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
      }

      function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        const num = parseInt(clean, 16);
        return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
      }

      function shadeHex(hex, delta) {
        const [r, g, b] = hexToRgb(hex);
        const clamp = (v) => Math.max(0, Math.min(255, Math.round(v + delta)));
        return `rgb(${clamp(r)},${clamp(g)},${clamp(b)})`;
      }

      function fillTexturedRect(ctx, x, y, w, h, baseHex, variance = 8, seed = 1) {
        for (let py = y; py < y + h; py++) {
          for (let px = x; px < x + w; px++) {
            const n = (hash2D(px, py, seed) - 0.5) * 2 * variance;
            ctx.fillStyle = shadeHex(baseHex, n);
            ctx.fillRect(px, py, 1, 1);
          }
        }
      }

      function makeCanvasTex(wTex, hTex, drawFn) {
        const cw = Math.max(1, Math.round(wTex));
        const ch = Math.max(1, Math.round(hTex));
        const c = document.createElement('canvas');
        c.width = cw;
        c.height = ch;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        drawFn(ctx, cw, ch);
        const tex = new THREE.CanvasTexture(c);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        tex.needsUpdate = true;
        return tex;
      }

      function createPixelBox(w, h, d, faceDrawMap, matOpts = {}) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const order = ['right', 'left', 'top', 'bottom', 'front', 'back'];
        const dims = [
          [d, h], [d, h],
          [w, d], [w, d],
          [w, h], [w, h]
        ];
        const materials = order.map((face, i) => {
          const fn = faceDrawMap[face] || faceDrawMap.sides || faceDrawMap.all;
          const tex = makeCanvasTex(dims[i][0], dims[i][1], (ctx, cw, ch) => {
            if (fn) fn(ctx, cw, ch, face);
          });
          return new THREE.MeshStandardMaterial({
            map: tex,
            roughness: matOpts.roughness !== undefined ? matOpts.roughness : 0.82,
            metalness: matOpts.metalness !== undefined ? matOpts.metalness : 0.06,
            transparent: !!matOpts.transparent,
            opacity: matOpts.opacity !== undefined ? matOpts.opacity : 1.0
          });
        });
        const mesh = new THREE.Mesh(geo, materials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      /* ───────── Color Palette — Michael Myers (Ref 1 `images.jpg`, Ref 2 `MichaelMyers2018.jpg`, Ref 3 `MICHAELMYERSHD.png`) ───────── */
      const PAL = {
        // 2018 Aged Cracked Latex Mask (`images.jpg` & `MichaelMyers2018.jpg`)
        mask18Bright: '#d6d3c9',
        mask18Light: '#c7c3b8',
        mask18Base: '#b2ada1',
        mask18Mid: '#948f83',
        mask18Shade: '#757065',
        mask18Crack: '#524e45',
        mask18Deep: '#302d28',
        eyeVoid: '#050608',

        // 1978 Stark Bleached-White Mask (`MICHAELMYERSHD.png` high-contrast chiaroscuro)
        mask78Pure: '#f2f5fa',
        mask78White: '#e4e9f2',
        mask78Light: '#cbd3e0',
        mask78Shade: '#7e889b',
        mask78Dark: '#394152',
        mask78StarkShadow: '#181c26',

        // 2021 Halloween Kills Scorched / Melted Left-Side Mask
        burnChar: '#1f1714',
        burnDark: '#362720',
        burnMid: '#543d30',
        burnBlister: '#7d5c47',
        burnYellow: '#91785c',

        // Matted Dark Reddish-Brown Kirk Mask Hair (`images.jpg`)
        hairDeep: '#180f0a',
        hairDark: '#241710',
        hairBase: '#332117',
        hairMid: '#422b1e',
        hairLight: '#543828',

        // Coveralls — 2018 Matte Charcoal-Slate (`images.jpg` & `MichaelMyers2018.jpg`)
        cov18Base: '#181c22',
        cov18Light: '#232932',
        cov18Highlight: '#2e3642',
        cov18Dark: '#101318',
        cov18Deep: '#0a0c10',
        undershirtGrey: '#262a30',

        // Coveralls — 1978 Tex-Green / Slate Spruce (`MICHAELMYERSHD.png`)
        cov78Base: '#233036',
        cov78Light: '#31424a',
        cov78Highlight: '#41555e',
        cov78Dark: '#161f24',

        // Ghost Sheet (`Bob's Ghost` 1978)
        sheetWhite: '#e8ebf2',
        sheetFold: '#c9d0de',
        sheetShade: '#9aa3b5',

        // Hands, Boots & Lamson Butcher Knife
        handSkin: '#b38871',
        handShade: '#8f6955',
        handGrime: '#694d3e',
        bandage: '#d8d2c5',
        bootBlack: '#121417',
        bootSole: '#090a0c',
        woodHilt: '#4a2a1b',
        brassRivet: '#c9a64e',
        bladeSteel: '#dce4ee',
        bladeDark: '#7c8694',
        bloodFresh: '#8a1117'
      };

      /* ───────── Root & Hierarchical 2-Bone Skeleton (Rule 12) ───────── */
      const characterRoot = new THREE.Group();
      characterRoot.name = 'michaelRoot';
      scene.add(characterRoot);

      const bodyPivot = new THREE.Group();
      bodyPivot.name = 'bodyPivot';
      bodyPivot.position.set(0, 12, 0);
      characterRoot.add(bodyPivot);

      const torsoPivot = new THREE.Group();
      torsoPivot.name = 'torso';
      torsoPivot.position.set(0, 0, 0);
      bodyPivot.add(torsoPivot);

      const headPivot = new THREE.Group();
      headPivot.name = 'head';
      headPivot.position.set(0, 12, 0);
      torsoPivot.add(headPivot);

      const armBoneR = new THREE.Group();
      armBoneR.name = 'armR';
      armBoneR.position.set(-6.0, 11.5, 0);
      torsoPivot.add(armBoneR);

      const forearmBoneR = new THREE.Group();
      forearmBoneR.name = 'forearmR';
      forearmBoneR.position.set(0, -6.0, 0);
      armBoneR.add(forearmBoneR);

      const armBoneL = new THREE.Group();
      armBoneL.name = 'armL';
      armBoneL.position.set(6.0, 11.5, 0);
      torsoPivot.add(armBoneL);

      const forearmBoneL = new THREE.Group();
      forearmBoneL.name = 'forearmL';
      forearmBoneL.position.set(0, -6.0, 0);
      armBoneL.add(forearmBoneL);

      const legBoneR = new THREE.Group();
      legBoneR.name = 'legR';
      legBoneR.position.set(-2.0, 0, 0);
      bodyPivot.add(legBoneR);

      const kneeBoneR = new THREE.Group();
      kneeBoneR.name = 'kneeR';
      kneeBoneR.position.set(0, -6.0, 0);
      legBoneR.add(kneeBoneR);

      const legBoneL = new THREE.Group();
      legBoneL.name = 'legL';
      legBoneL.position.set(2.0, 0, 0);
      bodyPivot.add(legBoneL);

      const kneeBoneL = new THREE.Group();
      kneeBoneL.name = 'kneeL';
      kneeBoneL.position.set(0, -6.0, 0);
      legBoneL.add(kneeBoneL);

      // Spring-driven Coverall Hip / Ghost Sheet Lower Drape Pivots
      const skirtPivotR = new THREE.Group();
      skirtPivotR.name = 'skirtR';
      skirtPivotR.position.set(-2.1, 0.4, 0);
      torsoPivot.add(skirtPivotR);

      const skirtPivotL = new THREE.Group();
      skirtPivotL.name = 'skirtL';
      skirtPivotL.position.set(2.1, 0.4, 0);
      torsoPivot.add(skirtPivotL);

      const hairTuftPivot = new THREE.Group();
      hairTuftPivot.name = 'hairTufts';
      hairTuftPivot.position.set(0, 8.0, 0);
      headPivot.add(hairTuftPivot);

      /* ───────── 1. Recessed Hollow Eye Sockets & Shadowy Eyes (`images.jpg` & `MICHAELMYERSHD.png`) ───────── */
      // Positioned at y = 4.25 (matching rows 6..8 of the 16x16 mask face grid!)
      const eyeSocketMat = new THREE.MeshStandardMaterial({ color: 0x040507, roughness: 0.95 });
      const socketR = new THREE.Mesh(new THREE.BoxGeometry(1.75, 1.05, 0.10), eyeSocketMat);
      socketR.position.set(-1.75, 4.25, 4.01);
      const socketL = new THREE.Mesh(new THREE.BoxGeometry(1.75, 1.05, 0.10), eyeSocketMat);
      socketL.position.set(1.75, 4.25, 4.01);
      headPivot.add(socketR, socketL);

      // Barely-visible dark eyes deep inside the shadowed sockets (tracks pointer subtly)
      const pupilMat = new THREE.MeshStandardMaterial({ color: 0x161412, roughness: 0.8 });
      const pupilR = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.46, 0.11), pupilMat);
      pupilR.position.set(-1.72, 4.24, 4.02);
      const pupilL = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.46, 0.11), pupilMat);
      pupilL.position.set(1.72, 4.24, 4.02);
      headPivot.add(pupilR, pupilL);

      const lidMat = new THREE.MeshStandardMaterial({ color: 0x040507, roughness: 0.95 });
      const eyelidR = new THREE.Mesh(new THREE.BoxGeometry(1.80, 1.08, 0.13), lidMat);
      eyelidR.position.set(-1.75, 4.25, 4.04);
      eyelidR.scale.y = 0.01;
      const eyelidL = new THREE.Mesh(new THREE.BoxGeometry(1.80, 1.08, 0.13), lidMat);
      eyelidL.position.set(1.75, 4.25, 4.04);
      eyelidL.scale.y = 0.01;
      headPivot.add(eyelidR, eyelidL);

      /* ───────── 2. Four Reference-Accurate Michael Myers Outfits ───────── */
      const outfitMeshes = {
        h2018: [],
        classic78: [],
        kills: [],
        ghost: []
      };

      function registerMesh(key, parent, mesh) {
        parent.add(mesh);
        outfitMeshes[key].push(mesh);
        return mesh;
      }

      /* ───────── 16x16 High-Precision Mask Face Painters (1:1 to `images.jpg` & `MICHAELMYERSHD.png`) ───────── */
      // Paint a 16x16 pixel-art face canvas mapped onto the 8x8 head front face (0.5-texel crisp NearestFilter detail)
      function paintMyersFace16(ctx, mode) {
        if (mode === 'ghost') {
          fillTexturedRect(ctx, 0, 0, 16, 16, PAL.sheetWhite, 3, 101);
          // Vertical ghost sheet cloth folds
          ctx.fillStyle = PAL.sheetFold;
          ctx.fillRect(2, 0, 2, 16);
          ctx.fillRect(12, 0, 2, 16);
          ctx.fillRect(7, 8, 2, 8);
          ctx.fillStyle = PAL.sheetShade;
          ctx.fillRect(0, 0, 1, 16);
          ctx.fillRect(15, 0, 1, 16);
          ctx.fillRect(3, 10, 1, 6);
          ctx.fillRect(12, 9, 1, 7);
          // Cutout oval eye holes in the sheet (rows 6..8)
          ctx.fillStyle = PAL.eyeVoid;
          ctx.fillRect(3, 6, 4, 3);
          ctx.fillRect(9, 6, 4, 3);
          return;
        }

        const is78 = mode === 'classic78';
        const isKills = mode === 'kills';

        // Cohesive, smooth sculpted latex palette (matches `images.jpg` & `MICHAELMYERSHD.png` without harsh blotches)
        const cHighlight = is78 ? '#f4f6fa' : '#dbd7cc';
        const cBright    = is78 ? '#e8ecf4' : '#cfc9be';
        const cLight     = is78 ? '#d8dfe9' : '#c2bcb0';
        const cBase      = is78 ? '#c2cad8' : '#b2aca0';
        const cMid       = is78 ? '#97a2b5' : '#9c968a';
        const cShade     = is78 ? '#687387' : '#827c70';
        const cCrease    = is78 ? '#434b5c' : '#635e54';
        const cRim       = is78 ? '#252a36' : '#3b3832';

        // 1) Smooth base latex skin across 16x16 (low variance = smooth molded latex)
        fillTexturedRect(ctx, 0, 0, 16, 16, cBase, 1.8, 105);

        // 2) Tall Broad Forehead (`images.jpg`: broad pale latex forehead catching top-down light)
        fillTexturedRect(ctx, 1, 1, 14, 4, cLight, 1.5, 106);
        fillTexturedRect(ctx, 2, 1, 12, 3, cBright, 1.2, 107);
        fillTexturedRect(ctx, 4, 1, 8, 2, cHighlight, 1.0, 108);

        // Organic Matted Kirk Hairline at top edge & temple corners (`images.jpg` & `MICHAELMYERSHD.png`)
        ctx.fillStyle = PAL.hairDark;
        ctx.fillRect(0, 0, 3, 1);
        ctx.fillRect(13, 0, 3, 1);
        ctx.fillRect(0, 1, 2, 1);
        ctx.fillRect(14, 1, 2, 1);
        ctx.fillRect(0, 2, 1, 2);
        ctx.fillRect(15, 2, 1, 2);
        ctx.fillStyle = PAL.hairBase;
        ctx.fillRect(3, 0, 2, 1);
        ctx.fillRect(7, 0, 2, 1); // Subtle center widow's-peak tuft
        ctx.fillRect(11, 0, 2, 1);
        ctx.fillRect(2, 1, 1, 1);
        ctx.fillRect(13, 1, 1, 1);
        // Soft hairline shadow transition along top forehead (row 0)
        ctx.fillStyle = cShade;
        ctx.fillRect(5, 0, 2, 1);
        ctx.fillRect(9, 0, 2, 1);

        // Subtle forehead temple shading & separated vertical glabella frown creases (`images.jpg`)
        ctx.fillStyle = cMid;
        ctx.fillRect(1, 2, 1, 3);
        ctx.fillRect(14, 2, 1, 3);
        // Two separated vertical frown lines above the brow bridge (`images.jpg`), keeping center cols 7..8 pale!
        ctx.fillRect(6, 3, 1, 2);
        ctx.fillRect(9, 3, 1, 2);
        if (!is78) {
          // Fine, asymmetric 2018 weathered forehead cracks (`images.jpg`)
          ctx.fillStyle = cShade;
          ctx.fillRect(3, 2, 1, 2);
          ctx.fillRect(12, 1, 1, 2);
          ctx.fillRect(11, 2, 1, 1);
        }

        // 3) Sculpted Supraorbital Brow Arches (rows 4..5)
        ctx.fillStyle = cHighlight;
        ctx.fillRect(2, 4, 4, 1);
        ctx.fillRect(10, 4, 4, 1);
        ctx.fillStyle = cBright;
        ctx.fillRect(2, 5, 4, 1);
        ctx.fillRect(10, 5, 4, 1);
        ctx.fillRect(7, 4, 2, 2); // Lit upper bridge between brows

        // 4) Recessed Dark Almond / Oval Eye Cutouts (rows 6..8, cols 2..5 and 10..13) (`images.jpg` & `MICHAELMYERSHD.png`)
        // Soft orbital shadow rim framing the eye openings
        ctx.fillStyle = cShade;
        ctx.fillRect(1, 6, 1, 3);
        ctx.fillRect(6, 6, 1, 2);
        ctx.fillRect(9, 6, 1, 2);
        ctx.fillRect(14, 6, 1, 3);
        ctx.fillStyle = cMid;
        ctx.fillRect(2, 9, 4, 1);
        ctx.fillRect(10, 9, 4, 1);

        // Pitch-black oval eye voids
        ctx.fillStyle = PAL.eyeVoid;
        ctx.fillRect(2, 6, 4, 3);
        ctx.fillRect(10, 6, 4, 3);
        // Rounded almond eye corners (`images.jpg` curved eye cutout corners)
        ctx.fillStyle = cRim;
        ctx.fillRect(2, 6, 1, 1);
        ctx.fillRect(5, 6, 1, 1);
        ctx.fillRect(2, 8, 1, 1);
        ctx.fillRect(5, 8, 1, 1);
        ctx.fillRect(10, 6, 1, 1);
        ctx.fillRect(13, 6, 1, 1);
        ctx.fillRect(10, 8, 1, 1);
        ctx.fillRect(13, 8, 1, 1);

        // 5) Sculpted Latex Nose Bridge & Nostril Wings (rows 5..9, cols 6..9)
        ctx.fillStyle = cHighlight;
        ctx.fillRect(7, 5, 2, 5); // Smooth lit nose bridge & tip
        ctx.fillStyle = cBright;
        ctx.fillRect(6, 8, 1, 2); // Nostril wing R
        ctx.fillRect(9, 8, 1, 2); // Nostril wing L
        // Subtle nostril shadow tucked right at row 9 corners (leaves row 10 philtrum clean & pale!)
        ctx.fillStyle = cCrease;
        ctx.fillRect(6, 9, 1, 1);
        ctx.fillRect(9, 9, 1, 1);

        // 6) Smooth Sculpted Malar Cheekbones & Subtle Gaunt Contour (`images.jpg`)
        // Smooth pale latex across cheeks & philtrum (rows 9..13)
        fillTexturedRect(ctx, 2, 9, 12, 4, cLight, 1.4, 110);
        // Bright upper cheekbone highlights (rows 9..10)
        ctx.fillStyle = cHighlight;
        ctx.fillRect(2, 9, 3, 1);
        ctx.fillRect(11, 9, 3, 1);
        ctx.fillStyle = cBright;
        ctx.fillRect(2, 10, 4, 1);
        ctx.fillRect(10, 10, 4, 1);

        // Soft sub-cheekbone hollow on outer cheeks (rows 11..13) & delicate nasolabial fold (`images.jpg`)
        ctx.fillStyle = cBase;
        ctx.fillRect(2, 11, 3, 3);
        ctx.fillRect(11, 11, 3, 3);
        ctx.fillStyle = cMid;
        ctx.fillRect(1, 10, 1, 3);
        ctx.fillRect(14, 10, 1, 3);
        ctx.fillRect(5, 10, 1, 2); // Soft nasolabial crease R
        ctx.fillRect(10, 10, 1, 2); // Soft nasolabial crease L

        // 7) Sculpted William Shatner / Kirk Philtrum, Lips & Subtle Mouth Parting (rows 10..13) (`images.jpg`!)
        // Clean pale philtrum (rows 10..11) with subtle center dimple
        ctx.fillStyle = cBright;
        ctx.fillRect(6, 10, 4, 2);
        ctx.fillStyle = cBase;
        ctx.fillRect(7, 10, 2, 1);

        // Narrow dark sculpted lip parting line (row 12) with slightly downturned corners (`images.jpg`)
        ctx.fillStyle = cRim;
        ctx.fillRect(6, 12, 4, 1);
        ctx.fillStyle = cCrease;
        ctx.fillRect(5, 12, 1, 1);
        ctx.fillRect(10, 12, 1, 1);
        ctx.fillStyle = cShade;
        ctx.fillRect(4, 13, 1, 1); // Subtle downturned mouth corner R (`images.jpg`)
        ctx.fillRect(11, 13, 1, 1); // Subtle downturned mouth corner L (`images.jpg`)

        // Rounded lower lip highlight (row 13) + soft labiomental chin crease (row 14)
        ctx.fillStyle = cHighlight;
        ctx.fillRect(6, 13, 4, 1);
        ctx.fillStyle = cLight;
        ctx.fillRect(5, 13, 1, 1);
        ctx.fillRect(10, 13, 1, 1);
        ctx.fillStyle = cMid;
        ctx.fillRect(6, 14, 4, 1);

        // 8) Smooth Rounded Chin & Jawline Contour (rows 14..15)
        ctx.fillStyle = cHighlight;
        ctx.fillRect(6, 15, 4, 1);
        ctx.fillStyle = cBright;
        ctx.fillRect(4, 14, 2, 2);
        ctx.fillRect(10, 14, 2, 2);
        // Outer jaw & temple contour shadow
        ctx.fillStyle = cMid;
        ctx.fillRect(0, 4, 1, 9);
        ctx.fillRect(15, 4, 1, 9);
        ctx.fillStyle = cShade;
        ctx.fillRect(0, 13, 2, 3);
        ctx.fillRect(14, 13, 2, 3);
        ctx.fillRect(2, 15, 2, 1);
        ctx.fillRect(12, 15, 2, 1);

        // 9) Fine Weathering Cracks (`h2018`) or Stark Chiaroscuro Shadow (`classic78`) or Fire Char (`kills`)
        if (!is78) {
          // Delicate, realistic 2018 latex age cracks on outer cheek & jaw (`images.jpg`)
          ctx.fillStyle = cShade;
          ctx.fillRect(1, 7, 1, 1);
          ctx.fillRect(14, 7, 1, 2);
          ctx.fillRect(2, 12, 1, 2);
          ctx.fillRect(13, 11, 1, 2);
          ctx.fillStyle = cCrease;
          ctx.fillRect(1, 12, 1, 1);
          ctx.fillRect(13, 12, 1, 1);
        } else {
          // 1978 `MICHAELMYERSHD.png` Dramatic Side-Shadow on Viewer's Left (cols 0..4)
          ctx.fillStyle = PAL.mask78Shade;
          ctx.fillRect(2, 2, 2, 13);
          ctx.fillStyle = PAL.mask78Dark;
          ctx.fillRect(0, 2, 2, 14);
          ctx.fillRect(2, 11, 3, 5);
          ctx.fillRect(5, 9, 2, 2); // Shadow under nose (`MICHAELMYERSHD.png`)
          ctx.fillStyle = PAL.mask78StarkShadow;
          ctx.fillRect(0, 5, 1, 11);
          ctx.fillRect(1, 13, 2, 3);
        }

        if (isKills) {
          // 2021 `Halloween Kills` Scorched / Melted Left Side of Mask (cols 9..15)
          fillTexturedRect(ctx, 10, 0, 6, 16, PAL.burnMid, 5, 109);
          fillTexturedRect(ctx, 12, 0, 4, 16, PAL.burnDark, 5, 110);
          fillTexturedRect(ctx, 14, 1, 2, 15, PAL.burnChar, 4, 111);
          ctx.fillStyle = PAL.burnBlister;
          ctx.fillRect(9, 2, 2, 3);
          ctx.fillRect(9, 9, 3, 3);
          ctx.fillRect(8, 13, 3, 2);
          ctx.fillStyle = PAL.burnYellow;
          ctx.fillRect(9, 4, 1, 2);
          ctx.fillRect(10, 10, 1, 2);
          ctx.fillStyle = PAL.eyeVoid;
          ctx.fillRect(10, 6, 4, 3);
          ctx.fillStyle = PAL.burnChar;
          ctx.fillRect(6, 12, 4, 1);
        }
      }

      function buildMyersOutfit(key, cfg) {
        // 1) Head / Mask Cube (8x8x8 with 16x16 high-density pixel-art canvas for 1:1 facial accuracy)
        // Note: on Three.js BoxGeometry, material 'right' is +X (viewer right, x=0 is front +Z, x=w-1 is back -Z)
        // and material 'left' is -X (viewer left, x=0 is back -Z, x=w-1 is front +Z).
        const headBox = createPixelBox(8, 8, 8, {});
        // Populate all 6 faces of headBox with 16x16 high-detail pixel-art canvases!
        const headOrder = ['right', 'left', 'top', 'bottom', 'front', 'back'];
        const headFns = {
          front: (ctx) => paintMyersFace16(ctx, key),
          right: (ctx) => {
            if (cfg.isGhost) {
              fillTexturedRect(ctx, 0, 0, 16, 16, PAL.sheetWhite, 4, 112);
              ctx.fillStyle = PAL.sheetFold;
              ctx.fillRect(4, 0, 2, 16);
              ctx.fillRect(10, 0, 2, 16);
            } else {
              const sideHex = cfg.isScorched ? PAL.burnDark : cfg.maskBaseHex;
              fillTexturedRect(ctx, 0, 0, 16, 16, sideHex, 2.5, 113);
              const hairCol = cfg.isScorched ? PAL.burnChar : PAL.hairBase;
              // Sideburns & back hair coverage (x=0 is front +Z, x=15 is back -Z)
              fillTexturedRect(ctx, 0, 0, 16, 2, hairCol, 4, 114);
              fillTexturedRect(ctx, 5, 2, 11, 4, hairCol, 4, 115);
              fillTexturedRect(ctx, 8, 6, 8, 7, PAL.hairDark, 4, 116);
              // Subtle sculpted latex ear & jaw shadow (`images.jpg`)
              ctx.fillStyle = cfg.maskLightHex;
              ctx.fillRect(5, 6, 2, 4);
              ctx.fillStyle = cfg.maskSideHex;
              ctx.fillRect(6, 7, 1, 2);
              ctx.fillRect(2, 12, 5, 1);
            }
          },
          left: (ctx) => {
            if (cfg.isGhost) {
              fillTexturedRect(ctx, 0, 0, 16, 16, PAL.sheetWhite, 4, 117);
              ctx.fillStyle = PAL.sheetFold;
              ctx.fillRect(4, 0, 2, 16);
              ctx.fillRect(10, 0, 2, 16);
            } else {
              fillTexturedRect(ctx, 0, 0, 16, 16, cfg.maskSideHex, 2.5, 118);
              // Sideburns & back hair coverage (x=0 is back -Z, x=15 is front +Z)
              fillTexturedRect(ctx, 0, 0, 16, 2, PAL.hairBase, 4, 119);
              fillTexturedRect(ctx, 0, 2, 11, 4, PAL.hairBase, 4, 120);
              fillTexturedRect(ctx, 0, 6, 8, 7, PAL.hairDark, 4, 121);
              // Subtle sculpted latex ear & jaw shadow (`images.jpg`)
              ctx.fillStyle = cfg.maskBaseHex;
              ctx.fillRect(8, 6, 2, 4);
              ctx.fillStyle = cfg.maskCrackHex;
              ctx.fillRect(9, 7, 1, 2);
              ctx.fillRect(9, 12, 5, 1);
            }
          },
          back: (ctx) => {
            if (cfg.isGhost) {
              fillTexturedRect(ctx, 0, 0, 16, 16, PAL.sheetWhite, 4, 122);
            } else {
              fillTexturedRect(ctx, 0, 0, 16, 13, PAL.hairDark, 5, 123);
              fillTexturedRect(ctx, 0, 13, 16, 3, cfg.maskSideHex, 3, 124);
              ctx.fillStyle = cfg.maskCrackHex;
              ctx.fillRect(7, 13, 2, 3);
            }
          },
          top: (ctx) => {
            if (cfg.isGhost) {
              fillTexturedRect(ctx, 0, 0, 16, 16, PAL.sheetWhite, 4, 125);
            } else {
              fillTexturedRect(ctx, 0, 0, 16, 16, PAL.hairBase, 5, 126);
              fillTexturedRect(ctx, 3, 3, 10, 10, PAL.hairMid, 5, 127);
            }
          },
          bottom: (ctx) => fillTexturedRect(ctx, 0, 0, 16, 16, cfg.maskSideHex, 3, 128)
        };
        headOrder.forEach((f, idx) => {
          headBox.material[idx].map = makeCanvasTex(16, 16, headFns[f]);
          headBox.material[idx].roughness = cfg.isGhost ? 0.88 : 0.76;
          headBox.material[idx].needsUpdate = true;
        });
        headBox.position.set(0, 4.0, 0);
        registerMesh(key, headPivot, headBox);

        // 2) Seamless Sculpted 3D Latex Mask Features (`images.jpg` & `MICHAELMYERSHD.png`!)
        // Colored in the exact pale latex shade so Three.js lighting creates natural 3D depth without dark boxy seams!
        if (!cfg.isGhost) {
          // 2a) Overhanging 3D Furrowed Latex Brow Ridges casting real shadow into the hollow eye sockets
          const browR = createPixelBox(2.25, 0.52, 0.28, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskLightHex, 1.5, 130),
            bottom: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskSideHex, 1.5, 131)
          }, { roughness: 0.76 });
          browR.position.set(-1.75, 5.02, 4.08);
          browR.rotation.z = -0.06; // Furrowed Kirk brow arch (`images.jpg`)
          registerMesh(key, headPivot, browR);

          const browL = createPixelBox(2.25, 0.52, 0.28, {
            all: (ctx, w, h) => {
              const col = cfg.isScorched ? PAL.burnBlister : cfg.maskLightHex;
              fillTexturedRect(ctx, 0, 0, w, h, col, 1.5, 132);
            },
            bottom: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskSideHex, 1.5, 133)
          }, { roughness: 0.76 });
          browL.position.set(1.75, 5.02, 4.08);
          browL.rotation.z = 0.06;
          registerMesh(key, headPivot, browL);

          // 2b) Sculpted 3D Latex Nose Bridge & Nostril Base (`images.jpg` & `MICHAELMYERSHD.png`)
          const noseBridge = createPixelBox(1.02, 1.68, 0.36, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskLightHex, 1.5, 134),
            bottom: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskSideHex, 1.5, 135)
          }, { roughness: 0.74 });
          noseBridge.position.set(0, 3.92, 4.12);
          noseBridge.rotation.x = -0.07;
          registerMesh(key, headPivot, noseBridge);

          const noseNostrils = createPixelBox(1.48, 0.48, 0.28, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskBaseHex, 1.5, 136),
            bottom: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.eyeVoid, 1, 137)
          }, { roughness: 0.76 });
          noseNostrils.position.set(0, 3.24, 4.09);
          registerMesh(key, headPivot, noseNostrils);

          // 2c) Subtle 3D Sculpted William Shatner / Kirk Upper & Lower Lip Relief (`images.jpg`!)
          const upperLip3D = createPixelBox(1.90, 0.36, 0.14, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskLightHex, 1.5, 139),
            bottom: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskCrackHex, 1.5, 140)
          }, { roughness: 0.76 });
          upperLip3D.position.set(0, 2.26, 4.04);
          registerMesh(key, headPivot, upperLip3D);

          const lowerLip3D = createPixelBox(1.70, 0.34, 0.13, {
            all: (ctx, w, h) => {
              const col = cfg.isScorched ? PAL.burnBlister : cfg.maskBaseHex;
              fillTexturedRect(ctx, 0, 0, w, h, col, 1.5, 141);
            }
          }, { roughness: 0.76 });
          lowerLip3D.position.set(0, 1.66, 4.03);
          registerMesh(key, headPivot, lowerLip3D);

          // 2d) Molded 3D Latex Mask Ears (`images.jpg` & `MICHAELMYERSHD.png` visible ear silhouette)
          const earR = createPixelBox(0.32, 1.75, 1.10, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.maskSideHex, 2, 143)
          });
          earR.position.set(-4.12, 3.85, -0.35);
          registerMesh(key, headPivot, earR);

          const earL = createPixelBox(0.32, 1.75, 1.10, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.isScorched ? PAL.burnDark : cfg.maskBaseHex, 2, 144)
          });
          earL.position.set(4.12, 3.85, -0.35);
          registerMesh(key, headPivot, earL);

          // 2e) Wild, Matted, Frizzy Brushed-Back 3D Kirk Mask Hair (`images.jpg` & `MICHAELMYERSHD.png`!)
          // Recedes slightly from the front hairline to expose the broad pale forehead, puffing up at the crown & sides!
          const hairCrownMain = createPixelBox(8.36, 1.28, 8.15, {
            all: (ctx, w, h) => {
              fillTexturedRect(ctx, 0, 0, w, h, PAL.hairDark, 4, 145);
              if (cfg.isScorched) {
                ctx.fillStyle = PAL.burnChar;
                ctx.fillRect(5, 0, 3, h);
              }
            },
            top: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairBase, 5, 146)
          }, { roughness: 0.94 });
          hairCrownMain.position.set(0, 8.24, -0.35);
          hairCrownMain.rotation.x = -0.06; // Swept back off the forehead (`images.jpg`)
          registerMesh(key, headPivot, hairCrownMain);

          // Organic 3D Matted Hairline Clusters (breaks up the horizontal top edge into a sculpted hairline!)
          const hairPeakCenter = createPixelBox(3.4, 0.72, 2.2, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairBase, 5, 158)
          }, { roughness: 0.95 });
          hairPeakCenter.position.set(-0.1, 7.88, 3.15);
          hairPeakCenter.rotation.x = -0.14;
          hairPeakCenter.rotation.z = 0.05;
          registerMesh(key, headPivot, hairPeakCenter);

          const hairCornerR = createPixelBox(2.2, 0.95, 2.6, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairDark, 5, 159)
          }, { roughness: 0.95 });
          hairCornerR.position.set(-3.25, 7.62, 2.95);
          hairCornerR.rotation.z = 0.22;
          registerMesh(key, headPivot, hairCornerR);

          const hairCornerL = createPixelBox(2.2, 0.95, 2.6, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.isScorched ? PAL.burnChar : PAL.hairDark, 5, 160)
          }, { roughness: 0.95 });
          hairCornerL.position.set(3.25, 7.62, 2.95);
          hairCornerL.rotation.z = -0.22;
          registerMesh(key, headPivot, hairCornerL);

          // Center brushed-back pompadour wave (`images.jpg` messy front-center hair wave)
          const hairPompadour = createPixelBox(5.8, 0.92, 6.8, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairBase, 5, 147)
          }, { roughness: 0.95 });
          hairPompadour.position.set(-0.15, 8.82, -0.25);
          hairPompadour.rotation.z = 0.04;
          registerMesh(key, headPivot, hairPompadour);

          // Animated top frizzy hair tufts (`hairTuftPivot`)
          const tuftTopA = createPixelBox(4.5, 0.68, 5.2, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairMid, 5, 148)
          }, { roughness: 0.95 });
          tuftTopA.position.set(-0.65, 1.05, -0.40);
          tuftTopA.rotation.z = 0.09;
          registerMesh(key, hairTuftPivot, tuftTopA);

          const tuftTopB = createPixelBox(3.6, 0.62, 4.6, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.isScorched ? PAL.burnChar : PAL.hairBase, 5, 149)
          }, { roughness: 0.95 });
          tuftTopB.position.set(1.25, 0.96, -0.68);
          tuftTopB.rotation.z = -0.11;
          registerMesh(key, hairTuftPivot, tuftTopB);

          // Flared Frizzy Side-Temple Hair Tufts (`images.jpg` & `MICHAELMYERSHD.png` messy hair sticking out above ears!)
          const hairTempleFluffR = createPixelBox(0.72, 2.85, 5.2, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairDark, 5, 150)
          }, { roughness: 0.94 });
          hairTempleFluffR.position.set(-4.16, 6.45, -0.95);
          hairTempleFluffR.rotation.z = 0.14;
          registerMesh(key, headPivot, hairTempleFluffR);

          const hairTempleFluffL = createPixelBox(0.72, 2.85, 5.2, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.isScorched ? PAL.burnChar : PAL.hairDark, 5, 151)
          }, { roughness: 0.94 });
          hairTempleFluffL.position.set(4.16, 6.45, -0.95);
          hairTempleFluffL.rotation.z = -0.14;
          registerMesh(key, headPivot, hairTempleFluffL);

          // Lower behind-ear bushy side-locks & nape hair (`images.jpg` & `MICHAELMYERSHD.png`)
          const hairSideBackR = createPixelBox(0.65, 3.6, 3.6, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairDeep, 4, 152)
          }, { roughness: 0.94 });
          hairSideBackR.position.set(-4.10, 3.8, -2.25);
          hairSideBackR.rotation.z = 0.08;
          registerMesh(key, headPivot, hairSideBackR);

          const hairSideBackL = createPixelBox(0.65, 3.6, 3.6, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, cfg.isScorched ? PAL.burnChar : PAL.hairDeep, 4, 153)
          }, { roughness: 0.94 });
          hairSideBackL.position.set(4.10, 3.8, -2.25);
          hairSideBackL.rotation.z = -0.08;
          registerMesh(key, headPivot, hairSideBackL);

          const hairBackCurtain = createPixelBox(8.4, 6.2, 1.15, {
            all: (ctx, w, h) => fillTexturedRect(ctx, 0, 0, w, h, PAL.hairDeep, 4, 154)
          }, { roughness: 0.94 });
          hairBackCurtain.position.set(0, 4.65, -4.15);
          registerMesh(key, headPivot, hairBackCurtain);

          // 2f) Loose Flared Latex Mask Neck-Skirt (`images.jpg` shows the pale cracked latex neck flaring below the chin!)
          const maskNeckUpper = createPixelBox(5.2, 1.25, 4.4, {
            all: (ctx, w, h) => {
              fillTexturedRect(ctx, 0, 0, w, h, cfg.maskSideHex, 2.5, 155);
              ctx.fillStyle = cfg.maskCrackHex;
              ctx.fillRect(1, 0, 1, h);
              ctx.fillRect(3, 0, 1, h);
            }
          }, { roughness: 0.78 });
          maskNeckUpper.position.set(0, -0.35, -0.15);
          registerMesh(key, headPivot, maskNeckUpper);

          const maskNeckLower = createPixelBox(5.5, 1.15, 4.5, {
            all: (ctx, w, h) => {
              fillTexturedRect(ctx, 0, 0, w, h, cfg.maskSideHex, 2.5, 156);
              ctx.fillStyle = cfg.maskCrackHex;
              ctx.fillRect(1, 0, 1, h);
              ctx.fillRect(4, 0, 1, h);
            }
          }, { roughness: 0.78 });
          maskNeckLower.position.set(0, 11.75, -0.10);
          registerMesh(key, torsoPivot, maskNeckLower);
        } else {
          // Bob's 3D Black-Rimmed Wire Eyeglasses worn over the Ghost Sheet (1978 Bedroom Scene!)
          const frameMat = new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.35, metalness: 0.45 });
          const lensMat = new THREE.MeshStandardMaterial({ color: 0x9ab4cc, transparent: true, opacity: 0.38, roughness: 0.15 });

          const rimR = new THREE.Mesh(new THREE.BoxGeometry(2.65, 1.65, 0.32), frameMat);
          rimR.position.set(-1.75, 4.25, 4.18);
          const rimL = new THREE.Mesh(new THREE.BoxGeometry(2.65, 1.65, 0.32), frameMat);

        const yR = 6.0 * Math.cos(hipRxR) + 6.0 * Math.cos(hipRxR + kneeRxR);
        const yL = 6.0 * Math.cos(hipRxL) + 6.0 * Math.cos(hipRxL + kneeRxL);
        const k = 6.0;
        const m = Math.min(yR, yL);
        const smoothMin = m - Math.log(Math.exp(-k * (yR - m)) + Math.exp(-k * (yL - m))) / k;
        return Math.max(9.6, Math.min(12.2, smoothMin));
      }

      /* ───────── 4 Selectable Animations + Reference Poses ───────── */
      let currentAnim = 'idle';
      let prevAnim = 'idle';
      let animTime = 0;
      let prevAnimTime = 0;
      let blendWeight = 1.0;
      let lastStrikeTrigger = -1;

      const BONE_KEYS = [
        'torso', 'head',
        'armR', 'forearmR',
        'armL', 'forearmL',
        'legR', 'kneeR',
        'legL', 'kneeL'
      ];

      function createZeroPose() {
        return {
          pos: [0, 12, 0],
          bodyRotY: 0,
          torso: [0, 0, 0],
          head: [0, 0, 0],
          armR: [0, 0, 0],
          forearmR: [0, 0, 0],
          armL: [0, 0, 0],
          forearmL: [0, 0, 0],
          legR: [0, 0, 0],
          kneeR: [0, 0, 0],
          legL: [0, 0, 0],
          kneeL: [0, 0, 0],
          knifeRot: [0, 0, 0],
          pumpkinGlow: 0
        };
      }

      function evaluateAnimPose(name, t) {
        const P = createZeroPose();

        if (name === 'idle') {
          // 1. IDLE: "The Shape" Breathing & Raised Butcher Knife Stalker Pose
          // Matches `MichaelMyers2018.jpg` (Ref 2) & `MICHAELMYERSHD.png` (Ref 3)
          const breath = Math.sin(t * 1.9);
          const slowScan = Math.sin(t * 0.65);

          // Heavy, mechanical chest rise (audible mask breathing)
          P.torso[0] = 0.03 + breath * 0.025;
          P.torso[1] = slowScan * 0.04;

          // Iconic eerie Michael Myers head tilt (`images.jpg` & `MICHAELMYERSHD.png`)
          P.head[0] = 0.07 - breath * 0.015;
          P.head[1] = slowScan * 0.14;
          P.head[2] = -0.09 + Math.sin(t * 0.8) * 0.04;

          if (currentOutfit === 'classic78') {
            // Exact `MICHAELMYERSHD.png` (Ref 3) porch-railing stance:
            // Right fist raised beside his right shoulder with the Lamson blade angled diagonally across his chest!
            P.armR[0] = -0.52 + breath * 0.025;
            P.armR[1] = -0.15;
            P.armR[2] = -0.36;
            P.forearmR[0] = -1.12 + Math.sin(t * 1.9) * 0.03;
            P.forearmR[2] = 0.12;
            P.knifeRot[0] = 0.88;
            P.knifeRot[1] = 0.82;
            P.knifeRot[2] = -0.35;
          } else {
            // Exact `MichaelMyers2018.jpg` (Ref 2) stance:
            // Right arm raised in an L-shape with the Lamson Butcher Knife poised beside his shoulder!
            P.armR[0] = -0.68 + breath * 0.025;
            P.armR[1] = -0.22;
            P.armR[2] = -0.52;
            P.forearmR[0] = -1.28 + Math.sin(t * 1.9 - 0.5) * 0.03;
            P.forearmR[2] = -0.18;
            P.knifeRot[0] = 0.18;
            P.knifeRot[2] = -0.35;
          }

          // Left arm hangs heavy at his side with slight elbow bend (`MichaelMyers2018.jpg`)
          P.armL[0] = 0.05 - breath * 0.018;
          P.armL[2] = 0.09;
          P.forearmL[0] = -0.20;

          P.legR[0] = -0.04;
          P.legR[2] = -0.03;
          P.kneeR[0] = 0.06;

          P.legL[0] = 0.05;
          P.legL[2] = 0.03;
          P.kneeL[0] = 0.06;

          P.pos[1] = solvePelvisGroundY(P.legR[0], P.kneeR[0], P.legL[0], P.kneeL[0]) + breath * 0.06;

        } else if (name === 'walk') {
          // 2. WALK: Relentless Haddonfield Stalker Stride (2-bone hip + knee articulation)
          const w = t * 3.4;
          const s = Math.sin(w);
          const c = Math.cos(w);

          const swingR = Math.max(0, -c);
          const swingL = Math.max(0, c);
          P.legR[0] = s * 0.48;
          P.kneeR[0] = 0.06 + swingR * swingR * 0.54;

          P.legL[0] = -s * 0.48;
          P.kneeL[0] = 0.06 + swingL * swingL * 0.54;

          P.pos[0] = c * 0.26;
          P.pos[1] = solvePelvisGroundY(P.legR[0], P.kneeR[0], P.legL[0], P.kneeL[0]);
          P.bodyRotY = -s * 0.06;

          // Stiff, unnervingly upright torso with minimal sway
          P.torso[0] = 0.07 + c * c * 0.02;
          P.torso[1] = s * 0.12;
          P.torso[2] = -c * 0.025;

          // Deadpan mask stare locked forward with slight tilt
          P.head[0] = 0.06;
          P.head[1] = -s * 0.09;
          P.head[2] = -0.06 + c * 0.02;

          // Right hand carries the Lamson Knife low at his side during the relentless march
          P.armR[0] = -0.18 - s * 0.22;
          P.armR[2] = -0.09;
          P.forearmR[0] = -0.38 - Math.sin(w - 0.5) * 0.12;

          P.armL[0] = s * 0.32;
          P.armL[2] = 0.09;
          P.forearmL[0] = -0.24 + Math.max(0, -s) * 0.18;

        } else if (name === 'attack') {
          // 3. ATTACK: Iconic Overhead Slasher Stab & Savage Downward Lamson Knife Plunge
          const dur = 1.95;
          const phase = (t % dur) / dur;

          if (phase < 0.28) {
            // Wind-up: Lifts right arm high overhead into classic Halloween poster stab pose
            const k = smoothStep(phase / 0.28);
            P.bodyRotY = k * 0.30;
            P.torso[0] = THREE.MathUtils.lerp(0.03, -0.16, k);
            P.torso[1] = THREE.MathUtils.lerp(0, 0.34, k);
            P.head[0] = THREE.MathUtils.lerp(0.07, -0.08, k);
            P.head[1] = THREE.MathUtils.lerp(0, -0.24, k);
            P.head[2] = -0.12 * k;

            P.armR[0] = THREE.MathUtils.lerp(-0.45, -2.35, k);
            P.armR[2] = THREE.MathUtils.lerp(-0.18, -0.24, k);
            P.forearmR[0] = THREE.MathUtils.lerp(-0.75, -0.58, k);
            P.knifeRot[0] = 0.25 * k;

            P.armL[0] = 0.28 * k;
            P.armL[2] = 0.22 * k;
            P.forearmL[0] = -0.35 * k;

            P.legR[0] = 0.20 * k;
            P.kneeR[0] = 0.18 * k;
            P.legL[0] = -0.26 * k;
            P.kneeL[0] = 0.24 * k;
            P.pos[2] = k * 1.2;

          } else if (phase < 0.48) {
            // Downward Plunge: Brutal overhead knife stab!
            const k = smoothStep((phase - 0.28) / 0.20);
            P.bodyRotY = THREE.MathUtils.lerp(0.30, -0.26, k);
            P.torso[0] = THREE.MathUtils.lerp(-0.16, 0.32, k);
            P.torso[1] = THREE.MathUtils.lerp(0.34, -0.32, k);
            P.head[0] = THREE.MathUtils.lerp(-0.08, 0.16, k);
            P.head[1] = THREE.MathUtils.lerp(-0.24, 0.20, k);

            P.armR[0] = THREE.MathUtils.lerp(-2.35, -0.38, k);
            P.armR[2] = -0.16;
            P.forearmR[0] = THREE.MathUtils.lerp(-0.58, -0.18, k);
            P.knifeRot[0] = THREE.MathUtils.lerp(0.25, 0.42, k);

            P.armL[0] = 0.42;
            P.armL[2] = 0.28;
            P.forearmL[0] = -0.40;

            P.legR[0] = THREE.MathUtils.lerp(0.20, 0.32, k);
            P.kneeR[0] = 0.26;
            P.legL[0] = THREE.MathUtils.lerp(-0.26, -0.36, k);
            P.kneeL[0] = 0.34;
            P.pos[2] = THREE.MathUtils.lerp(1.2, 2.6, k);

          } else if (phase < 0.72) {
            // Second Strike: Horizontal gut-slash & cold head tilt
            const k = smoothStep((phase - 0.48) / 0.24);
            P.bodyRotY = THREE.MathUtils.lerp(-0.26, 0.22, k);
            P.torso[0] = THREE.MathUtils.lerp(0.32, 0.12, k);
            P.torso[1] = THREE.MathUtils.lerp(-0.32, 0.32, k);
            P.head[0] = 0.12;
            P.head[1] = THREE.MathUtils.lerp(0.20, -0.22, k);
            P.head[2] = -0.18 * Math.sin(k * Math.PI);

            P.armR[0] = THREE.MathUtils.lerp(-0.38, -1.18, Math.sin(k * Math.PI));
            P.armR[1] = THREE.MathUtils.lerp(0.25, -0.58, k);
            P.armR[2] = THREE.MathUtils.lerp(-0.16, -0.55, k);
            P.forearmR[0] = THREE.MathUtils.lerp(-0.18, -0.65, k);

            P.legR[0] = THREE.MathUtils.lerp(0.32, 0.10, k);
            P.kneeR[0] = 0.16;
            P.legL[0] = THREE.MathUtils.lerp(-0.36, -0.14, k);
            P.kneeL[0] = 0.18;
            P.pos[2] = THREE.MathUtils.lerp(2.6, 1.1, k);

          } else {
            // Composed recovery to Idle
            const k = smoothStep((phase - 0.72) / 0.28);
            P.bodyRotY = THREE.MathUtils.lerp(0.22, 0, k);
            P.torso[0] = THREE.MathUtils.lerp(0.12, 0.03, k);
            P.torso[1] = THREE.MathUtils.lerp(0.32, 0, k);
            P.head[0] = THREE.MathUtils.lerp(0.12, 0.07, k);
            P.head[1] = THREE.MathUtils.lerp(-0.22, 0, k);
            P.head[2] = THREE.MathUtils.lerp(-0.12, -0.09, k);

            P.armR[0] = THREE.MathUtils.lerp(-0.55, -0.68, k);
            P.armR[1] = THREE.MathUtils.lerp(-0.58, -0.22, k);
            P.armR[2] = THREE.MathUtils.lerp(-0.55, -0.52, k);
            P.forearmR[0] = THREE.MathUtils.lerp(-0.65, -1.28, k);

            P.legR[0] = THREE.MathUtils.lerp(0.10, -0.04, k);
            P.kneeR[0] = THREE.MathUtils.lerp(0.16, 0.06, k);
            P.legL[0] = THREE.MathUtils.lerp(-0.14, 0.05, k);
            P.kneeL[0] = THREE.MathUtils.lerp(0.18, 0.06, k);
            P.pos[2] = THREE.MathUtils.lerp(1.1, 0, k);
          }

          P.pos[1] = solvePelvisGroundY(P.legR[0], P.kneeR[0], P.legL[0], P.kneeL[0]);

        } else if (name === 'special') {
          // 4. SPECIAL: "The Shape's Curiosity Head-Tilt & Jack-O'-Lantern Porch Stalker"
          // Matches `MICHAELMYERSHD.png` (Ref 3) & `images.jpg` (Ref 1):
          // The glowing Halloween Jack-O'-Lantern lights up at his feet as Michael raises the Lamson blade
          // across his chest and performs his famous slow, 28-degree inquisitive head-tilt!
          const dur = 3.4;
          const phase = (t % dur) / dur;
          const settle = smoothStep(Math.min(1, phase / 0.18)) * (phase > 0.85 ? 1 - smoothStep((phase - 0.85) / 0.15) : 1);
          const tiltWave = Math.sin(Math.min(1, Math.max(0, (phase - 0.15) / 0.70)) * Math.PI);

          P.pumpkinGlow = settle;

          P.torso[0] = 0.06 * settle;
          P.torso[1] = -0.08 * settle;

          // Famous eerie 28-degree head tilt (`images.jpg` & `Halloween` 1978 wall-pin scene!)
          P.head[0] = 0.12 * settle;
          P.head[1] = 0.08 * settle;
          P.head[2] = -0.09 - 0.34 * tiltWave;

          // Holds the Lamson Butcher Knife diagonally across his chest (exact `MICHAELMYERSHD.png` Ref 3 pose!)
          P.armR[0] = THREE.MathUtils.lerp(-0.68, -0.52, settle);
          P.armR[1] = THREE.MathUtils.lerp(-0.22, -0.15, settle);
          P.armR[2] = THREE.MathUtils.lerp(-0.52, -0.36, settle);
          P.forearmR[0] = THREE.MathUtils.lerp(-1.28, -1.12, settle);
          P.forearmR[2] = THREE.MathUtils.lerp(-0.18, 0.12, settle);
          P.knifeRot[0] = THREE.MathUtils.lerp(0.18, 0.88, settle);
          P.knifeRot[1] = 0.82 * settle;
          P.knifeRot[2] = -0.35;

          P.armL[0] = 0.06;
          P.armL[2] = 0.10;
          P.forearmL[0] = -0.22;

          P.legR[0] = -0.04;
          P.kneeR[0] = 0.06;
          P.legL[0] = 0.05;
          P.kneeL[0] = 0.06;
          P.pos[1] = solvePelvisGroundY(P.legR[0], P.kneeR[0], P.legL[0], P.kneeL[0]);
        }

        return P;
      }

      /* ───────── Secondary Spring Physics (Coverall Hip Flaps / Ghost Sheet & Hair Tufts) ───────── */
      let prevPelvisY = 12;
      let prevTorsoX = 0;
      const skirtSpringR = { a: 0, v: 0 };
      const skirtSpringL = { a: 0, v: 0 };
      const hairSpring = { a: 0, v: 0 };

      function stepSpring(s, target, dt, k = 85, d = 10) {
        const acc = -k * (s.a - target) - d * s.v;
        s.v += acc * dt;
        s.a += s.v * dt;
      }

      const _worldPos = new THREE.Vector3();
      const _headWorld = new THREE.Vector3();
      const _targetLocal = new THREE.Vector3();
      const raycaster = new THREE.Raycaster();

      function updateAnimation(dt, totalTime) {
        animTime += dt;
        prevAnimTime += dt;
        blendWeight = Math.min(1.0, blendWeight + dt / 0.28);

        const curPose = evaluateAnimPose(currentAnim, animTime);
        let P = curPose;

        if (blendWeight < 1.0 && prevAnim !== currentAnim) {
          const oldPose = evaluateAnimPose(prevAnim, prevAnimTime);
          const w = smoothStep(blendWeight);
          P = createZeroPose();
          for (let i = 0; i < 3; i++) {
            P.pos[i] = THREE.MathUtils.lerp(oldPose.pos[i], curPose.pos[i], w);
            P.knifeRot[i] = THREE.MathUtils.lerp(oldPose.knifeRot[i], curPose.knifeRot[i], w);
          }
          P.bodyRotY = THREE.MathUtils.lerp(oldPose.bodyRotY, curPose.bodyRotY, w);
          P.pumpkinGlow = THREE.MathUtils.lerp(oldPose.pumpkinGlow, curPose.pumpkinGlow, w);
          for (const key of BONE_KEYS) {
            for (let i = 0; i < 3; i++) {
              P[key][i] = THREE.MathUtils.lerp(oldPose[key][i], curPose[key][i], w);
            }
          }
        }

        bodyPivot.position.set(P.pos[0], P.pos[1], P.pos[2]);
        bodyPivot.rotation.y = P.bodyRotY;

        torsoPivot.rotation.set(P.torso[0], P.torso[1], P.torso[2]);
        headPivot.rotation.set(P.head[0], P.head[1], P.head[2]);

        armBoneR.rotation.set(P.armR[0], P.armR[1], P.armR[2]);
        forearmBoneR.rotation.set(P.forearmR[0], P.forearmR[1], P.forearmR[2]);

        armBoneL.rotation.set(P.armL[0], P.armL[1], P.armL[2]);
        forearmBoneL.rotation.set(P.forearmL[0], P.forearmL[1], P.forearmL[2]);

        legBoneR.rotation.set(P.legR[0], P.legR[1], P.legR[2]);
        kneeBoneR.rotation.set(P.kneeR[0], P.kneeR[1], P.kneeR[2]);

        legBoneL.rotation.set(P.legL[0], P.legL[1], P.legL[2]);
        kneeBoneL.rotation.set(P.kneeL[0], P.kneeL[1], P.kneeL[2]);

        knifeGroup.rotation.set(P.knifeRot[0], P.knifeRot[1], P.knifeRot[2]);

        // Glowing Halloween Jack-O'-Lantern visibility & candle flicker during Special
        const showPumpkin = P.pumpkinGlow > 0.05;
        pumpkinGroup.visible = showPumpkin;
        pumpkinLight.intensity = showPumpkin
          ? P.pumpkinGlow * (1.85 + 0.45 * Math.sin(totalTime * 19.0))
          : 0;

        // Smooth Pointer Head & Eye Tracking (Rules 6, 7, 11)
        const nowMs = performance.now();
        let targetYaw = 0;
        let targetPitch = 0;
        if (nowMs - lastPointerMove < 4000) {
          headPivot.getWorldPosition(_headWorld);
          raycaster.setFromCamera(pointer, camera);
          raycaster.ray.at(camera.position.distanceTo(_headWorld), _targetLocal);
          torsoPivot.worldToLocal(_targetLocal);
          _targetLocal.y -= 16.0;
          targetYaw = THREE.MathUtils.clamp(Math.atan2(_targetLocal.x, _targetLocal.z), -0.45, 0.45);
          targetPitch = THREE.MathUtils.clamp(-Math.atan2(_targetLocal.y, Math.hypot(_targetLocal.x, _targetLocal.z)), -0.08, 0.08);
        }
        const trackAlpha = 1 - Math.exp(-dt * 8);
        lookFilter.yaw += (targetYaw - lookFilter.yaw) * trackAlpha;
        lookFilter.pitch += (targetPitch - lookFilter.pitch) * trackAlpha;
        lookFilter.eyeX += (THREE.MathUtils.clamp(targetYaw * 0.42 + Math.sin(totalTime * 0.8) * 0.07, -0.22, 0.22) - lookFilter.eyeX) * (1 - Math.exp(-dt * 12));

        headPivot.rotation.y += lookFilter.yaw;
        headPivot.rotation.x = THREE.MathUtils.clamp(headPivot.rotation.x + lookFilter.pitch, -0.22, 0.25);
        pupilR.position.x = -1.72 + lookFilter.eyeX;
        pupilL.position.x = 1.72 + lookFilter.eyeX;

        // Smooth Natural Blink (~0.18s sine bump on eyelids, occasional double blink)
        if (totalTime > blinkState.nextBlink) {
          blinkState.blinkStart = totalTime;
          if (blinkState.doublePending) {
            blinkState.doublePending = false;
            blinkState.nextBlink = totalTime + 2.6 + Math.random() * 3.2;
          } else if (Math.random() < 0.25) {
            blinkState.doublePending = true;
            blinkState.nextBlink = totalTime + 0.26;
          } else {
            blinkState.nextBlink = totalTime + 2.6 + Math.random() * 3.2;
          }
        }
        const blinkElapsed = totalTime - blinkState.blinkStart;
        const blinkAmt = (blinkElapsed >= 0 && blinkElapsed < 0.18)
          ? Math.sin((blinkElapsed / 0.18) * Math.PI)
          : 0.01;
        eyelidR.scale.y = Math.max(0.01, blinkAmt);
        eyelidL.scale.y = Math.max(0.01, blinkAmt);

        // Secondary Spring Physics: Coverall Hip Flaps / Ghost Sheet & Hair Tufts
        if (dt > 0) {
          const vy = (P.pos[1] - prevPelvisY) / dt;
          const vTorso = (P.torso[0] - prevTorsoX) / dt;
          prevPelvisY = P.pos[1];
          prevTorsoX = P.torso[0];

          skirtSpringR.v += (-vy * 0.07 - vTorso * 0.32);
          skirtSpringL.v += (-vy * 0.07 - vTorso * 0.32);
          hairSpring.v += (-vy * 0.05 + vTorso * 0.35);

          const targetFlapR = Math.min(0, P.legR[0] * 0.42) - 0.04;
          const targetFlapL = Math.min(0, P.legL[0] * 0.42) - 0.04;
          stepSpring(skirtSpringR, targetFlapR, dt, 90, 10);
          stepSpring(skirtSpringL, targetFlapL, dt, 90, 10);
          stepSpring(hairSpring, 0.03, dt, 80, 9);

          skirtPivotR.rotation.x = THREE.MathUtils.clamp(skirtSpringR.a, -0.36, 0.04);
          skirtPivotL.rotation.x = THREE.MathUtils.clamp(skirtSpringL.a, -0.36, 0.04);
          hairTuftPivot.rotation.x = THREE.MathUtils.clamp(hairSpring.a, -0.05, 0.16);
        }

        // Slash impact particles during Attack
        if (currentAnim === 'attack') {
          const cycle = Math.floor(animTime / 1.95);
          const phase = (animTime % 1.95) / 1.95;
          if (phase >= 0.40 && phase < 0.48 && lastStrikeTrigger !== cycle * 2) {
            lastStrikeTrigger = cycle * 2;
            scene.updateMatrixWorld();
            knifeTipAnchor.getWorldPosition(_worldPos);
            spawnSparks(_worldPos, 9);
          } else if (phase >= 0.62 && phase < 0.70 && lastStrikeTrigger !== cycle * 2 + 1) {
            lastStrikeTrigger = cycle * 2 + 1;
            scene.updateMatrixWorld();
            knifeTipAnchor.getWorldPosition(_worldPos);
            spawnSparks(_worldPos, 7);
          }
        }

        for (let i = 0; i < sparkPool.length; i++) {
          const p = sparkPool[i];
          if (p.active) {
            p.age += dt;
            if (p.age >= p.maxAge) {
              p.active = false;
              p.mesh.visible = false;
            } else {
              p.vel.y -= 32 * dt;
              p.mesh.position.addScaledVector(p.vel, dt);
              const life = 1 - p.age / p.maxAge;
              p.mesh.material.opacity = life * 0.88;
              p.mesh.scale.setScalar(0.45 + life * 0.65);
            }
          }
        }
      }

      /* ───────── UI & Keyboard Controls ───────── */
      function switchAnimation(nextAnim) {
        if (!nextAnim || nextAnim === currentAnim) return;
        prevAnim = currentAnim;
        prevAnimTime = animTime;
        currentAnim = nextAnim;
        animTime = 0;
        blendWeight = 0;
        lastStrikeTrigger = -1;
        document.querySelectorAll('.anim-btn').forEach((b) => {
          b.classList.toggle('active', b.getAttribute('data-anim') === nextAnim);
        });
      }

      document.querySelectorAll('.anim-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchAnimation(btn.getAttribute('data-anim')));
      });

      document.querySelectorAll('.outfit-btn').forEach((btn) => {
        btn.addEventListener('click', () => applyOutfit(btn.getAttribute('data-outfit')));
      });

      let isResettingCamera = false;
      const resetBtn = document.getElementById('reset-camera');
      resetBtn.addEventListener('click', () => {
        isResettingCamera = true;
      });

      controls.addEventListener('start', () => {
        isResettingCamera = false;
      });

      const OUTFIT_ORDER = ['h2018', 'classic78', 'kills', 'ghost'];
      window.addEventListener('keydown', (e) => {
        if (e.key === '1') switchAnimation('idle');
        else if (e.key === '2') switchAnimation('walk');
        else if (e.key === '3') switchAnimation('attack');
        else if (e.key === '4') switchAnimation('special');
        else if (e.key === '5') applyOutfit('h2018');
        else if (e.key === '6') applyOutfit('classic78');
        else if (e.key === '7') applyOutfit('kills');
        else if (e.key === '8') applyOutfit('ghost');
        else if (e.key === 'o' || e.key === 'O') {
          const nextIdx = (OUTFIT_ORDER.indexOf(currentOutfit) + 1) % OUTFIT_ORDER.length;
          applyOutfit(OUTFIT_ORDER[nextIdx]);
        } else if (e.key === 'r' || e.key === 'R') {
          isResettingCamera = true;
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Initialize default 2018 outfit
      applyOutfit('h2018');

      // Expose debug handle for automated inspection
      window.michaelDebug = {
        scene,
        camera,
        renderer,
        characterRoot,
        switchAnimation,
        applyOutfit,
        get currentAnim() { return currentAnim; },
        get currentOutfit() { return currentOutfit; }
      };

      /* ───────── Locked 60 FPS Delta-Time Render Loop ───────── */
      const STEP_MS = 1000 / 60;
      let lastFrameMs = performance.now() - STEP_MS;
      let totalElapsed = 0;

      function animate(nowMs) {
        requestAnimationFrame(animate);

        const elapsedMs = nowMs - lastFrameMs;
        if (elapsedMs < STEP_MS - 1) return;
        lastFrameMs = nowMs - (elapsedMs % STEP_MS);

        const dt = Math.min(elapsedMs, 50) / 1000;
        totalElapsed += dt;

        if (isResettingCamera) {
          camera.position.lerp(DEFAULT_CAM_POS, 0.12);
          controls.target.lerp(DEFAULT_TARGET, 0.12);
          if (
            camera.position.distanceTo(DEFAULT_CAM_POS) < 0.08 &&
            controls.target.distanceTo(DEFAULT_TARGET) < 0.08
          ) {
            camera.position.copy(DEFAULT_CAM_POS);
            controls.target.copy(DEFAULT_TARGET);
            isResettingCamera = false;
          }
        }

        updateAnimation(dt, totalElapsed);
        controls.update();
        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    };
  </script>

  <script>
    /* ───────── Rig overlay ("Show bones" button, key B) ─────────
       Same block in every mob (rule 10). A dot on every bone pivot (yellow) and a line to its
       parent bone (cyan), drawn on top of the model and updated live in every animation.
       Waits for window.THREE (module pages set it after their import).
       Bones = the group nodes of the mob (the scene child with the most meshes).
       It wraps renderer.render, so it needs none of the page's own variables. */
    (function waitThree() {
      if (!window.THREE) return setTimeout(waitThree, 50);
      const ANCHOR = '#reset-camera';
      const rig = { on: false, scene: null, root: null, list: [], parentIdx: [], lines: null, dots: null, linePos: null, dotPos: null, checkAt: 0 };
      const va = new THREE.Vector3(), vb = new THREE.Vector3();
      const isBone = (o) => !o.isMesh && !o.isLight && !o.isCamera && !o.isLine && !o.isPoints && !o.isSprite && o.children.length > 0;

      function build(scene) {
        let best = 0; rig.root = null;
        for (const c of scene.children) {
          if (c === rig.lines || c === rig.dots || c.isLight || c.isCamera) continue;
          let n = 0; c.traverse((x) => { if (x.isMesh) n++; });
          if (n > best) { best = n; rig.root = c; }
        }
        rig.list = [];
        if (rig.root) rig.root.traverse((x) => { if (x !== rig.root && isBone(x)) rig.list.push(x); });
        const idx = new Map(rig.list.map((g, i) => [g, i]));
        rig.parentIdx = rig.list.map((g) => { let p = g.parent; while (p && p !== rig.root && !idx.has(p)) p = p.parent; return idx.has(p) ? idx.get(p) : -1; });
        const n = rig.list.length;
        if (!rig.lines || rig.dotPos.length !== n * 3) {
          if (rig.lines) { scene.remove(rig.lines, rig.dots); rig.lines.geometry.dispose(); rig.dots.geometry.dispose(); }
          rig.linePos = new Float32Array(n * 6); rig.dotPos = new Float32Array(n * 3);
          const lg = new THREE.BufferGeometry(), dg = new THREE.BufferGeometry();
          lg.setAttribute('position', new THREE.BufferAttribute(rig.linePos, 3));
          dg.setAttribute('position', new THREE.BufferAttribute(rig.dotPos, 3));
          rig.lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x67e8f9, depthTest: false, transparent: true, opacity: 0.9 }));
          rig.dots = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xfacc15, size: 6, sizeAttenuation: false, depthTest: false, transparent: true }));
          for (const o of [rig.lines, rig.dots]) { o.renderOrder = 999; o.frustumCulled = false; }
        }
        if (rig.lines.parent !== scene) scene.add(rig.lines, rig.dots);
        rig.lines.visible = rig.dots.visible = rig.on;
        rig.scene = scene;
      }

      function update(now) {
        if (now > rig.checkAt) { rig.checkAt = now + 1000; build(rig.scene); }
        if (!rig.root) return;
        rig.list.forEach((g, i) => {
          va.setFromMatrixPosition(g.matrixWorld);
          const p = rig.parentIdx[i];
          if (p >= 0) vb.setFromMatrixPosition(rig.list[p].matrixWorld); else vb.copy(va);
          const j = i * 6, k = i * 3;
          rig.linePos[j] = vb.x; rig.linePos[j + 1] = vb.y; rig.linePos[j + 2] = vb.z;
          rig.linePos[j + 3] = va.x; rig.linePos[j + 4] = va.y; rig.linePos[j + 5] = va.z;
          rig.dotPos[k] = va.x; rig.dotPos[k + 1] = va.y; rig.dotPos[k + 2] = va.z;
        });
        rig.lines.geometry.attributes.position.needsUpdate = true;
        rig.dots.geometry.attributes.position.needsUpdate = true;
      }

      const baseUpdate = THREE.Object3D.prototype.updateMatrixWorld;
      THREE.Object3D.prototype.updateMatrixWorld = function (force) {
        baseUpdate.call(this, force);
        if (rig.on && this.isScene) { if (rig.scene !== this) { rig.checkAt = 0; rig.scene = this; } update(performance.now()); }
      };

      const anchor = document.querySelector(ANCHOR);
      const btn = document.createElement('button');
      btn.id = 'bonesBtn'; btn.type = 'button'; btn.title = 'Show bones (B)'; btn.setAttribute('aria-pressed', 'false');
      btn.className = anchor ? anchor.className.split(/\s+/).filter((c) => !/^(anim-btn|variant-btn|toggle-btn|active.*)$/.test(c)).join(' ') : '';
      btn.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;';
      if (!anchor) btn.style.cssText += 'position:fixed;right:16px;bottom:16px;z-index:50;width:36px;height:36px;border-radius:999px;background:#1a1d24;color:#cbd5e1;border:1px solid #2a2f3a;';
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><circle cx="7" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="9" cy="20" r="1.6"/><circle cx="15" cy="20" r="1.6"/><path d="M12 6v8M12 8l-5 4M12 8l5 4M12 14l-3 6M12 14l3 6"/></svg>';
      if (anchor) anchor.insertAdjacentElement('afterend', btn); else document.body.appendChild(btn);

      function toggleBones() {
        rig.on = !rig.on;
        if (rig.lines) rig.lines.visible = rig.dots.visible = rig.on;
        rig.checkAt = 0;
        btn.setAttribute('aria-pressed', String(rig.on));
        btn.style.background = rig.on ? 'rgba(250, 204, 21, 0.18)' : (anchor ? '' : '#1a1d24');
        btn.style.color = rig.on ? '#facc15' : '';
      }
      btn.addEventListener('click', toggleBones);
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
        if (e.key === 'b' || e.key === 'B') toggleBones();
      });
      window.rigOverlay = { toggle: toggleBones, get bones() { return rig.list.length; } };
    })();
  </script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bateman Vanilla+ Model</title>
<style>
  :root{
    --bg:#0f1115; --pill:rgba(22,25,31,.78); --line:rgba(255,255,255,.07);
    --fg:#c9cdd4; --mute:#6f7580; --on:#f4f5f7; --hi:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg);
    font:500 12.5px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block;outline:none;touch-action:none}
  .bar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px;border-radius:22px;background:var(--pill);
    border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 12px 32px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
  .row{display:flex;align-items:center;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .fits{padding-bottom:5px;border-bottom:1px solid var(--line)}
  .bar button{appearance:none;border:0;background:transparent;color:var(--mute);height:30px;padding:0 13px;
    border-radius:999px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;
    transition:color .18s,background .18s}
  .bar button:hover{color:var(--fg)}
  .bar button.on{color:var(--on);background:var(--hi)}
  .bar button:focus-visible{outline:1px solid rgba(255,255,255,.35);outline-offset:1px}
  .sep{width:1px;height:16px;background:var(--line);margin:0 4px}
  .bar .fit{height:auto;width:78px;padding:6px 4px 7px;border-radius:14px;flex-direction:column;gap:3px;flex:none;
    border:1px solid transparent}
  .bar .fit.on{border-color:rgba(255,255,255,.14)}
  .fit img{width:56px;height:70px;object-fit:contain;image-rendering:auto;border-radius:9px;
    background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);
    opacity:.75;transition:opacity .18s,transform .18s}
  .fit:hover img,.fit.on img{opacity:1}
  .fit.on img{transform:translateY(-1px)}
  .fit b{font-weight:600;font-size:12px}
  .fit small{font-size:10px;color:var(--mute)}
  .reset{width:30px;padding:0!important;justify-content:center}
  .reset svg{width:15px;height:15px}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<nav class="bar" aria-label="Viewer controls">
  <div class="row fits" aria-label="Outfit">
    <button class="fit on" data-fit="overcoat" style="--c:#c29a6a"><img alt=""><b>Overcoat</b><small>pistol</small></button>
    <button class="fit" data-fit="raincoat" style="--c:#e6edf2"><img alt=""><b>Raincoat</b><small>axe</small></button>
    <button class="fit" data-fit="walkman" style="--c:#f08a24"><img alt=""><b>Walkman</b><small>nail gun</small></button>
    <button class="fit" data-fit="suspenders" style="--c:#2c3f78"><img alt=""><b>Suspenders</b><small>phone</small></button>
    <button class="fit" data-fit="shorts" style="--c:#8fb8de"><img alt=""><b>Shorts</b><small>face mask</small></button>
  </div>
  <div class="row" aria-label="Animation">
    <button data-anim="idle" class="on">Idle</button>
    <button data-anim="walk">Walk</button>
    <button data-anim="attack">Attack</button>
    <button data-anim="special">Special</button>
    <span class="sep"></span>
    <button class="reset" title="Reset camera" aria-label="Reset camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>
</nav>

<script type="module">
import * as THREE from 'three';
window.THREE = THREE; // the Show bones block (bottom of the page) uses the global
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================================
   Educational fan model: blocky Vanilla+ character, 1 texel = 1/16 block.
   Rig units are pixels; the root is scaled by 1/16 so 16 px = 1 block.
   ========================================================================= */

// ---------- colour + noise helpers ----------
const _rgb = new Map();
function rgb(h){ let v=_rgb.get(h); if(!v){ const n=parseInt(h.slice(1),16); v=[n>>16&255,n>>8&255,n&255]; _rgb.set(h,v);} return v; }
function hex(r,g,b){ const f=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0'); return '#'+f(r)+f(g)+f(b); }
function sh(h,k){ const [r,g,b]=rgb(h); return hex(r*k,g*k,b*k); }
function N(x,y,s){ let h=Math.imul(x+101,374761393)^Math.imul(y+211,668265263)^Math.imul(s+7,1442695041);
  h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function fab(c,x,y,s,a=0.06){ const n=N(x,y,s); return n>0.8?sh(c,1+a):n<0.18?sh(c,1-a):c; }

// ---------- palettes ----------
const SK={l:'#e9bb98',b:'#d8a281',s:'#c08767',d:'#a06a4e',lip:'#9a5c4a'};
const HR={d:'#1c120b',m:'#2c1d13',l:'#422c1c',h:'#5e412b',g:'#7a5638'};
const SHOE={b:'#16171a',h:'#3d4047',d:'#0b0b0d'};
const EYE={w:'#f1ebe4',i:'#3b2a1f',brow:'#22150d'};

// ---------- texture + part factory ----------
function makeTex(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const col=fn(x,y); if(col){ g.fillStyle=col; g.fillRect(x,y,1,1);} }
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.generateMipmaps=false;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function makeMat(map,mode){
  if(mode==='glass') return new THREE.MeshLambertMaterial({map,transparent:true,depthWrite:false,alphaTest:0.02});
  if(mode==='cut') return new THREE.MeshLambertMaterial({map,alphaTest:0.5});
  return new THREE.MeshLambertMaterial({map});
}
// Face order of BoxGeometry: +x(L) -x(R) +y(T) -y(D) +z(F) -z(B). Model faces +z.
const FACES=['L','R','T','D','F','B'];
/* painter(q): q.F face, q.x/q.y canvas pixel, q.u column measured from the character's
   right on F/B (from the front on side faces), q.iu distance from the inner edge for
   limb parts, q.out / q.inner for limb side faces, q.s noise seed. Return colour or null. */
function part(spec){
  const {at,size,paint,mode='solid',side=null,rot=null,seed=0}=spec;
  const tx=(spec.tx||size).map(v=>Math.max(1,Math.round(v)));
  const [w,h,d]=size, [tw,th,td]=tx;
  const dims={L:[td,th],R:[td,th],T:[tw,td],D:[tw,td],F:[tw,th],B:[tw,th]};
  const mats=FACES.map((F,i)=>{
    const [fw,fh]=dims[F];
    const map=makeTex(fw,fh,(x,y)=>{
      const u=(F==='B'||F==='R')?fw-1-x:x;
      let iu, out=false, inner=false;
      if(side){
        if(F==='F') iu=side==='R'?fw-1-x:x;
        else if(F==='B') iu=side==='R'?x:fw-1-x;
        out=(F==='L'&&side==='L')||(F==='R'&&side==='R');
        inner=(F==='L'&&side==='R')||(F==='R'&&side==='L');
      }
      return paint({F,x,y,u,w:fw,h:fh,iu,out,inner,s:seed*13+i});
    });
    return makeMat(map,mode);
  });
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats);
  m.position.set(at[0]+w/2,at[1]+h/2,at[2]+d/2);
  if(rot) m.rotation.set(rot[0],rot[1],rot[2]);
  m.castShadow=mode!=='glass'&&spec.shadow!==false; m.receiveShadow=true;
  return m;
}
const inf=(at,size,i)=>({at:at.map(v=>v-i),size:size.map(v=>v+2*i),tx:size});
// plain material painter with bevelled edges (items, trims)
const solid=(c,o={})=>q=>{
  const {F,x,y,w,h}=q;
  let k=F==='T'?1.08:F==='D'?0.82:1;
  if((w>2&&(x===0||x===w-1))||(h>2&&(y===0||y===h-1))) k*=o.edge??0.86;
  return fab(sh(c,k),x,y,q.s,o.n??0.05);
};

// ---------- renderer / scene ----------
const BG=0x0f1115;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(BG);
scene.fog=new THREE.Fog(BG,8,17);

const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.05,60);
const HOME={pos:new THREE.Vector3(2.75,1.7,4.7),tgt:new THREE.Vector3(0,1.02,0)};
camera.position.copy(HOME.pos);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME.tgt);
Object.assign(controls,{enableDamping:true,dampingFactor:0.08,enablePan:false,minDistance:2.2,maxDistance:10,
  maxPolarAngle:Math.PI*0.495,rotateSpeed:0.7,zoomSpeed:0.8});

scene.add(new THREE.HemisphereLight(0xdfe6ff,0x2a2420,1.25));
const key=new THREE.DirectionalLight(0xfff0de,2.3);
key.position.set(2.6,5.2,3.4); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-1.8,right:1.8,top:2.8,bottom:-1.4,near:1,far:12});
key.shadow.bias=-0.0004; key.shadow.normalBias=0.02;
scene.add(key);
const rim=new THREE.DirectionalLight(0x9db4ff,0.95); rim.position.set(-3,3.5,-4); scene.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,0.35); fill.position.set(-3.5,2,3); scene.add(fill);

// floor: soft radial disc with a faint 1-block grid
{
  const S=512, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  rg.addColorStop(0,'rgba(34,38,46,1)'); rg.addColorStop(0.55,'rgba(24,27,33,.9)'); rg.addColorStop(1,'rgba(15,17,21,0)');
  g.fillStyle=rg; g.fillRect(0,0,S,S);
  g.globalCompositeOperation='source-atop'; g.strokeStyle='rgba(255,255,255,.035)'; g.lineWidth=2;
  for(let i=0;i<=8;i++){ const p=i*S/8; g.beginPath(); g.moveTo(p,0); g.lineTo(p,S); g.moveTo(0,p); g.lineTo(S,p); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshLambertMaterial({map:t,transparent:true,depthWrite:false}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
}
// contact shadow blob
const blob=(()=>{
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const rg=g.createRadialGradient(64,64,0,64,64,64); rg.addColorStop(0,'rgba(0,0,0,.55)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.fillRect(0,0,128,128);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1.25,0.8),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.y=0.002; scene.add(m); return m;
})();

// ---------- rig (pivot points in pixels, Blockbench style) ----------
const root=new THREE.Group(); root.scale.setScalar(1/16); scene.add(root);
const bone=(p,x,y,z)=>{ const g=new THREE.Group(); g.position.set(x,y,z); p.add(g); return g; };
const R={};
R.pelvis=bone(root,0,12,0);
R.torso =bone(R.pelvis,0,0,0);
R.head  =bone(R.torso,0,12,0);
R.armR  =bone(R.torso,-5,10,0);
R.armL  =bone(R.torso,5,10,0);
R.legR  =bone(R.pelvis,-2,0,0);
R.legL  =bone(R.pelvis,2,0,0);
R.hand  =bone(R.armR,-1,-9,0);          // wrist pivot (animated)
R.item  =bone(R.hand,0,0,0);             // item space: +Z barrel, +Y up, grip at origin
R.item.rotation.x=Math.PI/2;
R.skirtR=bone(R.legR,0,0,0);             // coat panels follow the legs (no clipping)
R.skirtL=bone(R.legL,0,0,0);
R.tie   =bone(R.torso,0,10.5,2);
R.muzzle=bone(R.item,0,0,0);
R.eject =bone(R.item,0,0,0);

// muzzle flash (pixel star, additive)
const flash=(()=>{
  const P=['...y....','..yyy..y','.yywwy..','yywwwwy.','.ywwwwyy','..ywwy..','y..yyy..','....y...'];
  const t=makeTex(8,8,(x,y)=>({y:'#ffb340',w:'#fff6d0'})[P[y][x]]||null);
  const mat=new THREE.MeshBasicMaterial({map:t,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  const g=new THREE.Group();
  for(const r of [0,Math.PI/2]){ const p=new THREE.Mesh(new THREE.PlaneGeometry(6,6),mat); p.rotation.z=r; p.rotation.y=Math.PI/2; p.position.z=2.6; g.add(p); }
  const f=new THREE.Mesh(new THREE.PlaneGeometry(5,5),mat); f.position.z=0.6; g.add(f);
  g.visible=false; R.muzzle.add(g); return g;
})();
const flashLight=new THREE.PointLight(0xffc06a,0,2.6,2); scene.add(flashLight);

// ---------- shared painters ----------
const HAIR_TOP=[HR.m,HR.l,HR.m,HR.h,HR.l,HR.m,HR.l,HR.d];
function faceF(u,y,closed){
  const S=SK;
  if(y===0) return [HR.m,HR.l,HR.m,HR.h,HR.l,HR.m,HR.l,HR.m][u];
  if(y===1) return (u===0||u===7)?HR.d:(u===1||u===6)?HR.m:(u===3?S.b:S.l);
  if(y===2) return (u===0||u===7)?S.s:(u===1||u===6)?S.b:S.l;
  if(y===3) return (u===0||u===7)?S.s:(u===1||u===2||u===5||u===6)?EYE.brow:S.b;
  if(y===4){
    if(closed) return (u===0||u===7)?S.s:(u===1||u===2||u===5||u===6)?S.d:S.b;
    return [S.s,EYE.w,EYE.i,S.b,S.b,EYE.i,EYE.w,S.s][u];
  }
  if(y===5) return [S.s,S.s,S.b,S.l,S.s,S.b,S.s,S.s][u];
  if(y===6) return [S.s,S.b,S.b,S.lip,S.lip,'#b47a62',S.b,S.s][u];
  return [S.d,S.s,S.b,S.l,S.b,S.b,S.s,S.d][u];
}
function hairSide(u,y,s){ return fab(y===0?HR.l:u>=6?HR.d:HR.m,u,y,s,0.1); }
const headPaint=closed=>q=>{
  const {F,u,y,x}=q;
  if(F==='T') return fab(y>=6?sh(HAIR_TOP[x],1.08):y<=1?sh(HAIR_TOP[x],0.85):HAIR_TOP[x],x,y,q.s,0.08);
  if(F==='D') return y>=6?SK.d:SK.s;
  if(F==='F') return faceF(u,y,closed);
  if(F==='B'){
    if(y===7) return (u===0||u===7)?HR.d:SK.d;
    if(y===6) return (u===0||u===7)?SK.d:HR.d;
    return fab([HR.d,HR.m,HR.l,HR.m,HR.m,HR.l,HR.m,HR.d][u],u,y,q.s,0.1);
  }
  // side faces, u = distance from the front
  if(y<=1) return hairSide(u,y,q.s);
  if(y===2) return u===0?SK.s:hairSide(u,y,q.s);
  if(u>=5) return y<=5?hairSide(u,y,q.s):(y===6&&u>=6)?HR.d:SK.d;
  if(u===4) return y===3?SK.b:y===4?SK.d:SK.s;          // ear
  if(u===3&&y<=4) return y===3?HR.d:HR.m;                 // sideburn
  if(y===7) return u<=1?SK.s:SK.d;
  if(y===6&&u>=2) return SK.s;
  return u===0?SK.s:SK.b;
};
const hatPaint=style=>q=>{
  const {F,u,y,x}=q;
  if(F==='D') return null;
  if(F==='T') return fab(sh(HAIR_TOP[(x+1)%8],y>=5?1.2:1.08),x,y,q.s+3,0.1);
  if(F==='F'){
    if(y===0) return sh([HR.l,HR.h,HR.l,HR.g,HR.h,HR.l,HR.h,HR.l][u],1);
    if(style==='messy'&&((u===2&&y<=2)||(u===5&&y===1))) return y>=2?HR.d:HR.m;
    if(y===1&&(u===0||u===7)) return HR.m;
    return null;
  }
  if(F==='B') return y<=5?fab(HR.l,u,y,q.s,0.12):(y===6&&u>=1&&u<=6)?HR.m:null;
  // sides
  if(y===0) return HR.h;
  if(y===1) return u>=1?HR.l:null;
  if(u>=5&&y<=4) return fab(HR.m,u,y,q.s,0.12);
  if(style==='messy'&&u===2&&y===2) return HR.m;
  return null;
};
function legPaint(P){ return q=>{
  const {F,y,x}=q;
  if(F==='T') return P.c;
  if(F==='D') return SHOE.d;
  if(y===11) return SHOE.d;
  if(y===10) return F==='F'&&(q.iu===1||q.iu===2)?'#222429':SHOE.b;
  if(y===9) return sh(P.c,0.84);
  if(F==='F'&&q.iu===1) return P.l;                      // trouser crease
  if(q.inner) return fab(sh(P.c,0.9),x,y,q.s);
  return fab(P.c,x,y,q.s,0.07);
};}
const toePaint=q=>q.F==='T'?(q.x===1||q.x===2?SHOE.h:'#26282d'):q.F==='F'?(q.y===0&&(q.x===1||q.x===2)?SHOE.h:SHOE.b):SHOE.d;
function handPx(H,q){
  const {F,y}=q;
  if(H==='glove') return F==='F'&&y===10&&(q.iu===1||q.iu===2)?'#3a3c43':y===11?'#101114':'#1a1b1f';
  if(y===11) return q.inner?SK.d:SK.s;
  if(F==='F'&&(q.iu===1||q.iu===2)) return SK.l;
  return q.inner?SK.s:SK.b;
}
function armPaint(o){ return q=>{
  const {F,y,x}=q;
  if(F==='T') return o.top||o.sl;
  if(F==='D') return o.hand==='glove'?'#101114':SK.s;
  if(y>=10) return handPx(o.hand,q);
  if(y===9) return o.cuff;
  if(y===8) return sh(o.sl,0.88);
  if(o.stripe&&o.stripe(q)) return o.stripeC;
  return fab(o.sl,x,y,q.s,0.07);
};}
const watch=bone=>({bone,at:[-1.2,-7.9,-2.2],size:[4.4,0.8,4.4],tx:[4,1,4],
  paint:q=>q.F==='L'&&q.x===1?'#efe2b8':q.F==='T'||q.F==='D'?'#8c6d27':'#bf9636'});

/* =========================================================================
   OUTFITS
   ========================================================================= */
const FITS={};

// ---- 1. Overcoat (camel coat, navy suit, gloves) · pistol ----
{
  const OC={c:'#c29a6a',l:'#d7b384',s:'#a88050',d:'#8b673f',btn:'#4e3624'};
  const NV={c:'#1f2738',l:'#2e3953',s:'#161c29'};
  const SB={c:'#a3c6e8',s:'#86aad0',l:'#c6def4'};
  const TN={c:'#26355e',l:'#4462a0',d:'#1a2443'};
  FITS.overcoat={hair:'messy',weapon:'gun',parts(){
    const L=[];
    L.push({bone:'torso',at:[-4,0,-2],size:[8,12,4],seed:3,paint:q=>{
      const {F,u,y,x}=q;
      if(F!=='F') return fab(NV.c,x,y,q.s);
      if(y===11) return NV.s;
      if(u===3||u===4) return y===0?TN.l:y<=10?((y+u)%3===0?TN.l:TN.c):NV.c;
      if(u===2||u===5) return y===0?SB.l:y<=10?fab(SB.c,x,y,q.s):NV.c;
      return fab(NV.c,x,y,q.s);
    }});
    // coat outer layer with V opening
    L.push({bone:'torso',...inf([-4,0,-2],[8,12,4],0.5),mode:'cut',seed:9,paint:q=>{
      const {F,u,y,x}=q;
      if(F==='F'){
        if(y<=2&&u>=2&&u<=5) return null;
        if(y>=3&&y<=5&&(u===3||u===4)) return null;
        if(y===6&&(u===3||u===4)) return OC.s;
        if(u===4&&y>=7) return OC.d;
        if(y===11) return OC.s;
        if(u===0||u===7) return sh(OC.c,0.93);
        return fab(OC.c,x,y,q.s);

  <script>
    /* ───────── Rig overlay ("Show bones" button, key B) ─────────
       Same block in every mob (rule 10). A dot on every bone pivot (yellow) and a line to its
       parent bone (cyan), drawn on top of the model and updated live in every animation.
       Waits for window.THREE (module pages set it after their import).
       Bones = the group nodes of the mob (the scene child with the most meshes).
       It wraps renderer.render, so it needs none of the page's own variables. */
    (function waitThree() {
      if (!window.THREE) return setTimeout(waitThree, 50); // module pages: THREE arrives later
      const ANCHOR = '.bar .reset'; // a button in the dock: the bones button goes right after it
      const rig = { on: false, scene: null, root: null, list: [], parentIdx: [], lines: null, dots: null, linePos: null, dotPos: null, checkAt: 0 };
      const va = new THREE.Vector3(), vb = new THREE.Vector3();
      const isBone = (o) => !o.isMesh && !o.isLight && !o.isCamera && !o.isLine && !o.isPoints && !o.isSprite && o.children.length > 0;

      // Find the mob root and its bones; (re)make the buffers only when the bone count changes.
      function build(scene) {
        let best = 0; rig.root = null;
        for (const c of scene.children) {
          if (c === rig.lines || c === rig.dots || c.isLight || c.isCamera) continue;
          let n = 0; c.traverse((x) => { if (x.isMesh) n++; });
          if (n > best) { best = n; rig.root = c; }
        }
        rig.list = [];
        if (rig.root) rig.root.traverse((x) => { if (x !== rig.root && isBone(x)) rig.list.push(x); });
        const idx = new Map(rig.list.map((g, i) => [g, i]));
        rig.parentIdx = rig.list.map((g) => { let p = g.parent; while (p && p !== rig.root && !idx.has(p)) p = p.parent; return idx.has(p) ? idx.get(p) : -1; });
        const n = rig.list.length;
        if (!rig.lines || rig.dotPos.length !== n * 3) {
          if (rig.lines) { scene.remove(rig.lines, rig.dots); rig.lines.geometry.dispose(); rig.dots.geometry.dispose(); }
          rig.linePos = new Float32Array(n * 6); rig.dotPos = new Float32Array(n * 3);
          const lg = new THREE.BufferGeometry(), dg = new THREE.BufferGeometry();
          lg.setAttribute('position', new THREE.BufferAttribute(rig.linePos, 3));
          dg.setAttribute('position', new THREE.BufferAttribute(rig.dotPos, 3));
          rig.lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x67e8f9, depthTest: false, transparent: true, opacity: 0.9 }));
          rig.dots = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xfacc15, size: 6, sizeAttenuation: false, depthTest: false, transparent: true }));
          for (const o of [rig.lines, rig.dots]) { o.renderOrder = 999; o.frustumCulled = false; }
        }
        if (rig.lines.parent !== scene) scene.add(rig.lines, rig.dots);
        rig.lines.visible = rig.dots.visible = rig.on;
        rig.scene = scene;
      }

      // Plain writes into the buffers: no new objects per frame.
      function update(now) {
        if (now > rig.checkAt) { rig.checkAt = now + 1000; build(rig.scene); } // variants may rebuild parts
        if (!rig.root) return;
        rig.list.forEach((g, i) => { // world matrices are fresh: the scene was just updated
          va.setFromMatrixPosition(g.matrixWorld);

          rig.linePos[j + 3] = va.x; rig.linePos[j + 4] = va.y; rig.linePos[j + 5] = va.z;

      if (!anchor) btn.style.cssText += 'position:fixed;right:16px;bottom:16px;z-index:50;width:36px;height:36px;border-radius:999px;background:#1a1d24;color:#cbd5e1;border:1px solid #2a2f3a;';
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><circle cx="7" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="9" cy="20" r="1.6"/><circle cx="15" cy="20" r="1.6"/><path d="M12 6v8M12 8l-5 4M12 8l5 4M12 14l-3 6M12 14l3 6"/></svg>';
      if (anchor) anchor.insertAdjacentElement('afterend', btn); else document.body.appendChild(btn);

    })();

            leftArmBone.add(createBox(3.9, 12.0, 3.9, suitMat, 0, -5.0, 0));

            // Left Hinged Curved Shoulder Bell
            const lPauldron = new THREE.Group();
            lPauldron.position.set(-0.3, 0.6, 0);
            lPauldron.rotation.z = -0.16;
            leftArmBone.add(lPauldron);
            lPauldron.add(createBox(4.6, 5.2, 5.2, armorMat, 0.4, -2.2, 0));
            lPauldron.add(createBox(4.75, 4.6, 3.2, gunmetalMat, 0.42, -2.1, 0));
            lPauldron.add(createBox(1.2, 5.0, 4.8, armorMat, 2.35, -2.2, 0, 0, 0, -0.12));

            // Left Flared Gauntlet Glove
            leftArmBone.add(createBox(4.45, 1.4, 4.45, armorMat, 0, -5.6, 0, 0.05, 0, 0));
            leftArmBone.add(createBox(4.25, 4.6, 4.25, suitMat, 0, -8.3, 0));
            leftArmBone.add(createBox(4.35, 2.2, 4.35, armorMat, 0, -9.8, 0));

            // =========================================================================
            // 6. RIGHT & LEFT LEGS, CONTOURED SHIN GREAVES & ARMORED BOOTS
            // =========================================================================
            function buildLeg(isRight) {
                const legBone = new THREE.Group();
                legBone.position.set(isRight ? -2.2 : 2.2, 0, 0);
                rootBone.add(legBone);

                // Quilted Ribbed Leather Thigh
                legBone.add(createBox(4.1, 11.8, 4.1, suitMat, 0, -5.9, 0));

                // Sculpted Glossy Obsidian Shin Greave Armor (Matches Reference Image 1!)
                legBone.add(createBox(4.35, 6.8, 4.4, armorMat, 0, -8.2, 0.12));
                // Central vertical angled spine ridge down the front of the shin guard
                legBone.add(createBox(1.15, 7.2, 0.65, armorMat, 0, -8.0, 2.25, 0.04, 0, 0));
                // Upper diamond knee-pad extension
                legBone.add(createBox(2.5, 1.65, 0.75, armorMat, 0, -4.4, 2.18, -0.12, 0, 0));
                // Silver metallic ankle actuator strip (visible near bottom of shin in Reference 1)
                legBone.add(createBox(0.35, 2.2, 0.4, Materials.silverMetal, isRight ? -1.4 : 1.4, -10.2, 2.18));

                // Heavy Armored Sith Boot with projecting toe-box
                legBone.add(createBox(4.45, 2.1, 5.6, armorMat, 0, -11.45, 0.65));
                legBone.add(createBox(4.2, 1.3, 1.4, armorMat, 0, -11.85, 3.6, 0.18, 0, 0));
                return legBone;
            }

            skeleton.rightLeg = buildLeg(true);
            skeleton.leftLeg = buildLeg(false);

            // Flowing Lower Surcoat / Kama Robe Panels (Continuation of chest tunic below belt!)
            const leftKama = new THREE.Group();
            leftKama.position.set(3.35, 0.5, 0);
            torsoBone.add(leftKama);
            leftKama.add(createBox(2.5, 10.8, 5.0, clothMat, 0, -5.4, 0, 0, 0, -0.07));
            skeleton.leftKama = leftKama;

            const rightKama = new THREE.Group();
            rightKama.position.set(-3.35, 0.5, 0);
            torsoBone.add(rightKama);
            rightKama.add(createBox(2.5, 10.8, 5.0, clothMat, 0, -5.4, 0, 0, 0, 0.07));
            skeleton.rightKama = rightKama;

            // =========================================================================
            // 7. MULTI-SEGMENT ARTICULATED SITH CAPE (Full-Width Flowing Drape)
            // =========================================================================
            const capeBones = [];
            let parentCape = torsoBone;
            const segHeights = [6.0, 6.2, 6.2, 6.4];
            const segWidths = [13.2, 14.4, 15.6, 16.8];

            for (let i = 0; i < 4; i++) {
                const cBone = new THREE.Group();
                if (i === 0) {
                    cBone.position.set(0, 11.9, -2.55);
                } else {
                    cBone.position.set(0, -segHeights[i - 1] + 0.2, 0);
                }
                const h = segHeights[i];
                const w = segWidths[i];
                const segMesh = createBox(w, h, 0.85, clothMat, 0, -h / 2, 0);
                cBone.add(segMesh);

                // Side cape folds wrapping forward slightly around the shoulders
                if (i < 2) {
                    cBone.add(createBox(0.9, h, 2.4, clothMat, -w / 2 + 0.3, -h / 2, 1.1, 0, 0.2, 0));
                    cBone.add(createBox(0.9, h, 2.4, clothMat, w / 2 - 0.3, -h / 2, 1.1, 0, -0.2, 0));
                }

                // In Burned mode, add tattered voxel cutouts at the bottom of the cape
                if (isBurned && i === 3) {
                    cBone.add(createBox(2.4, 1.2, 0.9, Materials.moltenEdge, -4.2, -h + 0.2, 0));
                    cBone.add(createBox(3.1, 0.9, 0.9, Materials.moltenEdge, 3.1, -h + 0.1, 0));
                }

                parentCape.add(cBone);
                capeBones.push(cBone);
                parentCape = cBone;
            }
            skeleton.cape = capeBones;

            // =========================================================================
            // 8. BURNED VARIANT: DYNAMIC 3D VOXEL FLAMES & SITH EYE GLOW
            // =========================================================================
            flameParticles.length = 0;

            if (isBurned) {
                eyeLight = new THREE.PointLight(0xff7700, 1.8, 12, 1.8);
                eyeLight.position.set(2.2, 4.5, 5.2);
                headBone.add(eyeLight);

                fireLight = new THREE.PointLight(0xff5500, 2.2, 28, 1.5);
                fireLight.position.set(3.5, 6.0, 2.0);
                torsoBone.add(fireLight);

                const flameMatCore = new THREE.MeshBasicMaterial({ color: 0xfef08a });
                const flameMatMid = new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.9 });
                const flameMatTip = new THREE.MeshBasicMaterial({ color: 0xdc2626, transparent: true, opacity: 0.78 });

                const attachPoints = [
                    { bone: leftArmBone, x: 0.8, y: 1.4, z: 0.4, scale: 1.0 },
                    { bone: leftArmBone, x: 1.6, y: -3.2, z: 1.2, scale: 0.75 },
                    { bone: torsoBone, x: 2.6, y: 11.4, z: 1.4, scale: 0.85 },
                    { bone: torsoBone, x: -2.2, y: 8.5, z: -2.2, scale: 0.9 },
                    { bone: skeleton.leftLeg, x: 1.2, y: -5.5, z: 1.8, scale: 0.8 },
                    { bone: capeBones[2], x: 4.2, y: -3.0, z: 0.5, scale: 0.95 },
                    { bone: capeBones[3], x: -3.8, y: -4.5, z: 0.4, scale: 1.05 }
                ];

                attachPoints.forEach((pt, idx) => {
                    const fGroup = new THREE.Group();
                    fGroup.position.set(pt.x, pt.y, pt.z);
                    pt.bone.add(fGroup);

                    const c1 = new THREE.Mesh(new THREE.BoxGeometry(1.4 * pt.scale, 1.8 * pt.scale, 1.4 * pt.scale), flameMatCore);
                    const c2 = new THREE.Mesh(new THREE.BoxGeometry(2.0 * pt.scale, 2.8 * pt.scale, 2.0 * pt.scale), flameMatMid);
                    const c3 = new THREE.Mesh(new THREE.BoxGeometry(1.1 * pt.scale, 3.6 * pt.scale, 1.1 * pt.scale), flameMatTip);
                    c1.position.y = 0.7 * pt.scale;
                    c2.position.y = 1.2 * pt.scale;
                    c3.position.y = 2.1 * pt.scale;
                    fGroup.add(c1, c2, c3);

                    flameParticles.push({
                        group: fGroup,
                        c1, c2, c3,
                        seed: idx * 3.17,
                        baseScale: pt.scale
                    });
                });
            }
        }

        let pedestalGroup, pedestalStripMat;

        function buildEnvironment() {
            pedestalGroup = new THREE.Group();
            scene.add(pedestalGroup);

            // Sleek Octagonal Minecraft-style Obsidian & Basalt Display Plinth
            const baseTex = createPixelTexture(32, 32, (ctx, w, h) => {
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const n = hash2D(x, y, 201);
                        const edge = (x < 2 || x >= w - 2 || y < 2 || y >= h - 2);
                        const v = edge ? 34 : Math.floor(15 + n * 7);
                        ctx.fillStyle = `rgb(${v},${v},${v + 3})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            });
            const baseMat = new THREE.MeshStandardMaterial({
                map: baseTex,
                roughness: 0.4,
                metalness: 0.5
            });

            pedestalStripMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 });

            // Top platform block
            const topSlab = createBox(22, 1.5, 22, baseMat, 0, -0.75, 0);
            pedestalGroup.add(topSlab);

            // Glowing Imperial/Sith rim strip
            const glowSlab = createBox(22.3, 0.35, 22.3, pedestalStripMat, 0, -1.65, 0);
            pedestalGroup.add(glowSlab);

            // Lower stepped base
            const bottomSlab = createBox(25, 1.6, 25, baseMat, 0, -2.6, 0);
            pedestalGroup.add(bottomSlab);

            // Floating Rising Ember / Dark-Side Particle Pool
            const emberGeo = new THREE.BoxGeometry(0.45, 0.45, 0.45);
            for (let i = 0; i < 42; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    color: (i % 2 === 0) ? 0xf97316 : 0xef4444,
                    transparent: true,
                    opacity: 0.75
                });
                const mesh = new THREE.Mesh(emberGeo, mat);
                resetEmber(mesh, true);
                scene.add(mesh);
                emberParticles.push({
                    mesh,
                    speedY: 4 + Math.random() * 7,
                    driftSeed: Math.random() * 100
                });
            }

            // Deflection Spark Pool (for Lightsaber Deflect animation)
            const sparkGeo = new THREE.BoxGeometry(0.35, 0.35, 1.8);
            for (let i = 0; i < 12; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    color: 0xfef08a,
                    transparent: true,
                    opacity: 0
                });
                const mesh = new THREE.Mesh(sparkGeo, mat);
                scene.add(mesh);
                sparkParticles.push({
                    mesh,
                    vx: 0, vy: 0, vz: 0,
                    life: 0
                });
            }
        }

        function resetEmber(mesh, randomY = false) {
            const radius = 3 + Math.random() * 11;
            const angle = Math.random() * Math.PI * 2;
            mesh.position.set(
                Math.cos(angle) * radius,
                randomY ? Math.random() * 34 : 0.2,
                Math.sin(angle) * radius
            );
            const s = 0.5 + Math.random() * 0.9;
            mesh.scale.set(s, s, s);
        }

        // Smooth damped lerp helper for frame-rate independent 60fps transitions
        function damp(current, target, lambda, dt) {
            return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
        }

        let deflTimer = 0;

        function updateAnimations(time, dt) {
            if (!skeleton.root) return;

            // Default target transforms
            const target = {
                rootY: 12.5,
                rootRotY: 0,
                rootRotX: 0,
                torsoX: 0, torsoY: 0, torsoZ: 0,
                headX: 0, headY: 0, headZ: 0,
                rArmX: 0, rArmY: 0, rArmZ: 0,
                lArmX: 0, lArmY: 0, lArmZ: 0,
                rLegX: 0, rLegY: 0, rLegZ: 0,
                lLegX: 0, lLegY: 0, lLegZ: 0,
                saberX: Math.PI / 2, saberY: 0, saberZ: 0,
                capeWaveAmp: 0.06,
                capeBaseLift: 0.14
            };

            // =====================================================================
            // 1. IDLE BREATHING (Matches Reference Image 1: Commanding Sith Stance)
            // =====================================================================
            if (currentAnim === 'idle') {
                const breath = Math.sin(time * 1.9);
                target.rootY = 12.5 + breath * 0.14;
                target.torsoX = breath * 0.03;
                target.torsoY = -0.15;

                // Menacing downward chin tilt so the flared brow shadows the eyes like Ref 2!
                target.headY = 0.14 + Math.sin(time * 0.65) * 0.12;
                target.headX = 0.09 - breath * 0.025;

                // Right arm holding lightsaber angled down & beside leg (like Reference Image 1!)
                target.rArmX = -0.22 + breath * 0.03;
                target.rArmZ = 0.14;
                target.rArmY = -0.12;
                target.saberX = Math.PI / 2 + 0.82;
                target.saberZ = -0.08;

                // Left arm resting powerfully near belt / thigh
                target.lArmX = -0.16 - breath * 0.03;
                target.lArmZ = -0.15;

                target.rLegZ = 0.04;
                target.lLegZ = -0.04;
                target.capeWaveAmp = 0.06;
                target.capeBaseLift = 0.15;
            }

            // =====================================================================
            // 2. IMPERIAL MARCH (Heavy, deliberate, unstoppable stride)
            // =====================================================================
            else if (currentAnim === 'walk') {
                const wSpeed = 3.6;
                const cycle = time * wSpeed;
                const stride = Math.sin(cycle);
                const bounce = Math.abs(Math.cos(cycle));

                target.rootY = 12.5 - bounce * 0.45;
                target.torsoX = 0.07; // Slight forward commanding lean
                target.torsoY = -stride * 0.14;
                target.torsoZ = Math.cos(cycle) * 0.035;

                target.headY = stride * 0.1;
                target.headX = 0.08;

                // Heavy Leg Stride
                target.rLegX = stride * 0.58;
                target.lLegX = -stride * 0.58;

                // Arms swinging with purposeful weight
                target.rArmX = -0.35 - stride * 0.28;
                target.rArmZ = 0.18;
                target.saberX = Math.PI / 2 + 0.45;

                target.lArmX = stride * 0.42;
                target.lArmZ = -0.14;

                target.capeWaveAmp = 0.16;
                target.capeBaseLift = 0.38;
            }

            // =====================================================================
            // 3. FORCE CHOKE (Left hand raised & clenched)
            // =====================================================================
            else if (currentAnim === 'choke') {
                const pulse = Math.sin(time * 3.2);
                const tremor = Math.sin(time * 18.0) * 0.015;

                target.rootY = 12.5 + Math.sin(time * 1.5) * 0.12;
                target.torsoY = -0.32;
                target.torsoX = -0.04;

                // Head turned toward victim with menacing tilt
                target.headY = 0.28;
                target.headX = -0.08 + pulse * 0.03;
                target.headZ = -0.08;

                // Left Arm raised forward in iconic Force Choke grip
                target.lArmX = -1.38 + pulse * 0.05 + tremor;
                target.lArmY = -0.22;
                target.lArmZ = -0.18 + tremor;

                // Right Arm holding crimson blade low across the body (just like Ref 2!)
                target.rArmX = -0.28;
                target.rArmY = 0.35;
                target.rArmZ = 0.24;
                target.saberX = Math.PI / 2 + 0.38;
                target.saberZ = -0.45;

                target.capeWaveAmp = 0.12;
                target.capeBaseLift = 0.26;
            }

            // =====================================================================
            // 4. LIGHTSABER FORM V (Djem So) SLASH COMBO
            // =====================================================================
            else if (currentAnim === 'slash') {
                const phase = (time * 0.85) % 1.0;

                if (phase < 0.33) {
                    // Phase 1: Heavy overhead Djem So windup & vertical strike
                    const p = phase / 0.33;
                    const swing = Math.sin(p * Math.PI * 1.3);
                    target.torsoY = -0.45 + p * 0.9;
                    target.torsoX = -0.15 + p * 0.38;
                    target.rArmX = -2.4 + p * 2.1;
                    target.rArmZ = 0.15;
                    target.saberX = Math.PI / 2 - 0.3 + p * 0.8;
                    target.lArmX = -1.4 + p * 1.0;
                    target.lArmY = -0.4;
                    target.rLegX = -0.35;
                    target.lLegX = 0.35;
                    target.rootY = 11.4;
                } else if (phase < 0.66) {
                    // Phase 2: Sweeping backhand horizontal arc
                    const p = (phase - 0.33) / 0.33;
                    const arc = Math.sin(p * Math.PI);
                    target.torsoY = 0.55 - p * 1.15;
                    target.torsoX = 0.12;
                    target.rArmX = -1.45;
                    target.rArmY = 0.85 - p * 1.9;
                    target.rArmZ = 0.65;
                    target.saberX = Math.PI / 2 + 0.25;
                    target.saberZ = -0.5 + arc * 0.8;
                    target.lArmX = -0.55;
                    target.lArmZ = -0.45;
                    target.rLegX = 0.3;
                    target.lLegX = -0.3;
                    target.rootY = 11.3;
                } else {
                    // Phase 3: Intimidating forward thrust & recovery guard
                    const p = (phase - 0.66) / 0.34;
                    const thrust = Math.sin(p * Math.PI);
                    target.torsoY = -0.6 + thrust * 0.3;
                    target.torsoX = 0.18 * thrust;
                    target.rArmX = -1.55 - thrust * 0.25;
                    target.rArmY = -0.15;
                    target.saberX = Math.PI / 2 + 0.55 * thrust;
                    target.lArmX = -0.45;
                    target.lArmZ = -0.3;
                    target.rootY = 11.6;
                }
                target.capeWaveAmp = 0.25;
                target.capeBaseLift = 0.52;
            }

            // =====================================================================
            // 5. DARK SIDE UNLEASHED (Reference Image 1: Arms spread wide!)
            // =====================================================================
            else if (currentAnim === 'unleashed') {
                const surge = Math.sin(time * 2.4);
                target.rootY = 12.2 + surge * 0.25;
                target.torsoX = -0.18 + surge * 0.04; // Chest puffed out powerfully
                target.headX = -0.22 + surge * 0.05; // Looking slightly up/commanding
                target.headY = Math.sin(time * 1.1) * 0.12;

                // Both arms spread wide open (Iconic Pose from Reference Image 1)
                target.rArmX = -0.35;
                target.rArmZ = 1.18 + surge * 0.08;
                target.rArmY = 0.25;
                target.saberX = Math.PI / 2 + 0.15;

                target.lArmX = -0.35;
                target.lArmZ = -1.18 - surge * 0.08;
                target.lArmY = -0.25;

                target.rLegZ = 0.08;
                target.lLegZ = -0.08;

                // Dramatic billowing cape
                target.capeWaveAmp = 0.28;
                target.capeBaseLift = 0.58;
            }

            // =====================================================================
            // 6. LIGHTSABER DEFLECT / BLASTER PARRY
            // =====================================================================
            else if (currentAnim === 'deflect') {
                const slot = Math.floor(time * 2.8) % 4;
                const sub = (time * 2.8) % 1.0;
                const snap = Math.sin(sub * Math.PI);

                target.torsoX = 0.06;
                target.rootY = 11.7;
                target.rLegX = -0.18;
                target.lLegX = 0.18;

                if (slot === 0) {
                    // High Left Guard Parry
                    target.torsoY = 0.22;
                    target.rArmX = -1.65;
                    target.rArmY = 0.55;
                    target.saberZ = -0.65;
                    target.saberX = Math.PI / 2 - 0.35;
                } else if (slot === 1) {
                    // Low Right Guard Parry
                    target.torsoY = -0.25;
                    target.rArmX = -1.15;
                    target.rArmY = -0.45;
                    target.saberZ = 0.55;
                    target.saberX = Math.PI / 2 + 0.35;
                } else if (slot === 2) {
                    // Overhead Cross Block
                    target.torsoY = 0.1;
                    target.rArmX = -2.05;
                    target.rArmZ = 0.35;
                    target.saberZ = -1.15;
                    target.saberX = Math.PI / 2;
                } else {
                    // Center Vertical Deflect
                    target.torsoY = -0.15;
                    target.rArmX = -1.45 - snap * 0.2;
                    target.rArmY = 0.25;
                    target.saberZ = -0.1;
                    target.saberX = Math.PI / 2 - 0.5;
                }

                target.lArmX = -0.55;
                target.lArmZ = -0.28;
                target.capeWaveAmp = 0.18;
                target.capeBaseLift = 0.34;

                // Trigger deflection spark bursts periodically
                deflTimer += dt;
                if (deflTimer > 0.35 && saberActive) {
                    deflTimer = 0;
                    spawnDeflectSparks();
                }
            }

            const speed = 11.0;
            skeleton.root.position.y = damp(skeleton.root.position.y, target.rootY, speed, dt);
            skeleton.torso.rotation.x = damp(skeleton.torso.rotation.x, target.torsoX, speed, dt);
            skeleton.torso.rotation.y = damp(skeleton.torso.rotation.y, target.torsoY, speed, dt);
            skeleton.torso.rotation.z = damp(skeleton.torso.rotation.z, target.torsoZ, speed, dt);

            skeleton.head.rotation.x = damp(skeleton.head.rotation.x, target.headX, speed, dt);
            skeleton.head.rotation.y = damp(skeleton.head.rotation.y, target.headY, speed, dt);
            skeleton.head.rotation.z = damp(skeleton.head.rotation.z, target.headZ, speed, dt);

            skeleton.rightArm.rotation.x = damp(skeleton.rightArm.rotation.x, target.rArmX, speed, dt);
            skeleton.rightArm.rotation.y = damp(skeleton.rightArm.rotation.y, target.rArmY, speed, dt);
            skeleton.rightArm.rotation.z = damp(skeleton.rightArm.rotation.z, target.rArmZ, speed, dt);

            skeleton.leftArm.rotation.x = damp(skeleton.leftArm.rotation.x, target.lArmX, speed, dt);
            skeleton.leftArm.rotation.y = damp(skeleton.leftArm.rotation.y, target.lArmY, speed, dt);
            skeleton.leftArm.rotation.z = damp(skeleton.leftArm.rotation.z, target.lArmZ, speed, dt);

            skeleton.rightLeg.rotation.x = damp(skeleton.rightLeg.rotation.x, target.rLegX, speed, dt);
            skeleton.rightLeg.rotation.z = damp(skeleton.rightLeg.rotation.z, target.rLegZ, speed, dt);
            skeleton.leftLeg.rotation.x = damp(skeleton.leftLeg.rotation.x, target.lLegX, speed, dt);
            skeleton.leftLeg.rotation.z = damp(skeleton.leftLeg.rotation.z, target.lLegZ, speed, dt);

            // Kama cloth skirts follow leg motion naturally
            if (skeleton.rightKama && skeleton.leftKama) {
                skeleton.rightKama.rotation.x = skeleton.rightLeg.rotation.x * 0.65;
                skeleton.leftKama.rotation.x = skeleton.leftLeg.rotation.x * 0.65;
            }

            // Lightsaber orientation
            skeleton.saber.rotation.x = damp(skeleton.saber.rotation.x, target.saberX, speed * 1.2, dt);
            skeleton.saber.rotation.y = damp(skeleton.saber.rotation.y, target.saberY, speed * 1.2, dt);
            skeleton.saber.rotation.z = damp(skeleton.saber.rotation.z, target.saberZ, speed * 1.2, dt);

            // Smooth Lightsaber Blade Ignite / Retract Animation
            const targetBladeScale = saberActive ? 1.0 : 0.001;
            saberLengthScale = damp(saberLengthScale, targetBladeScale, 16.0, dt);
            if (skeleton.blade) {
                skeleton.blade.visible = saberLengthScale > 0.01;
                skeleton.blade.scale.set(
                    0.96 + Math.sin(time * 42) * 0.04,
                    saberLengthScale,
                    0.96 + Math.cos(time * 42) * 0.04
                );
            }
            if (saberLight) {
                saberLight.intensity = (2.5 + Math.sin(time * 35) * 0.3) * saberLengthScale;
            }

            // Multi-Segment Cape Traveling Sine Wave Physics
            if (skeleton.cape) {
                skeleton.cape.forEach((cBone, idx) => {
                    const wave = Math.sin(time * 3.4 - idx * 0.85) * target.capeWaveAmp;
                    const sideSway = Math.cos(time * 2.1 - idx * 0.6) * (target.capeWaveAmp * 0.35);
                    const baseAngle = (idx === 0) ? target.capeBaseLift : 0.05;
                    cBone.rotation.x = damp(cBone.rotation.x, baseAngle + wave, 10, dt);
                    cBone.rotation.z = damp(cBone.rotation.z, sideSway, 10, dt);
                });
            }

            // Animate 3D Voxel Flames on Vader's suit (when in Burned variant)
            if (currentVariant === 'burned') {
                flameParticles.forEach((fp) => {
                    const t = time * 10.0 + fp.seed;
                    fp.c1.scale.y = 0.85 + Math.sin(t * 1.7) * 0.25;
                    fp.c2.scale.y = 0.85 + Math.cos(t * 1.3) * 0.3;
                    fp.c2.rotation.y = Math.sin(t * 0.5) * 0.4;
                    fp.c3.position.y = (1.9 + Math.sin(t * 2.1) * 0.45) * fp.baseScale;
                    fp.c3.position.x = Math.cos(t * 1.9) * 0.22;
                });
                if (fireLight) {
                    fireLight.intensity = 2.0 + Math.sin(time * 23.0) * 0.55;
                }
                if (eyeLight) {
                    eyeLight.intensity = 1.6 + Math.sin(time * 8.0) * 0.35;
                }
            }

            // Update floating ember / dark-side aura particles
            const activeEmberCount = (currentVariant === 'burned') ? emberParticles.length : 16;
            emberParticles.forEach((ep, idx) => {
                if (idx >= activeEmberCount) {
                    ep.mesh.visible = false;
                    return;
                }
                ep.mesh.visible = true;
                ep.mesh.position.y += ep.speedY * dt;
                ep.mesh.position.x += Math.sin(time * 2.0 + ep.driftSeed) * 1.5 * dt;
                ep.mesh.rotation.x += 2.0 * dt;
                ep.mesh.rotation.y += 2.5 * dt;

                if (ep.mesh.position.y > 35) {
                    resetEmber(ep.mesh, false);
                }
            });

            // Update blaster deflection sparks
            sparkParticles.forEach((sp) => {
                if (sp.life > 0) {
                    sp.life -= dt * 2.8;
                    sp.mesh.position.x += sp.vx * dt;
                    sp.mesh.position.y += sp.vy * dt;
                    sp.mesh.position.z += sp.vz * dt;
                    sp.mesh.material.opacity = Math.max(0, sp.life);
                } else {
                    sp.mesh.material.opacity = 0;
                }
            });
        }

        function spawnDeflectSparks() {
            if (!skeleton.blade) return;
            const worldPos = new THREE.Vector3(0, 11, 0);
            skeleton.blade.localToWorld(worldPos);

            sparkParticles.forEach((sp) => {
                sp.life = 1.0;
                sp.mesh.position.copy(worldPos);
                sp.vx = (Math.random() - 0.5) * 42;
                sp.vy = (Math.random() - 0.3) * 38;
                sp.vz = 15 + Math.random() * 35;
                sp.mesh.lookAt(
                    sp.mesh.position.x + sp.vx,
                    sp.mesh.position.y + sp.vy,
                    sp.mesh.position.z + sp.vz
                );
            });
        }

        function setupControls(domElement) {
            domElement.addEventListener('contextmenu', (e) => e.preventDefault());

            domElement.addEventListener('pointerdown', (e) => {
                camState.isDragging = true;
                camState.isRightDrag = (e.button === 2);
                camState.prevX = e.clientX;
                camState.prevY = e.clientY;
                domElement.setPointerCapture(e.pointerId);
            });

            domElement.addEventListener('pointermove', (e) => {
                if (!camState.isDragging) return;
                const dx = e.clientX - camState.prevX;
                const dy = e.clientY - camState.prevY;
                camState.prevX = e.clientX;
                camState.prevY = e.clientY;

                if (camState.isRightDrag) {
                    camState.targetPanX -= dx * 0.04;
                    camState.targetPanY += dy * 0.04;
                    camState.targetPanY = Math.max(4, Math.min(30, camState.targetPanY));
                } else {
                    camState.targetTheta -= dx * 0.0075;
                    camState.targetPhi = Math.max(0.25, Math.min(Math.PI - 0.25, camState.targetPhi - dy * 0.0065));
                }
            });

            domElement.addEventListener('pointerup', (e) => {
                camState.isDragging = false;
                try { domElement.releasePointerCapture(e.pointerId); } catch (_) {}
            });

            domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camState.targetRadius = Math.max(18, Math.min(80, camState.targetRadius + e.deltaY * 0.032));
            }, { passive: false });
        }

        function updateCamera(dt) {
            if (autoRotate && !camState.isDragging) {
                camState.targetTheta += 0.45 * dt;
            }
            const smooth = 12.0;
            camState.theta = damp(camState.theta, camState.targetTheta, smooth, dt);
            camState.phi = damp(camState.phi, camState.targetPhi, smooth, dt);
            camState.radius = damp(camState.radius, camState.targetRadius, smooth, dt);
            camState.panX = damp(camState.panX, camState.targetPanX, smooth, dt);
            camState.panY = damp(camState.panY, camState.targetPanY, smooth, dt);

            const x = camState.panX + camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta);
            const y = camState.panY + camState.radius * Math.cos(camState.phi);
            const z = camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta);

            camera.position.set(x, Math.max(1.5, y), z);
            camera.lookAt(camState.panX, camState.panY, 0);
        }

        function setModelVariant(variant) {
            if (currentVariant === variant) return;
            currentVariant = variant;

            const btnPristine = document.getElementById('btn-pristine');
            const btnBurned = document.getElementById('btn-burned');

            if (variant === 'pristine') {
                btnPristine.classList.add('active-pristine');
                btnBurned.classList.remove('active-burned');
                if (pedestalStripMat) pedestalStripMat.color.setHex(0xdc2626);
                if (rimLightRed) rimLightRed.color.setHex(0xdc2626);
                scene.fog.color.setHex(0x08080b);
            } else {
                btnPristine.classList.remove('active-pristine');
                btnBurned.classList.add('active-burned');
                if (pedestalStripMat) pedestalStripMat.color.setHex(0xf97316);
                if (rimLightRed) rimLightRed.color.setHex(0xea580c);
                scene.fog.color.setHex(0x110906);
            }

            buildVaderModel();
        }

        function setAnimation(animName) {
            currentAnim = animName;
            document.querySelectorAll('.anim-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.anim === animName);
            });
        }

        function toggleSaber() {
            saberActive = !saberActive;
            const btn = document.getElementById('btn-saber');
            const dot = document.getElementById('saber-dot');
            btn.classList.toggle('active', saberActive);
            dot.className = saberActive
                ? 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]'
                : 'w-2 h-2 rounded-full bg-zinc-600';
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('btn-rotate').classList.toggle('active', autoRotate);
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x08080b);
            scene.fog = new THREE.FogExp2(0x08080b, 0.0085);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 250);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            container.appendChild(renderer.domElement);

            // Studio 3-Point Lighting tailored for Dark Glossy Obsidian Armor
            const ambient = new THREE.AmbientLight(0xd4d4d8, 0.55);
            scene.add(ambient);

            // Cool Top-Left Key Light to bring out crisp voxel armor planes & helmet highlights
            const keyLight = new THREE.DirectionalLight(0xe4e4f0, 1.45);
            keyLight.position.set(-22, 42, 28);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 1024;
            keyLight.shadow.mapSize.height = 1024;
            keyLight.shadow.camera.near = 10;
            keyLight.shadow.camera.far = 90;
            const d = 22;
            keyLight.shadow.camera.left = -d;
            keyLight.shadow.camera.right = d;
            keyLight.shadow.camera.top = d;
            keyLight.shadow.camera.bottom = -d;
            scene.add(keyLight);

            // Dramatic Crimson/Mustafar Back Rim Light
            rimLightRed = new THREE.DirectionalLight(0xdc2626, 1.35);
            rimLightRed.position.set(18, 25, -26);
            scene.add(rimLightRed);

            // Subtle Cool Fill Light from Right
            const fillLight = new THREE.DirectionalLight(0x71717a, 0.65);
            fillLight.position.set(26, 14, 15);
            scene.add(fillLight);

            initMaterials();
            buildEnvironment();
            buildVaderModel();
            setupControls(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // High-precision 60fps loop with live FPS counter
        let lastTime = performance.now();
        let frames = 0;
        let fpsLastUpdate = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            const elapsedTime = now * 0.001;

            frames++;
            if (now - fpsLastUpdate >= 500) {
                const fps = Math.min(60, Math.round((frames * 1000) / (now - fpsLastUpdate)));
                const el = document.getElementById('fps-counter');
                if (el) el.textContent = `${fps} FPS`;
                frames = 0;
                fpsLastUpdate = now;
            }

            updateAnimations(elapsedTime, dt);
            updateCamera(dt);
            renderer.render(scene, camera);
        }

        window.onload = function () {
            init();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>

    const GRAVITY = 9.8;

    /* ───────── Simulation state ───────── */
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function makeSim(seed) {
      return {
        anim: 'idle', t: 0, time: 0, blend: 1,
        snap: makePose(), cur: makePose(), out: makePose(),
        face: { browUp: 0, frown: 0, open: 0, wide: 0, glance: 0, squint: 0 },
        yawLimit: 0.5,
        // Talking (set each frame by the voice player): level 0-1 = loudness, shape 0-1 = dull 'o' .. bright 'ee'.
        talk: { active: false, level: 0, shape: 0.5 }, talkW: 0,
        rng: mulberry32(seed),
        blink: { wait: 1.2, t: -1, again: false },
        follow: { on: true, w: 1, yaw: 0, pitch: 0, eye: 0, mx: 0, my: 0, has: false },
        springs: SPRINGS.map((s) => ({ ...s, ax: 0, az: 0, vx: 0, vz: 0, prev: new THREE.Vector3(), vel: new THREE.Vector3(), velPrev: new THREE.Vector3(), acc: new THREE.Vector3(), init: false })),
        crown: { lift: 0, liftV: 0, tx: 0, tz: 0, vx: 0, vz: 0, prev: new THREE.Vector3(), vel: new THREE.Vector3(), velPrev: new THREE.Vector3(), acc: new THREE.Vector3(), init: false }
      };
    }

    function switchAnim(S, name) {
      if (name === S.anim) return;
      copyPose(S.out, S.snap); // crossfade from whatever is on screen now
      S.anim = name; S.t = 0; S.blend = 0;
    }

    // Reusable temporaries (no allocation inside the per-frame update).
    const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
    const qA = new THREE.Quaternion();
    const ray = new THREE.Raycaster();
    const plane = new THREE.Plane();
    const ndc = new THREE.Vector2();

    function filt(dt, rate) { return 1 - Math.exp(-dt * rate); }
    const PITCH_UP = -0.08, PITCH_DOWN = 0.03; // head pitch range (rad); + = chin down

    // Track an anchor's smoothed velocity and acceleration (world space).
    function trackMotion(st, world, dt) {
      if (!st.init) { st.prev.copy(world); st.vel.set(0, 0, 0); st.velPrev.set(0, 0, 0); st.acc.set(0, 0, 0); st.init = true; return; }
      vC.copy(world).sub(st.prev).divideScalar(dt);
      st.prev.copy(world);
      st.vel.lerp(vC, filt(dt, 25));
      vC.copy(st.vel).sub(st.velPrev).divideScalar(dt);
      st.velPrev.copy(st.vel);
      st.acc.lerp(vC, filt(dt, 18));
    }

    // Every box with its half sizes (world units), for the ground check in step() (lying poses touch the ground with anything).
    const SOLES = cubeList.map((c) => ({ mesh: c.mesh, h: c.size.map((s) => (Math.abs(s) / 2 + c.inflate) * TEXEL) }));

    /* ───────── One simulation step ───────── */
    function step(S, dt) {
      const A = ANIMS[S.anim];
      S.time += dt;
      // loopFade: an anim whose end pose differs from its start pose crossfades on the loop wrap (no snap).
      if (A.loopFade && S.t + dt >= A.T) { copyPose(S.out, S.snap); S.blend = 0; S.loops = (S.loops || 0) + 1; }
      S.t = (S.t + dt) % A.T;
      S.blend = Math.min(1, S.blend + dt / 0.35);

      // 1. Animation pose, crossfaded from the snapshot after a switch, added to the v2 rest pose.
      clearPose(S.cur);
      S.cur.yawLimit = A.yawLimit;
      S.cur.follow = A.follow ?? 1;                     // an anim may lower this per frame (arms near the head)
      A.fn(S.t, S.cur);
      const w = smooth01(S.blend);
      const o = S.out;
      for (let i = 0; i < NB * 3; i++) {
        o.r[i] = S.snap.r[i] + (S.cur.r[i] - S.snap.r[i]) * w;
        o.p[i] = S.snap.p[i] + (S.cur.p[i] - S.snap.p[i]) * w;
      }
      for (const k of FACE_KEYS) o.f[k] = S.snap.f[k] + (S.cur.f[k] - S.snap.f[k]) * w;
      o.yawLimit = S.snap.yawLimit + (S.cur.yawLimit - S.snap.yawLimit) * w;
      o.follow = S.snap.follow + (S.cur.follow - S.snap.follow) * w;

      for (let b = 0; b < NB; b++) {
        const g = boneList[b], r = g.userData.rest, rr = g.userData.restRot;
        g.rotation.set(rr.x + o.r[b * 3], rr.y + o.r[b * 3 + 1], rr.z + o.r[b * 3 + 2]);
        g.position.set(r.x + o.p[b * 3] * TEXEL, r.y + o.p[b * 3 + 1] * TEXEL, r.z + o.p[b * 3 + 2] * TEXEL);
        g.scale.set(1, 1, 1);
      }
      // Arms only rotate outward on Z (right arm sits on -x, so outward is negative).
      bones.arm_right.rotation.z = Math.min(bones.arm_right.userData.restRot.z, bones.arm_right.rotation.z);
      bones.arm_left.rotation.z = Math.max(bones.arm_left.userData.restRot.z, bones.arm_left.rotation.z);

      // 2. Head + eyes follow the mouse. Yaw limit per animation (0.25-0.35: the bandana fold stays off the sleeves);
      //    pitch only 0.03 down (the bandana front would sink into the collar) and 0.08 up.
      // While talking the chin lifts on loud syllables (pitch is clamped below).
      head.rotation.x -= 0.06 * S.talk.level * S.talkW;
      const F = S.follow;
      S.yawLimit += (o.yawLimit - S.yawLimit) * filt(dt, 4);
      F.w += ((F.on && F.has ? o.follow : 0) - F.w) * filt(dt, 5);
      let wantYaw = 0, wantPitch = 0, wantEye = 0;
      if (F.on && F.has && F.inject) {
        // Look angles given directly (the mod: where the mob looks; the trace test): same limits as the mouse.
        wantYaw = clamp(F.inject.yaw, -S.yawLimit, S.yawLimit);
        wantPitch = clamp(F.inject.pitch, PITCH_UP, PITCH_DOWN);
        wantEye = clamp((F.inject.yaw - wantYaw) * 2.2, -1, 1);
      } else if (F.on && F.has) {
        mobRoot.updateMatrixWorld(true);
        head.getWorldPosition(vA);
        camera.getWorldDirection(vB);
        plane.setFromNormalAndCoplanarPoint(vB, vA);
        ndc.set(F.mx, F.my);
        ray.setFromCamera(ndc, camera);
        if (ray.ray.intersectPlane(plane, vC)) {
          head.parent.worldToLocal(vC);          // into the head's parent space
          vC.sub(head.position);
          const rawYaw = Math.atan2(vC.x, vC.z);
          wantYaw = clamp(rawYaw, -S.yawLimit, S.yawLimit);
          wantPitch = clamp(Math.atan2(-vC.y, Math.hypot(vC.x, vC.z)), PITCH_UP, PITCH_DOWN);
          wantEye = clamp((rawYaw - wantYaw) * 2.2, -1, 1); // eyes go further when the head hits its limit
        }
      }
      const k5 = filt(dt, 6);
      F.yaw += (wantYaw - F.yaw) * k5;
      F.pitch += (wantPitch - F.pitch) * k5;
      F.eye += (wantEye - F.eye) * filt(dt, 10);
      head.rotation.y = clamp(head.rotation.y + F.yaw * F.w, -S.yawLimit, S.yawLimit);
      head.rotation.x = clamp(head.rotation.x + F.pitch * F.w, PITCH_UP, PITCH_DOWN);

      // 3. Face: smoothing filter on every channel, random (double) blinks as a sine bump.
      // Talking overrides the animation's mouth (and makes him grumpy): open = loudness, shape = brightness.
      const T = S.talk;
      S.talkW += ((T.active ? 1 : 0) - S.talkW) * filt(dt, 10);
      const tw = S.talkW;
      if (tw > 0.001) {
        o.f.open += (T.level - o.f.open) * tw;
        o.f.wide += ((T.shape - 0.5) * 1.4 - o.f.wide) * tw;
        o.f.frown = Math.max(o.f.frown, 0.55 * tw);
        o.f.browUp += (-0.15 - o.f.browUp) * tw * 0.6;
        o.f.squint = Math.max(o.f.squint, 0.25 * tw);
      }
      const kf16 = filt(dt, 16);
      for (const k of FACE_KEYS) S.face[k] += (o.f[k] - S.face[k]) * kf16;
      const fc = S.face;
      const bl = S.blink;
      let blinkV = 0;
      if (bl.t < 0) {
        bl.wait -= dt;
        if (bl.wait <= 0) { bl.t = 0; bl.again = S.rng() < 0.18; }
      }
      if (bl.t >= 0) {
        bl.t += dt;
        if (bl.t >= 0.18) {
          bl.t = -1;
          bl.wait = bl.again ? 0.12 : 1.8 + S.rng() * 3.4;
          bl.again = false;
        } else blinkV = Math.sin(Math.PI * bl.t / 0.18);
      }
      const closed = clamp(Math.max(blinkV, fc.squint * 0.5), 0.001, 1);
      bones.lid_right.scale.y = bones.lid_left.scale.y = closed;
      // Step out in front of the eye only while the lid is a sliver (scale ~0), so the jump is never visible.
      const lidZ = closed > 0.002 ? 0.08 * TEXEL : 0;
      bones.lid_right.position.z = bones.lid_right.userData.rest.z + lidZ;
      bones.lid_left.position.z = bones.lid_left.userData.rest.z + lidZ;
      // Glance: + = toward his left (+x). Both pupils slide the same way, half a texel at most.
      const glance = clamp(fc.glance + F.eye * F.w, -1, 1);
      bones.pupil_right.position.x = bones.pupil_right.userData.rest.x + glance * 0.5 * TEXEL;
      bones.pupil_left.position.x = bones.pupil_left.userData.rest.x + glance * 0.5 * TEXEL;
      // Brows: raise / frown; capped so they stay under the crown band.
      const browY = clamp(fc.browUp * 0.3 - fc.frown * 0.15 - blinkV * 0.08, -0.25, 0.25) * TEXEL;
      bones.brow_right.position.y = bones.brow_right.userData.rest.y + browY;
      bones.brow_left.position.y = bones.brow_left.userData.rest.y + browY;
      bones.brow_right.rotation.z = -fc.frown * 0.3;  // inner ends down
      bones.brow_left.rotation.z = fc.frown * 0.3;
      // Mouth: rest scale 1 = v2's lip line. Opens downward, grins wider, "o" narrower; the jaw (bandana) drops with it.
      const wide = clamp(fc.wide, -1, 1), open = clamp(fc.open, 0, 1);
      // The top lip rises a little too, so the open mouth shows above the bandana.
      bones.mouth.scale.set(1 + wide * 0.3, clamp(1 + open * 1.1 + Math.max(0, -wide) * 0.3, 1, 2), 1);
      bones.mouth.position.y = bones.mouth.userData.rest.y + open * 0.35 * TEXEL;
      jaw.rotation.x += open * 0.06;
      // The bandana's bottom sits only 0.05 above the shirt (v2 model). Pitching the head (back edge drops
      // ~3 texels x angle, front ~4.6 x angle), turning it or dropping the jaw would sink it into the collar, so the head
      // rises on its neck by the same amount. Smooth, at most ~0.4 texel.
      const hp = head.rotation.x;
      head.position.y += (Math.max(0, -hp) * 3 + Math.max(0, hp) * 4.6 + open * 0.06 * 4.2 + head.rotation.y ** 2 * 1.4) * TEXEL;

      // 4. Springs on loose parts (need world matrices of this frame's pose).
      mobRoot.updateMatrixWorld(true);
      for (const sp of S.springs) {
        const g = bones[sp.bone], rr = g.userData.restRot;
        g.getWorldPosition(vA);
        trackMotion(sp, vA, dt);
        // Effective gravity in the parent's space -> the angle the part wants to hang at.
        vB.set(0, -GRAVITY, 0).addScaledVector(sp.acc, -sp.accel);
        g.parent.getWorldQuaternion(qA).invert();
        vB.applyQuaternion(qA).normalize();
        const tx = Math.atan2(-vB.z, -vB.y) + (sp.bx || 0) + sp.breeze * Math.sin(S.time * sp.f * TAU * 0.5);
        const tz = Math.atan2(vB.x, -vB.y) + (sp.bz || 0) + sp.breeze * 0.6 * Math.sin(S.time * sp.f * TAU * 0.37 + 1);
        sp.vx += (sp.k * (tx - sp.ax) - sp.d * sp.vx) * dt;
        sp.vz += (sp.k * (tz - sp.az) - sp.d * sp.vz) * dt;
        sp.ax += sp.vx * dt; sp.az += sp.vz * dt;
        if (sp.ax < sp.x[0] || sp.ax > sp.x[1]) { sp.ax = clamp(sp.ax, sp.x[0], sp.x[1]); sp.vx = 0; }
        if (sp.az < sp.z[0] || sp.az > sp.z[1]) { sp.az = clamp(sp.az, sp.z[0], sp.z[1]); sp.vz = 0; }
        g.rotation.x = rr.x + sp.ax;
        g.rotation.z = rr.z + sp.az;
      }

      // Crown: lifts a little when the head drops fast, tilts against side motion. Never sinks below rest.
      const C = S.crown, cr = crown;
      cr.getWorldPosition(vA);
      trackMotion(C, vA, dt);
      vB.copy(C.acc);
      cr.parent.getWorldQuaternion(qA).invert();
      vB.applyQuaternion(qA);
      const liftT = clamp(-vB.y * 0.05, 0, 0.3) + 0.02 * (0.5 + 0.5 * Math.sin(S.time * 2.1));
      C.liftV += (220 * (liftT - C.lift) - 14 * C.liftV) * dt;
      C.lift = clamp(C.lift + C.liftV * dt, 0, 0.3);
      const tiltX = clamp(-vB.z * 0.004, -0.01, 0.03) /* tipping back more would bring the back wall onto the head */, tiltZ = clamp(vB.x * 0.004, -0.03, 0.03);
      C.vx += (160 * (tiltX - C.tx) - 10 * C.vx) * dt;
      C.vz += (160 * (tiltZ - C.tz) - 10 * C.vz) * dt;
      C.tx = clamp(C.tx + C.vx * dt, -0.01, 0.03);
      C.tz = clamp(C.tz + C.vz * dt, -0.03, 0.03);
      cr.position.y = cr.userData.rest.y + C.lift * TEXEL;
      cr.rotation.x = cr.userData.restRot.x + C.tx;
      cr.rotation.z = cr.userData.restRot.z + C.tz;

      // 5. Nothing sinks into the ground (done last, so swinging hair counts too). A crossfade between a crouch and standing blends angles and heights
      // in a straight line, which puts the hips a little too low halfway: lift the whole body by the lowest corner of any box.
      mobRoot.updateMatrixWorld(true);
      let low = 0;
      for (const c of SOLES) for (let k = 0; k < 8; k++) {
        vA.set(k & 1 ? c.h[0] : -c.h[0], k & 2 ? c.h[1] : -c.h[1], k & 4 ? c.h[2] : -c.h[2]).applyMatrix4(c.mesh.matrixWorld);
        if (vA.y < low) low = vA.y;
      }
      if (low < 0) root.position.y -= low;
      S.groundLift = -low / TEXEL; // texels lifted this frame (the clip test reports the biggest)
    }

    /* ───────── Blockbench export (.bbmodel) ─────────
       "Generic Model" (free) format with per-face UV, like v2: v2 has non-whole cube sizes
       (2.5, 7.6, ...), which Modded Entity / box UV would round and so change the model.
       Blockbench space = three.js turned 180° around Y: x -> -x, z -> -z.
       Bones keep their v2 rest rotation; animation keyframes are offsets from it,
       baked from the live simulation (springs + face included). */
    const R2D = 180 / Math.PI;
    const r4 = (n) => Math.round(n * 10000) / 10000 || 0;
    function uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16);
      });
    }
    const bbVec = (v) => [r4(-v[0]), r4(v[1]), r4(-v[2])];
    const bbRot = (x, y, z) => [r4(-x * R2D), r4(y * R2D), r4(-z * R2D)];

    function bakeAnimation(name) {
      const A = ANIMS[name];
      const S = makeSim(1234);
      S.anim = name; S.follow.on = false;
      const dt = 1 / 120, fps = 12;
      const warm = A.T * 2; // let the springs settle into their loop
      for (let t = 0; t < warm; t += dt) step(S, dt);
      const frames = Math.round(A.T * fps);
      const tracks = boneList.map(() => ({ rot: [], pos: [], scl: [] }));
      for (let f = 0; f <= frames; f++) {
        boneList.forEach((g, b) => {
          const r = g.userData.rest, rr = g.userData.restRot, tr = tracks[b];
          tr.rot.push(bbRot(g.rotation.x - rr.x, g.rotation.y - rr.y, g.rotation.z - rr.z));
          tr.pos.push([r4(-(g.position.x - r.x) / TEXEL), r4((g.position.y - r.y) / TEXEL), r4(-(g.position.z - r.z) / TEXEL)]);
          tr.scl.push([r4(g.scale.x), r4(g.scale.y), r4(g.scale.z)]);
        });
        let acc = 0;
        while (acc < 1 / fps - 1e-9) { step(S, dt); acc += dt; }
      }
      const animators = {};
      const isRest = (arr, rest) => arr.every((v) => Math.abs(v[0] - rest) < 0.01 && Math.abs(v[1] - rest) < 0.01 && Math.abs(v[2] - rest) < 0.01);
      boneList.forEach((g, b) => {
        const tr = tracks[b], keyframes = [];
        const add = (channel, list) => list.forEach((v, f) => keyframes.push({
          channel, data_points: [{ x: v[0], y: v[1], z: v[2] }], uuid: uuid(), time: r4(f / fps), color: -1, interpolation: 'catmullrom'
        }));
        if (!isRest(tr.rot, 0)) add('rotation', tr.rot);
        if (!isRest(tr.pos, 0)) add('position', tr.pos);
        if (!isRest(tr.scl, 1)) add('scale', tr.scl);
        if (keyframes.length) animators[g.userData.uuid] = { name: g.name, type: 'bone', keyframes };
      });
      return {
        uuid: uuid(), name: `animation.crowned_traveler.${name}`, loop: 'loop', override: false,
        length: A.T, snapping: 24, selected: name === 'idle', anim_time_update: '', blend_weight: '',
        start_delay: '', loop_delay: '', animators
      };
    }

    function buildBBModel() {
      // Absolute rest pivots (texels): each bone's offset added up the chain. Blockbench stores
      // children in unrotated model space and rotates them around the parent pivot, like three.js does.
      const abs = new Map();
      boneList.forEach((g) => {
        g.userData.uuid = uuid();
        const p = g.parent.isGroup && abs.has(g.parent) ? abs.get(g.parent) : [0, 0, 0];
        const r = g.userData.rest;
        abs.set(g, [p[0] + r.x / TEXEL, p[1] + r.y / TEXEL, p[2] + r.z / TEXEL]);
      });
      const elements = [];
      const groupOf = {};
      for (const c of cubeList) {
        const id = uuid();
        const bp = abs.get(bones[c.bone]);
        const ctr = bbVec([bp[0] + c.center[0], bp[1] + c.center[1], bp[2] + c.center[2]]);
        const [w, h, d] = c.size;
        const R = (f) => { const r = c.rects[f]; return [r.x, r.y, r.x + r.w, r.y + r.h]; };
        const Rf = (f) => { const r = c.rects[f]; return [r.x + r.w, r.y + r.h, r.x, r.y]; }; // up/down turned 180°
        const rotated = c.rot.some((v) => v !== 0);
        elements.push({
          name: c.name, box_uv: false, rescale: false, locked: false, render_order: 'default', allow_mirror_modeling: true,
          from: [r4(ctr[0] - w / 2), r4(ctr[1] - h / 2), r4(ctr[2] - d / 2)],
          to: [r4(ctr[0] + w / 2), r4(ctr[1] + h / 2), r4(ctr[2] + d / 2)],
          autouv: 0, color: 0, inflate: c.inflate,
          origin: rotated ? ctr : bbVec(bp),
          ...(rotated ? { rotation: bbRot(c.rot[0], c.rot[1], c.rot[2]) } : {}),
          faces: {
            north: { uv: R(4), texture: 0 }, south: { uv: R(5), texture: 0 },
            east: { uv: R(1), texture: 0 }, west: { uv: R(0), texture: 0 },
            up: { uv: Rf(2), texture: 0 }, down: { uv: Rf(3), texture: 0 }
          },
          type: 'cube', uuid: id
        });
        (groupOf[c.bone] = groupOf[c.bone] || []).push(id);
      }
      const outlinerNode = (g) => ({
        name: g.name, origin: bbVec(abs.get(g)), rotation: bbRot(g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z),
        color: 0, uuid: g.userData.uuid, export: true, mirror_uv: false, isOpen: true, locked: false, visibility: true, autouv: 0,
        children: [...(groupOf[g.name] || []), ...g.children.filter((ch) => ch.isGroup).map(outlinerNode)]
      });
      const animations = ANIM_ORDER.map(bakeAnimation); // own sims; the live view is re-posed on its next frame
      return {
        meta: { format_version: '4.5', model_format: 'free', box_uv: false },
        name: 'crowned_traveler', model_identifier: 'crowned_traveler',
        visible_box: [2, 2.5, 1], variable_placeholders: '', variable_placeholder_buttons: [],
        resolution: { width: ATLAS_W, height: ATLAS_H },
        elements, outliner: [outlinerNode(root)],
        textures: [{
          path: '', name: 'crowned_traveler.png', folder: 'entity', namespace: '', id: '0', particle: false,
          render_mode: 'default', render_sides: 'auto', frame_time: 1, frame_order_type: 'loop', frame_order: '',
          frame_interpolate: false, visible: true, internal: true, saved: false, uuid: uuid(),
          source: atlas.toDataURL('image/png')
        }],
        animations
      };
    }

    /* ───────── UI ───────── */
    let sim = makeSim((Math.random() * 1e9) | 0);

    const dotsEl = document.getElementById('dots');
    VARIANTS.forEach((v, i) => {
      const d = document.createElement('button');
      d.className = 'dot';
      d.title = `${v.name} colors`;
      d.style.background = (v.pal.shirtBase || BASE.shirtBase);
      d.addEventListener('click', () => setVariant(i));
      dotsEl.appendChild(d);
    });

    const animBtns = document.querySelectorAll('.anim-btn');
    const markAnim = (name) => animBtns.forEach((b) => b.classList.toggle('active', b.dataset.anim === name));
    let chosenAnim = 'idle';                       // what the user picked (the random dance returns to it)
    function selectAnim(name) {
      chosenAnim = name; autoDance.on = false;
      switchAnim(sim, name);
      markAnim(name);
    }
    animBtns.forEach((b) => b.addEventListener('click', () => selectAnim(b.dataset.anim)));

    /* ───────── Random dance ─────────
       From Idle / Idle 2 he sometimes does the dance once by himself, then goes back. */
    const autoDance = { on: false, t: 0, wait: 15 + Math.random() * 20 };
    function updateAutoDance(dt) {
      if (autoDance.on) {
        autoDance.t += dt;
        // Leave 0.35 s before the end: the crossfade back runs while he stands up.
        if (autoDance.t >= ANIMS.dance.T - 0.35) { autoDance.on = false; autoDance.wait = 25 + Math.random() * 35; switchAnim(sim, chosenAnim); markAnim(chosenAnim); }
      } else if ((chosenAnim === 'idle' || chosenAnim === 'idle2') && !voice.playing) {
        autoDance.wait -= dt;
        if (autoDance.wait <= 0) { autoDance.on = true; autoDance.t = 0; switchAnim(sim, 'dance'); markAnim('dance'); }
      }
    }

    /* ───────── Voice lines + lip sync ─────────
       Sounds live in /sounds/the_king/. The mouth follows a loudness curve made from each file beforehand
       (30 values per second, made with tools/lipsync.html): live audio analysis does not work on file:// pages.
       env: loudness 0-35 (base 36 digit), zcr: brightness 0-9 (low = round "o", high = wide "ee"). */
    const VOICE_LINES = [
      { id: 'cussing_short', src: '../../sounds/the_king/cussingshort',
        env: '77ajtwpkrzzzxvspjb4332222222', zcr: '5507868951345432105555555555' },
      { id: 'cussing_long', src: '../../sounds/the_king/cussing_long_final',
        env: '3323bowqc7hvxl89krmhnpg9htwpd6fuzrd8ef838ityzzzsjc7433211000', zcr: '555593331543234354343322343445911001412522222220345555555555' },
      { id: 'take_your_stuff', src: '../../sounds/the_king/take_ur_stuff_and_get_out_of_my_seat_please_final',
        env: '2466cnrne9ciigea66izzzzvf78abbdgfhotutojifekle878ckttnga7545bhkoqqolhedcbcghe843', zcr: '55557123244337975573333215340024333533221222318555356542555530356753422211122555' }
    ];
    // vol: 0.35 by default (user wish: 65% quieter than the raw files); the dock slider changes it.
    const voice = { on: true, unlocked: false, playing: null, last: -1, wait: 4 + Math.random() * 6, vol: 0.35 };
    try { const s = localStorage.getItem('theking.voiceVol'); if (s !== null && isFinite(+s)) voice.vol = clamp(+s, 0, 1); } catch (e) { /* storage blocked: keep the default */ }
    // Every sound exists as .ogg (also used by the mod) and .mp3 (for browsers without Ogg Vorbis).
    const AUDIO_EXT = new Audio().canPlayType('audio/ogg; codecs="vorbis"') ? '.ogg' : '.mp3';
    VOICE_LINES.forEach((v) => { v.audio = new Audio(v.src + AUDIO_EXT); v.audio.preload = 'auto'; v.audio.volume = voice.vol; v.audio.addEventListener('ended', () => endLine(v)); });
    function endLine(v) { if (voice.playing === v) { voice.playing = null; voice.wait = 9 + Math.random() * 14; } }
    function sayLine() {
      if (voice.playing) return;
      let i = Math.floor(Math.random() * VOICE_LINES.length);
      if (i === voice.last) i = (i + 1) % VOICE_LINES.length;           // never the same line twice in a row
      const v = VOICE_LINES[i];
      voice.last = i;
      v.audio.currentTime = 0;
      v.audio.play().then(() => { voice.playing = v; }).catch(() => {}); // blocked until the first click / key
    }
    function stopLine() { if (voice.playing) { voice.playing.audio.pause(); endLine(voice.playing); } }
    // Feed the mouth from the playing line; random lines when voice is on (browsers allow sound only after a click).
    function updateVoice(dt) {
      const v = voice.playing, T = sim.talk;
      if (v) {
        const i = Math.min(v.env.length - 1, Math.floor(v.audio.currentTime * 30));
        T.active = true;
        T.level = Math.min(1, parseInt(v.env[i], 36) / 35 * 1.1);
        T.shape = +v.zcr[i] / 9;
      } else T.active = false;
      if (voice.on && voice.unlocked && !v && !autoDance.on && sim.anim !== 'dance') {
        voice.wait -= dt;
        if (voice.wait <= 0) sayLine();
      }
    }
    const unlock = () => { voice.unlocked = true; };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);

    /* ───────── Dance music ─────────
       sounds/the_king/backgroundmusic = the reference video's sound from 14.0 to 19.0 s, the same 5 s the
       dance copies. It plays while the dance runs, kept on the dance clock (sim.t): it starts with the dance,
       jumps back on each loop and leads the dance clock (small drift is eased away). It fades out when the dance ends.
       The speaker button mutes it too; like all sound it waits for the first click / key. */
    const MUSIC_VOL = 0.45;
    const music = { audio: new Audio(), w: 0 };
    music.audio.src = '../../sounds/the_king/backgroundmusic' + AUDIO_EXT;
    music.audio.preload = 'auto';
    music.audio.volume = 0;
    function updateMusic(dt) {
      const A = music.audio;
      const on = sim.anim === 'dance' && voice.on && voice.unlocked;
      if (on) {
        const len = Math.min(A.duration || 99, ANIMS.dance.T); // Chrome can misread the .ogg length (6.5 s instead of 5.0)
        if (A.paused && sim.t < len - 0.1) { A.currentTime = sim.t; A.play().catch(() => {}); }
        else if (!A.paused) {
          // The music is the master clock: small drift -> the dance clock eases onto it; big jump (loop) -> seek.
          const d = A.currentTime - sim.t;
          if (Math.abs(d) > 0.15) { if (sim.t < len - 0.1) A.currentTime = sim.t; }
          else sim.t = clamp(sim.t + d * filt(dt, 3), 0, ANIMS.dance.T - 1e-3);
        }
      }
      music.w += ((on ? 1 : 0) - music.w) * filt(dt, on ? 25 : 6); // quick fade in, softer fade out
      A.volume = clamp(music.w * MUSIC_VOL, 0, 1);
      if (!on && music.w < 0.01 && !A.paused) A.pause();
    }

    const voiceBtn = document.getElementById('voiceBtn');
    const voiceVol = document.getElementById('voiceVol');
    voiceBtn.addEventListener('click', () => {
      voice.on = !voice.on;
      if (!voice.on) stopLine();
      voiceBtn.classList.toggle('on', voice.on);
      voiceBtn.setAttribute('aria-pressed', String(voice.on));
      voiceVol.disabled = !voice.on;
    });
    // Voice volume slider: sets all lines at once and remembers it in this browser.
    function setVoiceVol(v) {
      voice.vol = clamp(v, 0, 1);
      VOICE_LINES.forEach((l) => { l.audio.volume = voice.vol; });
      voiceVol.value = String(Math.round(voice.vol * 100));
      voiceVol.title = `Voice lines volume: ${voiceVol.value}%`;
    }
    setVoiceVol(voice.vol);
    voiceVol.addEventListener('input', () => {
      setVoiceVol(+voiceVol.value / 100);
      try { localStorage.setItem('theking.voiceVol', String(voice.vol)); } catch (e) { /* storage blocked: fine */ }
    });

    const followBtn = document.getElementById('followBtn');
    followBtn.addEventListener('click', () => {
      sim.follow.on = !sim.follow.on;
      followBtn.classList.toggle('on', sim.follow.on);
      followBtn.setAttribute('aria-pressed', String(sim.follow.on));
    });

    let resetting = false;
    document.getElementById('resetBtn').addEventListener('click', () => { resetting = true; });


    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return; // the volume slider keeps the number keys
      const i = ['1', '2', '3', '4', '5', '6', '7'].indexOf(e.key);
      if (i >= 0) selectAnim(ANIM_ORDER[i]);
      if (e.key === 'v' || e.key === 'V') { voice.unlocked = true; sayLine(); }
      if (e.key === 'r' || e.key === 'R') resetting = true;
      if (e.key === 'b' || e.key === 'B') toggleBones();
    });

    /* ───────── Rig overlay ("Show bones" button, key B) ─────────
       Same block in every mob. A dot on every bone pivot (yellow) and a line to its parent
       (cyan), drawn on top of the model. Buffers are made once; update() only rewrites them. */
    const rigView = (() => {
      const list = boneList.filter((b) => b.name !== 'root');
      const linePos = new Float32Array(list.length * 6), dotPos = new Float32Array(list.length * 3);
      const lineGeo = new THREE.BufferGeometry(), dotGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
      dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
      const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x67e8f9, depthTest: false, transparent: true, opacity: 0.9 }));
      const dots = new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0xfacc15, size: 6, sizeAttenuation: false, depthTest: false, transparent: true }));
      for (const o of [lines, dots]) { o.renderOrder = 999; o.frustumCulled = false; o.visible = false; scene.add(o); }
      const a = new THREE.Vector3(), b = new THREE.Vector3();
      return {
        on: false,
        set(on) { this.on = on; lines.visible = dots.visible = on; if (on) this.update(); },
        update() {
          mobRoot.updateMatrixWorld(true);
          list.forEach((g, i) => {
            g.getWorldPosition(a);
            (g.parent.isGroup && g.parent !== mobRoot ? g.parent : g).getWorldPosition(b);
            const j = i * 6, k = i * 3; // plain writes: no new arrays per frame
            linePos[j] = b.x; linePos[j + 1] = b.y; linePos[j + 2] = b.z;
            linePos[j + 3] = a.x; linePos[j + 4] = a.y; linePos[j + 5] = a.z;
            dotPos[k] = a.x; dotPos[k + 1] = a.y; dotPos[k + 2] = a.z;
          });
          lineGeo.attributes.position.needsUpdate = true;
          dotGeo.attributes.position.needsUpdate = true;
        }
      };
    })();
    const bonesBtn = document.getElementById('bonesBtn');
    function toggleBones() {
      rigView.set(!rigView.on);
      bonesBtn.classList.toggle('on', rigView.on);
      bonesBtn.setAttribute('aria-pressed', String(rigView.on));
    }
    bonesBtn.addEventListener('click', toggleBones);

    window.addEventListener('pointermove', (e) => {
      sim.follow.mx = (e.clientX / window.innerWidth) * 2 - 1;
      sim.follow.my = -(e.clientY / window.innerHeight) * 2 + 1;
      sim.follow.has = true;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Camera follow for animations that move the whole mob (root motion, e.g. the dropkick leap):
    // camera, orbit target and shadow light glide along with the root on x/z. k = 1: jump there at once.
    const camOff = new THREE.Vector3(), camWant = new THREE.Vector3();
    function followRoot(k) {
      if (ANIMS[sim.anim].rootMotion) camWant.set(root.position.x, 0, root.position.z); else camWant.set(0, 0, 0);
      vA.copy(camWant).sub(camOff).multiplyScalar(k);
      camOff.add(vA);
      camera.position.add(vA); controls.target.add(vA);
      keyLight.position.add(vA); keyLight.target.position.add(vA);
    }

    /* ───────── Loop: 120 FPS when the screen can, else 60 ─────────       The first ~30 frames measure the screen refresh; >= 110 Hz -> lock to 120, else 60.
       All motion uses delta time, so speed is the same at both rates. */
    let targetHz = 60, measuring = true, lastNow = 0, lastRender = 0;
    const intervals = [];

    function frame(now) {
      requestAnimationFrame(frame);
      if (measuring) {
        if (lastNow) intervals.push(now - lastNow);
        lastNow = now;
        if (intervals.length >= 30) {
          const sorted = intervals.slice().sort((a, b) => a - b);
          targetHz = 1000 / sorted[15] >= 110 ? 120 : 60;
          measuring = false;
        }
      } else {
        const interval = 1000 / targetHz;
        if (now < lastRender + interval - 1) return;           // skip frames above the lock rate
      }
      const dt = lastRender ? Math.min((now - lastRender) / 1000, 0.1) : 1 / 60;
      lastRender = measuring ? now : Math.max(lastRender + 1000 / targetHz, now - 1000 / targetHz);

      updateAutoDance(dt);
      updateVoice(dt);
      updateMusic(dt);
      step(sim, dt);

      followRoot(filt(dt, 3));
      if (resetting) {
        const k = filt(dt, 8);
        vB.copy(CAM_POS).add(camOff); vC.copy(CAM_TARGET).add(camOff); // reset relative to the followed root
        camera.position.lerp(vB, k);
        controls.target.lerp(vC, k);
        if (camera.position.distanceTo(vB) < 0.005 && controls.target.distanceTo(vC) < 0.005) resetting = false;
      }
      controls.dampingFactor = filt(dt, 4.5); // same feel at 60 and 120 FPS
      controls.update();
      if (rigView.on) rigView.update();
      renderer.render(scene, camera);
    }

    setVariant(0);

    /* ───────── Self-tests ─────────
       #cliptest  clipping, ground and export check (results in <pre id="cliptest">)
       #shot-<anim>-<variant>-<sec>  one rendered frame as a PNG data URL in <pre id="shot">
       #rest      the rest pose, to compare pixel by pixel with archive/the_king/thekingv2.html */
    function restPose() {
      boneList.forEach((g) => { g.rotation.copy(new THREE.Euler(g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z, 'ZYX')); g.position.copy(g.userData.rest); g.scale.set(1, 1, 1); });
    }

    /* Clipping check from the rules: per frame, a 5x5 grid on every face of part A is moved into
       part B's space; points deeper than 0.06 texel inside B count. Every animation is tested with the
       mouse at the center, the edges and the corners. v2 parts that already overlap at rest (hair on the
       shoulders, bandana around the chin, ...) only count when they go 0.15 texel deeper than at rest.
       Joints (hip, knee, shoe-on-shin, elbow, shoulder, neck) are reported apart: the thinner part bends inside the thicker one. */
    function clipTest() {
      const meshes = cubeList.map((c) => c.mesh);
      const inv = meshes.map(() => new THREE.Matrix4());
      const half = cubeList.map((c) => c.size.map((s) => (Math.abs(s) / 2 + c.inflate) * TEXEL));
      const pts = cubeList.map((c, i) => {
        const [hx, hy, hz] = half[i], list = [];
        for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++) {
          const u = -1 + a * 0.5, v = -1 + b * 0.5;
          list.push([hx, u * hy, v * hz], [-hx, u * hy, v * hz], [u * hx, hy, v * hz], [u * hx, -hy, v * hz], [u * hx, v * hy, hz], [u * hx, v * hy, -hz]);
        }
        return list.map((p) => new THREE.Vector3(...p));
      });
      const radius = half.map((h) => Math.hypot(h[0], h[1], h[2]) * 2.2); // 2.2: room for mouth/lid scale
      const centers = meshes.map(() => new THREE.Vector3());
      const EPS = 0.06, LAYER = 0.15;
      const wp = new THREE.Vector3(), lp = new THREE.Vector3();
      function depthInside(j, p) {
        const [hx, hy, hz] = half[j];
        const dx = hx - Math.abs(p.x), dy = hy - Math.abs(p.y), dz = hz - Math.abs(p.z);
        if (dx <= 0 || dy <= 0 || dz <= 0) return 0;
        const sh = cubeList[j].shell;
        if (!sh) return Math.min(dx, dy, dz);
        const d = Math.min(dx, dz); // shells are hollow: only the side walls count, within their band
        return d < sh.band * TEXEL ? d : 0;
      }
      function measure() {
        mobRoot.updateMatrixWorld(true);
        meshes.forEach((m, i) => { inv[i].copy(m.matrixWorld).invert(); centers[i].setFromMatrixPosition(m.matrixWorld); });
        const res = new Map();
        for (let i = 0; i < meshes.length; i++) for (let j = 0; j < meshes.length; j++) {
          if (i === j || cubeList[i].bone === cubeList[j].bone) continue;
          if (centers[i].distanceTo(centers[j]) > radius[i] + radius[j]) continue; // too far apart to touch
          let worst = 0;
          for (const p of pts[i]) {
            wp.copy(p).applyMatrix4(meshes[i].matrixWorld);
            lp.copy(wp).applyMatrix4(inv[j]);
            const d = depthInside(j, lp);
            if (d > worst) worst = d;
          }
          if (worst > 0) res.set(i + ':' + j, worst / TEXEL);
        }
        return res;
      }
      const JOINTS = [[/^thigh_/, /^torso_shirt$/], [/^calf_/, /^thigh_/], [/^shoe_/, /^calf_/], [/^lower_arm_/, /^(upper_arm_|sleeve_cuff_)/],
        [/^(upper_arm_|sleeve_cuff_)/, /^torso_shirt$/], [/^neck_column$/, /^(torso_shirt|head_cranium)$/]];
      const isJoint = (a, b) => JOINTS.some(([x, y]) => (x.test(a) && y.test(b)) || (x.test(b) && y.test(a)));
      // v2 hair already sits inside the head, crown and shoulders at rest (see layeredAtRest). The parts that
      // move stay inside the hair volume, so this is reported apart as "modelContact", not hidden.
      const HAIR = /^hair_/, HAIR_ON = /^(head_cranium|paper_crown|hair_|sleeve_cuff_|upper_arm_)/;
      const isModelContact = (a, b) => (HAIR.test(a) && HAIR_ON.test(b)) || (HAIR.test(b) && HAIR_ON.test(a));

      restPose();
      const baseline = measure();
      const report = {
        cubes: cubeList.length, bones: NB, atlas: [ATLAS_W, ATLAS_H],
        clips: {}, joints: {}, modelContact: {}, ground: {},
        layeredAtRest: [...baseline].filter(([, d]) => d > EPS).map(([k, d]) => k.split(':').map((i) => cubeList[i].name).join(' / ') + ' ' + d.toFixed(2))
      };
      const shoes = cubeList; // every box: lying poses touch the ground with anything
      const corner = new THREE.Vector3();
      const mice = [[0, 0], [-0.95, 0], [0.95, 0], [0, 0.95], [0, -0.95], [-0.95, 0.95], [0.95, 0.95], [-0.95, -0.95], [0.95, -0.95]];
      for (const name of ANIM_ORDER) {
        let low = 99, lowT = 0, lowPart = '', lift = 0, liftT = 0;
        for (const [mi, [mx, my]] of mice.entries()) {
          const S = makeSim(99);
          // Every second run talks, mouth over its full range (open + jaw drop + shapes).
          const talk = (t) => { if (mi % 2) Object.assign(S.talk, { active: true, level: 0.5 + 0.5 * Math.sin(TAU * 3.7 * t), shape: 0.5 + 0.5 * Math.sin(TAU * 1.3 * t) }); };
          S.anim = name;
          Object.assign(S.follow, { on: true, has: true, mx, my });
          const dt = 1 / 120;
          for (let t = 0; t < ANIMS[name].T; t += dt) { talk(t); step(S, dt); } // warm up
          let since = 0;
          for (let t = 0; t < ANIMS[name].T * 2; t += dt) {
            talk(t); step(S, dt);
            since += dt;
            if (S.groundLift > lift) { lift = S.groundLift; liftT = S.t; }
            if (since < 1 / 20) continue;
            since = 0;
            for (const [key, d] of measure()) {
              const base = baseline.get(key) || 0;
              const [i, j] = key.split(':').map(Number);
              const a = cubeList[i].name, b = cubeList[j].name;
              const joint = isJoint(a, b), contact = !joint && isModelContact(a, b);
              if (!joint && d <= (base > EPS ? base + LAYER : EPS)) continue;
              if (joint && d <= base + EPS) continue;
              const bucket = joint ? report.joints : contact ? report.modelContact : report.clips;
              const id = `${a} in ${b}`;
              if (!bucket[id] || bucket[id].depth < d) bucket[id] = { depth: +d.toFixed(3), rest: +base.toFixed(3), anim: name, mouse: [mx, my], t: +S.t.toFixed(2) };
            }
            // Lowest corner of any box (texels above the ground; below 0 = in the ground).
            for (const c of shoes) {
              const [hx, hy, hz] = half[cubeList.indexOf(c)];
              for (let k = 0; k < 8; k++) {
                corner.set(k & 1 ? hx : -hx, k & 2 ? hy : -hy, k & 4 ? hz : -hz).applyMatrix4(c.mesh.matrixWorld);
                if (corner.y / TEXEL < low) { low = corner.y / TEXEL; lowT = S.t; lowPart = c.name; }
              }
            }
          }
        }
        report.ground[name] = +low.toFixed(3);
        report.groundAt = report.groundAt || {}; report.groundAt[name] = [+lowT.toFixed(2), lowPart]; // when + which part was lowest
        // Biggest automatic lift (texels) by the ground clamp in step(): big = the pose itself sinks, fix the keys.
        report.groundLift = report.groundLift || {}; report.groundLift[name] = [+lift.toFixed(2), +liftT.toFixed(2)];
      }
      // Export sanity: every face UV inside the atlas, cube count, keyframe count.
      const bb = buildBBModel();
      const badUV = bb.elements.filter((e) => Object.values(e.faces).some((f) => f.uv.some((v, k) => v < 0 || v > (k % 2 ? ATLAS_H : ATLAS_W)))).map((e) => e.name);
      report.export = {
        elements: bb.elements.length, badUV,
        animations: bb.animations.map((a) => ({ name: a.name, bones: Object.keys(a.animators).length, keyframes: Object.values(a.animators).reduce((n, x) => n + x.keyframes.length, 0) })),
        bytes: JSON.stringify(bb).length
      };
      const out = document.createElement('pre');
      out.id = 'cliptest';
      out.textContent = JSON.stringify(report, null, 1);
      document.body.appendChild(out);
      const bbOut = document.createElement('textarea');
      bbOut.id = 'bbout';
      bbOut.textContent = JSON.stringify(bb);
      document.body.appendChild(bbOut);
    }

    function dumpFrame() {
      controls.update();
      renderer.render(scene, camera);
      const out = document.createElement('pre');
      out.id = 'shot';
      out.textContent = canvas.toDataURL('image/png');
      document.body.appendChild(out);
    }

    // One frame of an animation (mouse a bit up-right), for checking renders.
    // Optional 5th part: talk loudness 0-1 (#shot-idle-0-2-0.9), to check the lip-sync mouth.
    function shot(anim, variant, secs, talk) {
      setVariant(variant);
      sim.anim = anim;
      Object.assign(sim.follow, { has: true, mx: 0.35, my: 0.25 });
      if (talk) Object.assign(sim.talk, { active: true, level: talk, shape: 0.5 });
      for (let t = 0; t < secs; t += 1 / 60) step(sim, 1 / 60);
      dumpFrame();
    }

    // Filmstrip: #strip-<anim>-<variant>-<from>-<to>-<step> renders frames (seconds) side by side as one JPEG
    // data URL in <pre id="shot">, to compare an animation with the reference video frame by frame.
    // Optional 7th part: camera turn in degrees around the model (90 = from his left side).
    function strip(anim, variant, from, to, stepS, camDeg) {
      setVariant(variant);
      if (camDeg) { const a = camDeg * Math.PI / 180, r = Math.hypot(CAM_POS.x - CAM_TARGET.x, CAM_POS.z - CAM_TARGET.z); camera.position.set(CAM_TARGET.x + r * Math.sin(a), CAM_POS.y, CAM_TARGET.z + r * Math.cos(a)); }
      sim.anim = anim;
      Object.assign(sim.follow, { on: false, has: false });
      const n = Math.round((to - from) / stepS) + 1, W = 160, H = 240;
      const sheet = document.createElement('canvas');
      sheet.width = W * n; sheet.height = H;
      const g = sheet.getContext('2d');
      let t = 0;
      for (let k = 0; k < n; k++) {
        const want = from + k * stepS;
        while (t < want - 1e-6) { const d = Math.min(1 / 120, want - t); step(sim, d); t += d; }
        followRoot(1);
        controls.update();
        renderer.render(scene, camera);
        const s = Math.min(canvas.width / W, canvas.height / H); // crop the middle of the view
        g.drawImage(canvas, (canvas.width - W * s) / 2, (canvas.height - H * s) / 2, W * s, H * s, k * W, 0, W, H);
        g.fillStyle = '#ff0'; g.font = '14px monospace'; g.fillText(want.toFixed(1), k * W + 4, 16);
      }
      const out = document.createElement('pre');
      out.id = 'shot';
      out.textContent = sheet.toDataURL('image/jpeg', 0.8);
      document.body.appendChild(out);
    }

    /* ───────── Mod export (#modexport) ─────────
       Everything the NeoForge mod needs to show the King 1:1, read by tools/export_mod_assets.ps1:
       bones (rest pose), cubes as finished quads (exact UVs of this atlas), ground-check boxes, springs,
       textures per color variant, voice-line lip-sync curves and every animation baked at 60 fps.
       Units: texels, radians. Axes like here: +x = his left, +y = up, +z = his front. UV v goes down (Minecraft). */
    const BAKE_FPS = 120; // 120 fps: the fast attack curves come back within 0.002 rad
    function modExport() {
      const r6 = (n) => Math.round(n * 1e6) / 1e6 || 0;
      const bonesOut = boneList.map((g) => ({
        name: g.name, parent: g.parent.isGroup && B[g.parent.name] !== undefined ? B[g.parent.name] : -1,
        pos: [g.userData.rest.x, g.userData.rest.y, g.userData.rest.z].map((v) => r6(v / TEXEL)),
        rot: [g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z].map(r6)
      }));
      const v3 = new THREE.Vector3(), n3 = new THREE.Vector3(), nm = new THREE.Matrix3();
      const cubesOut = cubeList.map((c) => {
        const m = c.mesh;
        m.updateMatrix();
        nm.getNormalMatrix(m.matrix);
        const geo = m.geometry, P = geo.attributes.position, U = geo.attributes.uv, N = geo.attributes.normal, I = geo.index.array;
        const quads = [];
        for (let f = 0; f < 6; f++) {
          const ids = [I[f * 6], I[f * 6 + 1], I[f * 6 + 4], I[f * 6 + 2]]; // BoxGeometry quad a, b, c, d (counter-clockwise from outside)
          const vs = ids.map((i) => v3.fromBufferAttribute(P, i).applyMatrix4(m.matrix).divideScalar(TEXEL).toArray().map(r6));
          const e1 = new THREE.Vector3(...vs[1]).sub(new THREE.Vector3(...vs[0])), e2 = new THREE.Vector3(...vs[3]).sub(new THREE.Vector3(...vs[0]));
          if (e1.cross(e2).length() < 1e-6) continue; // the zero-width sides of a face plane
          n3.fromBufferAttribute(N, ids[0]).applyMatrix3(nm).normalize();
          quads.push({ v: vs, uv: ids.map((i) => [r6(U.getX(i)), r6(1 - U.getY(i))]), n: n3.toArray().map(r6) });
        }
        const h = c.size.map((s) => r6(Math.abs(s) / 2 + c.inflate));
        return { name: c.name, bone: B[c.bone], twoSided: m.material.alphaTest > 0, quads,
          box: { c: m.position.toArray().map((v) => r6(v / TEXEL)), r: [m.rotation.x, m.rotation.y, m.rotation.z].map(r6), h } };
      });
      // Animations: the raw anim pose (before crossfade, follow, face filter, springs) sampled at 60 fps, T included.
      const anims = {}, chunks = [];
      let offset = 0;
      for (const name of ANIM_ORDER) {
        const A = ANIMS[name], frames = Math.round(A.T * BAKE_FPS) + 1;
        // The mod samples frame f at f / BAKE_FPS: a length that is not a whole number of frames loses its last bit.
        if (Math.abs(A.T * BAKE_FPS - Math.round(A.T * BAKE_FPS)) > 1e-6) throw new Error(`${name}: T ${A.T} s is not a whole number of 1/${BAKE_FPS} s frames`);
        const Q = makePose(), cols = new Map();
        const put = (key, f, v) => { if (!cols.has(key)) cols.set(key, new Float64Array(frames)); cols.get(key)[f] = v; };
        for (let f = 0; f < frames; f++) {
          const t = Math.min(f / BAKE_FPS, A.T);
          clearPose(Q); Q.yawLimit = A.yawLimit; Q.follow = A.follow ?? 1;
          A.fn(t, Q);
          for (let b = 0; b < NB; b++) for (let k = 0; k < 3; k++) {
            put(`r:${b}:${k}`, f, Q.r[b * 3 + k]);
            put(`p:${b}:${k}`, f, Q.p[b * 3 + k]);
          }
          for (const k of FACE_KEYS) put(`f:${k}`, f, Q.f[k]);
          put('follow', f, Q.follow);
          if (A.rootMotion) { put('rm:z', f, mc(t, A.rootMotion.z)); put('rm:y', f, mc(t, A.rootMotion.y)); }
        }
        const channels = [];
        for (const [key, arr] of cols) {
          let lo = Infinity, hi = -Infinity;
          for (const v of arr) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
          const keep = key.startsWith('f:') || key === 'follow' || key.startsWith('rm:') || hi - lo > 1e-7 || Math.abs(lo) > 1e-7;
          if (!keep) continue;
          // 16-bit steps between lo and hi, stored as differences from the previous frame (small numbers pack well).
          const q = new Int16Array(frames), span = hi - lo;
          let prev = 0;
          for (let f = 0; f < frames; f++) {
            const level = span > 0 ? Math.round((arr[f] - lo) / span * 65535) - 32768 : -32768;
            q[f] = level - prev; prev = level;
          }
          chunks.push(q);
          channels.push({ key, lo, hi, at: offset }); // exact lo/hi: the 16-bit levels map back without drift
          offset += frames;
        }
        anims[name] = { T: A.T, frames, yawLimit: A.yawLimit, loopFade: !!A.loopFade, events: A.events || {}, rootMotion: !!A.rootMotion, channels };
      }
      const all = new Int16Array(offset);
      let at = 0;
      for (const q of chunks) { all.set(q, at); at += q.length; }
      const bytes = new Uint8Array(all.length * 2), dv = new DataView(bytes.buffer);
      all.forEach((v, i) => dv.setInt16(i * 2, v, false)); // big-endian (Java DataInputStream)
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      const textures = {};
      const keep = variantIndex;
      VARIANTS.forEach((v, i) => { setVariant(i); textures[v.id] = atlas.toDataURL('image/png'); });
      setVariant(keep);
      return {
        rig: {
          format: 1, fps: BAKE_FPS, atlas: [ATLAS_W, ATLAS_H], variants: VARIANTS.map((v) => v.id), animOrder: ANIM_ORDER,
          bones: bonesOut, cubes: cubesOut,
          springs: SPRINGS.map((s) => ({ ...s, bone: B[s.bone] })),
          consts: { pitchUp: PITCH_UP, pitchDown: PITCH_DOWN, gravity: GRAVITY },
          voice: VOICE_LINES.map((v) => ({ id: v.id, env: v.env, zcr: v.zcr })),
          anims
        },
        bin: btoa(bin), textures
      };
    }

    /* Reference recording for the mod's Java test (#modtrace): a fixed scene (seed 7, 1/120 s steps) with
       animation switches, talking and look angles; every bone's rotation, position (texels) and scale every 1/30 s. */
    function modTrace() {
      const S = makeSim(7), dt = 1 / 120, out = [];
      const plan = [[0, 'idle'], [3, 'idle2'], [6, 'walk'], [8, 'dance'], [11, 'attack'], [14.6, 'attack2'], [15.8, 'run'], [18.2, 'idle']];
      const end = 19.7; // seconds recorded (the Java test reads it)
      S.follow.on = true; S.follow.has = true; S.follow.inject = { yaw: 0, pitch: 0 };
      let p = 0, next = 0;
      for (let i = 0; i <= end * 120; i++) {
        const t = i * dt;
        while (p < plan.length && t >= plan[p][0] - 1e-9) { switchAnim(S, plan[p][1]); p++; }
        S.follow.inject.yaw = 0.6 * Math.sin(0.7 * t); S.follow.inject.pitch = 0.1 * Math.sin(0.5 * t);
        const talking = t >= 1 && t < 2.5;
        Object.assign(S.talk, { active: talking, level: talking ? 0.5 + 0.5 * Math.sin(TAU * 3 * t) : 0, shape: 0.5 + 0.5 * Math.sin(TAU * t) });
        step(S, dt);
        if (t >= next - 1e-9) {
          next += 1 / 30;
          out.push(boneList.map((g) => [g.rotation.x, g.rotation.y, g.rotation.z, g.position.x / TEXEL, g.position.y / TEXEL, g.position.z / TEXEL, g.scale.x, g.scale.y, g.scale.z].map((v) => Math.round(v * 1e5) / 1e5)));
        }
      }
      return { dt, every: 1 / 30, end, plan, frames: out };
    }

    window.kingDebug = { cubeList, bones, boneList, atlas, voice, VOICE_LINES, music, ANIMS, makeSim, step, rigView, toggleBones, get sim() { return sim; } }; // for the self-tests (DevTools)
    const dumpJson = (id, obj) => { const pre = document.createElement('pre'); pre.id = id; pre.textContent = JSON.stringify(obj); document.body.appendChild(pre); };
    if (location.hash === '#cliptest') clipTest();
    else if (location.hash === '#modexport') dumpJson('modexport', modExport());
    else if (location.hash === '#modtrace') dumpJson('modtrace', modTrace());
    else if (location.hash.startsWith('#strip')) { const [, a, v, f, to, st, cd] = location.hash.split('-'); strip(a, +v, +f, +to, +st, +(cd || 0)); }
    else if (location.hash === '#rest') { restPose(); dumpFrame(); }
    else if (location.hash.startsWith('#shot')) { const [, a, v, s, tk] = location.hash.split('-'); shot(a, +v, +s, +(tk || 0)); }
    else requestAnimationFrame(frame);
  </script>
</body>

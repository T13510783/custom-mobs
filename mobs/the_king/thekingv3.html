<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The King v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!--
    The King v3
    - Model: archive/the_king/thekingv2.html (same cubes, pivots, rest rotations and pixel textures).
      Changes: brows, eyes and mouth are thin planes on the same pixels, so they can move; pupils rest
      centered (v2 looked cross-eyed); the bandana tip is a thin pointed flap on the same bone as the fold.
    - Animations, face system, springs, UI and self-tests: TheKing v1. Dance (key 4): reference video 0:15-0:19.
    - Voice lines: sounds/the_king/, mouth synced (see VOICE_LINES).
  -->

  <style>
    /* ───────── Tokens ───────── */
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --pill: rgba(20, 23, 30, 0.82);
      --line: rgba(255, 255, 255, 0.09);
      --text: rgba(255, 255, 255, 0.62);
      --text-hi: #ffffff;
      --accent: #f59e0b;
      --accent-bg: rgba(217, 119, 6, 0.24);
      --accent-text: #fef3c7;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ───────── Page ───────── */
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text-hi); font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    #viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
    #viewport:active { cursor: grabbing; }

    /* ───────── Glass pills ───────── */
    .pill {
      background: var(--pill);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border-radius: 999px;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .icon-btn {
      height: 36px; min-width: 36px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      color: var(--text); font-size: 12px; font-weight: 500;
      transition: color .2s, background .2s, transform .2s cubic-bezier(.22, 1, .36, 1);
    }
    .icon-btn:hover { color: var(--text-hi); transform: translateY(-1px); }
    .icon-btn:active { transform: scale(.97); }
    .icon-btn svg { width: 16px; height: 16px; flex: none; }
    #resetBtn { padding: 0; width: 36px; }

    /* ───────── Top right: download + reset ───────── */
    #topRight { position: fixed; top: 16px; right: 16px; z-index: 20; display: flex; gap: 8px; }

    /* ───────── Bottom dock ───────── */
    #dock {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 4px; padding: 6px; max-width: calc(100vw - 32px);
    }
    .anim-btn {
      padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: .02em;
      color: var(--text); border: 1px solid transparent; white-space: nowrap;
      transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
    }
    .anim-btn:hover { color: var(--text-hi); }
    .anim-btn.active { color: var(--accent-text); background: var(--accent-bg); border-color: rgba(245, 158, 11, .45); box-shadow: 0 0 18px rgba(217, 119, 6, .24); }
    .anim-btn kbd { font: inherit; opacity: .45; margin-right: 6px; }
    .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
    #followBtn, #voiceBtn, #bonesBtn { width: 32px; height: 32px; min-width: 32px; padding: 0; border-radius: 999px; }
    #followBtn.on, #voiceBtn.on, #bonesBtn.on { color: var(--accent-text); background: var(--accent-bg); }
    #voiceVol { width: 60px; margin: 0 4px 0 2px; accent-color: var(--accent); cursor: pointer; }
    #voiceVol:disabled { opacity: .35; cursor: default; }
    .dot {
      width: 18px; height: 18px; border-radius: 999px; margin: 0 3px;
      border: 2px solid rgba(255, 255, 255, .18); transition: transform .2s, border-color .2s;
    }
    .dot:hover { transform: scale(1.12); }
    .dot.active { border-color: var(--accent); }


    @media (max-width: 520px) {
      .anim-btn { padding: 7px 10px; }
      .anim-btn kbd { display: none; }
      #voiceVol { width: 44px; }
    }
  </style>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <!-- Top right: camera reset -->
  <div id="topRight">
    <button id="resetBtn" class="pill icon-btn" title="Reset camera (R)" aria-label="Reset camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>


  <!-- Bottom dock: animations, follow toggle, color variants -->
  <nav id="dock" class="pill" aria-label="Viewer controls">
    <button class="anim-btn active" data-anim="idle"><kbd>1</kbd>Idle</button>
    <button class="anim-btn" data-anim="idle2"><kbd>2</kbd>Idle 2</button>
    <button class="anim-btn" data-anim="walk"><kbd>3</kbd>Walk</button>
    <button class="anim-btn" data-anim="dance"><kbd>4</kbd>Dance</button>
    <button class="anim-btn" data-anim="attack"><kbd>5</kbd>Attack</button>
    <button class="anim-btn" data-anim="attack2"><kbd>6</kbd>Attack 2</button>
    <button class="anim-btn" data-anim="run"><kbd>7</kbd>Run</button>
    <span class="sep"></span>
    <button id="followBtn" class="icon-btn on" title="Head and eyes follow the mouse" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <!-- Voice lines on/off (random lines, mouth synced). Key V = say one now. -->
    <button id="voiceBtn" class="icon-btn on" title="Voice lines on/off (V = say one now)" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
    <!-- Voice lines volume (0-100 %, default 35). Saved in this browser. -->
    <input id="voiceVol" type="range" min="0" max="100" value="35" title="Voice lines volume: 35%" aria-label="Voice lines volume">
    <!-- Show the rig: a dot on every bone pivot + a line to its parent. Key B. -->
    <button id="bonesBtn" class="icon-btn" title="Show bones (B)" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><circle cx="7" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="9" cy="20" r="1.6"/><circle cx="15" cy="20" r="1.6"/><path d="M12 6v8M12 8l-5 4M12 8l5 4M12 14l-3 6M12 14l3 6"/></svg>
    </button>
    <span class="sep"></span>
    <span id="dots"></span>
  </nav>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ───────── Renderer, scene, camera (same values as v2) ───────── */
    const canvas = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // cap: rule 14
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1115);
    scene.fog = new THREE.FogExp2(0x0f1115, 0.018);

    const TEXEL = 1 / 16; // 1 unit = 1 texel, 16 texels per block

    const CAM_POS = new THREE.Vector3(2.45, 1.72, 2.85);
    const CAM_TARGET = new THREE.Vector3(0, 1.04, 0);
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 60);
    camera.position.copy(CAM_POS);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(CAM_TARGET);
    controls.enableDamping = true;
    controls.minDistance = 1.4;
    controls.maxDistance = 7;
    controls.maxPolarAngle = Math.PI * 0.492;
    controls.update();

    /* ───────── Lights (one shadow caster) ───────── */
    scene.add(new THREE.HemisphereLight(0xffedd5, 0x161922, 0.92));
    const keyLight = new THREE.DirectionalLight(0xfff7ed, 2.35);
    keyLight.position.set(3.8, 6.2, 4.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -2.4;
    keyLight.shadow.camera.right = keyLight.shadow.camera.top = 2.4;
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.radius = 3.5;
    scene.add(keyLight, keyLight.target); // target in the scene: it moves with the camera follow below
    const rimLight = new THREE.DirectionalLight(0xfbbf24, 0.95);
    rimLight.position.set(-3.8, 3.2, -3.4);
    scene.add(rimLight);
    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.42);
    fillLight.position.set(-2.8, 1.6, 3.2);
    scene.add(fillLight);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.46 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    /* ───────── Palettes (one per color variant) ─────────
       BASE = the exact v2 colors. Variants only swap shirt, pants, bandana, hair and brows. */
    const BASE = {
      skinLight: '#f4c7b0', skinBase: '#e5af95', skinWarm: '#d6977b', skinRosy: '#d98473', skinShadow: '#b8765c',
      eyeWhite: '#f8fafc', eyePupil: '#1c140d', browHair: '#6e5038', lipLine: '#7c3f34', lidSkin: '#cd8a6e',
      hairDark: '#3d281a', hairBase: '#593d28', hairWarm: '#735138', hairHighlight: '#8f684b', hairGolden: '#a67c5b',
      crownGoldLight: '#fef08a', crownGold: '#facc15', crownGoldWarm: '#eab308', crownGoldShadow: '#ca8a04',
      crownLogoRed: '#dc2626', crownLogoOrange: '#f59e0b', crownLogoWhite: '#ffffff', crownJewel: '#a16207',
      bandanaDark: '#7f1d1d', bandanaRed: '#b91c1c', bandanaBright: '#dc2626', bandanaPaisley: '#fca5a5', bandanaWhite: '#fee2e2',
      shirtLight: '#fce7f3', shirtBase: '#f9d5e5', shirtFold: '#eebec2', shirtShadow: '#dc9fa6', shirtButton: '#ffffff',
      badgeGreen: '#86efac', badgeGrey: '#cbd5e1',
      phoneBlack: '#0f172a', phoneEdge: '#334155', phoneLens: '#020617',
      beltLeather: '#451a03', beltWarm: '#652b0d', beltBuckle: '#e2e8f0',
      khakiLight: '#dcd3c2', khakiBase: '#cfc3ae', khakiFold: '#b8aa93', khakiShadow: '#9c8d76',
      shoeDark: '#29150c', shoeBrown: '#432314', shoeHighlight: '#5c331e', shoeSole: '#170d08'
    };
    const VARIANTS = [
      { id: 'classic', name: 'Classic', pal: {} },
      { id: 'mint', name: 'Mint', pal: {
        shirtLight: '#e3fbef', shirtBase: '#c3f0da', shirtFold: '#9edcc0', shirtShadow: '#78c4a3',
        khakiLight: '#cbd5e1', khakiBase: '#a9b5c6', khakiFold: '#8b98ad', khakiShadow: '#6b7890',
        bandanaDark: '#7c2d12', bandanaRed: '#c2410c', bandanaBright: '#ea580c', bandanaPaisley: '#fdba74', bandanaWhite: '#ffedd5',
        hairDark: '#1f140d', hairBase: '#2f2016', hairWarm: '#3f2b1e', hairHighlight: '#553b28', hairGolden: '#664833',
        browHair: '#2f2016'
      } },
      { id: 'royal', name: 'Royal', pal: {
        shirtLight: '#f1edff', shirtBase: '#ddd6fe', shirtFold: '#c4b5fd', shirtShadow: '#a48af5',
        khakiLight: '#55617a', khakiBase: '#414c63', khakiFold: '#343d52', khakiShadow: '#262d3d',
        bandanaDark: '#1e3a8a', bandanaRed: '#1d4ed8', bandanaBright: '#2563eb', bandanaPaisley: '#93c5fd', bandanaWhite: '#dbeafe',
        hairDark: '#8a6a2f', hairBase: '#b08a3e', hairWarm: '#c49a48', hairHighlight: '#e0bf6a', hairGolden: '#ecd28a',
        browHair: '#9a7838'
      } }
    ];
    let P = { ...BASE }; // active palette, read by the painters

    /* ───────── Painters (copied from v2) ─────────
       Each painter fills one cube face, (0,0) = top left of that face.
       Face names are three.js names: right (+x, his left side), left (-x), top, bottom, front (+z), back. */
    function hash2D(x, y, seed = 1) {
      const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }
    function px(ctx, x, y, color) { ctx.fillStyle = color; ctx.fillRect(x, y, 1, 1); }
    const flat = (key) => (ctx, f, w, h) => { ctx.fillStyle = P[key]; ctx.fillRect(0, 0, w, h); };

    // Head (8x8x8). Same as v2, except the brow, eye and lip-line pixels: those are now
    // movable planes on top (see "Face parts"), so plain skin is painted under them.
    function paintHead(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const n = hash2D(x, y, 13);
          let col = n > 0.55 ? P.skinBase : P.skinWarm;

          if (face === 'front') {
            if (y <= 1) col = P.skinLight;
            if (y === 4 && (x === 1 || x === 6)) col = P.skinRosy;
            if (y === 5 && (x === 1 || x === 6)) col = P.skinShadow;
            if (y === 5 && x >= 2 && x <= 5) col = P.skinLight;
            if (y === 6 && (x === 2 || x === 5)) col = P.skinShadow; // mouth corners (the lip line itself is the mouth plane)
            if (y === 7) col = P.skinShadow;
          } else if (face === 'left' || face === 'right') {
            const fromFront = (face === 'right') ? x : (w - 1 - x);
            if (fromFront >= 4) {
              col = (x + y) % 2 === 0 ? P.hairBase : P.hairWarm;
            } else if (fromFront === 3 && y >= 2 && y <= 5) {
              col = P.hairHighlight;
            } else if (fromFront === 2 && (y === 3 || y === 4)) {
              col = P.skinRosy;
            }
          } else if (face === 'back' || face === 'top') {
            col = (x + y) % 2 === 0 ? P.hairBase : P.hairDark;
          } else if (face === 'bottom') {
            col = P.skinShadow;
          }
          px(ctx, x, y, col);
        }
      }
    }

    // Golden paper crown (8x6x8): peaks on top, logo on the front. Top and bottom are open.
    function paintCrown(ctx, face, w, h) {
      if (face === 'top' || face === 'bottom') return;
      ctx.clearRect(0, 0, w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const isCenterPeak = (x === 3 || x === 4);
          const isSidePeak = (x === 0 || x === 1 || x === 6 || x === 7);
          let filled = false;
          if (y >= 3) filled = true;
          else if (y === 2) filled = isCenterPeak || isSidePeak || x === 2 || x === 5;
          else if (y === 1) filled = isCenterPeak || x === 0 || x === 7;
          else if (y === 0) filled = isCenterPeak;
          if (!filled) continue;

          let col = y <= 1 ? P.crownGoldLight : (y <= 3 ? P.crownGold : P.crownGoldWarm);
          if (y === h - 1) col = P.crownGoldShadow;
          if (y === 4 && (x === 1 || x === 4 || x === 6)) col = P.crownJewel;
          if (face === 'front') {
            if (y === 2 && (x === 3 || x === 4)) col = x === 3 ? P.crownLogoOrange : P.crownLogoRed;
            else if (y === 3 && (x === 3 || x === 4)) col = x === 3 ? P.crownLogoWhite : P.crownLogoRed;
            else if (y === 2 && x === 5) col = P.hairDark;
          }
          px(ctx, x, y, col);
        }
      }
    }

    // Wavy shoulder-length hair.
    function paintHair(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const wave = Math.sin(y * 1.4 + x * 0.9);
          const n = hash2D(x, y, 37);
          let col = P.hairBase;
          if (wave > 0.45) col = P.hairHighlight;
          else if (wave > 0.1 && n > 0.5) col = P.hairGolden;
          else if (wave < -0.45) col = P.hairDark;
          else col = P.hairWarm;
          px(ctx, x, y, col);
        }
      }
    }

    // Red paisley bandana pulled down under the chin.
    function paintBandana(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let col = (x + y) % 2 === 0 ? P.bandanaRed : P.bandanaBright;
          if (y === h - 1) col = P.bandanaDark;
          if ((x * 3 + y * 5) % 7 === 0) col = P.bandanaWhite;
          else if ((x + y * 2) % 5 === 0) col = P.bandanaPaisley;
          px(ctx, x, y, col);
        }
      }
    }

    // Bandana tip (5x3, thin): the pointed end of the same cloth, hanging under the fold's front.
    // Cutout triangle: 5 / 3 / 1 pixels wide per row. Sides only on the top row, bottom only at the point.
    function paintBandanaTip(ctx, face, w, h) {
      const mid = (w - 1) / 2;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let on = true;
          if (face === 'front' || face === 'back') on = Math.abs(x - mid) <= mid - y * (mid / (h - 1));
          else if (face === 'left' || face === 'right') on = y === 0;
          else if (face === 'bottom') on = Math.abs(x - mid) < 0.6;
          if (!on) continue;
          let col = (x + y) % 2 === 0 ? P.bandanaRed : P.bandanaBright;
          if ((x * 3 + y * 5) % 7 === 0) col = P.bandanaWhite;
          else if ((x + y * 2) % 5 === 0) col = P.bandanaPaisley;
          if (y === h - 1 || face === 'bottom') col = P.bandanaDark;
          px(ctx, x, y, col);
        }
      }
    }

    // Pink button-down shirt with belt and khaki waist (8x12x4).
    function paintTorso(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const n = hash2D(x, y, 53);
          let col = n > 0.65 ? P.shirtLight : (n > 0.25 ? P.shirtBase : P.shirtFold);
          if (y === h - 2) {
            col = (x + y) % 2 === 0 ? P.beltLeather : P.beltWarm;
            if (face === 'front' && (x === 3 || x === 4)) col = P.beltBuckle;
            if (face === 'front' && (x === 1 || x === 6)) col = P.khakiLight;
          } else if (y === h - 1) {
            col = (x + y) % 2 === 0 ? P.khakiBase : P.khakiFold;
          } else if (face === 'front') {
            if (y === 0 && (x === 3 || x === 4)) {
              col = P.skinShadow;
            } else if (x === 3 || x === 4) {
              if (x === 3 && y % 3 === 1) col = P.shirtButton;
              else if (x === 4) col = P.shirtFold;
            }
            if (x >= 5 && x <= 6 && y >= 3 && y <= 6) {
              col = P.shirtLight;
              if (y === 3) col = P.shirtShadow;
              if (x === 5 && (y === 5 || y === 6)) col = P.badgeGreen;
              if (x === 6 && y === 5) col = P.badgeGrey;
            }
            if (y === h - 3 && (x === 1 || x === 2 || x === 6)) col = P.shirtShadow;
          } else if (face === 'back') {
            if (y === 2) col = P.shirtFold;
            if (y === h - 3 && (x === 2 || x === 5)) col = P.shirtShadow;
          }
          px(ctx, x, y, col);
        }
      }
    }

    function paintArm(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const n = hash2D(x, y, 71);
          if (y <= 4) {
            let col = n > 0.5 ? P.shirtBase : P.shirtLight;
            if (y === 4) col = P.shirtFold;
            px(ctx, x, y, col);
          } else {
            let col = n > 0.45 ? P.skinBase : P.skinWarm;
            if (y === 5) col = P.skinShadow;
            if (y === h - 1 && face === 'front') col = P.skinRosy;
            px(ctx, x, y, col);
          }
        }
      }
    }

    function paintKhaki(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const n = hash2D(x, y, 89);
          let col = n > 0.6 ? P.khakiLight : (n > 0.2 ? P.khakiBase : P.khakiFold);
          if (face === 'front' && x === Math.floor(w * 0.5)) col = P.khakiLight;
          if ((face === 'left' || face === 'right') && x === Math.floor(w * 0.5)) col = P.khakiShadow;
          if (y === h - 1) col = P.khakiShadow;
          px(ctx, x, y, col);
        }
      }
    }

    function paintShoe(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let col = P.shoeBrown;
          if (y === h - 1 || face === 'bottom') col = P.shoeSole;
          else if (face === 'top' || (face === 'front' && y === 0)) col = P.shoeHighlight;
          else if ((x + y) % 2 === 0) col = P.shoeDark;
          px(ctx, x, y, col);
        }
      }
    }

    function paintCollar(ctx, face, w, h) {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px(ctx, x, y, y === h - 1 ? P.shirtShadow : P.shirtLight);
    }
    function paintPocket(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let col = P.shirtLight;
          if (y === 0) col = P.shirtFold;
          else if (x === 0 && y >= 1) col = P.badgeGreen;
          px(ctx, x, y, col);
        }
      }
    }
    function paintPhone(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let col = P.phoneBlack;
          if (x === 0 || y === 0) col = P.phoneEdge;
          if (face === 'front' && x === 0 && y === 0) col = P.phoneLens;
          px(ctx, x, y, col);
        }
      }
    }
    function paintNose(ctx, face, w, h) {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px(ctx, x, y, y === 0 ? P.skinLight : P.skinRosy);
    }
    function paintSleeve(ctx, face, w, h) {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px(ctx, x, y, y === h - 1 ? P.shirtShadow : P.shirtLight);
    }
    function paintForearm(ctx, face, w, h) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const n = hash2D(x, y, 91);
          px(ctx, x, y, y === h - 1 ? P.skinRosy : (n > 0.4 ? P.skinBase : P.skinWarm));
        }
      }
    }

    /* ───────── Materials (one shared texture atlas) ─────────
       Same roughness / metalness per part as v2. The atlas size is set after packing. */
    const atlas = document.createElement('canvas');
    const atlasCtx = atlas.getContext('2d');
    const atlasTex = new THREE.CanvasTexture(atlas);
    atlasTex.magFilter = atlasTex.minFilter = THREE.NearestFilter;
    atlasTex.generateMipmaps = false;
    atlasTex.colorSpace = THREE.SRGBColorSpace;
    let ATLAS_W = 128, ATLAS_H = 128;

    const matCache = {};
    function mat(rough = 0.85, metal = 0.03, cut = false) {
      const key = rough + '|' + metal + '|' + cut;
      return matCache[key] || (matCache[key] = new THREE.MeshStandardMaterial({
        map: atlasTex, roughness: rough, metalness: metal,
        alphaTest: cut ? 0.5 : 0, side: cut ? THREE.DoubleSide : THREE.FrontSide
      }));
    }

    /* ───────── Rig builder ─────────
       Positions are in texels, relative to the parent bone (like v2's code), three.js axes:
       +x = the King's left, +y = up, +z = his front. Feet at y = 0.
       Every bone keeps its v2 rest rotation; animations add offsets on top of it.
       Rotation order Z, then Y, then X (Minecraft / Blockbench). */
    const mobRoot = new THREE.Group();
    mobRoot.name = 'crowned_traveler';
    scene.add(mobRoot);

    const bones = {};
    const boneList = [];
    const cubeList = [];

    function bone(name, parent, x, y, z, rx = 0, ry = 0, rz = 0) {
      const g = new THREE.Group();
      g.name = name;
      g.rotation.order = 'ZYX';
      g.position.set(x * TEXEL, y * TEXEL, z * TEXEL);
      g.rotation.set(rx, ry, rz);
      g.userData = { rest: g.position.clone(), restRot: new THREE.Vector3(rx, ry, rz) };
      (parent || mobRoot).add(g);
      bones[name] = g;
      boneList.push(g);
      return g;
    }

    // One cube: w x h x d texels, centered at (x, y, z) in its bone. opt: inflate, rot [x,y,z], rough, metal, cut, shadow.
    function box(b, name, w, h, d, x, y, z, painter, opt = {}) {
      const inflate = opt.inflate || 0;
      const geo = new THREE.BoxGeometry((w + inflate * 2) * TEXEL, (h + inflate * 2) * TEXEL, (d + inflate * 2) * TEXEL);
      // BoxGeometry flips the normal of a side whose depth is 0 (face planes), which lights it from behind.
      // Set every face normal straight out: +x, -x, +y, -y, +z, -z.
      const nrm = geo.attributes.normal;
      for (let i = 0; i < 24; i++) { const f = i >> 2; nrm.setXYZ(i, f === 0 ? 1 : f === 1 ? -1 : 0, f === 2 ? 1 : f === 3 ? -1 : 0, f === 4 ? 1 : f === 5 ? -1 : 0); }
      const mesh = new THREE.Mesh(geo, mat(opt.rough, opt.metal, opt.cut));
      const rot = opt.rot || [0, 0, 0];
      mesh.position.set(x * TEXEL, y * TEXEL, z * TEXEL);
      mesh.rotation.order = 'ZYX';
      mesh.rotation.set(rot[0], rot[1], rot[2]);
      mesh.castShadow = opt.shadow !== false;
      mesh.receiveShadow = true;
      mesh.name = name;
      b.add(mesh);
      const c = { name, bone: b.name, size: [w, h, d], inflate, center: [x, y, z], rot, painter, mesh, shell: opt.shell || null, rects: [] };
      cubeList.push(c);
      return c;
    }

    /* ───────── Rig: The King (exact v2 model) ───────── */
    const root = bone('root', null, 0, 0, 0);                  // ground pivot for whole-body sway (no cubes)
    const body = bone('body', root, 0, 12, 0);                 // pelvis, 12 texels up (v2 "body")

    // Torso, collar points, breast pocket, phone.
    const chest = bone('chest', body, 0, 0, 0);
    box(chest, 'torso_shirt', 8, 12, 4, 0, 6, 0, paintTorso);
    box(chest, 'collar_left', 2.5, 1.6, 1.2, 1.5, 11.4, 1.85, paintCollar, { rot: [0, 0.2, -0.25] });
    box(chest, 'collar_right', 2.5, 1.6, 1.2, -1.5, 11.4, 1.85, paintCollar, { rot: [0, -0.2, 0.25] });
    box(chest, 'breast_pocket', 2.6, 3.2, 0.5, 2.1, 7.2, 2.15, paintPocket);
    const phone = bone('pocket_phone', chest, 2.1, 9.1, 2.05, 0, 0, 0.14);
    box(phone, 'smartphone', 2.2, 2.6, 0.6, 0, 0, 0, paintPhone, { rough: 0.25, metal: 0.35 });

    // Neck and head.
    const neck = bone('neck', chest, 0, 12, 0);
    box(neck, 'neck_column', 4, 2, 4, 0, 0.8, 0, flat('skinWarm'));
    const head = bone('head', neck, 0, 1.4, 0);                // pivot on the bottom of the head
    box(head, 'head_cranium', 8, 8, 8, 0, 4, 0, paintHead);
    box(head, 'nose_bridge', 2, 2, 1.2, 0, 4.2, 4.4, paintNose);

    // Bandana (mouth mask pulled under the chin): ONE object on the head, one bone, no parts moving apart.
    // The bone works as the jaw: it drops a little when the mouth opens.
    const jaw = bone('chin_bandana', head, 0, 0.4, 0.4);
    box(jaw, 'bandana_fold', 7.2, 2.6, 6.8, 0, -0.3, 0.4, paintBandana, { inflate: 0.15, rot: [0.12, 0, 0] });
    // Pointed tip, tilted with the fold, flush with its front face, top 0.5 hidden inside it.
    // In the fold's own space: center (0, -2.45, 3.3); here turned by the fold's 0.12 and moved to its center.
    // v2's 4.6x2.2x2 tail block sat 0.1 from the shirt and hit it on every head turn; this thin tip
    // stays >= 0.1 in front of the collar points at full head turn (0.35 rad).
    box(jaw, 'bandana_tip', 5, 3, 0.5, 0, -3.127, 3.383, paintBandanaTip, { rot: [0.12, 0, 0], cut: true });

    // Golden paper crown. Shell band: paper is a thin skin; only points this close under it count as clipping.
    const crown = bone('golden_crown', head, 0, 9.4, 0, -0.06, 0, 0);
    box(crown, 'paper_crown', 8, 6, 8, 0, 0, 0, paintCrown, { inflate: 0.42, cut: true, rough: 0.55, metal: 0.12, shell: { walls: 'xz', band: 0.15 } });

    // Shoulder-length wavy hair: two side curtains and a back curtain.
    const hairL = bone('hair_left', head, 3.8, 5.8, -0.4, 0, 0, 0.24);
    box(hairL, 'hair_left_upper', 2.6, 7.5, 7.6, 0.6, -3.2, 0, paintHair);
    box(hairL, 'hair_left_lower', 2.8, 4.5, 6.6, 1.1, -6.2, 0.2, paintHair);
    const hairR = bone('hair_right', head, -3.8, 5.8, -0.4, 0, 0, -0.24);
    box(hairR, 'hair_right_upper', 2.6, 7.5, 7.6, -0.6, -3.2, 0, paintHair);
    box(hairR, 'hair_right_lower', 2.8, 4.5, 6.6, -1.1, -6.2, 0.2, paintHair);
    const hairB = bone('hair_back', head, 0, 5.6, -3.8, 0.16, 0, 0);
    box(hairB, 'hair_back_curtain', 8.6, 9.5, 2.6, 0, -4.2, -0.6, paintHair);

    /* ───────── Face parts ─────────
       Thin planes on the exact v2 face pixels (head front is at z 4), each on its own bone.
       At rest they look the same as v2's painted face. */
    const NO_SHADOW = { shadow: false };
    box(head, 'eye_white_right', 2, 1, 0, -2, 4.5, 4.02, flat('eyeWhite'), NO_SHADOW);
    box(head, 'eye_white_left', 2, 1, 0, 2, 4.5, 4.02, flat('eyeWhite'), NO_SHADOW);
    // Pupils rest in the middle of the 2-texel eye white (v2 had them on the inner pixel = cross-eyed look).
    // Both glide together, at most half a texel each way, so they never leave the white.
    box(bone('pupil_right', head, -2, 4.5, 4.04), 'pupil_right', 1, 1, 0, 0, 0, 0, flat('eyePupil'), NO_SHADOW);
    box(bone('pupil_left', head, 2, 4.5, 4.04), 'pupil_left', 1, 1, 0, 0, 0, 0, flat('eyePupil'), NO_SHADOW);
    // Lid pivot on its top edge: it slides down. At rest it sits just inside the head (z 3.98),
    // so the default pose (Blockbench, the mod) has open eyes; it steps to z 4.06 only while closing.
    box(bone('lid_right', head, -2, 5, 3.98), 'lid_right', 2, 1, 0, 0, -0.5, 0, flat('lidSkin'), NO_SHADOW);
    box(bone('lid_left', head, 2, 5, 3.98), 'lid_left', 2, 1, 0, 0, -0.5, 0, flat('lidSkin'), NO_SHADOW);
    box(bone('brow_right', head, -2, 5.5, 4.08), 'brow_right', 2, 1, 0, 0, 0, 0, flat('browHair'), NO_SHADOW);
    box(bone('brow_left', head, 2, 5.5, 4.08), 'brow_left', 2, 1, 0, 0, 0, 0, flat('browHair'), NO_SHADOW);
    // Mouth pivot on the top lip: it opens downward (the bandana hides the lowest part, like a jaw).
    box(bone('mouth', head, 0, 2, 4.03), 'mouth', 2, 1, 0, 0, -0.5, 0, flat('lipLine'), NO_SHADOW);

    // Arms: 2 bones (rig rule): arm_<side> = upper arm (shoulder), forearm_<side> = forearm (elbow).
    // Rest: slightly out, elbow a bit bent. (No hand bone: a held item would hang on the forearm.)
    function arm(side, sx) {
      const s = bone(`arm_${side}`, chest, sx * 5.6, 11, 0, 0, 0, sx * 0.06);
      box(s, `upper_arm_${side}`, 3.2, 6, 3.4, 0, -2.5, 0, paintArm);
      box(s, `sleeve_cuff_${side}`, 3.6, 5.2, 3.8, 0, -2, 0, paintSleeve);
      const e = bone(`forearm_${side}`, s, 0, -5.2, 0, -0.12, 0, 0);
      box(e, `lower_arm_${side}`, 2.8, 5.5, 2.8, 0, -2.6, 0, paintForearm);
    }
    arm('right', -1); // his right arm is on -x
    arm('left', 1);

    // Legs: 2 bones (rig rule): leg_<side> = thigh (hip), knee_<side> = shin + dress shoe (knee).
    // No ankle: the shoe tilts with the shin (foot angle = hip + knee). Same spot as the old ankle shoe:
    // sole 6.4 below the knee, heel 1.9 behind and toe 3.3 in front of the shin line (see footLow()).
    function leg(side, sx) {
      const hp = bone(`leg_${side}`, body, sx * 2, 0, 0);
      box(hp, `thigh_${side}`, 3.8, 6, 3.8, 0, -2.8, 0, paintKhaki);
      const k = bone(`knee_${side}`, hp, 0, -5.6, 0);
      box(k, `calf_${side}`, 3.5, 5, 3.6, 0, -2.3, 0, paintKhaki);
      box(k, `shoe_${side}`, 3.6, 2, 5.2, 0, -5.4, 0.7, paintShoe, { rough: 0.38 });
    }
    leg('right', -1);
    leg('left', 1);

    const B = {}; // bone index by name
    boneList.forEach((b, i) => { B[b.name] = i; });
    const NB = boneList.length;

    /* ───────── Texture atlas ─────────
       Every cube face gets its own rect (v2 face sizes: whole texels, at least 1).
       2-texel gaps; the edge pixels are smeared 1 texel into the gap so seams never show the background. */
    const FACES = ['right', 'left', 'top', 'bottom', 'front', 'back']; // BoxGeometry face order: +x, -x, +y, -y, +z, -z
    const faceSize = (c, f) => {
      const [w, h, d] = c.size, r = (v) => Math.max(1, Math.round(v));
      return f < 2 ? [r(d), r(h)] : f < 4 ? [r(w), r(d)] : [r(w), r(h)];
    };

    (function packAtlas() {
      const items = [];
      for (const c of cubeList) for (let f = 0; f < 6; f++) { const [w, h] = faceSize(c, f); items.push({ c, f, w, h }); }
      items.sort((a, b) => b.h - a.h || b.w - a.w);
      let x = 1, y = 1, shelf = 0;
      for (const it of items) {
        if (x + it.w + 1 > ATLAS_W) { x = 1; y += shelf + 2; shelf = 0; }
        it.c.rects[it.f] = { x, y, w: it.w, h: it.h };
        x += it.w + 2;
        shelf = Math.max(shelf, it.h);
      }
      while (y + shelf + 1 > ATLAS_H) ATLAS_H *= 2;
      atlas.width = ATLAS_W; atlas.height = ATLAS_H;
    })();

    // Point every face's UVs at its rect (same orientation as v2's one-canvas-per-face textures).
    for (const c of cubeList) {
      const uv = c.mesh.geometry.attributes.uv;
      for (let f = 0; f < 6; f++) {
        const r = c.rects[f];
        for (let k = 0; k < 4; k++) {
          const i = f * 4 + k, u = uv.getX(i), v = uv.getY(i);
          uv.setXY(i, (r.x + u * r.w) / ATLAS_W, 1 - (r.y + (1 - v) * r.h) / ATLAS_H);
        }
      }
      uv.needsUpdate = true;
    }

    // Repaint the whole atlas. Only called when the color variant changes.
    const scratch = document.createElement('canvas');
    scratch.width = scratch.height = 32;
    const sctx = scratch.getContext('2d');
    const GUTTER = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    function paintAtlas() {
      atlasCtx.imageSmoothingEnabled = false;
      atlasCtx.clearRect(0, 0, ATLAS_W, ATLAS_H);
      for (const c of cubeList) {
        for (let f = 0; f < 6; f++) {
          const r = c.rects[f];
          sctx.clearRect(0, 0, 32, 32);
          c.painter(sctx, FACES[f], r.w, r.h);
          for (const [dx, dy] of GUTTER) atlasCtx.drawImage(scratch, 0, 0, r.w, r.h, r.x + dx, r.y + dy, r.w, r.h);
          atlasCtx.clearRect(r.x, r.y, r.w, r.h);
          atlasCtx.drawImage(scratch, 0, 0, r.w, r.h, r.x, r.y, r.w, r.h);
        }
      }
      atlasTex.needsUpdate = true;
    }

    let variantIndex = 0;
    function setVariant(i) {
      variantIndex = i;
      P = { ...BASE, ...VARIANTS[i].pal };
      paintAtlas();
      document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('active', k === i));
    }

    /* ───────── Pose buffers & helpers ───────── */
    const FACE_KEYS = ['browUp', 'frown', 'open', 'wide', 'glance', 'squint'];
    function makePose() {
      return { r: new Float32Array(NB * 3), p: new Float32Array(NB * 3), f: { browUp: 0, frown: 0, open: 0, wide: 0, glance: 0, squint: 0 }, yawLimit: 0.5, follow: 1 };
    }
    function clearPose(Q) { Q.r.fill(0); Q.p.fill(0); for (const k of FACE_KEYS) Q.f[k] = 0; }
    function copyPose(src, dst) { dst.r.set(src.r); dst.p.set(src.p); for (const k of FACE_KEYS) dst.f[k] = src.f[k]; dst.yawLimit = src.yawLimit; dst.follow = src.follow; }
    function rot(Q, b, x, y, z) { const i = B[b] * 3; Q.r[i] += x; Q.r[i + 1] += y; Q.r[i + 2] += z; }
    function pos(Q, b, x, y, z) { const i = B[b] * 3; Q.p[i] += x; Q.p[i + 1] += y; Q.p[i + 2] += z; }

    const TAU = Math.PI * 2;
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const smooth01 = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
    // Looping keyframe curve with cosine easing. keys = [[time, value], ...]; last time = loop length.
    function kf(t, keys) {
      for (let i = 1; i < keys.length; i++) {
        if (t <= keys[i][0]) {
          const a = keys[i - 1], b = keys[i];
          const s = (t - a[0]) / (b[0] - a[0]);
          return a[1] + (b[1] - a[1]) * (0.5 - 0.5 * Math.cos(Math.PI * s));
        }
      }
      return keys[keys.length - 1][1];
    }
    // Smooth curve through keys that keeps its speed through each key (no stop at every key) and never
    // overshoots a key (monotone cubic, Fritsch-Carlson). Used for fast, flowing moves like the attacks.
    function mc(t, keys) {
      const n = keys.length;
      if (t <= keys[0][0]) return keys[0][1];
      if (t >= keys[n - 1][0]) return keys[n - 1][1];
      let i = 1;
      while (t > keys[i][0]) i++;
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i], h = t1 - t0;
      const slope = (a) => (keys[a + 1][1] - keys[a][1]) / (keys[a + 1][0] - keys[a][0]);
      const tan = (k) => {
        if (k === 0 || k === n - 1) return 0;
        const d0 = slope(k - 1), d1 = slope(k);
        if (d0 * d1 <= 0) return 0;
        const h0 = keys[k][0] - keys[k - 1][0], h1 = keys[k + 1][0] - keys[k][0];
        const w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
        return (w1 + w2) / (w1 / d0 + w2 / d1);
      };
      const s = (t - t0) / h, s2 = s * s, s3 = s2 * s;
      return (2 * s3 - 3 * s2 + 1) * v0 + (s3 - 2 * s2 + s) * h * tan(i - 1) + (-2 * s3 + 3 * s2) * v1 + (s3 - s2) * h * tan(i);
    }
    // Key-pose table -> one key list per channel: times [t0, t1, ...], table { channel: [v0, v1, ...] }.
    function poseTable(times, table) {
      const out = {};
      for (const ch in table) out[ch] = times.map((t, i) => [t, table[ch][i]]);
      return out;
    }

    /* ───────── Legs + ground (2-bone legs, no ankle) ─────────
       The shoe sits on the shin bone, so the foot angle = thigh + knee (world, + = toe down).
       Texels below the hip joint: knee 5.6, sole 6.4 below the knee, heel 1.9 behind and toe
       3.3 in front of the shin line. legHeight() = the body (hip) height offset that puts the
       lowest sole point of both feet on the floor: smooth min, so no corner when the feet swap. */
    const THIGH = 5.6, SOLE = 6.4, HEEL = -1.9, TOE = 3.3, HIP_H = 12;
    // (k 0.02: under-estimates by at most 0.014 per use, so the feet float at most ~0.03 texel and never sink)
    function smin(a, b, k = 0.02) { return Math.min(a, b) - k * Math.log1p(Math.exp(-Math.abs(a - b) / k)); }
    // Lowest sole point below the hip for world thigh angle h and knee angle k (Rx: y' = y cos - z sin)
    function footLow(h, k) {
      const a = h + k, c = Math.cos(a), s = Math.sin(a);
      return -THIGH * Math.cos(h) + smin(-SOLE * c - HEEL * s, -SOLE * c - TOE * s);
    }
    // Body (hip) y offset for both legs (world thigh angles hR / hL, knees kR / kL)
    function legHeight(hR, kR, hL, kL) { return -HIP_H - smin(footLow(hR, kR), footLow(hL, kL)); }

    /* ───────── Animations (from TheKing v1) ─────────
       Each one writes offsets from the rest pose (radians, texels) plus face targets.
       Every periodic term fits a whole number of times into the loop length T.
       v1 bone "body" (torso) = "chest" here. Rig rule (2026-10-15): 2 bones per arm and per leg, so elbows
       and knees bend in every animation; there is no ankle (the shoe follows the shin). */

    // 1 · Idle: calm, proud breathing. Slow chest rise, chin lifts on the in-breath, arms drift out.
    const IDLE_GLANCE = [[0, 0], [1.1, 0], [1.4, -0.7], [2.1, -0.7], [2.4, 0.2], [3.3, 0.2], [3.6, 0], [4, 0]];
    const IDLE_BROW = [[0, 0], [1.3, 0.25], [2.2, 0.1], [3.4, -0.05], [4, 0]];
    // 2 · Idle 2: looks around his kingdom, shifts weight, hand to the hip, smug grin.
    const I2_HEAD = [[0, 0], [0.7, 0], [1.3, 0.34], [2.6, 0.34], [3.3, -0.3], [4.6, -0.3], [5.3, 0], [6, 0]];
    const I2_EYES = [[0, 0], [0.5, 0], [0.8, 0.9], [2.4, 0.6], [2.8, -0.9], [4.4, -0.6], [4.9, 0.2], [5.6, 0], [6, 0]];
    const I2_SHIFT = [[0, 0], [1.0, 0.45], [2.8, 0.45], [3.6, -0.4], [4.9, -0.4], [6, 0]];
    const I2_HIP = [[0, 0], [0.6, 0], [1.2, 1], [4.4, 1], [5.2, 0], [6, 0]];
    const I2_GRIN = [[0, 0], [1.2, 0], [1.6, 1], [2.6, 1], [3.0, 0], [3.4, -0.8], [4.4, -0.8], [4.8, 0], [6, 0]];
    const I2_BROW = [[0, 0], [1.1, 0.6], [1.8, 0.35], [2.7, 0], [3.2, -0.2], [4.3, 0.5], [5.0, 0], [6, 0]];
    const I2_FROWN = [[0, 0], [2.8, 0], [3.2, 0.6], [4.0, 0.3], [4.6, 0], [6, 0]];
    // 3 · Walk: confident royal stroll, chin up, shoulders counter-twist, humming through an "o" mouth.
    const W_HUM = [[0, 0.2], [0.5, 0.45], [1.0, 0.25], [1.25, 0.5], [1.5, 0.3], [2, 0.2]];

    // D 0.36 -> both feet are off the ground 28% of the time (the flight that makes it a run, not a fast walk).
    // Texels: thigh 5.6, shin 4.8 to the shoe joint point, which sits 1.6 above a flat sole; heel 1.9 behind and

      Zf: 2.4, Zb: 5.0,      // foot lands 2.4 in front of the hip, pushes off 5 behind it (leg nearly straight)
      H0: 11.59, A: 0.31,    // hip height: 11.28 at mid-stance (knee ~0.7 bent) .. 11.9 mid-flight (rest 12)

    // contact height depends on the solved pose: start from the planned pitch (RUN_PITCH), solve,
    // read the real pitch, solve again (6 passes settle it, also at the fast landing). The real pitch gives heel strike, a heel
    // that rises at push-off and a toe that trails the kicked-up shin, much like RUN_PITCH wanted.

          y = runContact(f);
        } else {                                         // swing: Hermite curve, both ends moving backward
          // End speeds = the stance slide speed (no jerk at lift-off or landing): the foot keeps going back a little
          // after lift-off and paws back before it lands.
          const s = (u - RUN.D) / (1 - RUN.D), s2 = s * s, s3 = s2 * s, m = -L * (1 - RUN.D) / RUN.D;

          y = runContact(f) + RUN.Hk * 10.91 * s ** 1.5 * (1 - s) ** 2; // lift peaks early (s 0.43): heel up behind
        }

        // Angles: + = backward (rig convention). d >= 6.6 keeps the knee bend under ~1.8 rad (deeper, the shoe
        // folds into the back of the thigh); d <= 10.38 = leg nearly straight. Soft limits (softplus): no jerk.
        const ty = y - hip, d0 = Math.hypot(z, ty);
        const d1 = 6.6 + 0.3 * Math.log1p(Math.exp((d0 - 6.6) / 0.3));

        thigh = -(line + aHip); knee = Math.PI - aKnee;  // knee points forward, bends backward
        f = thigh + knee;                                // the real shoe pitch for the next pass
      }

      idle2: {

      },
      // 4 · Dance (asked for by the user): 1:1 copy of the reference video, see the D_ curves above.
      // Plays with the dance music; also starts by itself now and then from the idles.
      // Head-follow is faded down (follow 0.35). loopFade: when it loops, it crossfades back to the start pose.
      dance: {
        T: 5, yawLimit: 0.25, follow: 0.35, loopFade: true,
        fn(t, Q) {
          // Hops: sine arcs between take-off and landing. Knee bounces: soft pulses on the beat.

          for (const [t0, t1, h] of D_HOPS) if (t > t0 && t < t1) lift += h * Math.sin(Math.PI * (t - t0) / (t1 - t0));

            let e = 0;

            const sx = side === 'right' ? -1 : 1;  // outward on Z: right leg negative

          rot(Q, 'body', lean, 0, 0);
          rot(Q, 'chest', 0, -0.08 * Math.sin(Math.PI * clamp((t - 1.6) / 0.6, 0, 1) * 2) + 0.05 * kf(t, D_DANGLE) * Math.sin(TAU * 2.4 * t), 0);

          rot(Q, 'forearm_left', kf(t, D_L_FX), 0, kf(t, D_L_FZ) + 0.1 * wipe * Math.sin(TAU * 5 * t + 1));

      },

      // 7 · Run (asked for by the user): a heavy, determined sprint, see RUN above.

      run: {
        T: 1.125, yawLimit: 0.25, follow: 0.7,
        fn(t, Q) {
          const uR = (t / RUN.P) % 1, uL = (uR + 0.5) % 1;   // leg phases: 0 = that foot lands
          const lean = 0.2;                                    // pelvis tips forward (legs subtract it: world angles)

          const c = Math.cos(TAU * uR);                        // +1 = right leg in front
          rot(Q, 'chest', 0.08, 0.14 * c, 0);                  // more lean; shoulders turn against the hips
          rot(Q, 'root', 0, -0.1 * c, 0.015 * Math.sin(TAU * uR));

    /* ───────── Springs (loose parts) ─────────
       A pendulum per loose part: it hangs along gravity minus the anchor's acceleration,
       plus a tiny breeze so it always moves. Values are offsets from the v2 rest angle,
       clamped so nothing swings into the head or body. bias = small lean so the rest sits inside the range. */
    const SPRINGS = [
      // Back hair only swings backward (forward it would reach the head and back).
      { bone: 'hair_back', k: 70, d: 7, accel: 0.5, x: [-0.03, 0.45], z: [-0.1, 0.1], bx: 0.03, breeze: 0.03, f: 0.9 },
      // Side hair only swings outward on Z (inward it would enter the head and the bandana).
      { bone: 'hair_right', k: 90, d: 8, accel: 0.5, x: [-0.1, 0.1], z: [-0.3, 0], bz: -0.03, breeze: 0.03, f: 1.3 },
      { bone: 'hair_left', k: 90, d: 8, accel: 0.5, x: [-0.1, 0.1], z: [0, 0.3], bz: 0.03, breeze: 0.03, f: 1.1 }
      // The bandana is one fitted object on the head (user wish): no spring.

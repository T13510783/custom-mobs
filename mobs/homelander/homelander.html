  const fTgt = (S.follow.on && S.follow.has) ? (A.follow !== undefined ? A.follow : 1) : 0;
  S.follow.w += (fTgt - S.follow.w) * filt(dt, 8);

  // Look target: the mouse in the viewer; `inject` = look angles given directly (mod, 1:1 test). + yaw = his left, + pitch = down.
  const inj = S.follow.inject;
  const targetYaw = clamp(inj ? inj.yaw : S.follow.mx * 0.55, -S.yawLimit, S.yawLimit);
  const targetPitch = clamp(inj ? inj.pitch : -S.follow.my * 0.15, -0.08, 0.08);
  S.follow.yaw += (targetYaw - S.follow.yaw) * filt(dt, 9);
  S.follow.pitch += (targetPitch - S.follow.pitch) * filt(dt, 9);

  // Apply Kinematic Pose to Bones
  for (let i = 0; i < NB; i++) {
    const g = boneList[i];
    const r0 = g.userData.restRot, p0 = g.userData.rest;
    const j = i * 3;
    g.rotation.set(r0.x + S.out.r[j], r0.y + S.out.r[j + 1], r0.z + S.out.r[j + 2]);
    g.position.set(p0.x + S.out.p[j] * TEXEL, p0.y + S.out.p[j + 1] * TEXEL, p0.z + S.out.p[j + 2] * TEXEL);
  }

  // Apply Head Follow
  if (bones.head) {
    bones.head.rotation.y += S.follow.yaw * S.follow.w;
    bones.head.rotation.x += S.follow.pitch * S.follow.w;
    bones.head.rotation.x -= 0.05 * S.talk.level * S.talkW; // chin lifts on loud syllables
    // Random look-around (animation's `look` weight; the mouse follow takes over most of it):
    // head turns, chest follows a quarter, chin lifts while holding a look; fake smile cocks the head.
    // The neck lifts by the extra tilt (head half depth x angle, soft norm) so no corner sinks into the torso.
    const fr = 1 - 0.6 * S.follow.w, L = rd.look * rd.lookW * fr;
    const P = -0.25 * L * L + rd.pitch * rd.lookW * fr, Z = 0.06 * rd.mw[2] * rd.moodW;
    bones.head.rotation.y += 0.75 * L;
    bones.head.rotation.x += P;
    bones.head.rotation.z += Z;
    bones.head.position.y += 4.2 * (Math.sqrt(P * P + Z * Z + 4e-4) - 0.02) * TEXEL;
    bones.chest.rotation.y += 0.25 * L;
  }

  // Pupils eye glance tracking
  const pGlance = clamp(S.face.glance + S.follow.yaw * 0.35 * S.follow.w, -0.45, 0.45);
  if (bones.pupil_right && bones.pupil_left) {
    bones.pupil_right.position.x = (-2 + pGlance) * TEXEL;
    bones.pupil_left.position.x = (2 + pGlance) * TEXEL;
  }

  // Sliding Eyelids
  const closeAmt = clamp(blinkVal + S.face.squint * 0.5, 0, 1);
  if (bones.lid_right && bones.lid_left) {
    bones.lid_right.scale.y = closeAmt;
    bones.lid_left.scale.y = closeAmt;
    bones.lid_right.position.z = (closeAmt > 0.05 ? 4.06 : 3.98) * TEXEL;
    bones.lid_left.position.z = (closeAmt > 0.05 ? 4.06 : 3.98) * TEXEL;
  }

  // Eyebrows
  if (bones.brow_right && bones.brow_left) {
    const browY = (5.6 + S.face.browUp * 0.4 - S.face.frown * 0.3) * TEXEL;
    bones.brow_right.position.y = browY;
    bones.brow_left.position.y = browY;
    bones.brow_right.rotation.z = -0.06 - S.face.frown * 0.25;
    bones.brow_left.rotation.z = 0.06 + S.face.frown * 0.25;
  }

  // Mouth: open / wider for the grin, smirk tilts it up on his left side and shifts it over;
  // teeth grow down from the lip line and step out of the head only while grinning
  if (bones.mouth) {
    bones.mouth.scale.y = 1 + S.face.open * 1.5;
    bones.mouth.scale.x = 1 + S.face.wide * 0.4 + S.face.grin * 0.3;
    bones.mouth.rotation.z = 0.14 * S.face.smirk;
    bones.mouth.position.x = 0.25 * S.face.smirk * TEXEL;
    bones.teeth.scale.y = Math.max(0.001, S.face.grin);
    bones.teeth.position.z = (-0.05 + 0.045 * clamp(S.face.grin * 10, 0, 1)) * TEXEL;
  }

  // Red eye glow: anim channel + random Idle pulse, dimmed while the lids are closed
  // (the lids slide over the glow planes, so a blink hides the red by itself)
  const glow = clamp(Math.max(S.face.glow + evGlow, S.face.laser), 0, 1);
  glowMat.opacity = Math.min(1, glow * 1.3);                 // red eye white
  glowCoreMat.opacity = clamp(glow * 1.6 - 0.45, 0, 1);      // hot core only when it really burns
  glowHaloMat.opacity = glow * 0.35;                         // faint bloom (more reads as a pink box)
  for (const e of eyeGlow) e.core.position.x = (e.x + pGlance) * TEXEL; // core sits on the pupil

  // Heat-vision beams: thickness flickers, length = the animation's `beam` (texels) or LASER_LEN
  const laserActive = S.face.laser;
  laserMat.opacity = laserActive;
  laserCoreMat.opacity = laserActive * 0.95;
  const beamW = laserActive > 0.01 ? (0.75 + 0.25 * Math.sin(S.time * 45)) * Math.min(1, laserActive * 2) : 0.0001;
  // (the mod does the same: A.beam, else the distance to the first thing the beam hits)
  const beamLen = Math.max(0.0001, A.beam || (S.beamLen && S.beamLen()) || LASER_LEN);
  for (const l of lasers) { l.beam.scale.set(beamW, beamW, beamLen); l.core.scale.set(beamW, beamW, beamLen); } // geometry runs along +z

  // Cape: cloth physics (see Cloth). The viewer has no real movement, so an animation that walks gives
  // its own speed (A.move, texels/s forward); the mod passes his real movement in S.move.
  if (!S.move) { clothMove[0] = 0; clothMove[1] = 0; clothMove[2] = (A.move || 0) * dt; }
  clothStep(S, dt, S.move || clothMove);
}

/* ───────── Blockbench .bbmodel Exporter ───────── */
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

const bbVec = (p) => [-p[0], p[1], p[2]];
const bbRot = (rx, ry, rz) => [-rx * 180 / Math.PI, -ry * 180 / Math.PI, rz * 180 / Math.PI];
const r4 = (v) => Math.round(v * 10000) / 10000;

function bakeAnimation(name) {
  const A = ANIMS[name];
  const fps = 24, frames = Math.round(A.T * fps);
  const S = makeSim(1);
  S.anim = name; S.follow.on = false;
  const tracks = {};
  boneList.forEach((g) => { tracks[g.name] = { rot: [], pos: [], scl: [] }; });

  for (let f = 0; f <= frames; f++) {
    S.t = (f / fps) % A.T;
    clearPose(S.cur);
    A.fn(S.t, S.cur);
    for (let i = 0; i < NB; i++) {
      const g = boneList[i], b = g.name;
      const j = i * 3;
      tracks[b].rot.push(bbRot(S.cur.r[j], S.cur.r[j + 1], S.cur.r[j + 2]));
      tracks[b].pos.push(bbVec([S.cur.p[j], S.cur.p[j + 1], S.cur.p[j + 2]]));
      tracks[b].scl.push([1, 1, 1]);
    }
  }

  const animators = {};
  const isRest = (list, def) => list.every((p) => Math.abs(p[0] - def) < 1e-4 && Math.abs(p[1] - def) < 1e-4 && Math.abs(p[2] - def) < 1e-4);
  boneList.forEach((g) => {
    const b = g.name, tr = tracks[b], keyframes = [];
    const add = (channel, list) => list.forEach((v, f) => keyframes.push({
      channel, data_points: [{ x: v[0], y: v[1], z: v[2] }], uuid: uuid(), time: r4(f / fps), color: -1, interpolation: 'catmullrom'
    }));
    if (!isRest(tr.rot, 0)) add('rotation', tr.rot);
    if (!isRest(tr.pos, 0)) add('position', tr.pos);
    if (keyframes.length) animators[g.userData.uuid] = { name: g.name, type: 'bone', keyframes };
  });

  return {
    uuid: uuid(), name: `animation.homelander.${name}`, loop: 'loop', override: false,
    length: A.T, snapping: 24, selected: name === 'idle', anim_time_update: '', blend_weight: '',
    start_delay: '', loop_delay: '', animators
  };
}

function buildBBModel() {
  const abs = new Map();
  boneList.forEach((g) => {
    g.userData.uuid = uuid();
    const p = g.parent.isGroup && abs.has(g.parent) ? abs.get(g.parent) : [0, 0, 0];
    const r = g.userData.rest;
    abs.set(g, [p[0] + r.x / TEXEL, p[1] + r.y / TEXEL, p[2] + r.z / TEXEL]);
  });

  const elements = [];
  const groupOf = {};
  for (const c of cubeList) {
    const id = uuid();
    const bp = abs.get(bones[c.bone]);
    const ctr = bbVec([bp[0] + c.center[0], bp[1] + c.center[1], bp[2] + c.center[2]]);
    const [w, h, d] = c.size;
    const R = (f) => { const r = c.rects[f]; return [r.x, r.y, r.x + r.w, r.y + r.h]; };
    const Rf = (f) => { const r = c.rects[f]; return [r.x + r.w, r.y + r.h, r.x, r.y]; };
    const rotated = c.rot.some((v) => v !== 0);

    elements.push({
      name: c.name, box_uv: false, rescale: false, locked: false, render_order: 'default', allow_mirror_modeling: true,
      from: [r4(ctr[0] - w / 2), r4(ctr[1] - h / 2), r4(ctr[2] - d / 2)],
      to: [r4(ctr[0] + w / 2), r4(ctr[1] + h / 2), r4(ctr[2] + d / 2)],
      autouv: 0, color: 0, inflate: c.inflate,
      origin: rotated ? ctr : bbVec(bp),
      ...(rotated ? { rotation: bbRot(c.rot[0], c.rot[1], c.rot[2]) } : {}),
      faces: {
        north: { uv: R(4), texture: 0 }, south: { uv: R(5), texture: 0 },
        east: { uv: R(1), texture: 0 }, west: { uv: R(0), texture: 0 },
        up: { uv: Rf(2), texture: 0 }, down: { uv: Rf(3), texture: 0 }
      },
      type: 'cube', uuid: id
    });
    (groupOf[c.bone] = groupOf[c.bone] || []).push(id);
  }

  const outlinerNode = (g) => ({
    name: g.name, origin: bbVec(abs.get(g)), rotation: bbRot(g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z),
    color: 0, uuid: g.userData.uuid, export: true, mirror_uv: false, isOpen: true, locked: false, visibility: true, autouv: 0,
    children: [...(groupOf[g.name] || []), ...g.children.filter((ch) => ch.isGroup).map(outlinerNode)]
  });

  const animations = ALL_ANIMS.map(bakeAnimation);

  return {
    meta: { format_version: '4.5', model_format: 'free', box_uv: false },
    name: 'homelander', model_identifier: 'homelander',
    visible_box: [2, 2.5, 1], variable_placeholders: '', variable_placeholder_buttons: [],
    resolution: { width: ATLAS_W, height: ATLAS_H },
    elements, outliner: [outlinerNode(root)],
    textures: [{
      path: '', name: 'homelander.png', folder: 'entity', namespace: '', id: '0', particle: false,
      render_mode: 'default', render_sides: 'auto', frame_time: 1, frame_order_type: 'loop', frame_order: '',
      frame_interpolate: false, visible: true, internal: true, saved: false, uuid: uuid(),
      source: atlas.toDataURL('image/png')
    }],
    animations
  };
}

/* ───────── Mod export (#modexport) ─────────
   Everything the NeoForge mod needs to show Homelander 1:1, read by tools/export_mod_assets.ps1:
   bones (rest pose), cubes as finished quads (exact UVs of this atlas), cape cloth settings + body colliders, the eye glow / laser
   geometry, victim spots, the voice line's lip-sync curve, textures per color variant and every
   animation's raw pose (before crossfade, follow, face filter, cloth) baked at 120 fps.
   Units: texels, radians. Axes like here: +x = his left, +y = up, +z = his front. UV v goes down (Minecraft). */
const BAKE_FPS = 120;
function modExport() {
  const r6 = (n) => Math.round(n * 1e6) / 1e6 || 0;
  restPose();
  mobRoot.updateMatrixWorld(true);
  const bonesOut = boneList.map((g) => ({
    name: g.name, parent: g.parent.isGroup && B[g.parent.name] !== undefined ? B[g.parent.name] : -1,
    pos: [g.userData.rest.x, g.userData.rest.y, g.userData.rest.z].map((v) => r6(v / TEXEL)),
    rot: [g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z].map(r6)
  }));
  const v3 = new THREE.Vector3(), n3 = new THREE.Vector3(), nm = new THREE.Matrix3();
  const cubesOut = cubeList.map((c) => {
    const m = c.mesh;
    m.updateMatrix();
    nm.getNormalMatrix(m.matrix);
    const geo = m.geometry, Pa = geo.attributes.position, U = geo.attributes.uv, N = geo.attributes.normal, I = geo.index.array;
    const quads = [];
    for (let f = 0; f < 6; f++) {
      const ids = [I[f * 6], I[f * 6 + 1], I[f * 6 + 4], I[f * 6 + 2]]; // BoxGeometry quad a, b, c, d (counter-clockwise from outside)
      const vs = ids.map((i) => v3.fromBufferAttribute(Pa, i).applyMatrix4(m.matrix).divideScalar(TEXEL).toArray().map(r6));
      const e1 = new THREE.Vector3(...vs[1]).sub(new THREE.Vector3(...vs[0])), e2 = new THREE.Vector3(...vs[3]).sub(new THREE.Vector3(...vs[0]));
      if (e1.cross(e2).length() < 1e-6) continue; // the zero-width sides of a face plane
      n3.fromBufferAttribute(N, ids[0]).applyMatrix3(nm).normalize();
      quads.push({ v: vs, uv: ids.map((i) => [r6(U.getX(i)), r6(1 - U.getY(i))]), n: n3.toArray().map(r6) });
    }
    return { name: c.name, bone: B[c.bone], twoSided: m.material.alphaTest > 0, quads };
  });
  // Animations: the raw anim pose sampled at 120 fps, T included. Channels that never move are left out.
  const anims = {}, chunks = [];
  let offset = 0;
  for (const name of ALL_ANIMS) {
    const A = ANIMS[name], frames = Math.round(A.T * BAKE_FPS) + 1;
    // The mod samples frame f at f / BAKE_FPS: a length that is not a whole number of frames loses its last bit.
    if (Math.abs(A.T * BAKE_FPS - Math.round(A.T * BAKE_FPS)) > 1e-6) throw new Error(`${name}: T ${A.T} s is not a whole number of 1/${BAKE_FPS} s frames`);
    const Q = makePose(), cols = new Map();
    const put = (key, f, v) => { if (!cols.has(key)) cols.set(key, new Float64Array(frames)); cols.get(key)[f] = v; };
    for (let f = 0; f < frames; f++) {
      const t = Math.min(f / BAKE_FPS, A.T);
      clearPose(Q);
      A.fn(t, Q);
      for (let b = 0; b < NB; b++) for (let k = 0; k < 3; k++) {
        put(`r:${b}:${k}`, f, Q.r[b * 3 + k]);
        put(`p:${b}:${k}`, f, Q.p[b * 3 + k]);
      }
      for (const k of FACE_KEYS) put(`f:${k}`, f, Q.f[k]);
    }
    const channels = [];
    for (const [key, arr] of cols) {
      let lo = Infinity, hi = -Infinity;
      for (const v of arr) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
      if (!key.startsWith('f:') && hi - lo <= 1e-7 && Math.abs(lo) <= 1e-7) continue;
      // 16-bit steps between lo and hi, stored as differences from the previous frame (small numbers pack well).
      const q = new Int16Array(frames), span = hi - lo;
      let prev = 0;
      for (let f = 0; f < frames; f++) {
        const level = span > 0 ? Math.round((arr[f] - lo) / span * 65535) - 32768 : -32768;
        q[f] = level - prev; prev = level;
      }
      chunks.push(q);
      channels.push({ key, lo, hi, at: offset }); // exact lo/hi: the 16-bit levels map back without drift
      offset += frames;
    }
    anims[name] = { T: A.T, frames, yawLimit: A.yawLimit || 0.45, follow: A.follow !== undefined ? A.follow : 1, beam: A.beam || 0, events: A.events || {}, channels };
  }
  const all = new Int16Array(offset);
  let at = 0;
  for (const q of chunks) { all.set(q, at); at += q.length; }
  const bytes = new Uint8Array(all.length * 2), dv = new DataView(bytes.buffer);
  all.forEach((v, i) => dv.setInt16(i * 2, v, false)); // big-endian (Java DataInputStream)
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const textures = {};
  const keep = variantIndex;
  VARIANTS.forEach((v, i) => { setVariant(i); textures[v.id] = atlas.toDataURL('image/png'); });
  setVariant(keep);
  const col = (m) => '#' + m.color.getHexString();
  return {
    rig: {
      format: 1, fps: BAKE_FPS, atlas: [ATLAS_W, ATLAS_H], variants: VARIANTS.map((v) => v.id), animOrder: ALL_ANIMS,
      faceKeys: FACE_KEYS, bones: bonesOut, cubes: cubesOut,
      // Cape cloth (see Cloth): settings, cape bones, body boxes it collides with (bone, center, half size, rotation)
      cloth: { ...CLOTH, n: CAPE_N, seg: CAPE_SEG, top: CAPE_TOP, bones: CAPE.map((n) => B[n]),
        colliders: CLOTH_COL.map((c) => ({ name: c.name, bone: B[c.bone], c: c.center, h: c.size.map((s) => s / 2 + c.inflate), r: c.rot })) },
      // Eye glow planes and heat-vision beams (drawn by the mod in the head bone, like eyeGlow / lasers here)
      fx: {
        eyesX: [-2, 2], eyeY: 4.5, glowZ: [4.05, 4.052, 4.1], glowSize: [[2, 1], [1, 1], [3, 2]],
        glowColors: [col(glowMat), col(glowCoreMat), col(glowHaloMat)], beamZ: 4.1, beamR: [0.7, 0.28], beamSides: [8, 6],
        beamColors: [col(laserMat), col(laserCoreMat)], laserLen: LASER_LEN
      },
      victim: { hand: HAND_PT, neck: DUMMY_NECK, scale: DUMMY_SCALE, throwVy: THROW_VY, grabLift: GRAB_LIFT, spots: VICTIM },
      voice: VOICE_LINES.map((v) => ({ id: v.id, env: v.env, zcr: v.zcr })),
      anims
    },
    bin: btoa(bin), textures
  };
}

/* Reference recording for the mod's Java test (#modtrace): a fixed scene (seed 7, 1/120 s steps) with every
   animation, look angles, the Clap's voice line (mouth from its curve) and the random Idle extras (glow, Hover).
   Every 1/30 s: each bone's rotation, position (texels) and scale, plus the eye/laser effect values. */
function modTrace() {
  const S = makeSim(7), dt = 1 / 120, out = [], fx = [];
  const plan = [[0, 'idle'], [3, 'idle2'], [6, 'walk'], [8, 'attack'], [10, 'special'], [14.2, 'throw'], [17.6, 'clap'], [21.4, 'throatLaser'], [25, 'idle']];
  const end = 36; // seconds recorded (the Java test reads it); the last Idle runs into a Hover
  S.follow.on = true; S.follow.has = true; S.follow.inject = { yaw: 0, pitch: 0 };
  const line = VOICE_LINES[0];
  let talkStart = -1;
  S.onEvent = (name) => { if (name === 'voice') talkStart = S.time; };
  let p = 0, next = 0;
  for (let i = 0; i <= end * 120; i++) {
    const t = i * dt;
    while (p < plan.length && t >= plan[p][0] - 1e-9) { switchAnim(S, plan[p][1]); p++; }
    S.follow.inject.yaw = 0.6 * Math.sin(0.7 * t); S.follow.inject.pitch = 0.1 * Math.sin(0.5 * t);
    // the page's updateVoice(): mouth from the curve on the line's own clock
    const k = talkStart >= 0 ? Math.floor((S.time - talkStart) * 30) : -1;
    if (k >= line.env.length) talkStart = -1;
    S.talk.active = k >= 0 && k < line.env.length;
    if (S.talk.active) { S.talk.level = Math.min(1, parseInt(line.env[k], 36) / 35 * 1.1); S.talk.shape = +line.zcr[k] / 9; }
    step(S, dt);
    if (t >= next - 1e-9) {
      next += 1 / 30;
      const r5 = (v) => Math.round(v * 1e5) / 1e5;
      out.push(boneList.map((g) => [g.rotation.x, g.rotation.y, g.rotation.z, g.position.x / TEXEL, g.position.y / TEXEL, g.position.z / TEXEL, g.scale.x, g.scale.y, g.scale.z].map(r5)));
      fx.push([glowMat.opacity, glowCoreMat.opacity, glowHaloMat.opacity, laserMat.opacity, lasers[0].beam.scale.x, eyeGlow[0].core.position.x / TEXEL + 2].map(r5));
    }
  }
  return { dt, every: 1 / 30, end, plan, frames: out, fx };
}

/* ───────── Voice line ─────────
   sounds/homelander/i_am_god: .ogg (also used by the mod) and .mp3 (browsers without Ogg Vorbis).
   It plays when the Clap passes its events.voice time (0.3 s), or on key V (any animation).
   The mouth follows a loudness curve made beforehand with tools/lipsync.html (30 values per second):
   live audio analysis gives zeros on file:// pages. env: loudness 0-35 (base 36 digit), zcr: brightness 0-9.
   The curve runs on its own clock, so the mouth moves the same with the sound muted or still locked
   (browsers allow sound only after the first click or key) - and the same as in the mod. */
const VOICE_LINES = [
  { id: 'i_am_god', src: '../../sounds/homelander/i_am_god',
    env: '6iuyzzvsssmdbfmtutsstsstkb9aa635ivywuttvzzzyutqkjha5321100000000',
    zcr: '5232222451135442233433100369855552333333222233244545555555555555' }
];
// vol: 0.6 by default; the dock slider changes it (saved in this browser).
const voice = { on: true, unlocked: false, line: null, start: 0, anim: null, audio: null, vol: 0.6 };
try { const s = localStorage.getItem('homelander.voiceVol'); if (s !== null && isFinite(+s)) voice.vol = clamp(+s, 0, 1); } catch (e) { /* storage blocked: keep the default */ }
const AUDIO_EXT = new Audio().canPlayType('audio/ogg; codecs="vorbis"') ? '.ogg' : '.mp3';
VOICE_LINES.forEach((v) => { v.audio = new Audio(v.src + AUDIO_EXT); v.audio.preload = 'auto'; v.audio.volume = voice.vol; });

// Start a line now: S = the sim whose mouth it drives; anim = stop it when this animation ends ('' = never).
function sayLine(S, id = 'i_am_god', anim = '') {
  const v = VOICE_LINES.find((l) => l.id === id);
  if (!v) return;
  stopLine();
  voice.line = v; voice.start = S.time; voice.anim = anim;
  if (voice.on && voice.unlocked) { v.audio.currentTime = 0; v.audio.play().catch(() => {}); }
}
function stopLine() {
  if (voice.line) voice.line.audio.pause();
  voice.line = null;
}
// Every frame, before step(): feed the mouth from the line's curve at the line's own clock.
function updateVoice(S) {
  const v = voice.line, T = S.talk;
  if (v && voice.anim && S.anim !== voice.anim) stopLine();   // the attack was cut off: so is the shout

    mobRoot.updateMatrixWorld(true);

/* ───────── Per frame ─────────

function updateDummy(S, dt) {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ───────── 60/120 FPS Locked Render Loop ───────── */
let targetHz = 60, measuring = true, lastNow = 0, lastRender = 0;
const intervals = [];

function frame(now) {
  requestAnimationFrame(frame);
  if (measuring) {
    if (lastNow) intervals.push(now - lastNow);
    lastNow = now;
    if (intervals.length >= 30) {
      const sorted = intervals.slice().sort((a, b) => a - b);
      targetHz = 1000 / sorted[15] >= 110 ? 120 : 60;
      measuring = false;
    }
  } else {
    const interval = 1000 / targetHz;
    if (now < lastRender + interval - 1) return;
  }
  const dt = lastRender ? Math.min((now - lastRender) / 1000, 0.1) : 1 / 60;
  lastRender = measuring ? now : Math.max(lastRender + 1000 / targetHz, now - 1000 / targetHz);

  updateVoice(sim);
  updateSfx(sim);
  step(sim, dt);
  updateDummy(sim, dt);
  if (rigView.on) rigView.update();

  if (resetting) {
    const k = filt(dt, 8);
    camera.position.lerp(CAM_POS, k);
    controls.target.lerp(CAM_TARGET, k);
    if (camera.position.distanceTo(CAM_POS) < 0.005 && controls.target.distanceTo(CAM_TARGET) < 0.005) resetting = false;
  }
  controls.dampingFactor = filt(dt, 4.5);
  controls.update();
  renderer.render(scene, camera);
}

setVariant(0);

/* ───────── Self-Tests & Headless Testing ───────── */
function restPose() {
  boneList.forEach((g) => {
    g.rotation.copy(new THREE.Euler(g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z, 'ZYX'));
    g.position.copy(g.userData.rest);
    g.scale.set(1, 1, 1);
  });
}

function clipTest() {
  const meshes = cubeList.map((c) => c.mesh);
  const inv = meshes.map(() => new THREE.Matrix4());
  const half = cubeList.map((c) => c.size.map((s) => (Math.abs(s) / 2 + c.inflate) * TEXEL));
  const pts = cubeList.map((c, i) => {
    const [hx, hy, hz] = half[i], list = [];
    for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++) {
      const u = -1 + a * 0.5, v = -1 + b * 0.5;
      list.push([hx, u * hy, v * hz], [-hx, u * hy, v * hz], [u * hx, hy, v * hz], [u * hx, -hy, v * hz], [u * hx, v * hy, hz], [u * hx, v * hy, -hz]);
    }
    return list.map((p) => new THREE.Vector3(...p));
  });
  const radius = half.map((h) => Math.hypot(h[0], h[1], h[2]) * 2.2);
  const centers = meshes.map(() => new THREE.Vector3());
  const EPS = 0.06, LAYER = 0.15;
  const wp = new THREE.Vector3(), lp = new THREE.Vector3();

  function depthInside(j, p) {
    const [hx, hy, hz] = half[j];
    const dx = hx - Math.abs(p.x), dy = hy - Math.abs(p.y), dz = hz - Math.abs(p.z);
    if (dx <= 0 || dy <= 0 || dz <= 0) return 0;
    return Math.min(dx, dy, dz);
  }

  function measure() {
    mobRoot.updateMatrixWorld(true);
    meshes.forEach((m, i) => { inv[i].copy(m.matrixWorld).invert(); centers[i].setFromMatrixPosition(m.matrixWorld); });
    const res = new Map();
    for (let i = 0; i < meshes.length; i++) for (let j = 0; j < meshes.length; j++) {
      if (i === j || cubeList[i].bone === cubeList[j].bone) continue;
      if (centers[i].distanceTo(centers[j]) > radius[i] + radius[j]) continue;
      let worst = 0;
      for (const p of pts[i]) {
        wp.copy(p).applyMatrix4(meshes[i].matrixWorld);
        lp.copy(wp).applyMatrix4(inv[j]);
        const d = depthInside(j, lp);
        if (d > worst) worst = d;
      }
      if (worst > 0) res.set(i + ':' + j, worst / TEXEL);
    }
    return res;
  }

  const JOINTS = [
    [/^(thigh_|calf_|boot_)/, /^torso_suit$/],
    [/^(calf_|boot_)/, /^thigh_/],
    [/^(lower_arm_|gauntlet_)/, /^(upper_arm_|pauldron_)/],
    [/^(upper_arm_|pauldron_)/, /^(torso_suit|head_cranium)$/],
    [/^head_cranium$/, /^torso_suit$/],
    [/^cape_seg_([1-9]|10)$/, /^(torso_suit|head_cranium|hair_main|pauldron_|upper_arm_)/],   // shoulders (top 4 texels = 10 bones)
    ...CAPE.slice(1).map((n, i) => [new RegExp(`^${n}$`), new RegExp(`^${CAPE[i]}$`)]) // each bone with the one above
  ];
  const isJoint = (a, b) => JOINTS.some(([x, y]) => (x.test(a) && y.test(b)) || (x.test(b) && y.test(a)));

  restPose();
  const baseline = measure();
  const report = {
    cubes: cubeList.length, bones: NB, atlas: [ATLAS_W, ATLAS_H],
    clips: {}, joints: {}, ground: {},
    layeredAtRest: [...baseline].filter(([, d]) => d > EPS).map(([k, d]) => k.split(':').map((i) => cubeList[i].name).join(' / ') + ' ' + d.toFixed(2))
  };

  const boots = cubeList.filter((c) => /^boot_/.test(c.name));
  const corner = new THREE.Vector3();
  const mice = [[0, 0], [-0.95, 0], [0.95, 0], [0, 0.95], [0, -0.95]];

  for (const name of ALL_ANIMS) {
    let low = 99;
    for (const [, [mx, my]] of mice.entries()) {
      const S = makeSim(99);
      S.anim = name;
      S.events = false; // no random anim switches while testing one animation
      Object.assign(S.follow, { on: true, has: true, mx, my });
      const dt = 1 / 120;
      for (let t = 0; t < ANIMS[name].T; t += dt) step(S, dt);
      let since = 0;
      for (let t = 0; t < ANIMS[name].T * 2; t += dt) {
        step(S, dt);
        since += dt;
        if (since < 1 / 20) continue;
        since = 0;
        for (const [key, d] of measure()) {
          const base = baseline.get(key) || 0;
          const [i, j] = key.split(':').map(Number);
          const a = cubeList[i].name, b = cubeList[j].name;
          const joint = isJoint(a, b);
          if (!joint && d <= (base > EPS ? base + LAYER : EPS)) continue;
          if (joint && d <= base + EPS) continue;
          const bucket = joint ? report.joints : report.clips;
          const id = `${a} in ${b}`;
          if (!bucket[id] || bucket[id].depth < d) bucket[id] = { depth: +d.toFixed(3), rest: +base.toFixed(3), anim: name };
        }
        for (const c of boots) {
          const [hx, hy, hz] = half[cubeList.indexOf(c)];
          for (let k = 0; k < 8; k++) {
            corner.set(k & 1 ? hx : -hx, k & 2 ? hy : -hy, k & 4 ? hz : -hz).applyMatrix4(c.mesh.matrixWorld);
            low = Math.min(low, corner.y / TEXEL);
          }
        }
      }
    }
    report.ground[name] = +low.toFixed(3);
  }

  // Victim clipping: the test dummy against his cubes in every attack (both directions, 5x5 points per face).
  // Hands on the victim's head/neck are the attack itself ("contact"); everything else counts as a clip.
  const dMeshes = [];
  dummy.root.traverse((o) => { if (o.isMesh) dMeshes.push(o); });
  const dHalf = dMeshes.map((m) => [m.geometry.parameters.width / 2, m.geometry.parameters.height / 2, m.geometry.parameters.depth / 2]);
  const dInv = dMeshes.map(() => new THREE.Matrix4());
  const grid = (h) => { const l = []; for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++) { const u = -1 + a * 0.5, v = -1 + b * 0.5; l.push([h[0], u * h[1], v * h[2]], [-h[0], u * h[1], v * h[2]], [u * h[0], h[1], v * h[2]], [u * h[0], -h[1], v * h[2]], [u * h[0], v * h[1], h[2]], [u * h[0], v * h[1], -h[2]]); } return l.map((p) => new THREE.Vector3(...p)); };
  const dPts = dHalf.map(grid);
  const inside = (h, p) => { const dx = h[0] - Math.abs(p.x), dy = h[1] - Math.abs(p.y), dz = h[2] - Math.abs(p.z); return dx > 0 && dy > 0 && dz > 0 ? Math.min(dx, dy, dz) : 0; };
  const HAND = /^(lower_arm_|gauntlet_)/;
  report.victim = { clips: {}, contact: {} };
  const keepDummy = { shown: dummy.shown, opacity: dummy.opacity };
  for (const name of Object.keys(VICTIM)) {
    const S = makeSim(99); S.anim = name; S.events = false; S.follow.on = false;
    dummy.shown = name;
    for (let t = 0, since = 1; t < ANIMS[name].T; t += 1 / 120) {
      step(S, 1 / 120); since += 1 / 120;
      if (since < 1 / 20) continue;
      since = 0;
      dummy.opacity = 1; updateDummy(S, 0);
      if (!dummy.root.visible) continue;
      dummy.root.updateMatrixWorld(true); mobRoot.updateMatrixWorld(true);
      meshes.forEach((m, i) => inv[i].copy(m.matrixWorld).invert());
      dMeshes.forEach((m, j) => dInv[j].copy(m.matrixWorld).invert());
      for (let j = 0; j < dMeshes.length; j++) for (let i = 0; i < meshes.length; i++) {
        let worst = 0;
        for (const p of dPts[j]) { wp.copy(p).applyMatrix4(dMeshes[j].matrixWorld).applyMatrix4(inv[i]); worst = Math.max(worst, inside(half[i], wp)); }
        for (const p of pts[i]) { wp.copy(p).applyMatrix4(meshes[i].matrixWorld).applyMatrix4(dInv[j]); worst = Math.max(worst, inside(dHalf[j], wp)); }
        if (worst / TEXEL <= EPS) continue;
        const contact = HAND.test(cubeList[i].name) && (S.t % ANIMS[name].T) >= (ANIMS[name].events.grab || 1e9) - 0.05;
        const bucket = contact ? report.victim.contact : report.victim.clips;
        const id = `${cubeList[i].name} / dummy#${j} (${name})`;
        if (!bucket[id] || bucket[id].depth < worst / TEXEL) bucket[id] = { depth: +(worst / TEXEL).toFixed(3), t: +(S.t % ANIMS[name].T).toFixed(2) };
      }
    }
  }
  Object.assign(dummy, keepDummy);

  const bb = buildBBModel();
  const badUV = bb.elements.filter((e) => Object.values(e.faces).some((f) => f.uv.some((v, k) => v < 0 || v > (k % 2 ? ATLAS_H : ATLAS_W)))).map((e) => e.name);
  report.export = {
    elements: bb.elements.length, badUV,
    animations: bb.animations.map((a) => ({ name: a.name, bones: Object.keys(a.animators).length, keyframes: Object.values(a.animators).reduce((n, x) => n + x.keyframes.length, 0) })),
    bytes: JSON.stringify(bb).length
  };

  const out = document.createElement('pre');
  out.id = 'cliptest';
  out.textContent = JSON.stringify(report, null, 1);
  document.body.appendChild(out);
}

function dumpFrame() {
  controls.update();
  renderer.render(scene, camera);
  const out = document.createElement('pre');
  out.id = 'shot';
  out.textContent = canvas.toDataURL('image/png');
  document.body.appendChild(out);
}

function shot(anim, variant, secs) {
  setVariant(variant);
  sim.anim = anim;
  sim.events = false;
  Object.assign(sim.follow, { has: true, mx: 0.25, my: 0.15 });
  if (anim === 'special') {
    camera.position.set(2.8, 2.2, 3.4);
    controls.target.set(0, 1.45, 0);
  }
  for (let t = 0; t < secs; t += 1 / 60) step(sim, 1 / 60);
  dumpFrame();
}

/* #strip-<anim>-<variant>-<from>-<to>-<step>[-<camDeg>[-<dist>]]: one JPEG filmstrip of an animation with the
   test dummy (fixed seed: same frames every run). camDeg = camera angle around him (0 = front, 90 = his left side),
   dist = camera distance in blocks. Result: data URL in <pre id="strip">. */
function strip(anim, variant, from, to, stepS, camDeg = 35, dist = 3.8) {
  setVariant(variant);
  sim = hookSim(makeSim(5));
  sim.events = false; sim.anim = anim; sim.follow.has = false;
  const victim = !!VICTIM[anim];                  // only attacks have a victim
  dummy.shown = victim ? anim : null; dummy.opacity = victim ? 1 : 0;
  const a = camDeg * Math.PI / 180, tgt = CAM_TARGET.clone();
  camera.position.set(tgt.x + Math.sin(a) * dist, tgt.y + 0.25, tgt.z + Math.cos(a) * dist);
  controls.target.copy(tgt); controls.update();
  const times = [];
  for (let t = from; t <= to + 1e-6; t += stepS) times.push(t);
  const TW = 240, cols = Math.min(times.length, 6), rows = Math.ceil(times.length / cols);
  const out = document.createElement('canvas'); out.width = cols * TW; out.height = rows * TW;
  const g = out.getContext('2d');
  g.fillStyle = '#0f1115'; g.fillRect(0, 0, out.width, out.height);
  let simT = 0;
  times.forEach((t, k) => {
    while (simT < t - 1e-6) { const dt = Math.min(1 / 120, t - simT); updateVoice(sim); step(sim, dt); simT += dt; }
    if (victim) { dummy.opacity = 1; updateDummy(sim, 0); }
    renderer.render(scene, camera);
    const s = Math.min(canvas.width, canvas.height);
    g.drawImage(canvas, (canvas.width - s) / 2, (canvas.height - s) / 2, s, s, (k % cols) * TW, Math.floor(k / cols) * TW, TW, TW);
    g.fillStyle = '#facc15'; g.font = '14px sans-serif'; g.fillText(t.toFixed(2), (k % cols) * TW + 4, Math.floor(k / cols) * TW + 16);
  });
  const pre = document.createElement('pre'); pre.id = 'strip'; pre.textContent = out.toDataURL('image/jpeg', 0.7);
  document.body.appendChild(pre);
}

window.setVariant = setVariant;
window.selectAnim = selectAnim;
window.homelanderDebug = { cubeList, bones, boneList, atlas, get sim() { return sim; }, ANIMS, camera, controls, dumpFrame, setVariant, selectAnim, buildBBModel, rigView, toggleBones, makeSim, step, HB, VICTIM, dummy, voice };
// Headless JSON modes (tools/export_mod_assets.ps1, .bbmodel save): the result goes into <pre id="...">.
const dumpJson = (id, obj) => { const pre = document.createElement('pre'); pre.id = id; pre.textContent = JSON.stringify(obj); document.body.appendChild(pre); };
if (location.hash === '#cliptest') clipTest();
else if (location.hash === '#modexport') dumpJson('modexport', modExport());
else if (location.hash === '#modtrace') dumpJson('modtrace', modTrace());
else if (location.hash === '#bbmodel') dumpJson('bbmodel', buildBBModel());
else if (location.hash === '#rest') { restPose(); dumpFrame(); }
else if (location.hash === '#back') { restPose(); camera.position.set(0, 1.7, -3.6); controls.target.set(0, 1.05, 0); dumpFrame(); }
else if (location.hash.startsWith('#shot')) { const [, a, v, s] = location.hash.split('-'); shot(a, +v, +s); }
else if (location.hash.startsWith('#strip')) { const [, a, v, f, t, s, c, d] = location.hash.split('-'); strip(a, +v, +f, +t, +s, c === undefined ? 35 : +c, d === undefined ? 3.8 : +d); }
else requestAnimationFrame(frame);
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homelander - 3D Vanilla+ Minecraft Model Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!--
    Homelander - 3D Vanilla+ Minecraft Model Viewer
    - Box model, 1 unit = 1 texel: head 8x8x8, torso 9x12x5, 2-bone arms and legs (see js/rig.js).
    - Blonde hair shell, gold eagle pauldrons and belt, copper bracers, red gloves and boots,
      American flag cape with 50 bones, moved only by cloth physics (gravity, air, breeze, body collisions).
    - Animations (keys 1-8): Idle, Idle 2, Walk, Attack (super punch), Special (levitation + heat vision),
      Throw (neck grab, fling up), Clap ("I AM GOD" + head clap, with the voice line), Throat Laser;
      Hover plays by itself from Idle now and then.
    - Test dummy (key D) = the victim of every attack; voice line on/off + volume (key V = say it).
    - Same UI as every mob (#0f1115), Show bones (B); the mod gets everything 1:1 through #modexport.
    - Code in js/ (classic scripts, loaded in order below).
  -->

  <style>
    /* ───────── Tokens ───────── */
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --pill: rgba(20, 23, 30, 0.82);
      --line: rgba(255, 255, 255, 0.09);
      --text: rgba(255, 255, 255, 0.62);
      --text-hi: #ffffff;
      --accent: #3b82f6;
      --accent-bg: rgba(59, 130, 246, 0.22);
      --accent-text: #bfdbfe;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ───────── Page ───────── */
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text-hi); font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    #viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
    #viewport:active { cursor: grabbing; }

    /* ───────── Glass pills ───────── */
    .pill {
      background: var(--pill);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border-radius: 999px;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .icon-btn {
      height: 36px; min-width: 36px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      color: var(--text); font-size: 12px; font-weight: 500;
      transition: color .2s, background .2s, transform .2s cubic-bezier(.22, 1, .36, 1);
    }
    .icon-btn:hover { color: var(--text-hi); transform: translateY(-1px); }
    .icon-btn:active { transform: scale(.97); }
    .icon-btn svg { width: 16px; height: 16px; flex: none; }
    #resetBtn { padding: 0; width: 36px; }

    /* ───────── Top right: download + reset ───────── */
    #topRight { position: fixed; top: 16px; right: 16px; z-index: 20; display: flex; gap: 8px; }

    /* ───────── Bottom dock ───────── */
    #dock {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 4px; padding: 6px; max-width: calc(100vw - 32px);
    }
    .anim-btn {
      padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: .02em;
      color: var(--text); border: 1px solid transparent; white-space: nowrap;
      transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
    }
    .anim-btn:hover { color: var(--text-hi); }
    .anim-btn.active { color: var(--accent-text); background: var(--accent-bg); border-color: rgba(59, 130, 246, .45); box-shadow: 0 0 18px rgba(59, 130, 246, .24); }
    .anim-btn kbd { font: inherit; opacity: .45; margin-right: 6px; }
    .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
    #followBtn, #voiceBtn, #dummyBtn, #bonesBtn { width: 32px; height: 32px; min-width: 32px; padding: 0; border-radius: 999px; }
    #followBtn.on, #voiceBtn.on, #dummyBtn.on, #bonesBtn.on { color: var(--accent-text); background: var(--accent-bg); }
    #voiceVol { width: 60px; margin: 0 4px 0 2px; accent-color: var(--accent); cursor: pointer; }
    #voiceVol:disabled { opacity: .35; cursor: default; }
    .dot {
      width: 18px; height: 18px; border-radius: 999px; margin: 0 3px;
      border: 2px solid rgba(255, 255, 255, .18); transition: transform .2s, border-color .2s;
    }
    .dot:hover { transform: scale(1.12); }
    .dot.active { border-color: var(--accent); }


    @media (max-width: 540px) {
      .anim-btn { padding: 7px 10px; }
      .anim-btn kbd { display: none; }
      #voiceVol { width: 44px; }
    }
  </style>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <!-- Top right: camera reset -->
  <div id="topRight">
    <button id="resetBtn" class="pill icon-btn" title="Reset camera (R)" aria-label="Reset camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>


  <!-- Bottom dock: animations, follow toggle, color variants -->
  <nav id="dock" class="pill" aria-label="Viewer controls">
    <button class="anim-btn active" data-anim="idle"><kbd>1</kbd>Idle</button>
    <button class="anim-btn" data-anim="idle2"><kbd>2</kbd>Idle 2</button>
    <button class="anim-btn" data-anim="walk"><kbd>3</kbd>Walk</button>
    <button class="anim-btn" data-anim="attack"><kbd>4</kbd>Attack</button>
    <button class="anim-btn" data-anim="special"><kbd>5</kbd>Special</button>
    <button class="anim-btn" data-anim="throw"><kbd>6</kbd>Throw</button>
    <button class="anim-btn" data-anim="clap"><kbd>7</kbd>Clap</button>
    <button class="anim-btn" data-anim="throatLaser"><kbd>8</kbd>Throat Laser</button>
    <span class="sep"></span>
    <button id="followBtn" class="icon-btn on" title="Head and eyes follow the mouse" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <!-- Sound on/off (I AM GOD voice line in the Clap + attack sound effects) + volume. Key V = shout the line now. -->
    <button id="voiceBtn" class="icon-btn on" title="Sound on/off (V = say I AM GOD now)" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
    <input id="voiceVol" type="range" min="0" max="100" value="60" title="Volume: 60%" aria-label="Volume">
    <!-- Test dummy: the victim of the attacks (grabbed, thrown, lasered, clapped). Key D. -->
    <button id="dummyBtn" class="icon-btn on" title="Show test dummy (D)" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M7 10h10v6H7zM9 16v6M15 16v6M7 10l-3 5M17 10l3 5"/></svg>
    </button>
    <!-- Show the rig: a dot on every bone pivot + a line to its parent. Key B. -->
    <button id="bonesBtn" class="icon-btn" title="Show bones (B)" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><circle cx="7" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="9" cy="20" r="1.6"/><circle cx="15" cy="20" r="1.6"/><path d="M12 6v8M12 8l-5 4M12 8l5 4M12 14l-3 6M12 14l3 6"/></svg>
    </button>
    <span class="sep"></span>
    <span id="dots"></span>
  </nav>

  <script>
    window.__errors = [];
    window.onerror = (m, u, l, c, e) => window.__errors.push({ m, u, l, c, s: e ? e.stack : '' });
    window.addEventListener('unhandledrejection', (e) => window.__errors.push({ m: String(e.reason) }));
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    window.THREE = THREE; // tools and the shared viewer script use the global

/* ───────── Renderer, scene, camera ───────── */
const canvas = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
scene.fog = new THREE.FogExp2(0x0f1115, 0.016);

const TEXEL = 1 / 16; // 1 unit = 1 texel, 16 texels per Minecraft block (1m)

const CAM_POS = new THREE.Vector3(2.4, 1.75, 2.9);
const CAM_TARGET = new THREE.Vector3(0, 1.05, 0);
const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.copy(CAM_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CAM_TARGET);
controls.enableDamping = true;
controls.minDistance = 1.2;
controls.maxDistance = 7.5;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ───────── Lighting ───────── */
scene.add(new THREE.HemisphereLight(0xfff5ea, 0x141824, 0.95));

const keyLight = new THREE.DirectionalLight(0xfff8ee, 2.45);
keyLight.position.set(3.6, 6.2, 4.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 18;
keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -2.5;
keyLight.shadow.camera.right = keyLight.shadow.camera.top = 2.5;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.radius = 3.2;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.95);
rimLight.position.set(-3.6, 3.2, -3.6);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xfef08a, 0.38);
fillLight.position.set(-2.6, 1.5, 3.0);
scene.add(fillLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.ShadowMaterial({ opacity: 0.45 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ───────── Color Palettes ───────── */
const BASE = {
  // Skin: Rich dimensional tones matching The King (micro-shading, rosy cheeks & nose tip)
  skin: '#e5af95', skinLight: '#f4c7b0', skinBase: '#e5af95', skinWarm: '#d6977b',
  skinRosy: '#d98473', skinShadow: '#b8765c', lidSkin: '#cd8a6e',
  eyeWhite: '#f8fafc', eyePupil: '#1f5f9e', eyeIris: '#0284c7',
  browHair: '#8a6431', lipLine: '#a36456', lipSmirk: '#a8655a', teeth: '#f3efe4',
  // Blonde hair: natural golden blonde from the photos (less lemon-yellow)
  hairLight: '#f0d68a', hairGolden: '#dcb862', hairBase: '#c89f4a', hairWarm: '#a98236', hairDark: '#7d5c26', hairNape: '#5c4219',
  // Suit: royal blue with a fine scale texture (photos), not navy
  suitLight: '#3b62a6', suitBase: '#2c4f8f', suitDark: '#1d3767', suitDeep: '#142951',
  suitTexture: '#264682', suitPipingRed: '#c8343a', suitPipingDark: '#8f1f26',
  // Antique gold eagle armor (pauldrons & belt)
  goldLight: '#f3d47e', goldBright: '#dcae4a', goldBase: '#c08f32', goldWarm: '#9a6c22', goldDark: '#5e4013',
  // Copper scale bracers on the forearms
  bronzeLight: '#da8b52', bronzeBase: '#b9662f', bronzeWarm: '#95491f', bronzeDark: '#5f2b13',
  // Deep red leather gloves & boots
  crimsonLight: '#d2413a', crimsonBase: '#b3262a', crimsonWarm: '#931c22', crimsonDark: '#5f1216', crimsonSole: '#3d1612',
  // Cape: US flag (star yoke + equal red/white stripes, striped inside too)
  capeBlueDark: '#1b2f63', capeBlueBase: '#253f82', capeStarWhite: '#ffffff',
  capeRedBase: '#b8262c', capeRedDark: '#8e1b21',
  capeWhiteBase: '#f1f1ec', capeWhiteShade: '#d9d9d2',
  capeLining: '#f1f5f9'
};

const VARIANTS = [
  { id: 'classic', name: 'Classic (Show)', pal: {} },
  { id: 'damaged', name: 'Battle Damaged', pal: {
    suitLight: '#2d4677', suitBase: '#213a68', suitTexture: '#1b315a', suitDark: '#142647', suitDeep: '#0e1b34',
    skinLight: '#e4bcab', skinBase: '#d4a28f', skinWarm: '#c48974',
    skinRosy: '#bf7969', skinShadow: '#9c6654', skin: '#d4a28f', lidSkin: '#c48974',
    goldBase: '#a07428', goldWarm: '#7c5419', goldDark: '#4a3210',
    bronzeBase: '#96522a', bronzeWarm: '#743a1a',
    crimsonBase: '#962024', crimsonWarm: '#7a181d', crimsonDark: '#4c0e11',
    capeRedBase: '#962024', capeRedDark: '#6e161a', capeWhiteBase: '#c9c7bd', capeWhiteShade: '#b3b1a7'
  } },
  { id: 'comic', name: 'Comic Book', pal: {
    suitLight: '#4a86e0', suitBase: '#2f6bc9', suitDark: '#1f4f9e', suitTexture: '#3a78d6', suitDeep: '#173d7c',
    skinLight: '#ffe0cf', skinBase: '#ffceb4', skinWarm: '#f6b89c',
    skinRosy: '#f89e90', skinShadow: '#d88e76', skin: '#ffceb4', lidSkin: '#f6b89c',
    hairBase: '#fde047', hairGolden: '#facc15', hairLight: '#fef9c3',
    goldBright: '#fef08a', goldBase: '#facc15', goldWarm: '#eab308',
    crimsonLight: '#f87171', crimsonBase: '#ef4444', crimsonWarm: '#dc2626',
    capeBlueBase: '#2563eb', capeRedBase: '#ef4444'
  } }
];

let P = { ...BASE };

/* ───────── Texture Painters ───────── */
function hash2D(x, y, seed = 1) {
  const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
  return n - Math.floor(n);
}
function px(ctx, x, y, col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
const flat = (key) => (ctx, f, w, h) => { ctx.fillStyle = P[key]; ctx.fillRect(0, 0, w, h); };

// Head base (8x8x8): Rich dimensional skin tones with micro-shading, rosy cheeks & jawline depth (matching The King)
function paintHead(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const n = hash2D(x, y, 13);
      let col = n > 0.55 ? P.skinBase : P.skinWarm;

      if (face === 'front') {
        if (y <= 1) col = P.skinLight; // forehead light
        if (y === 4 && (x === 1 || x === 6)) col = P.skinRosy; // rosy cheekbones
        if (y === 5 && (x === 1 || x === 6)) col = P.skinShadow; // cheek shadows
        // Painted player-style nose (no block): lit right side (key light is on +x), shaded left
        if (y === 4 && x === 3) col = P.skinWarm;
        if (y === 4 && x === 4) col = P.skinLight;
        if (y === 5 && x >= 2 && x <= 5) col = (x === 3 || x === 4) ? P.skinWarm : P.skinLight; // soft shade under the nose, lit cheeks beside it
        if (y === 6 && (x === 2 || x === 5)) col = P.skinShadow; // mouth corners (the lip line itself is the mouth plane, like The King)
        if (y === 7) col = (x >= 2 && x <= 5) ? P.skinWarm : P.skinShadow; // strong square chin, dark jaw corners
      } else if (face === 'left' || face === 'right') {
        const fromFront = (face === 'right') ? x : (w - 1 - x);
        if (fromFront >= 4) {
          // Short tapered sides: combed strands, darker toward the nape
          const streak = hash2D(fromFront, 0, 7) > 0.5;
          col = y <= 5 ? (streak ? P.hairBase : P.hairWarm) : (y === 6 ? (streak ? P.hairWarm : P.hairDark) : P.hairDark);
        } else if (fromFront === 3 && y >= 2 && y <= 5) {
          col = P.hairGolden;
        } else if (fromFront === 2 && (y === 3 || y === 4)) {
          col = P.skinRosy;
        }
      } else if (face === 'top') {
        col = (x % 2 === 0) ? P.hairLight : P.hairGolden;
      } else if (face === 'back') {
        // Back of the head below the hair shell: same combed strands as the shell, tapering
        // into a short dark nape (photos: neat short back)
        const streak = hash2D(x, 0, 7) > 0.5;
        if (y <= 5) col = streak ? P.hairBase : P.hairWarm;
        else if (y === 6) col = streak ? P.hairWarm : P.hairDark;
        else col = streak ? P.hairDark : P.hairNape;
      } else if (face === 'bottom') {
        col = P.skinShadow;
      }
      px(ctx, x, y, col);
    }
  }
}

// Blonde Hair Outer Shell (8x5x8 with 0.25 inflate, cut: true):
// Authentic pomaded slicked-back hairstyle with crisp left part, combed front-to-back crown,
// and neat tapered sides/nape ending cleanly above the neckline.
function paintHair(ctx, face, w, h) {
  ctx.clearRect(0, 0, w, h);
  if (face === 'bottom') return; // open underneath so neck/head fits

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let filled = false;
      let col = P.hairGolden;

      if (face === 'top') {
        // Crown: Hair combed straight back from forehead (y=0) to back of head (y=7)
        filled = true;
        if (x === 2) {
          // Side parting line: honey-warm comb division
          col = P.hairWarm;
        } else if (x === 0 || x === 1) {
          // Right side of part: combed straight back
          col = (x === 1) ? P.hairLight : ((y <= 2) ? P.hairLight : P.hairGolden);
        } else {
          // Main combed-over volume to the left: parallel combed strands
          if (x === 3 || x === 5) {
            col = (y <= 4) ? P.hairLight : P.hairGolden; // bright platinum highlights
          } else if (x === 4 || x === 6) {
            col = (y >= 5) ? P.hairWarm : P.hairGolden; // warm golden lock
          } else {
            col = (y >= 4) ? P.hairWarm : P.hairGolden; // outer crest
          }
        }
      } else if (face === 'front') {
        // Front hairline: slicked back across top edge ONLY.
        // No hanging sideburn strips: face is completely clear and open.
        if (y === 0) {
          filled = true;
          if (x === 2) col = P.hairWarm; // soft honey parting groove
          else if (x === 3 || x === 5) col = P.hairLight;
          else if (x === 0 || x === 7) col = P.hairWarm;
          else col = P.hairGolden;
        }
      } else if (face === 'left' || face === 'right') {
        // Sides: Hair combed horizontally back tight against the head, clean temple/ears
        const fromFront = (face === 'right') ? x : (w - 1 - x);
        if (y === 0) {
          filled = true;
          col = (fromFront <= 2) ? P.hairLight : P.hairGolden;
        } else if (y === 1) {
          filled = true;
          col = (fromFront >= w - 3) ? P.hairWarm : P.hairGolden;
        } else if (y === 2) {
          if (fromFront >= 2) {
            filled = true;
            col = (fromFront >= w - 2) ? P.hairDark : P.hairWarm;
          }
        } else if (y === 3) {
          if (fromFront >= 3) {
            filled = true;
            col = (fromFront >= w - 2) ? P.hairDark : P.hairWarm;
          }
        } else if (y === 4) {
          if (fromFront >= 4) {
            filled = true;
            col = P.hairDark;
          }
        }
      } else if (face === 'back') {
        // Back: vertical combed strands (one tone per column), lighter on top,
        // flowing into the head's back face below (same column hash)
        filled = true;
        const streak = hash2D(x, 0, 7) > 0.5;
        if (y <= 1) col = streak ? P.hairLight : P.hairGolden;
        else if (y <= 3) col = streak ? P.hairGolden : P.hairBase;
        else col = streak ? P.hairBase : P.hairWarm;
      }

      if (filled) px(ctx, x, y, col);
    }
  }
}

// Suit fabric: fine scale texture from the photos. Mostly base blue, sparse darker scale
// edges and rare light glints (hash noise, so no harsh checkerboard).
function suitCol(x, y, seed = 3) {
  const n = hash2D(x, y, seed);
  return n < 0.28 ? P.suitTexture : n > 0.9 ? P.suitLight : P.suitBase;
}

// Torso Suit (9x12x5): royal blue scale suit with sculpted chest + abs (photos).
// Front: plain blue neckline (no collar, user request), one red piping line across the upper chest
// (y 1, out to his left shoulder) that turns straight down on his right chest
// (viewer's left, x 2) to the belt, like the show suit (photos).
function paintTorso(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const weave = hash2D(x, y, 9) < 0.5;
      let col = suitCol(x, y);

      if (face === 'front') {
        const isLeftPec = (x >= 2 && x <= 3);
        const isRightPec = (x >= 5 && x <= 7);
        const pipe = (y === 1 && x >= 2 && x <= 7) || (x === 2 && y >= 1 && y <= 9);

        if (pipe) {
          col = y >= 7 ? P.suitPipingDark : P.suitPipingRed; // red piping, darker low on the flank
        } else if (y === 0) {
          // Clavicle line under the head
          col = (x === 0 || x === 8) ? P.suitDark : P.suitLight;
        } else if (y === 1 || y === 2) {
          // Upper Pectorals: prominent muscular chest crests with highlight sheen
          if (x === 4) col = P.suitDark; // center sternum groove
          else if (x === 0 || x === 8) col = P.suitDark; // flank contour
          else if (isLeftPec || isRightPec) col = weave ? P.suitLight : P.suitBase;
        } else if (y === 3) {
          // Mid Pectorals: full chest volume
          if (x === 4) col = P.suitDark;
          else if (x === 0 || x === 8) col = P.suitDark;
          else if (isLeftPec || isRightPec) col = weave ? P.suitBase : P.suitTexture;
        } else if (y === 4) {
          // Lower Pectoral Shelf: curved anatomical crease defining lower pectoral border
          if (x === 4) col = P.suitDeep; // epigastric fossa
          else if (isLeftPec || isRightPec) col = P.suitDark; // under-pec shadow crease
          else col = P.suitDark;
        } else if (y >= 5 && y <= 9) {
          // Six-pack Abdominals & Obliques:
          // Linea alba center groove at x=4, lateral ab borders at x=2 and x=6
          if (x === 4) {
            col = P.suitDark; // vertical center line
          } else if (x === 0 || x === 8) {
            col = P.suitDark; // athletic flank taper
          } else if (y === 6 || y === 8) {
            // Horizontal inscriptions dividing upper, mid, and lower ab pads
            if (x >= 2 && x <= 6) col = P.suitDark;
            else col = weave ? P.suitBase : P.suitTexture;
          } else if (x === 2 || x === 6) {
            col = P.suitDark; // lateral ab boundary grooves
          } else if (x === 3 || x === 5) {
            // Abdominal muscle pads (upper: y=5, middle: y=7, lower: y=9)
            col = (y === 5 || y === 7) ? (weave ? P.suitBase : P.suitTexture) : (weave ? P.suitBase : P.suitDark);
          } else {
            // Obliques (x=1, x=7)
            col = weave ? P.suitBase : P.suitTexture;
          }
        } else if (y >= 10) {
          // Built-in Golden Belt with Red Center Square Buckle (Ref 1)
          if (x >= 3 && x <= 5) {
            // Red square in the middle of the belt
            col = (y === 10) ? (x === 4 ? P.crimsonLight : P.crimsonBase) : (x === 4 ? P.crimsonBase : P.crimsonWarm);
          } else {
            // Gold belt strap & buckle rim
            col = (y === 10) ? P.goldBright : P.goldWarm;
          }
        }
      } else if (face === 'back') {
        if (y === 0) col = P.suitDark; // shoulder line
        else if (y >= 10) col = (y === 10) ? P.goldBright : P.goldWarm; // built-in gold belt strap
        else if (x === 4) col = P.suitDeep; // spine groove
      } else if (face === 'left' || face === 'right') {
        if (y === 0) col = P.suitDark;
        else if (y >= 10) col = (y === 10) ? P.goldBright : P.goldWarm; // built-in gold belt strap
      } else if (face === 'bottom') {
        col = P.suitDark;
      }
      px(ctx, x, y, col);
    }
  }
}

// Golden Eagle Pauldrons (Shoulder pads): sculpted gold eagles perched on shoulders
function paintPauldrons(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = P.goldBase;
      if (face === 'top') {
        // Eagle feathers: staggered light/dark rows, lit front edge
        col = y === 0 ? P.goldLight : ((x + y) % 2 === 0 ? P.goldBright : P.goldBase);
        if (y === h - 1) col = P.goldWarm;
      } else if (face === 'bottom') {
        col = P.goldDark;
      } else {
        if (y === 0) col = P.goldBright;
        else if (y === h - 1) col = P.goldDark;
        else col = (x % 2 === 0) ? P.goldBase : P.goldWarm;
      }
      px(ctx, x, y, col);
    }
  }
}

// Red leather (gloves, boots): soft hash shading instead of a checkerboard
const leather = (x, y, seed) => hash2D(x, y, seed) < 0.35 ? P.crimsonWarm : P.crimsonBase;

// Upper Arm: plain blue scale sleeve (photos: no band at the elbow)
function paintUpperArm(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      px(ctx, x, y, face === 'bottom' ? P.suitDark : suitCol(x, y, 21));
    }
  }
}

// Lower arm (6 rows of ~0.93 texel): blue sleeve at the elbow, hidden middle under the
// bracer, red glove for the bottom 2 rows (the hand, below the bracer).
function paintLowerArm(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = suitCol(x, y, 23);
      if (face === 'bottom') col = P.crimsonDark;          // palm / fist underside
      else if (face !== 'top' && y >= h - 2) col = leather(x, y, 25);
      px(ctx, x, y, col);
    }
  }
}

// Bracer (gauntlet box, 3 rows): copper scales with a dark top rim and a red glove cuff
// flaring over the bottom edge (photos)
function paintBracer(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = (x + y) % 2 === 0 ? P.bronzeBase : P.bronzeWarm; // tiny scales
      if (face === 'top' || face === 'bottom') col = P.bronzeDark;
      else if (y === 0) col = x % 2 === 0 ? P.bronzeDark : P.bronzeWarm; // ridged top rim
      else if (y === 1) col = x % 2 === 0 ? P.bronzeLight : P.bronzeBase; // lit scale row
      else if (y === h - 1) col = P.crimsonBase;                           // glove cuff
      px(ctx, x, y, col);
    }
  }
}

// Thighs (blue scale suit, darker knee fold)
function paintThigh(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = suitCol(x, y, 31);
      if (y === h - 1 && face !== 'top') col = P.suitDark; // knee fold shadow
      px(ctx, x, y, col);
    }
  }
}

// Calf = knee-high red boot shaft: antique gold top rim, round gold eagle medallion on the shin
function paintCalf(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = leather(x, y, 33);
      if (y === 0) {
        col = P.goldBase; // plain antique gold boot top rim
      } else if (face === 'front' && y >= 1 && y <= 2 && (x === 1 || x === 2)) {
        // 2x2 medallion: lit top-left, shaded bottom-right
        col = y === 1 ? (x === 1 ? P.goldLight : P.goldBright) : (x === 1 ? P.goldBase : P.goldWarm);
      } else if (y === 1 && (face === 'left' || face === 'right')) {
        col = P.crimsonDark; // shadow under the rim on the sides
      }
      px(ctx, x, y, col);
    }
  }
}

// Boot Foot: red leather boot with a dark sole and lit toe
function paintBootFoot(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = leather(x, y, 37);
      if (y === h - 1 || face === 'bottom') {
        col = P.crimsonSole;
      } else if (face === 'top' || (face === 'front' && y === 0)) {
        col = P.crimsonLight;
      }
      px(ctx, x, y, col);
    }
  }
}

// Cape stripes (photos): equal 1-texel red/white stripes, mirrored around the center so
// both edges are white. Same pattern outside and inside (the lining is striped too).
function capeStripe(x, y, w, seed) {
  const k = Math.min(x, w - 1 - x), shade = hash2D(x, y, seed) < 0.2;
  return k % 2 === 0 ? (shade ? P.capeWhiteShade : P.capeWhiteBase) : (shade ? P.capeRedDark : P.capeRedBase);
}
// Star field: staggered white stars on blue
const capeStar = (x, y) => (x + 2 * y) % 4 === 1;
const capeBlue = (x, y) => hash2D(x, y, 41) < 0.3 ? P.capeBlueDark : P.capeBlueBase;

// Cape segment 1: blue star yoke over the shoulders (outside), plain blue inside
function paintCapeMantle(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = P.capeBlueDark;
      if (face === 'back') col = capeStar(x, y) ? P.capeStarWhite : capeBlue(x, y);
      else if (face === 'front') col = capeBlue(x, y);
      px(ctx, x, y, col);
    }
  }
}

// Cape segment 2: the yoke ends in a V (2 rows), then stripes start
function paintCapeTrans(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = P.capeWhiteShade; // side edges = white edge stripe
      if (face === 'back') {
        const k = Math.min(x, w - 1 - x);            // distance from the nearest edge
        const yoke = (y === 0 && k >= 2) || (y === 1 && k >= 4);
        col = yoke ? (capeStar(x, y + 4) ? P.capeStarWhite : capeBlue(x, y + 4)) : capeStripe(x, y, w, 43);
      } else if (face === 'front') {
        col = capeStripe(x, y, w, 44);
      } else if (face === 'top') {
        col = P.capeBlueDark;
      }
      px(ctx, x, y, col);
    }
  }
}

// Cape segments 3-5: red/white stripes outside and inside
function paintCapeStripes(ctx, face, w, h) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col = P.capeWhiteShade;
      if (face === 'back' || face === 'front') col = capeStripe(x, y, w, face === 'back' ? 45 : 46);
      else if (face === 'bottom' || face === 'top') col = capeStripe(x, 0, w, 47);
      px(ctx, x, y, col);
    }
  }
}

/* ───────── Materials & Texture Atlas ───────── */
const atlas = document.createElement('canvas');
const atlasCtx = atlas.getContext('2d');
const atlasTex = new THREE.CanvasTexture(atlas);
atlasTex.magFilter = atlasTex.minFilter = THREE.NearestFilter;
atlasTex.generateMipmaps = false;
atlasTex.colorSpace = THREE.SRGBColorSpace;
let ATLAS_W = 128, ATLAS_H = 128;

const matCache = {};
function mat(rough = 0.85, metal = 0.04, cut = false) {
  const key = rough + '|' + metal + '|' + cut;
  return matCache[key] || (matCache[key] = new THREE.MeshStandardMaterial({
    map: atlasTex, roughness: rough, metalness: metal,
    alphaTest: cut ? 0.5 : 0, side: cut ? THREE.DoubleSide : THREE.FrontSide
  }));
}

/* ───────── Model Rigging ───────── */
const mobRoot = new THREE.Group();
mobRoot.name = 'homelander';
scene.add(mobRoot);

const bones = {};
const boneList = [];
const cubeList = [];

function bone(name, parent, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.Group();
  g.name = name;
  g.rotation.order = 'ZYX';
  g.position.set(x * TEXEL, y * TEXEL, z * TEXEL);
  g.rotation.set(rx, ry, rz);
  g.userData = { rest: g.position.clone(), restRot: new THREE.Vector3(rx, ry, rz) };
  (parent || mobRoot).add(g);
  bones[name] = g;
  boneList.push(g);
  return g;
}

function box(b, name, w, h, d, x, y, z, painter, opt = {}) {
  const inflate = opt.inflate || 0;
  const geo = new THREE.BoxGeometry((w + inflate * 2) * TEXEL, (h + inflate * 2) * TEXEL, (d + inflate * 2) * TEXEL);
  const nrm = geo.attributes.normal;
  for (let i = 0; i < 24; i++) {
    const f = i >> 2;
    nrm.setXYZ(i, f === 0 ? 1 : f === 1 ? -1 : 0, f === 2 ? 1 : f === 3 ? -1 : 0, f === 4 ? 1 : f === 5 ? -1 : 0);
  }
  const mesh = new THREE.Mesh(geo, mat(opt.rough, opt.metal, opt.cut));
  const rot = opt.rot || [0, 0, 0];
  mesh.position.set(x * TEXEL, y * TEXEL, z * TEXEL);
  mesh.rotation.order = 'ZYX';
  mesh.rotation.set(rot[0], rot[1], rot[2]);
  mesh.castShadow = opt.shadow !== false;
  mesh.receiveShadow = true;
  mesh.name = name;
  b.add(mesh);
  const c = { name, bone: b.name, size: [w, h, d], inflate, center: [x, y, z], rot, painter, mesh, shell: opt.shell || null, rects: [] };
  cubeList.push(c);
  return c;
}

const laserCoreMat = new THREE.MeshBasicMaterial({ color: 0xfff1e0, transparent: true, opacity: 0, depthWrite: false });

const coreGeo = new THREE.CylinderGeometry(0.28 * TEXEL, 0.28 * TEXEL, TEXEL, 6).translate(0, TEXEL / 2, 0).rotateX(Math.PI / 2);
const lasers = [-2, 2].map((x) => {

  for (const m of [beam, core]) { m.position.set(x * TEXEL, 4.5 * TEXEL, 4.1 * TEXEL); head.add(m); }

});
const LASER_LEN = 56; // default beam length in texels (3.5 blocks); anims may set `beam`

// American flag cape: 50 bones of 0.4 texel each, posed only by cloth physics (see Cloth below), no keyframes.
// Same 20-texel length and look: each bone paints the row of the old 4-texel pattern it covers
// (rows 0-3 star yoke, 4-7 V transition, 8-19 stripes). CAPE_TOP = where it hangs from the chest (texels):
// 0.3 behind the torso's back face, so the 0.4-thick cloth never sits inside the torso.
const CAPE_N = 50, CAPE_SEG = 0.4, CAPE_W = 9.6, CAPE_TOP = [0, 11.6, -2.8];
const capeSub = document.createElement('canvas');            // reused: old 4-row segment is painted here
capeSub.width = capeSub.height = 32;
const capeSubCtx = capeSub.getContext('2d');
function capePainter(y0) {
  return (ctx, face, w, h) => {
    const old = y0 < 4 ? paintCapeMantle : y0 < 8 ? paintCapeTrans : paintCapeStripes;
    const tall = face !== 'top' && face !== 'bottom';         // side faces carry the 4 rows; top/bottom don't
    capeSubCtx.clearRect(0, 0, 32, 32);
    old(capeSubCtx, face, w, tall ? 4 : h);
    ctx.drawImage(capeSub, 0, tall ? y0 % 4 : 0, w, h, 0, 0, w, h); // copy our row(s)
  };
}
const CAPE = [];
let capeParent = chest;
for (let i = 0; i < CAPE_N; i++) {
  const name = `cape_seg_${i + 1}`;
  // straight chain at rest (physics bends it every frame); each bone hangs CAPE_SEG below the one above
  const b = i === 0 ? bone(name, chest, CAPE_TOP[0], CAPE_TOP[1], CAPE_TOP[2]) : bone(name, capeParent, 0, -CAPE_SEG, 0);
  // texture row = the old pattern row under this bone's top edge (50 bones over 20 rows: 2-3 bones per row);
  // the top 4 texels (mantle) are a bit wider, like before
  box(b, name, i * CAPE_SEG < 4 - 1e-6 ? 10.0 : CAPE_W, CAPE_SEG, 0.4, 0, -CAPE_SEG / 2, 0, capePainter(Math.floor(i * CAPE_SEG + 1e-6)), { rough: 0.65 });
  CAPE.push(name);

}

/* ───────── Texture Atlas Packing ───────── */
const FACES = ['right', 'left', 'top', 'bottom', 'front', 'back'];
const faceSize = (c, f) => {
  const [w, h, d] = c.size, r = (v) => Math.max(1, Math.round(v));
  return f < 2 ? [r(d), r(h)] : f < 4 ? [r(w), r(d)] : [r(w), r(h)];
};

(function packAtlas() {
  const items = [];
  for (const c of cubeList) for (let f = 0; f < 6; f++) { const [w, h] = faceSize(c, f); items.push({ c, f, w, h }); }
  items.sort((a, b) => b.h - a.h || b.w - a.w);
  let x = 1, y = 1, shelf = 0;
  for (const it of items) {
    if (x + it.w + 1 > ATLAS_W) { x = 1; y += shelf + 2; shelf = 0; }
    it.c.rects[it.f] = { x, y, w: it.w, h: it.h };
    x += it.w + 2;
    shelf = Math.max(shelf, it.h);
  }
  while (y + shelf + 1 > ATLAS_H) ATLAS_H *= 2;
  atlas.width = ATLAS_W; atlas.height = ATLAS_H;
})();

// Map face UVs to packed atlas rects
for (const c of cubeList) {
  const uv = c.mesh.geometry.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const r = c.rects[f];
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k, u = uv.getX(i), v = uv.getY(i);
      uv.setXY(i, (r.x + u * r.w) / ATLAS_W, 1 - (r.y + (1 - v) * r.h) / ATLAS_H);
    }
  }
  uv.needsUpdate = true;
}

const scratch = document.createElement('canvas');
scratch.width = scratch.height = 32;
const sctx = scratch.getContext('2d');
const GUTTER = [[-1, 0], [1, 0], [0, -1], [0, 1]];

function paintAtlas() {
  atlasCtx.imageSmoothingEnabled = false;
  atlasCtx.clearRect(0, 0, ATLAS_W, ATLAS_H);
  for (const c of cubeList) {
    for (let f = 0; f < 6; f++) {
      const r = c.rects[f];
      sctx.clearRect(0, 0, 32, 32);
      c.painter(sctx, FACES[f], r.w, r.h);
      for (const [dx, dy] of GUTTER) atlasCtx.drawImage(scratch, 0, 0, r.w, r.h, r.x + dx, r.y + dy, r.w, r.h);
      atlasCtx.clearRect(r.x, r.y, r.w, r.h);
      atlasCtx.drawImage(scratch, 0, 0, r.w, r.h, r.x, r.y, r.w, r.h);
    }
  }
  atlasTex.needsUpdate = true;
}

let variantIndex = 0;   // current color variant (the mod export paints every variant, then restores this one)
function setVariant(i) {
  variantIndex = i;
  P = { ...BASE, ...VARIANTS[i].pal };
  paintAtlas();
  document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('active', k === i));
}

/* ───────── Pose Buffers & Kinematics ───────── */
// Face channels: grin = teeth showing, smirk = one-sided mouth lift, glow = red eyes (heat vision warming up)
const FACE_KEYS = ['browUp', 'frown', 'open', 'wide', 'glance', 'squint', 'laser', 'grin', 'smirk', 'glow'];
const zeroFace = () => Object.fromEntries(FACE_KEYS.map((k) => [k, 0]));
function makePose() {
  return { r: new Float32Array(NB * 3), p: new Float32Array(NB * 3), f: zeroFace(), yawLimit: 0.45, follow: 1 };
}
function clearPose(Q) { Q.r.fill(0); Q.p.fill(0); for (const k of FACE_KEYS) Q.f[k] = 0; }
function copyPose(src, dst) { dst.r.set(src.r); dst.p.set(src.p); for (const k of FACE_KEYS) dst.f[k] = src.f[k]; dst.yawLimit = src.yawLimit; dst.follow = src.follow; }
function rot(Q, b, x, y, z) { if (B[b] !== undefined) { const i = B[b] * 3; Q.r[i] += x; Q.r[i + 1] += y; Q.r[i + 2] += z; } }
function pos(Q, b, x, y, z) { if (B[b] !== undefined) { const i = B[b] * 3; Q.p[i] += x; Q.p[i + 1] += y; Q.p[i + 2] += z; } }

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function kf(t, keys) {
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i];
      const s = (t - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * (0.5 - 0.5 * Math.cos(Math.PI * s));
    }
  }
  return keys[keys.length - 1][1];
}

/* ───────── Legs + ground (2-bone legs, no ankle) ───────── */
// Boot geometry below the hip joint (texels): knee 5.6 down, sole 6.4 below the knee,
// heel 2.1 back and toe 2.9 forward of the shin line. The foot angle is hip + knee.
const THIGH = 5.6, SOLE = 6.4, HEEL = -2.1, TOE = 2.9, HIP_H = 12;

// Smooth min (no corner where the two values cross). Under-estimates by at most k*ln2.
function smin(a, b, k = 0.06) { return Math.min(a, b) - k * Math.log1p(Math.exp(-Math.abs(a - b) / k)); }

// Lowest boot point below the hip for hip angle h and knee angle k (Rx: y' = y cos - z sin)
function footLow(h, k) {
  const a = h + k, c = Math.cos(a), s = Math.sin(a);
  return -THIGH * Math.cos(h) + smin(-SOLE * c - HEEL * s, -SOLE * c - TOE * s);
}

// Pose both legs (hip forward = negative, knee bend = positive) and set the root height
// so the lower foot just touches the floor, plus `lift` (flying). Splay = legs a bit apart.
function legs(Q, hR, kR, hL, kL, lift = 0, splay = 0.03) {
  rot(Q, 'leg_right', hR, 0, -splay); rot(Q, 'knee_right', kR, 0, 0);
  rot(Q, 'leg_left', hL, 0, splay);   rot(Q, 'knee_left', kL, 0, 0);
  pos(Q, 'root', 0, -HIP_H - smin(footLow(hR, kR), footLow(hL, kL)) + 0.06 + lift, 0);
}

// Hands on hips (photo 1): elbows out, fists on the belt. w = 0..1 blend weight.
function handsOnHips(Q, side, w, breath = 0) {
  const sx = side === 'right' ? -1 : 1;
  rot(Q, `arm_${side}`, -0.1 * w, 0, sx * (0.34 + 0.02 * breath) * w);
  rot(Q, `forearm_${side}`, (-0.45 - 0.04 * breath) * w, 0, -sx * 0.08 * w);
}

// Hands behind the back (photo 3): upper arm swung back + elbow out, forearm folds
// inward (forearm z) so both fists rest behind the lower back. w = 0..1.
// Values from a clip search (hover t = 4): fists end ~3 texels beside the spine, ~6 behind the torso center
const HB = { ax: 0.8, az: 0.2, fx: 0.2, fz: 1.2 };
// w = upper arm swing, fold = forearm fold (fold lags behind w so the fists never pass through the back)
function handsBehind(Q, side, w, fold = w) {
  const sx = side === 'right' ? -1 : 1;
  rot(Q, `arm_${side}`, HB.ax * w, 0, sx * HB.az * w);
  rot(Q, `forearm_${side}`, HB.fx * fold, 0, -sx * HB.fz * fold);
}

    }
  },

  // 3 · Walk: upright, chest-out, unhurried stride (1 gait cycle = 2 steps in 1.25 s = 150 frames).
  // 2-bone legs: heel strikes with toes up, toe-off with heel up (foot angle = hip + knee),
  // knee folds ~1 rad in the swing for foot clearance; elbows bend more on the forward swing.
  walk: {
    T: 1.25, yawLimit: 0.20, look: 0.3, mood: 0.8, move: 16, // 16 texels/s = 1 block/s (the cape feels the air)
    fn(t, Q) {
      const p = t / 1.25, c = Math.cos(TAU * p), s = Math.sin(TAU * p);
      // Per leg: hip from -0.42 (forward, heel strike) to +0.42 (back, toe-off); knee: small
      // flex in stance, big fold in the swing (sin^2 halves: smooth at every joint of the cycle)
      const leg = (ph) => {
        const sp = Math.sin(TAU * ph), sw = sp * sp, swing = sp < 0 ? 1 : 0;
        return [-0.42 * Math.cos(TAU * ph) - 0.1 * sw * swing, (swing ? 1.0 : 0.07) * sw];
      };
      const [hR, kR] = leg(p), [hL, kL] = leg(p + 0.5);
      legs(Q, hR, kR, hL, kL);

      // Weight moves over the stance foot; pelvis turns with the forward leg, chest counters
      pos(Q, 'body', -0.3 * s, 0, 0);
      rot(Q, 'body', 0, 0.06 * c, 0);
      rot(Q, 'chest', 0.03, -0.1 * c, 0.02 * s);

      // Arms opposite to the legs, elbows bend more on the forward swing, slight flare
      rot(Q, 'arm_right', 0.38 * c, 0, -0.12);
      rot(Q, 'arm_left', -0.38 * c, 0, 0.12);
      rot(Q, 'forearm_right', -0.22 - 0.3 * (1 - c) * 0.5, 0, 0);
      rot(Q, 'forearm_left', -0.22 - 0.3 * (1 + c) * 0.5, 0, 0);

      // Head steady (counter-turns the chest), small nod on every step
      rot(Q, 'head', -0.03 + 0.015 * Math.cos(2 * TAU * p), 0.04 * c, 0);

      Q.f.smirk = 0.35;
      Q.f.browUp = 0.08;
      Q.f.frown = 0.15;
      Q.f.squint = 0.15;
      Q.f.wide = 0.15;
      Q.f.glance = 0.12 * Math.sin(TAU * p * 0.5) ** 2 - 0.06;
    }
  },

  // 4 · Attack: wind-up and explosive right super-punch, lunging onto the left leg
  attack: {
    T: 1.8, yawLimit: 0.05, follow: 0,
    events: { hit: 0.65 },                                  // punch lands (mod: damage + knockback)
    fn(t, Q) {
      const coil = kf(t, ATK_COIL);
      const punch = kf(t, ATK_PUNCH);
      const twist = kf(t, ATK_TWIST);

      // Lunge: left leg steps forward (flat foot: hip + knee = 0), right leg pushes back on its toes
      legs(Q, 0.12 * coil + 0.3 * punch, 0.1 * coil + 0.15 * punch, -0.1 * coil - 0.38 * punch, 0.25 * coil + 0.38 * punch);

      // Torso wind-up and explosive forward torque
      rot(Q, 'chest', 0.08 * punch, twist * 0.6, 0);
      pos(Q, 'chest', 0, -0.15 * punch, 0.3 * punch);

      // Right Arm: chambers back during wind-up with outward shoulder clearance, snaps forward
      rot(Q, 'arm_right', 0.22 * coil - 1.45 * punch, 0, -0.32 - 0.15 * coil);
      rot(Q, 'forearm_right', -0.85 * coil - 0.25 * punch, 0, 0);

      // Left Arm: guards chest and counter-balances
      rot(Q, 'arm_left', -0.2 * coil + 0.4 * punch, 0, 0.35);
      rot(Q, 'forearm_left', -0.6 * coil - 0.3 * punch, 0, 0);

      // Head locked onto the victim
      rot(Q, 'head', 0.04 * punch, 0, 0);

      // Violent grimace: bared teeth, low brows, eyes flash red on the hit
      Q.f.frown = 0.95 * (coil + punch);
      Q.f.squint = 0.65 * punch;
      Q.f.open = 0.3 * punch;
      Q.f.grin = 0.6 * punch;
      Q.f.glow = Math.min(1, 0.45 * coil + 0.75 * punch); // eyes flare red in the wind-up, peak on the hit
    }
  },

  // 5 · Special: Levitation Hover & Heat-Vision Laser Eyes!
  special: {
    T: 4.0, yawLimit: 0.2, follow: 0.15,
    events: { laserOn: 0.85, laserOff: 2.75 },              // beams at full strength (mod: burn what they hit)
    fn(t, Q) {
      const lift = kf(t, SPEC_LIFT);
      const laser = kf(t, SPEC_LASER);
      const sweep = kf(t, SPEC_SWEEP);

      // Hover legs: relaxed hanging pose once airborne (toes point down with the shin)
      const hoverAir = clamp((lift - 0.4) / 3.0, 0, 1);
      legs(Q, 0.06 * hoverAir, 0.06 + 0.2 * hoverAir, 0.06 * hoverAir, 0.06 + 0.14 * hoverAir, lift);

      // Supreme power stance: arms drawn back and clenched at sides
      rot(Q, 'arm_right', 0.18 * Math.min(1, lift / 4), 0, -0.32);
      rot(Q, 'forearm_right', -0.25 * Math.min(1, lift / 4), 0, 0.1);
      rot(Q, 'arm_left', 0.18 * Math.min(1, lift / 4), 0, 0.32);
      rot(Q, 'forearm_left', -0.25 * Math.min(1, lift / 4), 0, -0.1);

      // Head tilted downward with terrifying laser gaze sweeping across the target
      // (pitch SPEC_AIM: from 9.5 texels up the beams come down onto a target 3.5 blocks away, chest high;
      //  the neck lifts with the pitch so the chin stays out of the chest)
      rot(Q, 'head', SPEC_AIM * laser, sweep, 0);
      pos(Q, 'head', 0, 4.2 * (SPEC_AIM * laser) ** 2 / (SPEC_AIM * laser + 0.05), 0);

      // Cape flutters in the updraft: a wave that runs from the shoulders to the hem
      const air = Math.min(1, lift / 4);

      Q.f.laser = laser;
      Q.f.glow = clamp(lift / 6, 0, 1) ** 2;   // eyes heat up while he rises (full red just before the beams)
      Q.f.frown = 1.0 * laser;
      Q.f.open = 0.25 * laser;
      Q.f.grin = 0.5 * laser;
      Q.f.squint = 0.45 * laser;
    }
  },

  // 6 · Throw: grabs the victim by the neck (right hand), lifts them off the ground, dips
  // and flings them straight up, watches them fly and looks down where they will land.
  throw: {
    T: 3.25, yawLimit: 0.05, follow: 0,
    events: { grab: 0.42, release: 1.52 },                  // hand closes on the neck / lets go at the top of the fling
    fn(t, Q) {
      const step = kf(t, TH_STEP), cr = kf(t, TH_CROUCH), ext = kf(t, TH_EXT);
      const up = kf(t, TH_UP), down = kf(t, TH_DOWN), hold = kf(t, TH_HOLD);

      // Legs: left foot steps in, dips with the throw, pushes up onto the toes on the release
      legs(Q, 0.22 * step - 0.2 * cr + 0.1 * ext, 0.08 * step + 0.55 * cr, -0.3 * step - 0.2 * cr, 0.3 * step + 0.55 * cr, 0.7 * ext);

      // Chest: right shoulder turns forward to reach, leans into the dip, arches back on the throw
      // (chest twist 0.42 while holding = the right hand sits on his center line, where the victim is)
      rot(Q, 'chest', 0.04 * step + 0.14 * cr - 0.16 * up, 0.42 * hold + 0.12 * cr, 0);
      pos(Q, 'chest', 0, 0, 0.2 * cr);

      // Right arm: reach -> neck -> lift -> dip -> fling overhead (out to the side of the head)
      rot(Q, 'arm_right', kf(t, TH_AX), kf(t, TH_AY), kf(t, TH_AZ));
      rot(Q, 'forearm_right', kf(t, TH_FX), 0, 0);
      // Left arm: fist low and back for balance, swings forward on the throw
      rot(Q, 'arm_left', 0.25 * step - 0.35 * ext, 0, 0.2 * step);
      rot(Q, 'forearm_left', -0.5 * step, 0, -0.05);

      // Head: locked on the victim, then up after them (neck long: clears the shoulders), then down
      // (head counter-turns to keep his eyes on the victim and looks up into their face; the
      //  neck lift keeps the turned head's front corner above the raised upper arm)
      rot(Q, 'head', -0.22 * hold - 0.38 * up + 0.14 * down, -0.3 * hold, -0.03 * hold);
      pos(Q, 'head', 0, 1.0 * hold + 1.3 * up + 0.7 * down + 0.8 * cr, 0);

      // Face: snarl while choking, faint red eyes; shout on the release; smirk watching; cruel grin down
      Q.f.frown = 0.7 * hold + 0.5 * ext + 0.2 * down;
      Q.f.grin = 0.5 * hold + 0.7 * down;
      Q.f.open = 0.8 * ext;
      Q.f.wide = 0.15 + 0.3 * ext;
      Q.f.smirk = 0.8 * up;
      Q.f.browUp = 0.4 * up;
      Q.f.squint = 0.3 * hold + 0.2 * down;
      Q.f.glow = 0.35 * hold + 0.5 * ext;
      Q.f.glance = 0;
    }
  },

  // 7 · Clap: "I AM GOD" + head clap (both reference clips, see CL_*). Arms thrown out wide,
  // screaming the voice line with red eyes, then calm: both hands cup the victim's head at the
  // temples, a short smug hold, and the palms crush inward. The voice line starts at events.voice.
  clap: {
    T: 4.2, yawLimit: 0.05, follow: 0,
    events: { voice: 0.3, grab: 2.55, hit: 3.55, release: 3.7 },
    fn(t, Q) {
      const wide = kf(t, CL_WIDE), god = kf(t, CL_GOD), calm = kf(t, CL_CALM), cup = kf(t, CL_CUP);
      const press = kf(t, CL_PRESS), crush = kf(t, CL_CRUSH), hit = kf(t, CL_HIT), st = kf(t, CL_STANCE);
      const shake = 0.035 * Math.sin(TAU * 7 * t) * wide;              // arms tremble with rage while he screams
      const strain = 0.02 * Math.sin(TAU * 11 * t) * press * (1 - crush); // ...and with effort while he squeezes

      // Legs: wide planted stance (splay), knees give a little on "GOD", the squeeze and the crush
      // (lift 0.13*st: the wide splay tips the boots' outer edges below the floor solve)
      const kn = 0.06 * st + 0.12 * god + 0.16 * cup + 0.06 * press + 0.14 * crush;
      legs(Q, -0.05 * st - 0.08 * god - 0.1 * cup, kn, -0.05 * st - 0.08 * god - 0.1 * cup, kn, 0.13 * st, 0.03 + 0.09 * st * (1 - 0.6 * cup));

      // Chest: puffs up and arches back while screaming, pushes in on "GOD", leans toward the victim
      // to reach his head, leans further in while squeezing (+ jolt on the crush)
      rot(Q, 'chest', -0.12 * wide + 0.08 * god + 0.1 * cup + 0.05 * press + 0.04 * hit, 0, 0);
      pos(Q, 'chest', 0, 0.25 * wide, 0.35 * god + 0.3 * cup + 0.2 * press - 0.15 * hit);

      // Arms (mirrored): out wide and low -> drop calmly -> shoot up to the temples -> push the head up
      // and back (ax rises) -> crush inward
      const ax = kf(t, CL_AX), ay = kf(t, CL_AY), az = kf(t, CL_AZ), fx = kf(t, CL_FX);
      rot(Q, 'arm_right', ax - 0.1 * god, ay, az - 0.12 * god + shake + strain);
      rot(Q, 'arm_left', ax - 0.1 * god, -ay, -az + 0.12 * god - shake - strain);
      // the crush squeezes with the forearms (elbows swing in): the upper arms stay clear of his chin
      rot(Q, 'forearm_right', fx + strain, 0, CL_SQUEEZE * crush);
      rot(Q, 'forearm_left', fx + strain, 0, -CL_SQUEEZE * crush);

      // Head: chin up for the scream, cocked while smiling, a curious tilt down at the victim while holding,
      // shakes on the impact. Neck lifts with the pitch/tilt (head half size x angle) so no corner sinks into the chest.
      const hx = -0.2 * wide + 0.12 * cup * (1 - crush) + 0.02 * hit; // chin comes up on the crush: the elbows swing in under it
      const hz = 0.08 * calm + 0.06 * cup * (1 - crush) * (1 - calm) + 0.03 * Math.sin(TAU * 9 * t) * hit;
      rot(Q, 'head', hx, 0, hz);
      pos(Q, 'head', 0, 1.0 * wide + 4.2 * Math.max(0, hx) ** 2 / (Math.max(0, hx) + 0.05) + 4.2 * hz * hz / Math.sqrt(hz * hz + 0.0025) + 0.25 * cup, 0);

      // Face: scream (open mouth = the voice line's loudness, red eyes, brows up then frown) ->
      // big deliberate fake smile (teeth, brows up) -> the smile dies into a cold glare while he squeezes
      // (frown, bared teeth, eyes heating up) -> clenched teeth on the crush -> smirk
      Q.f.open = 0.75 * wide + 0.1 * press * (1 - crush);
      Q.f.wide = 0.2 + 0.5 * wide + 0.7 * calm;
      Q.f.browUp = 0.45 * wide - 0.1 * god + 0.55 * calm - 0.15 * press;
      Q.f.frown = 0.5 * wide + 0.4 * god + 0.8 * press * (1 - crush) + 1.0 * crush;
      Q.f.grin = 1.0 * calm + 0.35 * press * (1 - crush) + 0.9 * crush;
      Q.f.squint = 0.1 + 0.25 * god + 0.3 * press + 0.4 * crush - 0.05 * calm;
      Q.f.glow = 0.75 * wide + 0.25 * god + 0.6 * press * (1 - crush) + 0.35 * crush;
      Q.f.smirk = 0.3 * calm + 0.6 * kf(t, CL_SMUG);
      Q.f.glance = 0;
    }
  },

  // 8 · Throat laser: grabs the throat, lifts the victim, holds them 1 s while the eyes heat
  // up, then burns their face point-blank (short beams), drops them and smirks.
  throatLaser: {
    T: 3.4, yawLimit: 0.05, follow: 0, beam: 6, // beams end at the victim's face (probe: head center height, ~6 texels)
    events: { grab: 0.45, burnOn: 1.6, burnOff: 2.6, release: 2.85 },
    fn(t, Q) {
      const step = kf(t, TL_STEP), hold = kf(t, TL_HOLD), laser = kf(t, TL_LASER);

      // Legs: steps in with the left foot, sets the right back to carry the weight
      legs(Q, 0.2 * step, 0.08 * step, -0.3 * step, 0.25 * step);

      // Chest: right shoulder twists forward (hand on his center line = victim in front of him),
      // leans back a little under the lifted weight
      rot(Q, 'chest', -0.05 * hold, 0.42 * hold, 0);

      rot(Q, 'arm_right', kf(t, TL_AX), kf(t, TL_AY), -0.12 * step);
      rot(Q, 'forearm_right', kf(t, TL_FX), 0, 0);
      // Left arm: clenched fist by his side
      rot(Q, 'arm_left', 0.08 * step, 0, 0.16 * step);
      rot(Q, 'forearm_left', -0.35 * hold, 0, -0.06 * hold);

      // Head: looks up into the victim's face, curious tilt, buzzes while the beams fire
      const buzz = 0.012 * Math.sin(TAU * 15 * t) * laser;
      rot(Q, 'head', -0.3 * hold + buzz, -0.42 * hold, 0.08 * hold * (1 - laser) + buzz); // counter-turn: face to face
      pos(Q, 'head', 0, 1.0 * hold, 0);

      // Face: smug smirk while he squeezes, brows sink as the eyes heat up, snarl while burning
      Q.f.smirk = kf(t, TL_SMIRK);
      Q.f.glow = kf(t, TL_GLOW);
      Q.f.laser = laser;
      Q.f.frown = 0.35 * hold + 0.4 * kf(t, TL_GLOW) + 0.3 * laser;
      Q.f.grin = 0.85 * laser;
      Q.f.open = 0.15 * laser;
      Q.f.squint = 0.2 * hold + 0.3 * laser;
      Q.f.browUp = 0.15 * hold * (1 - laser);
      Q.f.glance = 0;
    }
  }
};

// Sound effects per animation event (sounds/homelander/<name>; the mod plays the same files on the same events).
// '-name' = stop that sound (the beams go out).
const SFX_EVENTS = {
  attack: { hit: 'punch' },
  special: { laserOn: 'laser', laserOff: '-laser' },
  throw: { grab: 'grab', release: 'whoosh' },
  clap: { grab: 'grab', hit: 'crush' },
  throatLaser: { grab: 'grab', burnOn: 'laser', burnOff: '-laser' }
};

const ANIM_ORDER = ['idle', 'idle2', 'walk', 'attack', 'special', 'throw', 'clap', 'throatLaser'];   // dock buttons / keys 1-8
const ALL_ANIMS = [...ANIM_ORDER, 'hover'];                           // + hidden ones (tests, export)

/* ───────── Cloth physics (the cape) ─────────
   No keyframes: three verlet chains of CAPE_N + 1 points (left edge, middle, right edge) hang from the
   chest. Every substep: gravity, air drag, a random breeze, then distance constraints (along each chain,
   across and diagonally across the cape, and a max distance from the top so it never stretches),
   collisions with his body boxes (a point inside a box is pushed out the shortest way) and the floor.
   Then every cape bone turns to follow its piece of the middle chain (twist from the edge chains).
   All in his model space (texels, seconds), plain doubles, fixed substeps: the mod runs the same code 1:1. */
const CLOTH = {
  sub: 1 / 240,           // substep length (s); a frame runs ceil(dt / sub) equal substeps
  gravity: 156.8,         // texels/s^2 (9.8 m/s^2, 16 texels per block)
  drag: 3.0,              // air drag per second (light cloth: walking 1 block/s blows it back ~17 degrees)
  iters: 6,               // constraint + collision passes per substep
  half: CAPE_W / 2,       // edge chains this far left/right of the middle (texels)
  margin: 0.3,            // points stay this far outside body boxes (cloth half thickness + a hair)
  wind: 10,               // breeze strength (texels/s^2): slow random gusts, ripples run down the cape
  colliders: ['torso_suit', 'head_cranium', 'hair_main', 'upper_arm_right', 'upper_arm_left', 'pauldron_right', 'pauldron_left',
    'pauldron_wing_right', 'pauldron_wing_left', 'lower_arm_right', 'lower_arm_left', 'gauntlet_right', 'gauntlet_left',
    'thigh_right', 'thigh_left', 'calf_right', 'calf_left', 'boot_right', 'boot_left']
};
const CLOTH_COL = CLOTH.colliders.map((n) => cubeList.find((c) => c.name === n));
const CAPE_BONES = CAPE.map((n) => bones[n]);
const NP = CAPE_N + 1;                                   // points per chain

function makeCloth(rand) {
  const n = 3 * NP * 3;
  const C = { init: false, P: new Float64Array(n), Q: new Float64Array(n), A: new Float64Array(9), ph: [], col: new Float64Array(CLOTH_COL.length * 12),
              R: new Float64Array(9), Rp: new Float64Array(9) };
  for (let i = 0; i < 6; i++) C.ph.push(rand() * TAU);   // breeze phases: every mob gusts differently
  return C;
}

// Rotation columns + translation (texels) of a three.js matrixWorld into o[at..at+11] (x col, y col, z col, t)
function mat34(m, o, at) {
  const e = m.elements;
  o[at] = e[0]; o[at + 1] = e[1]; o[at + 2] = e[2]; o[at + 3] = e[4]; o[at + 4] = e[5]; o[at + 5] = e[6];
  o[at + 6] = e[8]; o[at + 7] = e[9]; o[at + 8] = e[10]; o[at + 9] = e[12] / TEXEL; o[at + 10] = e[13] / TEXEL; o[at + 11] = e[14] / TEXEL;
}
const chestM = new Float64Array(12);

// One frame of cloth. move = how far his body moved through the air this frame (texels, model space):
// the viewer passes the animation's own walking speed, the mod his real movement.
function clothStep(S, dt, move) {
  const C = S.cloth, P = C.P, Q = C.Q, N = CAPE_N, half = CLOTH.half, seg = CAPE_SEG;
  mobRoot.updateMatrixWorld(true);
  mat34(bones.chest.matrixWorld, chestM, 0);
  // anchors: CAPE_TOP +- half in chest space
  for (let k = 0; k < 3; k++) {
    const x = CAPE_TOP[0] + (k - 1) * half, y = CAPE_TOP[1], z = CAPE_TOP[2], m = chestM;
    C.A[k * 3] = m[0] * x + m[3] * y + m[6] * z + m[9];
    C.A[k * 3 + 1] = m[1] * x + m[4] * y + m[7] * z + m[10];
    C.A[k * 3 + 2] = m[2] * x + m[5] * y + m[8] * z + m[11];
  }
  if (!C.init) {                                         // first frame: hang straight down
    for (let k = 0; k < 3; k++) for (let i = 0; i <= N; i++) {
      const j = (k * NP + i) * 3;
      P[j] = Q[j] = C.A[k * 3]; P[j + 1] = Q[j + 1] = C.A[k * 3 + 1] - i * seg; P[j + 2] = Q[j + 2] = C.A[k * 3 + 2];
    }
    C.init = true;
  }
  // body boxes this frame (rigid: rotation columns + center)
  for (let c = 0; c < CLOTH_COL.length; c++) mat34(CLOTH_COL[c].mesh.matrixWorld, C.col, c * 12);
  const hands = handsBlock(C);

  const n = Math.max(1, Math.ceil(dt / CLOTH.sub - 1e-9)), h = dt / n;
  const damp = Math.exp(-CLOTH.drag * h), ph = C.ph;
  const mx = move[0] / n, my = move[1] / n, mz = move[2] / n;
  for (let s = 0; s < n; s++) {
    const tt = S.time - dt + (s + 1) * h;
    // breeze: slow gusts, mostly from the front (blows the cape back), a bit sideways and up/down
    const W = CLOTH.wind * (0.55 + 0.45 * Math.sin(TAU * 0.13 * tt + ph[0]));
    const wx = W * 0.35 * Math.sin(TAU * 0.23 * tt + ph[1]), wy = W * 0.15 * Math.sin(TAU * 0.41 * tt + ph[2]);
    const wz = -W * (0.6 + 0.4 * Math.sin(TAU * 0.17 * tt + ph[3]));
    // integrate (verlet): inertia (damped by the air), air pushing on a moving body, gravity, breeze
    for (let k = 0; k < 3; k++) for (let i = 1; i <= N; i++) {
      const j = (k * NP + i) * 3;
      const ripple = 0.7 + 0.3 * Math.sin(TAU * 1.3 * tt - i * 0.25 + ph[4] + k * 0.6);   // gust waves run down the cloth
      const px = P[j], py = P[j + 1], pz = P[j + 2];
      P[j] = px + (px - Q[j]) * damp - mx * (1 - damp) + wx * ripple * h * h;
      P[j + 1] = py + (py - Q[j + 1]) * damp - my * (1 - damp) + (wy * ripple - CLOTH.gravity) * h * h;
      P[j + 2] = pz + (pz - Q[j + 2]) * damp - mz * (1 - damp) + wz * ripple * h * h;
      Q[j] = px; Q[j + 1] = py; Q[j + 2] = pz;
    }
    for (let k = 0; k < 3; k++) { const j = k * NP * 3; P[j] = Q[j] = C.A[k * 3]; P[j + 1] = Q[j + 1] = C.A[k * 3 + 1]; P[j + 2] = Q[j + 2] = C.A[k * 3 + 2]; }
    for (let it = 0; it < CLOTH.iters; it++) {
      for (let k = 0; k < 3; k++) for (let i = 0; i < N; i++) clothLink(P, (k * NP + i) * 3, (k * NP + i + 1) * 3, seg, i === 0);
      for (let i = 1; i <= N; i++) {
        clothLink(P, i * 3, (NP + i) * 3, half, false); clothLink(P, (NP + i) * 3, (2 * NP + i) * 3, half, false);
        clothLink(P, (i - 1) * 3, (NP + i) * 3, Math.hypot(half, seg), i === 1); clothLink(P, (2 * NP + i - 1) * 3, (NP + i) * 3, Math.hypot(half, seg), i === 1);
      }
      // never further from the top than the cloth length above it (no stretching under gravity)
      for (let k = 0; k < 3; k++) for (let i = 1; i <= N; i++) {
        const j = (k * NP + i) * 3, dx = P[j] - C.A[k * 3], dy = P[j + 1] - C.A[k * 3 + 1], dz = P[j + 2] - C.A[k * 3 + 2];
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz), L = i * seg;

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homelander - 3D Vanilla+ Minecraft Model Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!--
    Homelander - 3D Vanilla+ Minecraft Model Viewer
    - Strict 16x16 model resolution (Blockbench standard humanoid entity).
    - Articulated hierarchical box geometry: head (8x8x8), torso (8x12x4), arms (4x12x4), legs (4x12x4).
    - Layered 3D details: extruded blonde combed hair, golden eagle shoulder pauldrons,
      golden eagle belt buckle, red gauntlet bracers, tall red boots with eagle shin crests,
      and 3-segment articulated American flag cape (stars yoke + red/white vertical stripes).
    - 4 selectable animations: Idle (arrogant hands-on-hips stance & breathing), Walk (authoritative stride),
      Attack (superhuman snap punch), Special (levitation hover & heat-vision laser eyes).
    - Ultra-minimal dark UI (#0f1115), OrbitControls, soft shadows, .bbmodel export.
  -->

  <style>
    /* ───────── Tokens ───────── */
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --pill: rgba(20, 23, 30, 0.82);
      --line: rgba(255, 255, 255, 0.09);
      --text: rgba(255, 255, 255, 0.62);
      --text-hi: #ffffff;
      --accent: #3b82f6;
      --accent-bg: rgba(59, 130, 246, 0.22);
      --accent-text: #bfdbfe;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ───────── Page ───────── */
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text-hi); font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    #viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
    #viewport:active { cursor: grabbing; }

    /* ───────── Glass pills ───────── */
    .pill {
      background: var(--pill);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border-radius: 999px;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .icon-btn {
      height: 36px; min-width: 36px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      color: var(--text); font-size: 12px; font-weight: 500;
      transition: color .2s, background .2s, transform .2s cubic-bezier(.22, 1, .36, 1);
    }
    .icon-btn:hover { color: var(--text-hi); transform: translateY(-1px); }
    .icon-btn:active { transform: scale(.97); }
    .icon-btn svg { width: 16px; height: 16px; flex: none; }
    #resetBtn { padding: 0; width: 36px; }

    /* ───────── Top right: download + reset ───────── */
    #topRight { position: fixed; top: 16px; right: 16px; z-index: 20; display: flex; gap: 8px; }

    /* ───────── Bottom dock ───────── */
    #dock {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 4px; padding: 6px; max-width: calc(100vw - 32px);
    }
    .anim-btn {
      padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: .02em;
      color: var(--text); border: 1px solid transparent; white-space: nowrap;
      transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
    }
    .anim-btn:hover { color: var(--text-hi); }
    .anim-btn.active { color: var(--accent-text); background: var(--accent-bg); border-color: rgba(59, 130, 246, .45); box-shadow: 0 0 18px rgba(59, 130, 246, .24); }
    .anim-btn kbd { font: inherit; opacity: .45; margin-right: 6px; }
    .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
    #followBtn, #bonesBtn { width: 32px; height: 32px; min-width: 32px; padding: 0; border-radius: 999px; }
    #followBtn.on, #bonesBtn.on { color: var(--accent-text); background: var(--accent-bg); }
    .dot {
      width: 18px; height: 18px; border-radius: 999px; margin: 0 3px;
      border: 2px solid rgba(255, 255, 255, .18); transition: transform .2s, border-color .2s;
    }
    .dot:hover { transform: scale(1.12); }
    .dot.active { border-color: var(--accent); }


    @media (max-width: 540px) {
      .anim-btn { padding: 7px 10px; }
      .anim-btn kbd { display: none; }
    }
  </style>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <!-- Top right: camera reset -->
  <div id="topRight">
    <button id="resetBtn" class="pill icon-btn" title="Reset camera (R)" aria-label="Reset camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>


  <!-- Bottom dock: animations, follow toggle, color variants -->
  <nav id="dock" class="pill" aria-label="Viewer controls">
    <button class="anim-btn active" data-anim="idle"><kbd>1</kbd>Idle</button>
    <button class="anim-btn" data-anim="idle2"><kbd>2</kbd>Idle 2</button>
    <button class="anim-btn" data-anim="walk"><kbd>3</kbd>Walk</button>
    <button class="anim-btn" data-anim="attack"><kbd>4</kbd>Attack</button>
    <button class="anim-btn" data-anim="special"><kbd>5</kbd>Special</button>
    <button class="anim-btn" data-anim="throw"><kbd>6</kbd>Throw</button>
    <button class="anim-btn" data-anim="clap"><kbd>7</kbd>Clap</button>
    <button class="anim-btn" data-anim="throatLaser"><kbd>8</kbd>Throat Laser</button>
    <span class="sep"></span>
    <button id="followBtn" class="icon-btn on" title="Head and eyes follow the mouse" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button id="bonesBtn" class="icon-btn" title="Show bones (B)" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><circle cx="7" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="9" cy="20" r="1.6"/><circle cx="15" cy="20" r="1.6"/><path d="M12 6v8M12 8l-5 4M12 8l5 4M12 14l-3 6M12 14l3 6"/></svg>
    </button>
    <span class="sep"></span>
    <span id="dots"></span>
  </nav>

  <script>
    window.__errors = [];
    window.onerror = (m, u, l, c, e) => window.__errors.push({ m, u, l, c, s: e ? e.stack : '' });
    window.addEventListener('unhandledrejection', (e) => window.__errors.push({ m: String(e.reason) }));
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // The viewer is split into classic scripts in js/ (rule: max 2500 lines per file; ES module files
    // break on file:// pages). They share THREE through window and load one after another, in order.
    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
    const PARTS = ['scene', 'painters', 'rig', 'anims', 'sim', 'export', 'ui', 'tests'];
    (function next(i) {
      if (i >= PARTS.length) return;
      const s = document.createElement('script');
      s.src = `js/${PARTS[i]}.js`;
      s.onload = () => next(i + 1);
      s.onerror = () => window.__errors.push({ m: 'could not load ' + s.src });
      document.body.appendChild(s);
    })(0);
  </script>
</body>
</html>

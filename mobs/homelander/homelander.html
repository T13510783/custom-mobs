        for (const k of FACE_KEYS) S.out.f[k] = S.snap.f[k] + (S.cur.f[k] - S.snap.f[k]) * w;
        S.yawLimit = S.cur.yawLimit || 0.45;
      } else {
        copyPose(S.cur, S.out);
        S.yawLimit = A.yawLimit || 0.45;
      }

      // Smooth facial expression easing
      for (const k of FACE_KEYS) {
        S.face[k] += (S.out.f[k] - S.face[k]) * filt(dt, 16);
      }

      // Natural eye blinking
      S.blink.wait -= dt;
      if (S.blink.wait <= 0 && S.blink.t < 0) {
        S.blink.t = 0;
        S.blink.wait = 2.5 + S.rand() * 3.5;
      }
      let blinkVal = 0;
      if (S.blink.t >= 0) {
        S.blink.t += dt;
        blinkVal = Math.sin(clamp(S.blink.t / 0.18, 0, 1) * Math.PI);
        if (S.blink.t >= 0.18) {
          S.blink.t = -1;
          if (S.blink.wait > 1 && S.rand() < 0.2) S.blink.wait = 0.12; // now and then a quick double blink
        }
      }

      // Mouse tracking head & eye follow
      const fTgt = (S.follow.on && S.follow.has) ? (A.follow !== undefined ? A.follow : 1) : 0;
      S.follow.w += (fTgt - S.follow.w) * filt(dt, 8);

      const targetYaw = clamp(S.follow.mx * 0.55, -S.yawLimit, S.yawLimit);
      const targetPitch = clamp(-S.follow.my * 0.15, -0.08, 0.08);
      S.follow.yaw += (targetYaw - S.follow.yaw) * filt(dt, 9);
      S.follow.pitch += (targetPitch - S.follow.pitch) * filt(dt, 9);

      // Apply Kinematic Pose to Bones
      for (let i = 0; i < NB; i++) {
        const g = boneList[i];
        const r0 = g.userData.restRot, p0 = g.userData.rest;
        const j = i * 3;
        g.rotation.set(r0.x + S.out.r[j], r0.y + S.out.r[j + 1], r0.z + S.out.r[j + 2]);
        g.position.set(p0.x + S.out.p[j] * TEXEL, p0.y + S.out.p[j + 1] * TEXEL, p0.z + S.out.p[j + 2] * TEXEL);
      }

      // Apply Head Follow
      if (bones.head) {
        bones.head.rotation.y += S.follow.yaw * S.follow.w;
        bones.head.rotation.x += S.follow.pitch * S.follow.w;
      }

      // Pupils eye glance tracking
      const pGlance = clamp(S.face.glance + S.follow.yaw * 0.35 * S.follow.w, -0.45, 0.45);
      if (bones.pupil_right && bones.pupil_left) {
        bones.pupil_right.position.x = (-2 + pGlance) * TEXEL;
        bones.pupil_left.position.x = (2 + pGlance) * TEXEL;
      }

      // Sliding Eyelids
      const closeAmt = clamp(blinkVal + S.face.squint * 0.5, 0, 1);
      if (bones.lid_right && bones.lid_left) {
        bones.lid_right.scale.y = closeAmt;
        bones.lid_left.scale.y = closeAmt;
        bones.lid_right.position.z = (closeAmt > 0.05 ? 4.06 : 3.98) * TEXEL;
        bones.lid_left.position.z = (closeAmt > 0.05 ? 4.06 : 3.98) * TEXEL;
      }

      // Eyebrows
      if (bones.brow_right && bones.brow_left) {
        const browY = (5.6 + S.face.browUp * 0.4 - S.face.frown * 0.3) * TEXEL;
        bones.brow_right.position.y = browY;
        bones.brow_left.position.y = browY;
        bones.brow_right.rotation.z = -0.06 - S.face.frown * 0.25;
        bones.brow_left.rotation.z = 0.06 + S.face.frown * 0.25;
      }

      // Mouth: open / wider for the grin, smirk tilts it up on his left side and shifts it over;
      // teeth grow down from the lip line and step out of the head only while grinning
      if (bones.mouth) {
        bones.mouth.scale.y = 1 + S.face.open * 1.5;
        bones.mouth.scale.x = 1 + S.face.wide * 0.4 + S.face.grin * 0.3;
        bones.mouth.rotation.z = 0.14 * S.face.smirk;
        bones.mouth.position.x = 0.25 * S.face.smirk * TEXEL;
        bones.teeth.scale.y = Math.max(0.001, S.face.grin);
        bones.teeth.position.z = (-0.05 + 0.045 * clamp(S.face.grin * 10, 0, 1)) * TEXEL;
      }

      // Red eye glow: anim channel + random Idle pulse, dimmed while the lids are closed
      // (the lids slide over the glow planes, so a blink hides the red by itself)
      const glow = clamp(Math.max(S.face.glow + evGlow, S.face.laser), 0, 1);
      glowMat.opacity = Math.min(1, glow * 1.3);                 // red eye white
      glowCoreMat.opacity = clamp(glow * 1.6 - 0.45, 0, 1);      // hot core only when it really burns
      glowHaloMat.opacity = glow * 0.35;                         // faint bloom (more reads as a pink box)
      for (const e of eyeGlow) e.core.position.x = (e.x + pGlance) * TEXEL; // core sits on the pupil

      // Heat-vision beams: thickness flickers, length = the animation's `beam` (texels) or LASER_LEN
      const laserActive = S.face.laser;
      laserMat.opacity = laserActive;
      laserCoreMat.opacity = laserActive * 0.95;
      const beamW = laserActive > 0.01 ? (0.75 + 0.25 * Math.sin(S.time * 45)) * Math.min(1, laserActive * 2) : 0.0001;
      const beamLen = Math.max(0.0001, A.beam || LASER_LEN);
      for (const l of lasers) { l.beam.scale.set(beamW, beamW, beamLen); l.core.scale.set(beamW, beamW, beamLen); } // geometry runs along +z

      // Cape Physics Springs
      let parentSp = null;
      for (const sp of S.springs) {
        const b = bones[sp.bone];
        if (!b) continue;
        b.getWorldPosition(vA);
        trackMotion(sp, vA, dt);

        // target = own inertia + breeze (a wave running down the cape) + follow the bone above
        const breeze = Math.sin(TAU * sp.f * (S.time - sp.lag)) * sp.breeze;
        const chainX = parentSp ? sp.chain * (parentSp.ax - parentSp.bx) : 0;
        const chainZ = parentSp ? sp.chain * parentSp.az : 0;
        parentSp = sp;
        const targetX = clamp(-sp.acc.z * sp.accel * 0.03 + sp.bx + breeze + chainX, sp.x[0], sp.x[1]);
        const targetZ = clamp(sp.acc.x * sp.accel * 0.03 + chainZ, sp.z[0], sp.z[1]);

        sp.vx += (targetX - sp.ax) * sp.k * dt;
        sp.vx *= Math.max(0, 1 - sp.d * dt);
        sp.ax += sp.vx * dt;

        sp.vz += (targetZ - sp.az) * sp.k * dt;
        sp.vz *= Math.max(0, 1 - sp.d * dt);
        sp.az += sp.vz * dt;

        b.rotation.x += sp.ax;
        b.rotation.z += sp.az;
      }
    }

    /* ───────── Blockbench .bbmodel Exporter ───────── */
    function uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
      });
    }

    const bbVec = (p) => [-p[0], p[1], p[2]];
    const bbRot = (rx, ry, rz) => [-rx * 180 / Math.PI, -ry * 180 / Math.PI, rz * 180 / Math.PI];
    const r4 = (v) => Math.round(v * 10000) / 10000;

    function bakeAnimation(name) {
      const A = ANIMS[name];
      const fps = 24, frames = Math.round(A.T * fps);
      const S = makeSim(1);
      S.anim = name; S.follow.on = false;
      const tracks = {};
      boneList.forEach((g) => { tracks[g.name] = { rot: [], pos: [], scl: [] }; });

      for (let f = 0; f <= frames; f++) {
        S.t = (f / fps) % A.T;
        clearPose(S.cur);
        A.fn(S.t, S.cur);
        for (let i = 0; i < NB; i++) {
          const g = boneList[i], b = g.name;
          const j = i * 3;
          tracks[b].rot.push(bbRot(S.cur.r[j], S.cur.r[j + 1], S.cur.r[j + 2]));
          tracks[b].pos.push(bbVec([S.cur.p[j], S.cur.p[j + 1], S.cur.p[j + 2]]));
          tracks[b].scl.push([1, 1, 1]);
        }
      }

      const animators = {};
      const isRest = (list, def) => list.every((p) => Math.abs(p[0] - def) < 1e-4 && Math.abs(p[1] - def) < 1e-4 && Math.abs(p[2] - def) < 1e-4);
      boneList.forEach((g) => {
        const b = g.name, tr = tracks[b], keyframes = [];
        const add = (channel, list) => list.forEach((v, f) => keyframes.push({
          channel, data_points: [{ x: v[0], y: v[1], z: v[2] }], uuid: uuid(), time: r4(f / fps), color: -1, interpolation: 'catmullrom'
        }));
        if (!isRest(tr.rot, 0)) add('rotation', tr.rot);
        if (!isRest(tr.pos, 0)) add('position', tr.pos);
        if (keyframes.length) animators[g.userData.uuid] = { name: g.name, type: 'bone', keyframes };
      });

      return {
        uuid: uuid(), name: `animation.homelander.${name}`, loop: 'loop', override: false,
        length: A.T, snapping: 24, selected: name === 'idle', anim_time_update: '', blend_weight: '',
        start_delay: '', loop_delay: '', animators
      };
    }

    function buildBBModel() {
      const abs = new Map();
      boneList.forEach((g) => {
        g.userData.uuid = uuid();
        const p = g.parent.isGroup && abs.has(g.parent) ? abs.get(g.parent) : [0, 0, 0];
        const r = g.userData.rest;
        abs.set(g, [p[0] + r.x / TEXEL, p[1] + r.y / TEXEL, p[2] + r.z / TEXEL]);
      });

      const elements = [];
      const groupOf = {};
      for (const c of cubeList) {
        const id = uuid();
        const bp = abs.get(bones[c.bone]);
        const ctr = bbVec([bp[0] + c.center[0], bp[1] + c.center[1], bp[2] + c.center[2]]);
        const [w, h, d] = c.size;
        const R = (f) => { const r = c.rects[f]; return [r.x, r.y, r.x + r.w, r.y + r.h]; };
        const Rf = (f) => { const r = c.rects[f]; return [r.x + r.w, r.y + r.h, r.x, r.y]; };
        const rotated = c.rot.some((v) => v !== 0);

        elements.push({
          name: c.name, box_uv: false, rescale: false, locked: false, render_order: 'default', allow_mirror_modeling: true,
          from: [r4(ctr[0] - w / 2), r4(ctr[1] - h / 2), r4(ctr[2] - d / 2)],
          to: [r4(ctr[0] + w / 2), r4(ctr[1] + h / 2), r4(ctr[2] + d / 2)],
          autouv: 0, color: 0, inflate: c.inflate,
          origin: rotated ? ctr : bbVec(bp),
          ...(rotated ? { rotation: bbRot(c.rot[0], c.rot[1], c.rot[2]) } : {}),
          faces: {
            north: { uv: R(4), texture: 0 }, south: { uv: R(5), texture: 0 },
            east: { uv: R(1), texture: 0 }, west: { uv: R(0), texture: 0 },
            up: { uv: Rf(2), texture: 0 }, down: { uv: Rf(3), texture: 0 }
          },
          type: 'cube', uuid: id
        });
        (groupOf[c.bone] = groupOf[c.bone] || []).push(id);
      }

      const outlinerNode = (g) => ({
        name: g.name, origin: bbVec(abs.get(g)), rotation: bbRot(g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z),
        color: 0, uuid: g.userData.uuid, export: true, mirror_uv: false, isOpen: true, locked: false, visibility: true, autouv: 0,
        children: [...(groupOf[g.name] || []), ...g.children.filter((ch) => ch.isGroup).map(outlinerNode)]
      });

      const animations = ALL_ANIMS.map(bakeAnimation);

      return {
        meta: { format_version: '4.5', model_format: 'free', box_uv: false },
        name: 'homelander', model_identifier: 'homelander',
        visible_box: [2, 2.5, 1], variable_placeholders: '', variable_placeholder_buttons: [],
        resolution: { width: ATLAS_W, height: ATLAS_H },
        elements, outliner: [outlinerNode(root)],
        textures: [{
          path: '', name: 'homelander.png', folder: 'entity', namespace: '', id: '0', particle: false,
          render_mode: 'default', render_sides: 'auto', frame_time: 1, frame_order_type: 'loop', frame_order: '',
          frame_interpolate: false, visible: true, internal: true, saved: false, uuid: uuid(),
          source: atlas.toDataURL('image/png')
        }],
        animations
      };
    }

    /* ───────── Rig overlay ("Show bones" button, key B) ───────── */
    // Same block in every mob. A dot on every bone pivot (yellow) and a line to its parent
    // (cyan), drawn on top of the model. Buffers are made once; update() only rewrites them.
    const rigView = (() => {
      const list = boneList.filter((b) => b.name !== 'root');
      const linePos = new Float32Array(list.length * 6), dotPos = new Float32Array(list.length * 3);
      const lineGeo = new THREE.BufferGeometry(), dotGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
      dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
      const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x67e8f9, depthTest: false, transparent: true, opacity: 0.9 }));
      const dots = new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0xfacc15, size: 6, sizeAttenuation: false, depthTest: false, transparent: true }));
      for (const o of [lines, dots]) { o.renderOrder = 999; o.frustumCulled = false; o.visible = false; scene.add(o); }
      const a = new THREE.Vector3(), b = new THREE.Vector3();
      return {
        on: false,
        set(on) { this.on = on; lines.visible = dots.visible = on; if (on) this.update(); },
        update() {
          mobRoot.updateMatrixWorld(true);
          list.forEach((g, i) => {
            g.getWorldPosition(a);
            (g.parent.isGroup && g.parent !== mobRoot ? g.parent : g).getWorldPosition(b);
            const j = i * 6, k = i * 3; // plain writes: no new arrays per frame
            linePos[j] = b.x; linePos[j + 1] = b.y; linePos[j + 2] = b.z;
            linePos[j + 3] = a.x; linePos[j + 4] = a.y; linePos[j + 5] = a.z;
            dotPos[k] = a.x; dotPos[k + 1] = a.y; dotPos[k + 2] = a.z;
          });
          lineGeo.attributes.position.needsUpdate = true;
          dotGeo.attributes.position.needsUpdate = true;
        }
      };
    })();

    /* ───────── UI Controls ───────── */
    let sim = makeSim(999);
    const toast = document.getElementById('toast');
    let toastTimer = 0;

    const dotsEl = document.getElementById('dots');
    VARIANTS.forEach((v, i) => {
      const d = document.createElement('button');
      d.className = 'dot';
      d.title = `${v.name} colors`;
      d.style.background = (v.pal.suitBase || BASE.suitBase);
      d.addEventListener('click', () => setVariant(i));
      dotsEl.appendChild(d);
    });

    const animBtns = document.querySelectorAll('.anim-btn');
    const markAnim = (name) => animBtns.forEach((b) => b.classList.toggle('active', b.dataset.anim === name));

    function selectAnim(name) {
      switchAnim(sim, name);
      markAnim(name);
    }
    animBtns.forEach((b) => b.addEventListener('click', () => selectAnim(b.dataset.anim)));

    const followBtn = document.getElementById('followBtn');
    followBtn.addEventListener('click', () => {
      sim.follow.on = !sim.follow.on;
      followBtn.classList.toggle('on', sim.follow.on);
      followBtn.setAttribute('aria-pressed', String(sim.follow.on));
    });

    const bonesBtn = document.getElementById('bonesBtn');
    function toggleBones() {
      rigView.set(!rigView.on);
      bonesBtn.classList.toggle('on', rigView.on);
      bonesBtn.setAttribute('aria-pressed', String(rigView.on));
    }
    bonesBtn.addEventListener('click', toggleBones);

    let resetting = false;
    document.getElementById('resetBtn').addEventListener('click', () => { resetting = true; });

    document.getElementById('dlBtn').addEventListener('click', () => {
      const data = buildBBModel();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'homelander.bbmodel';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const i = ['1', '2', '3', '4', '5', '6', '7', '8'].indexOf(e.key);
      if (i >= 0) selectAnim(ANIM_ORDER[i]);
      if (e.key === 'r' || e.key === 'R') resetting = true;
      if (e.key === 'b' || e.key === 'B') toggleBones();
    });

    window.addEventListener('pointermove', (e) => {
      sim.follow.mx = (e.clientX / window.innerWidth) * 2 - 1;
      sim.follow.my = -(e.clientY / window.innerHeight) * 2 + 1;
      sim.follow.has = true;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ───────── 60/120 FPS Locked Render Loop ───────── */
    let targetHz = 60, measuring = true, lastNow = 0, lastRender = 0;
    const intervals = [];

    function frame(now) {
      requestAnimationFrame(frame);
      if (measuring) {
        if (lastNow) intervals.push(now - lastNow);
        lastNow = now;
        if (intervals.length >= 30) {
          const sorted = intervals.slice().sort((a, b) => a - b);
          targetHz = 1000 / sorted[15] >= 110 ? 120 : 60;
          measuring = false;
        }
      } else {
        const interval = 1000 / targetHz;
        if (now < lastRender + interval - 1) return;
      }
      const dt = lastRender ? Math.min((now - lastRender) / 1000, 0.1) : 1 / 60;
      lastRender = measuring ? now : Math.max(lastRender + 1000 / targetHz, now - 1000 / targetHz);

      step(sim, dt);
      if (rigView.on) rigView.update();

      if (resetting) {
        const k = filt(dt, 8);
        camera.position.lerp(CAM_POS, k);
        controls.target.lerp(CAM_TARGET, k);
        if (camera.position.distanceTo(CAM_POS) < 0.005 && controls.target.distanceTo(CAM_TARGET) < 0.005) resetting = false;
      }
      controls.dampingFactor = filt(dt, 4.5);
      controls.update();
      renderer.render(scene, camera);
    }

    setVariant(0);

    /* ───────── Self-Tests & Headless Testing ───────── */
    function restPose() {
      boneList.forEach((g) => {
        g.rotation.copy(new THREE.Euler(g.userData.restRot.x, g.userData.restRot.y, g.userData.restRot.z, 'ZYX'));
        g.position.copy(g.userData.rest);
        g.scale.set(1, 1, 1);
      });
    }

    function clipTest() {
      const meshes = cubeList.map((c) => c.mesh);
      const inv = meshes.map(() => new THREE.Matrix4());
      const half = cubeList.map((c) => c.size.map((s) => (Math.abs(s) / 2 + c.inflate) * TEXEL));
      const pts = cubeList.map((c, i) => {
        const [hx, hy, hz] = half[i], list = [];
        for (let a = 0; a < 5; a++) for (let b = 0; b < 5; b++) {
          const u = -1 + a * 0.5, v = -1 + b * 0.5;
          list.push([hx, u * hy, v * hz], [-hx, u * hy, v * hz], [u * hx, hy, v * hz], [u * hx, -hy, v * hz], [u * hx, v * hy, hz], [u * hx, v * hy, -hz]);
        }
        return list.map((p) => new THREE.Vector3(...p));
      });
      const radius = half.map((h) => Math.hypot(h[0], h[1], h[2]) * 2.2);
      const centers = meshes.map(() => new THREE.Vector3());
      const EPS = 0.06, LAYER = 0.15;
      const wp = new THREE.Vector3(), lp = new THREE.Vector3();

      function depthInside(j, p) {
        const [hx, hy, hz] = half[j];
        const dx = hx - Math.abs(p.x), dy = hy - Math.abs(p.y), dz = hz - Math.abs(p.z);
        if (dx <= 0 || dy <= 0 || dz <= 0) return 0;
        return Math.min(dx, dy, dz);
      }

      function measure() {
        mobRoot.updateMatrixWorld(true);
        meshes.forEach((m, i) => { inv[i].copy(m.matrixWorld).invert(); centers[i].setFromMatrixPosition(m.matrixWorld); });
        const res = new Map();
        for (let i = 0; i < meshes.length; i++) for (let j = 0; j < meshes.length; j++) {
          if (i === j || cubeList[i].bone === cubeList[j].bone) continue;
          if (centers[i].distanceTo(centers[j]) > radius[i] + radius[j]) continue;
          let worst = 0;
          for (const p of pts[i]) {
            wp.copy(p).applyMatrix4(meshes[i].matrixWorld);
            lp.copy(wp).applyMatrix4(inv[j]);
            const d = depthInside(j, lp);
            if (d > worst) worst = d;
          }
          if (worst > 0) res.set(i + ':' + j, worst / TEXEL);
        }
        return res;
      }

      const JOINTS = [
        [/^(thigh_|calf_|boot_)/, /^torso_suit$/],
        [/^(calf_|boot_)/, /^thigh_/],
        [/^(lower_arm_|gauntlet_)/, /^(upper_arm_|pauldron_)/],
        [/^(upper_arm_|pauldron_)/, /^(torso_suit|head_cranium)$/],
        [/^head_cranium$/, /^torso_suit$/],
        [/^cape_seg_(1|2)$/, /^(torso_suit|head_cranium|pauldron_|upper_arm_)/],   // shoulders
        [/^cape_seg_(3|4)$/, /^upper_arm_/],
        ...CAPE.slice(1).map((n, i) => [new RegExp(`^${n}$`), new RegExp(`^${CAPE[i]}$`)]) // each bone with the one above
      ];
      const isJoint = (a, b) => JOINTS.some(([x, y]) => (x.test(a) && y.test(b)) || (x.test(b) && y.test(a)));

      restPose();
      const baseline = measure();
      const report = {
        cubes: cubeList.length, bones: NB, atlas: [ATLAS_W, ATLAS_H],
        clips: {}, joints: {}, ground: {},
        layeredAtRest: [...baseline].filter(([, d]) => d > EPS).map(([k, d]) => k.split(':').map((i) => cubeList[i].name).join(' / ') + ' ' + d.toFixed(2))
      };

      const boots = cubeList.filter((c) => /^boot_/.test(c.name));
      const corner = new THREE.Vector3();
      const mice = [[0, 0], [-0.95, 0], [0.95, 0], [0, 0.95], [0, -0.95]];

      for (const name of ALL_ANIMS) {
        let low = 99;
        for (const [, [mx, my]] of mice.entries()) {
          const S = makeSim(99);
          S.anim = name;
          S.events = false; // no random anim switches while testing one animation
          Object.assign(S.follow, { on: true, has: true, mx, my });
          const dt = 1 / 120;
          for (let t = 0; t < ANIMS[name].T; t += dt) step(S, dt);
          let since = 0;
          for (let t = 0; t < ANIMS[name].T * 2; t += dt) {
            step(S, dt);
            since += dt;
            if (since < 1 / 20) continue;
            since = 0;
            for (const [key, d] of measure()) {
              const base = baseline.get(key) || 0;
              const [i, j] = key.split(':').map(Number);
              const a = cubeList[i].name, b = cubeList[j].name;
              const joint = isJoint(a, b);
              if (!joint && d <= (base > EPS ? base + LAYER : EPS)) continue;
              if (joint && d <= base + EPS) continue;
              const bucket = joint ? report.joints : report.clips;
              const id = `${a} in ${b}`;
              if (!bucket[id] || bucket[id].depth < d) bucket[id] = { depth: +d.toFixed(3), rest: +base.toFixed(3), anim: name };
            }
            for (const c of boots) {
              const [hx, hy, hz] = half[cubeList.indexOf(c)];
              for (let k = 0; k < 8; k++) {
                corner.set(k & 1 ? hx : -hx, k & 2 ? hy : -hy, k & 4 ? hz : -hz).applyMatrix4(c.mesh.matrixWorld);
                low = Math.min(low, corner.y / TEXEL);
              }
            }
          }
        }
        report.ground[name] = +low.toFixed(3);
      }

      const bb = buildBBModel();
      const badUV = bb.elements.filter((e) => Object.values(e.faces).some((f) => f.uv.some((v, k) => v < 0 || v > (k % 2 ? ATLAS_H : ATLAS_W)))).map((e) => e.name);
      report.export = {
        elements: bb.elements.length, badUV,
        animations: bb.animations.map((a) => ({ name: a.name, bones: Object.keys(a.animators).length, keyframes: Object.values(a.animators).reduce((n, x) => n + x.keyframes.length, 0) })),
        bytes: JSON.stringify(bb).length
      };

      const out = document.createElement('pre');
      out.id = 'cliptest';
      out.textContent = JSON.stringify(report, null, 1);
      document.body.appendChild(out);
    }

    function dumpFrame() {
      controls.update();
      renderer.render(scene, camera);
      const out = document.createElement('pre');
      out.id = 'shot';
      out.textContent = canvas.toDataURL('image/png');
      document.body.appendChild(out);
    }

    function shot(anim, variant, secs) {
      setVariant(variant);
      sim.anim = anim;
      sim.events = false;
      Object.assign(sim.follow, { has: true, mx: 0.25, my: 0.15 });
      if (anim === 'special') {
        camera.position.set(2.8, 2.2, 3.4);
        controls.target.set(0, 1.45, 0);
      }
      for (let t = 0; t < secs; t += 1 / 60) step(sim, 1 / 60);
      dumpFrame();
    }

    window.setVariant = setVariant;
    window.selectAnim = selectAnim;
    window.homelanderDebug = { cubeList, bones, atlas, sim, ANIMS, camera, controls, dumpFrame, setVariant, selectAnim, buildBBModel, rigView, toggleBones, makeSim, step, HB };
    if (location.hash === '#cliptest') clipTest();
    else if (location.hash === '#rest') { restPose(); dumpFrame(); }
    else if (location.hash === '#back') { restPose(); camera.position.set(0, 1.7, -3.6); controls.target.set(0, 1.05, 0); dumpFrame(); }
    else if (location.hash.startsWith('#shot')) { const [, a, v, s] = location.hash.split('-'); shot(a, +v, +s); }
    else requestAnimationFrame(frame);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Injustice 2 Bane — Vanilla+ 16x16 Model Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d12;
      font-family: 'Inter', sans-serif;
      color: #f3f4f6;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .pill-bar {
      background: rgba(14, 17, 23, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(78, 255, 43, 0.2);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75), 0 0 24px rgba(57, 255, 20, 0.07);
    }

    .anim-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      color: #9ca3af;
    }

    .anim-btn:hover {
      color: #ecfdf5;
      background: rgba(255, 255, 255, 0.06);
    }

    .anim-btn.active {
      background: rgba(57, 255, 20, 0.16);
      color: #4eff2b;
      border: 1px solid rgba(78, 255, 43, 0.48);
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.25);
      text-shadow: 0 0 8px rgba(78, 255, 43, 0.45);
    }

    .hud-icon-btn {
      background: rgba(14, 17, 23, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    .hud-icon-btn:hover {
      border-color: rgba(78, 255, 43, 0.45);
      color: #4eff2b;
      transform: translateY(-1px);
    }

    .hud-icon-btn.active {
      border-color: rgba(78, 255, 43, 0.55);
      color: #4eff2b;
      background: rgba(57, 255, 20, 0.13);
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.2);
    }

    .hud-icon-btn:active {
      transform: translateY(0px) scale(0.96);
    }

    .venom-tier-badge {
      transition: all 0.25s ease;
    }

    .venom-tier-badge[data-tier="1"] {
      border-color: rgba(78, 255, 43, 0.32);
      color: #86efac;
    }

    .venom-tier-badge[data-tier="2"] {
      border-color: rgba(78, 255, 43, 0.65);
      color: #4eff2b;
      background: rgba(57, 255, 20, 0.14);
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.25);
    }

    .venom-tier-badge[data-tier="3"] {
      border-color: rgba(168, 255, 120, 0.9);
      color: #d9ffe0;
      background: rgba(57, 255, 20, 0.26);
      box-shadow: 0 0 24px rgba(78, 255, 43, 0.5);
      text-shadow: 0 0 10px rgba(78, 255, 43, 0.8);
    }
  </style>
  <!-- Load Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top-Left Minimal Model Badge -->
  <div class="fixed top-5 left-5 z-20 pointer-events-none hidden sm:flex items-center gap-2.5 px-3.5 py-2 rounded-full pill-bar">
    <span id="status-dot" class="w-2 h-2 rounded-full bg-[#4eff2b] shadow-[0_0_8px_#4eff2b] transition-all duration-300"></span>
    <span class="text-[11px] font-bold tracking-widest uppercase text-gray-200">
      Bane <span id="status-subtext" class="text-[#4eff2b]/80 font-semibold">• Injustice 2 Accurate</span>
    </span>
  </div>

  <!-- Top-Right Compact Controls (Venom Dosage Level, Auto-Rotate, Reset Camera) -->
  <div class="fixed top-5 right-5 z-20 flex items-center gap-2">
    <button
      id="venom-tier-btn"
      data-tier="1"
      title="Cycle Venom Dosage (Key: V)"
      class="hud-icon-btn venom-tier-badge h-10 px-3.5 rounded-full flex items-center gap-2 text-xs font-bold tracking-wider uppercase cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
      <span id="venom-tier-label">Venom Lv.1</span>
    </button>

    <button
      id="turntable-btn"
      title="Toggle Turntable Rotation (Key: Space)"
      aria-label="Toggle Turntable Rotation"
      class="hud-icon-btn w-10 h-10 rounded-full flex items-center justify-center text-gray-400 cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/>
      </svg>
    </button>

    <button
      id="reset-cam-btn"
      title="Reset Camera (Key: R)"
      aria-label="Reset Camera"
      class="hud-icon-btn w-10 h-10 rounded-full flex items-center justify-center text-gray-400 cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>

  <!-- Bottom Animation Switcher Pill -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-20">
    <div class="pill-bar flex items-center gap-1.5 p-1.5 rounded-full">
      <button data-anim="idle" title="Key: 1" class="anim-btn active px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase border border-transparent cursor-pointer">
        Idle
      </button>
      <button data-anim="walk" title="Key: 2" class="anim-btn px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase border border-transparent cursor-pointer">
        Walk
      </button>
      <button data-anim="attack" title="Key: 3" class="anim-btn px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase border border-transparent cursor-pointer">
        Attack
      </button>
      <button data-anim="special" title="Key: 4" class="anim-btn px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase border border-transparent cursor-pointer">
        Special
      </button>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d12);
    scene.fog = new THREE.FogExp2(0x0b0d12, 0.011);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 260);
    const DEFAULT_CAM_POS = new THREE.Vector3(18, 19.5, 38);
    const DEFAULT_CAM_TARGET = new THREE.Vector3(0, 14.2, 0);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(DEFAULT_CAM_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;
    controls.minDistance = 11;
    controls.maxDistance = 80;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.6;
    controls.update();

    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x111827, 0.58);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.48);
    keyLight.position.set(20, 42, 30);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 5;
    keyLight.shadow.camera.far = 95;
    const shadowBounds = 22;
    keyLight.shadow.camera.left = -shadowBounds;
    keyLight.shadow.camera.right = shadowBounds;
    keyLight.shadow.camera.top = shadowBounds;
    keyLight.shadow.camera.bottom = -shadowBounds;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x7dd3fc, 0.85);
    rimLight.position.set(-26, 22, -22);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xe2e8f0, 0.42);
    fillLight.position.set(-18, 16, 20);
    scene.add(fillLight);

    const venomLight = new THREE.PointLight(0x4eff2b, 1.15, 36);
    venomLight.position.set(0, 19, 3);
    scene.add(venomLight);

    const floorCyanLight = new THREE.PointLight(0x38bdf8, 0.55, 18);
    floorCyanLight.position.set(-6.5, 1.2, 3.5);
    scene.add(floorCyanLight);

    function pixelNoise(x, y, seed = 1) {
      const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 43.123) * 43758.5453;
      return n - Math.floor(n);
    }

    function shadeHex(hex, amount) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, ((num >> 16) & 0xff) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
      const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
      return `rgb(${r},${g},${b})`;
    }

    const emissiveMaterials = [];

    function createPixelFaceMaterial(w, h, drawFn, options = {}) {
      const res = options.res || 2;
      const pw = Math.max(1, Math.round(w * res));
      const ph = Math.max(1, Math.round(h * res));
      const canvas = document.createElement('canvas');
      canvas.width = pw;
      canvas.height = ph;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const api = {
        w: pw,
        h: ph,
        ctx,
        fill(color, noiseAmt = 5, seed = 1) {
          for (let y = 0; y < ph; y++) {
            for (let x = 0; x < pw; x++) {
              const delta = Math.round((pixelNoise(x, y, seed) - 0.5) * 2 * noiseAmt);
              ctx.fillStyle = shadeHex(color, delta);
              ctx.fillRect(x, y, 1, 1);
            }
          }
        },
        fillCamo(baseHex, midHex, darkHex, lightHex, seed = 10) {
          for (let y = 0; y < ph; y++) {
            for (let x = 0; x < pw; x++) {
              const bx = Math.floor(x / 2);
              const by = Math.floor(y / 2);
              const n = pixelNoise(bx, by, seed);
              let c = baseHex;
              if (n < 0.26) c = darkHex;
              else if (n < 0.55) c = midHex;
              else if (n > 0.82) c = lightHex;
              const micro = Math.round((pixelNoise(x, y, seed + 3) - 0.5) * 8);
              ctx.fillStyle = shadeHex(c, micro);
              ctx.fillRect(x, y, 1, 1);
            }
          }
        },
        px(x, y, color) {
          const ix = Math.floor(x);
          const iy = Math.floor(y);
          if (ix >= 0 && ix < pw && iy >= 0 && iy < ph) {
            ctx.fillStyle = color;
            ctx.fillRect(ix, iy, 1, 1);
          }
        },
        rect(x, y, rw, rh, color, noiseAmt = 0, seed = 7) {
          const sx = Math.round(x);
          const sy = Math.round(y);
          const sw = Math.round(rw);
          const sh = Math.round(rh);
          for (let iy = sy; iy < sy + sh; iy++) {
            for (let ix = sx; ix < sx + sw; ix++) {
              if (ix >= 0 && ix < pw && iy >= 0 && iy < ph) {
                const delta = noiseAmt ? Math.round((pixelNoise(ix, iy, seed) - 0.5) * 2 * noiseAmt) : 0;
                ctx.fillStyle = delta ? shadeHex(color, delta) : color;
                ctx.fillRect(ix, iy, 1, 1);
              }
            }
          }
        },
        line(x0, y0, x1, y1, color, thickness = 1) {
          const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
          for (let i = 0; i <= steps; i++) {
            const lx = Math.round(x0 + ((x1 - x0) * i) / steps);
            const ly = Math.round(y0 + ((y1 - y0) * i) / steps);
            this.rect(lx, ly, thickness, thickness, color);
          }
        },
        border(color, thickness = 1) {
          ctx.fillStyle = color;
          ctx.fillRect(0, 0, pw, thickness);
          ctx.fillRect(0, ph - thickness, pw, thickness);
          ctx.fillRect(0, 0, thickness, ph);
          ctx.fillRect(pw - thickness, 0, thickness, ph);
        }
      };

      drawFn(api);

      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      tex.needsUpdate = true;

      const matConfig = {
        map: tex,
        roughness: options.roughness !== undefined ? options.roughness : 0.68,
        metalness: options.metalness !== undefined ? options.metalness : 0.2,
      };

      if (options.emissive) {
        const emCanvas = document.createElement('canvas');
        emCanvas.width = pw;
        emCanvas.height = ph;
        const emCtx = emCanvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, pw, ph);
        const emData = emCtx.createImageData(pw, ph);

        for (let i = 0; i < imgData.data.length; i += 4) {
          const r = imgData.data[i];
          const g = imgData.data[i + 1];
          const b = imgData.data[i + 2];
          const isNeonGreen = g > 135 && g > r * 1.25;
          const isGlowingRed = r > 170 && r > g * 1.6 && r > b * 1.6;
          const isCyanGlow = b > 190 && g > 150 && r < 140;
          if (isNeonGreen || isGlowingRed || isCyanGlow) {
            emData.data[i] = r;
            emData.data[i + 1] = g;
            emData.data[i + 2] = b;
            emData.data[i + 3] = 255;
          } else {
            emData.data[i] = 0;
            emData.data[i + 1] = 0;
            emData.data[i + 2] = 0;
            emData.data[i + 3] = 255;
          }
        }
        emCtx.putImageData(emData, 0, 0);
        const emTex = new THREE.CanvasTexture(emCanvas);
        emTex.magFilter = THREE.NearestFilter;
        emTex.minFilter = THREE.NearestFilter;
        emTex.generateMipmaps = false;

        matConfig.emissive = new THREE.Color(0xffffff);
        matConfig.emissiveMap = emTex;
        matConfig.emissiveIntensity = options.emissiveIntensity || 1.05;
      }

      const mat = new THREE.MeshStandardMaterial(matConfig);
      if (options.emissive && !options.skipGlobalTrack) {
        emissiveMaterials.push({
          mat,
          baseIntensity: matConfig.emissiveIntensity,
          tag: options.tag || 'general'
        });
      }
      return mat;
    }

    function createPixelBox(w, h, d, facePainters, matOptions = {}) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const defaultPainter = (p) => p.fill('#252729', 5);
      const materials = [
        createPixelFaceMaterial(d, h, facePainters.right || facePainters.side || defaultPainter, matOptions),
        createPixelFaceMaterial(d, h, facePainters.left || facePainters.side || defaultPainter, matOptions),
        createPixelFaceMaterial(w, d, facePainters.top || facePainters.cap || defaultPainter, matOptions),
        createPixelFaceMaterial(w, d, facePainters.bottom || facePainters.cap || defaultPainter, matOptions),
        createPixelFaceMaterial(w, h, facePainters.front || facePainters.side || defaultPainter, matOptions),
        createPixelFaceMaterial(w, h, facePainters.back || facePainters.side || defaultPainter, matOptions),
      ];
      const mesh = new THREE.Mesh(geo, materials);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const PAL = {
      maskBlack: '#1c1e21',
      maskCarbon: '#2d3034',
      maskHighlight: '#3d4147',
      respiratorSilver: '#767378',
      respiratorLight: '#918e94',
      respiratorDark: '#3f3d41',
      gillSlot: '#151618',
      suitQuiltLight: '#49474b',
      suitQuiltMid: '#373539',
      suitQuiltDark: '#232225',
      suitCarbonSide: '#2c2e30',
      zipperBlack: '#141517',
      armorGunmetal: '#4c4648',
      armorLight: '#635c5e',
      armorDark: '#2e2a2c',
      rivetSilver: '#b8bec4',
      strapCharcoal: '#2c2e30',
      strapBorder: '#1b1c1e',
      buckleSteel: '#8c9298',
      buckleFrame: '#323538',
      venomBright: '#4eff2b',
      venomCore: '#b8ffa1',
      venomMid: '#26cc12',
      eyeRed: '#ff2222',
      eyeCore: '#ff8888',
      skinTan: '#b88162',
      skinShadow: '#8f5d43',
      camoBase: '#3c3735',
      camoMid: '#2f2b29',
      camoDark: '#1f1d1c',
      camoLight: '#4d4743',
      leatherChap: '#473e3c',
      leatherEdge: '#5b504d',
      bootDark: '#222021',
      bootSole: '#141314'
    };

    // Platform top is placed cleanly at Y = 0.0, while grid sits at the base level (Y = -0.58) so they never Z-fight
    const platformPad = createPixelBox(18, 0.6, 16, {
      top: (p) => {
        p.fill('#1b1f26', 4, 91);
        p.border('#2d333f', 2);
        for (let y = 6; y <= 24; y += 4) {
          p.rect(10, y, 22, 2, '#111419');
        }
        p.rect(2, 18, 6, 8, '#0ea5e9');
        p.rect(3, 19, 4, 6, '#bae6fd');
      },
      side: (p) => {
        p.fill('#1f242d', 3);
        p.rect(0, 0, p.w, 1, '#333b48');
      }
    }, { emissive: true, emissiveIntensity: 0.65, roughness: 0.6, metalness: 0.45, tag: 'platform' });
    platformPad.position.set(0, -0.3, 0);
    scene.add(platformPad);

    const shadowPlaneGeo = new THREE.PlaneGeometry(140, 140);
    const shadowPlaneMat = new THREE.ShadowMaterial({
      opacity: 0.48,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -2
    });
    const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0.003;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    const gridHelper = new THREE.GridHelper(68, 17, 0x222936, 0x151922);
    gridHelper.position.y = -0.58;
    scene.add(gridHelper);

    const characterRoot = new THREE.Group();
    scene.add(characterRoot);

    const pelvisPivot = new THREE.Group();
    pelvisPivot.position.set(0, 12, 0);
    characterRoot.add(pelvisPivot);

    const torsoPivot = new THREE.Group();
    torsoPivot.position.set(0, 2, 0);
    pelvisPivot.add(torsoPivot);

    const headPivot = new THREE.Group();
    headPivot.position.set(0, 11.2, 0);
    torsoPivot.add(headPivot);

    // Extended neck height so it stays socketed inside both the head and collar with no gap
    const neckBlock = createPixelBox(5.1, 2.8, 4.7, {
      front: (p) => {
        p.fill(PAL.suitCarbonSide, 4);
        p.rect(4, 0, 2, 6, PAL.zipperBlack);
      },
      left: (p) => {
        p.fill(PAL.suitCarbonSide, 4);
        p.rect(2, 0, 5, 2, PAL.skinTan, 3);
      },
      right: (p) => {
        p.fill(PAL.suitCarbonSide, 4);
        p.rect(2, 0, 5, 2, PAL.skinShadow, 3);
      },
      back: (p) => p.fill(PAL.suitCarbonSide, 4)
    });
    neckBlock.position.set(0, 0.0, 0);
    headPivot.add(neckBlock);

    const headMesh = createPixelBox(8.0, 8.0, 8.0, {
      front: (p) => {
        p.fill(PAL.maskCarbon, 4, 11);

        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 16; x++) {
            if ((x < 3 || x > 12) && (x + y) % 2 === 0) {
              p.px(x, y, '#22252a');
            }
          }
        }

        p.rect(3, 0, 10, 6, PAL.maskBlack, 2);
        p.rect(1, 6, 14, 10, '#15171a', 2);

        p.rect(7, 3, 2, 4, '#101214');
        p.px(6, 5, '#25282c');
        p.px(9, 5, '#25282c');

        // Left V-stripe
        p.px(3, 0, PAL.venomBright);
        p.px(3, 1, PAL.venomBright);
        p.px(2, 2, PAL.venomBright);
        p.px(3, 2, PAL.venomCore);
        p.px(3, 3, PAL.venomBright);
        p.px(4, 4, PAL.venomBright);
        p.px(5, 5, PAL.venomBright);
        p.px(6, 6, PAL.venomCore);

        // Right V-stripe
        p.px(12, 0, PAL.venomBright);
        p.px(12, 1, PAL.venomBright);
        p.px(13, 2, PAL.venomBright);
        p.px(12, 2, PAL.venomCore);
        p.px(12, 3, PAL.venomBright);
        p.px(11, 4, PAL.venomBright);
        p.px(10, 5, PAL.venomBright);
        p.px(9, 6, PAL.venomCore);

        p.rect(1, 6, 5, 1, '#0d0e11');
        p.rect(10, 6, 5, 1, '#0d0e11');
        p.rect(5, 7, 6, 1, '#0d0e11');

        p.rect(1, 7, 5, 2, '#07080a');
        p.rect(10, 7, 5, 2, '#07080a');

        p.px(2, 7, PAL.eyeRed);
        p.rect(2, 8, 4, 1, PAL.eyeRed);
        p.rect(3, 8, 2, 1, PAL.eyeCore);

        p.px(13, 7, PAL.eyeRed);

    function createDynamicVenomHose(segmentCount = 21, thickness = 0.86, phaseOffset = 0) {
      const count = segmentCount % 2 === 0 ? segmentCount + 1 : segmentCount;
      const group = new THREE.Group();
      const segments = [];

      for (let i = 0; i < count; i++) {
        const isMetallicTip = i === 0 || i === count - 1;
        const isGlowBand = !isMetallicTip && i % 2 === 1;
        const segWidth = isMetallicTip
          ? thickness * 1.05
          : isGlowBand
          ? thickness * 1.0
          : thickness * 0.84;

        const geo = new THREE.BoxGeometry(segWidth, 1.0, segWidth);
        let mat;
        if (isMetallicTip) {
          mat = sharedMetallicTipMat;
        } else if (isGlowBand) {
          // Clone lightweight material sharing the same GPU texture so each ring can pulse independently
          mat = sharedGlowSideTemplate.clone();
        } else {
          mat = sharedDarkRubberMat;
        }

        const seg = new THREE.Mesh(geo, mat);
        seg.castShadow = true;
        seg.receiveShadow = true;
        group.add(seg);
        segments.push({ mesh: seg, mat, isGlowBand, isMetallicTip, index: i });
      }

      const prevTangent = new THREE.Vector3(0, 1, 0);
      const stepQuat = new THREE.Quaternion();
      const runningQuat = new THREE.Quaternion();
      const rotMat = new THREE.Matrix4();
      const rightAxis = new THREE.Vector3();
      const forwardAxis = new THREE.Vector3();
      const refForward = new THREE.Vector3(0, 0, 1);
      const posVec = new THREE.Vector3();
      const nextPosVec = new THREE.Vector3();
      const prevPosVec = new THREE.Vector3();
      const tangentVec = new THREE.Vector3();

      // Pre-allocated dense lookup table for fast arc-length parameterization without per-frame GC
      const LUT_STEPS = 64;
      const lutPoints = Array.from({ length: LUT_STEPS + 1 }, () => new THREE.Vector3());
      const lutCumLen = new Float32Array(LUT_STEPS + 1);

      const hoseObj = {
        group,
        segments,
        segmentCount: count,
        phaseOffset,
        updatePoints(pointsArray) {
          const curve = new THREE.CatmullRomCurve3(pointsArray, false, 'centripetal', 0.35);

          let totalLen = 0;
          lutCumLen[0] = 0;
          curve.getPoint(0, lutPoints[0]);
          for (let k = 1; k <= LUT_STEPS; k++) {
            curve.getPoint(k / LUT_STEPS, lutPoints[k]);
            totalLen += lutPoints[k].distanceTo(lutPoints[k - 1]);
            lutCumLen[k] = totalLen;
          }

          const unitSpan = totalLen / count;

          for (let i = 0; i < count; i++) {
            const targetDist = ((i + 0.5) / count) * totalLen;

            // Binary search in precomputed arc-length table
            let low = 0;
            let high = LUT_STEPS;
            while (low < high - 1) {
              const mid = (low + high) >> 1;
              if (lutCumLen[mid] <= targetDist) low = mid;
              else high = mid;
            }
            const segLen = Math.max(0.0001, lutCumLen[high] - lutCumLen[low]);
            const alpha = (targetDist - lutCumLen[low]) / segLen;
            posVec.lerpVectors(lutPoints[low], lutPoints[high], alpha);

            // Compute smooth tangent from neighboring LUT samples
            const lowPrev = Math.max(0, low - 1);
            const highNext = Math.min(LUT_STEPS, high + 1);
            prevPosVec.copy(lutPoints[lowPrev]);
            nextPosVec.copy(lutPoints[highNext]);
            tangentVec.subVectors(nextPosVec, prevPosVec).normalize();

            const segObj = segments[i];
            const segMesh = segObj.mesh;
            segMesh.position.copy(posVec);

            // Lock initial roll at i=0 using a stable orthonormal basis so the hose never twists wildly
            if (i === 0) {
              rightAxis.crossVectors(tangentVec, refForward);
              if (rightAxis.lengthSq() < 0.001) rightAxis.set(1, 0, 0);
              else rightAxis.normalize();
              forwardAxis.crossVectors(rightAxis, tangentVec).normalize();
              rotMat.makeBasis(rightAxis, tangentVec, forwardAxis);
              runningQuat.setFromRotationMatrix(rotMat);
            } else {
              stepQuat.setFromUnitVectors(prevTangent, tangentVec);
              runningQuat.premultiply(stepQuat).normalize();
            }
            prevTangent.copy(tangentVec);
            segMesh.quaternion.copy(runningQuat);

            if (segObj.isMetallicTip) {
              segMesh.scale.set(1, unitSpan * 1.18, 1);
            } else if (segObj.isGlowBand) {
              segMesh.scale.set(1, unitSpan * 0.92, 1);
            } else {
              segMesh.scale.set(1, unitSpan * 1.65, 1);
            }
          }
        }
      };

      animatedHoses.push(hoseObj);
      return hoseObj;
    }

    function pushPointOutOfOBB(ptTorso, mesh, hx, hy, hz, margin, mode, sideDir = 1) {
      tempLocalPt.copy(ptTorso);
      torsoPivot.localToWorld(tempLocalPt);
      mesh.worldToLocal(tempLocalPt);

      const ex = hx + margin;
      const ey = hy + margin;
      const ez = hz + margin;

      if (Math.abs(tempLocalPt.x) >= ex || Math.abs(tempLocalPt.y) >= ey || Math.abs(tempLocalPt.z) >= ez) {
        return;
      }

      if (mode === 'head') {
        const distBack = tempLocalPt.z - (-ez);
        const distTop = ey - tempLocalPt.y;
        if (distTop < distBack * 1.15) {
          tempLocalPt.y = ey;
        } else {
          tempLocalPt.z = -ez;
        }
      } else if (mode === 'torso') {
        const distBack = tempLocalPt.z - (-ez);
        const distOut = sideDir > 0 ? (ex - tempLocalPt.x) : (tempLocalPt.x - (-ex));
        if (distBack <= distOut) {
          tempLocalPt.z = -ez;
        } else {
          tempLocalPt.x = sideDir * ex;
        }
      } else if (mode === 'trap') {
        const distBack = tempLocalPt.z - (-ez);
        const distTop = ey - tempLocalPt.y;
        const distOut = sideDir > 0 ? (ex - tempLocalPt.x) : (tempLocalPt.x - (-ex));
        if (distBack <= distTop && distBack <= distOut) {
          tempLocalPt.z = -ez;
        } else if (distOut <= distTop) {
          tempLocalPt.x = sideDir * ex;
        } else {
          tempLocalPt.y = ey;
        }
      } else if (mode === 'limb') {
        const distOut = sideDir > 0 ? (ex - tempLocalPt.x) : (tempLocalPt.x - (-ex));
        const distBack = tempLocalPt.z - (-ez);
        if (distOut <= distBack * 1.25) {
          tempLocalPt.x = sideDir * ex;
        } else {
          tempLocalPt.z = -ez;
        }
      }

      mesh.localToWorld(tempLocalPt);
      torsoPivot.worldToLocal(tempLocalPt);
      ptTorso.copy(tempLocalPt);
    }

    function buildCollisionFreeHosePoints(rawControlPts, sampleCount, margin, colliders, sideDir, preEndPt) {
      const baseCurve = new THREE.CatmullRomCurve3(rawControlPts);
      const pts = [];
      for (let i = 0; i < sampleCount; i++) {
        pts.push(baseCurve.getPoint(i / (sampleCount - 1)));
      }

      for (let iter = 0; iter < 3; iter++) {
        for (let i = 1; i < sampleCount - 1; i++) {
          for (let c = 0; c < colliders.length; c++) {
            const col = colliders[c];
            pushPointOutOfOBB(pts[i], col.mesh, col.hx, col.hy, col.hz, margin, col.mode, sideDir);
          }
        }
        for (let i = 2; i < sampleCount - 2; i++) {
          pts[i].x = pts[i].x * 0.65 + (pts[i - 1].x + pts[i + 1].x) * 0.175;
          pts[i].y = pts[i].y * 0.65 + (pts[i - 1].y + pts[i + 1].y) * 0.175;
          pts[i].z = pts[i].z * 0.65 + (pts[i - 1].z + pts[i + 1].z) * 0.175;
        }
      }

      for (let i = 1; i < sampleCount - 1; i++) {
        for (let c = 0; c < colliders.length; c++) {
          const col = colliders[c];
          pushPointOutOfOBB(pts[i], col.mesh, col.hx, col.hy, col.hz, margin, col.mode, sideDir);
        }
      }

      // Gently guide the penultimate point toward the nozzle axis so the metallic tip enters straight
      if (preEndPt && sampleCount >= 4) {
        pts[sampleCount - 2].lerp(preEndPt, 0.45);
      }

      return pts;
    }

    function updateDynamicHoseGeometry() {
      torsoPivot.updateMatrixWorld(true);

      // 1. Cranial Hose
      manifoldCranialAnchor.getWorldPosition(tempStartPt);
      torsoPivot.worldToLocal(tempStartPt);

      headHoseAnchor.getWorldPosition(tempVecA);
      torsoPivot.worldToLocal(tempVecA);

      headPreHoseAnchor.getWorldPosition(tempVecC);
      torsoPivot.worldToLocal(tempVecC);

      tempVecB.set(0, 6.85, -5.45);
      headPivot.localToWorld(tempVecB);
      torsoPivot.worldToLocal(tempVecB);

      tempArchPt.set(tempVecA.x * 0.25, 12.9, tempStartPt.z - 1.5);

      const cranialPts = buildCollisionFreeHosePoints(
        [tempStartPt, tempArchPt, tempVecB, tempVecC, tempVecA],
        cranialHose.segmentCount,
        0.64,
        cranialColliders,
        1,
        tempVecC
      );
      cranialHose.updatePoints(cranialPts);

      // 2. Dual Arm Hoses per side
      for (let pIdx = 0; pIdx < armHosePairs.length; pIdx++) {
        const { arm, hose, secondHose, colliders } = armHosePairs[pIdx];
        const d = arm.dir;

        // Track A: Primary Outer-Shoulder-to-Gauntlet Hose
        arm.manifoldPrimaryAnchor.getWorldPosition(tempStartPt);
        torsoPivot.worldToLocal(tempStartPt);

        arm.gauntletSocketAnchor.getWorldPosition(tempVecB);
        torsoPivot.worldToLocal(tempVecB);

        arm.gauntletPreSocketAnchor.getWorldPosition(tempVecE);
        torsoPivot.worldToLocal(tempVecE);

        tempVecC.set(d * 4.55, 0.35, -1.65);
        arm.shoulderPivot.localToWorld(tempVecC);
        torsoPivot.worldToLocal(tempVecC);

        tempVecD.set(d * 4.55, -2.85, -0.95);
        arm.shoulderPivot.localToWorld(tempVecD);
        torsoPivot.worldToLocal(tempVecD);

        tempArchPt.set(
          d * 5.65,
          Math.max(11.35, (tempStartPt.y + tempVecC.y) * 0.5 + 1.45),
          Math.min(tempStartPt.z - 0.15, tempVecC.z - 0.95)
        );

        const primaryPts = buildCollisionFreeHosePoints(
          [tempStartPt.clone(), tempArchPt.clone(), tempVecC.clone(), tempVecD.clone(), tempVecE.clone(), tempVecB.clone()],
          hose.segmentCount,
          0.62,
          colliders,
          d,
          tempVecE
        );

        // Track B: Secondary Lower-Manifold-to-Posterior-Bicep Hose
        arm.manifoldSecondaryAnchor.getWorldPosition(tempStartPt);
        torsoPivot.worldToLocal(tempStartPt);

        arm.bicepSocketAnchor.getWorldPosition(tempVecD);
        torsoPivot.worldToLocal(tempVecD);

        arm.bicepPreSocketAnchor.getWorldPosition(tempVecE);
        torsoPivot.worldToLocal(tempVecE);

        tempVecC.set(d * 1.35, -1.85, -3.65);
        arm.shoulderPivot.localToWorld(tempVecC);
        torsoPivot.worldToLocal(tempVecC);

        tempArchPt.set(
          d * 4.35,
          6.85,
          Math.min(tempStartPt.z - 0.85, tempVecC.z - 0.85)
        );

        const secondaryPts = buildCollisionFreeHosePoints(
          [tempStartPt.clone(), tempArchPt.clone(), tempVecC.clone(), tempVecE.clone(), tempVecD.clone()],
          secondHose.segmentCount,
          0.58,
          colliders,
          d,
          tempVecE
        );

        // Enforce 3D separation between primary and secondary arm hoses
        const minHoseDist = 1.75;
        for (let iter = 0; iter < 2; iter++) {
          for (let i = 1; i < secondHose.segmentCount - 1; i++) {
            for (let j = 1; j < hose.segmentCount - 1; j++) {
              const dx = primaryPts[j].x - secondaryPts[i].x;
              const dy = primaryPts[j].y - secondaryPts[i].y;
              const dz = primaryPts[j].z - secondaryPts[i].z;
              const distSq = dx * dx + dy * dy + dz * dz;
              if (distSq < minHoseDist * minHoseDist && distSq > 0.0001) {
                const dist = Math.sqrt(distSq);
                const overlap = (minHoseDist - dist) * 0.55;
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                primaryPts[j].x += nx * overlap + d * overlap * 0.35;
                primaryPts[j].y += ny * overlap + overlap * 0.25;
                primaryPts[j].z += nz * overlap;
                secondaryPts[i].x -= nx * overlap;
                secondaryPts[i].y -= ny * overlap;
                secondaryPts[i].z -= Math.abs(nz) * overlap + overlap * 0.45;
              }
            }
          }
        }

        for (let j = 1; j < hose.segmentCount - 1; j++) {
          for (let c = 0; c < colliders.length; c++) {
            const col = colliders[c];
            pushPointOutOfOBB(primaryPts[j], col.mesh, col.hx, col.hy, col.hz, 0.6, col.mode, d);
          }
        }
        for (let i = 1; i < secondHose.segmentCount - 1; i++) {
          for (let c = 0; c < colliders.length; c++) {
            const col = colliders[c];
            pushPointOutOfOBB(secondaryPts[i], col.mesh, col.hx, col.hy, col.hz, 0.56, col.mode, d);
          }
        }

        hose.updatePoints(primaryPts);
        secondHose.updatePoints(secondaryPts);
      }
    }

    function updateVenomGlow(surgeMultiplier, globalTime) {
      const tierMultiplier = venomTier === 1 ? 1.0 : venomTier === 2 ? 1.48 : 2.15;
      const totalSurge = surgeMultiplier * tierMultiplier;

      for (let i = 0; i < emissiveMaterials.length; i++) {
        const item = emissiveMaterials[i];
        if (item.tag === 'platform') {
          item.mat.emissiveIntensity = item.baseIntensity;
        } else {
          item.mat.emissiveIntensity = item.baseIntensity * totalSurge;
        }
      }

      const flowSpeed = 6.5 + venomTier * 2.5;
      for (let h = 0; h < animatedHoses.length; h++) {
        const hose = animatedHoses[h];
        for (let s = 0; s < hose.segments.length; s++) {
          const seg = hose.segments[s];
          if (seg.isGlowBand) {
            const wave = 0.5 + 0.5 * Math.sin(globalTime * flowSpeed - s * 0.65 + hose.phaseOffset);
            seg.mat.emissiveIntensity = (0.75 + wave * 0.85) * totalSurge;
          }
        }
      }

      venomLight.intensity = 1.1 * totalSurge;
    }

    const footProbePoints = [
      leftLeg.heelProbe,
      leftLeg.toeProbe,
      rightLeg.heelProbe,
      rightLeg.toeProbe
    ];
    const tempProbeWorld = new THREE.Vector3();

    function enforceGroundContact() {
      characterRoot.position.y = 0;
      characterRoot.updateMatrixWorld(true);

      let minBootY = Infinity;
      for (let i = 0; i < footProbePoints.length; i++) {
        footProbePoints[i].getWorldPosition(tempProbeWorld);
        if (tempProbeWorld.y < minBootY) {
          minBootY = tempProbeWorld.y;
        }
      }

      // Shift characterRoot vertically so the lowest boot sole contact point rests cleanly on Y = 0.0
      if (minBootY < 0.0) {
        characterRoot.position.y = -minBootY;
      } else if (currentAnim === 'idle' || currentAnim === 'special') {
        characterRoot.position.y = -minBootY;
      }
    }

    const tempWorldVec = new THREE.Vector3();

    function updateCharacterAnimation(dt, globalTime) {
      animTime += dt;
      const s = 14;

      const tierMuscleScale = venomTier === 1 ? 1.0 : venomTier === 2 ? 1.045 : 1.095;

      let pelvisY = 12.0;
      let pelvisRotX = 0, pelvisRotY = 0.08, pelvisRotZ = 0;
      let torsoRotX = 0.04, torsoRotY = -0.05, torsoRotZ = 0;
      let torsoScale = tierMuscleScale;
      let headRotX = 0.08, headRotY = 0.04, headRotZ = 0;

      let lShoulderX = 0.06, lShoulderY = 0, lShoulderZ = 0.20;
      let rShoulderX = 0.06, rShoulderY = 0, rShoulderZ = -0.20;
      let lElbowX = -0.34, rElbowX = -0.34;

      let lHipX = -0.05, lHipZ = 0.055, rHipX = 0.06, rHipZ = -0.055;
      let lKneeX = 0.10, rKneeX = 0.08;

      let venomSurge = 1.0 + Math.sin(animTime * (2.8 + venomTier)) * 0.14;

      if (currentAnim === 'idle') {
        const breath = Math.sin(animTime * 2.2);
        const breath2 = Math.cos(animTime * 2.2);

        pelvisY = 12.0 - Math.abs(breath) * 0.15;
        torsoRotX = 0.05 + breath * 0.03;
        torsoScale = tierMuscleScale + Math.max(0, breath) * 0.018;

        headRotY = 0.04 + THREE.MathUtils.clamp(pointerNDC.x * 0.32, -0.38, 0.38) + Math.sin(animTime * 1.1) * 0.05;
        headRotX = 0.09 + THREE.MathUtils.clamp(-pointerNDC.y * 0.18, -0.22, 0.22) - breath * 0.025;

        lShoulderX = 0.08 + breath2 * 0.035;
        rShoulderX = 0.06 + breath2 * 0.035;
        lShoulderZ = 0.21 + breath * 0.025 + (venomTier - 1) * 0.04;
        rShoulderZ = -0.21 - breath * 0.025 - (venomTier - 1) * 0.04;
        lElbowX = -0.36 - breath * 0.04;
        rElbowX = -0.32 - breath * 0.04;

        lHipX = -0.06;
        rHipX = 0.06;
        lKneeX = 0.11;
        rKneeX = 0.08;

        if (venomTier === 3 && Math.random() < 0.18) {
          backManifold.getWorldPosition(tempWorldVec);
          spawnVenomVapor(tempWorldVec, 1.8, 3.0);
        }
      } else if (currentAnim === 'walk') {
        const wSpeed = 5.4;
        const phase = animTime * wSpeed;
        const sinP = Math.sin(phase);
        const cosP = Math.cos(phase);

        pelvisY = 11.75 + Math.abs(cosP) * 0.55;
        pelvisRotY = -sinP * 0.15;
        pelvisRotZ = cosP * 0.05;

        torsoRotX = 0.16 + Math.abs(sinP) * 0.05;
        torsoRotY = sinP * 0.24;
        torsoRotZ = -cosP * 0.05;

        headRotX = -0.06 + Math.abs(cosP) * 0.04;
        headRotY = -sinP * 0.14;

        lShoulderX = -sinP * 0.54 + 0.1;
        rShoulderX = sinP * 0.54 + 0.1;
        lShoulderZ = 0.24 + Math.max(0, -sinP) * 0.08;
        rShoulderZ = -0.24 - Math.max(0, sinP) * 0.08;
        lElbowX = -0.52 - Math.max(0, -sinP) * 0.35;
        rElbowX = -0.52 - Math.max(0, sinP) * 0.35;

        lHipX = sinP * 0.62;
        rHipX = -sinP * 0.62;
        lKneeX = Math.max(0, -cosP) * 0.72 + 0.1;
        rKneeX = Math.max(0, cosP) * 0.72 + 0.1;
      } else if (currentAnim === 'attack') {
        const cycle = (animTime * 1.15) % 2.0;
        if (cycle < 0.45) {
          slamTriggeredInCycle = false;
          const t = cycle / 0.45;
          const e = t * t * (3 - 2 * t);
          pelvisY = 11.6;
          torsoRotY = -0.68 * e;
          torsoRotX = 0.15 * e;
          headRotY = 0.45 * e;
          rShoulderX = -0.55 * e;
          rShoulderZ = -0.68 * e;
          rElbowX = -1.1 * e;
          lShoulderX = 0.55 * e;
          lElbowX = -0.95 * e;
          lHipX = -0.28 * e;
          rHipX = 0.32 * e;
          lKneeX = 0.35 * e;
          rKneeX = 0.25 * e;
          venomSurge = 1.2 + e * 0.5;
        } else if (cycle < 0.9) {
          const t = (cycle - 0.45) / 0.45;
          const e = 1 - Math.pow(1 - t, 3);
          pelvisY = 11.4;
          torsoRotY = -0.68 + 1.48 * e;
          torsoRotX = 0.28;
          headRotY = -0.55 * e;
          rShoulderX = 1.48 * e;
          rShoulderZ = -0.15;
          rElbowX = -0.22;
          lShoulderX = -0.45 * e;
          lElbowX = -1.1;
          lHipX = -0.35;
          rHipX = 0.42;
          lKneeX = 0.45;
          rKneeX = 0.25;
          venomSurge = 1.85;
        } else if (cycle < 1.35) {
          const t = (cycle - 0.9) / 0.45;
          const e = t * t * (3 - 2 * t);
          pelvisY = 12.35 * e + 11.5 * (1 - e);
          torsoRotY = 0.8 * (1 - e);
          torsoRotX = -0.34 * e;
          headRotX = -0.26 * e;
          lShoulderX = 2.68 * e;
          rShoulderX = 2.68 * e;
          lShoulderZ = 0.18;
          rShoulderZ = -0.18;
          lElbowX = -0.35;
          rElbowX = -0.35;
          venomSurge = 2.15;
        } else {
          const t = (cycle - 1.35) / 0.65;
          const slam = Math.min(1, t * 3.2);
          const recover = Math.max(0, (t - 0.35) / 0.65);

          if (slam >= 0.9 && !slamTriggeredInCycle) {
            slamTriggeredInCycle = true;
            triggerGroundShockwave(4.2);
          }

          pelvisY = THREE.MathUtils.lerp(11.15, 12.0, recover);
          torsoRotX = THREE.MathUtils.lerp(0.64, 0.05, recover);
          headRotX = THREE.MathUtils.lerp(-0.25, 0.08, recover);
          lShoulderX = THREE.MathUtils.lerp(2.68 - 1.78 * slam, 0.08, recover);
          rShoulderX = THREE.MathUtils.lerp(2.68 - 1.78 * slam, 0.06, recover);
          lElbowX = THREE.MathUtils.lerp(-0.2, -0.36, recover);
          rElbowX = THREE.MathUtils.lerp(-0.2, -0.32, recover);
          lHipX = THREE.MathUtils.lerp(-0.42, -0.06, recover);
          rHipX = THREE.MathUtils.lerp(0.42, 0.06, recover);
          lKneeX = THREE.MathUtils.lerp(0.58, 0.11, recover);
          rKneeX = THREE.MathUtils.lerp(0.48, 0.08, recover);
          venomSurge = THREE.MathUtils.lerp(2.5, 1.1, recover);
        }
      } else if (currentAnim === 'special') {
        const cycle = (animTime * 0.85) % 2.4;

        if (cycle < 0.7) {
          slamTriggeredInCycle = false;
          const t = cycle / 0.7;
          const e = t * t * (3 - 2 * t);
          pelvisY = 12.0 - 0.75 * e;
          torsoRotX = 0.36 * e;
          torsoRotY = 0.22 * e;
          headRotX = 0.25 * e;
          headRotY = -0.18 * e;
          lShoulderX = 0.65 * e;
          rShoulderX = 0.45 * e;
          lShoulderZ = 0.55 * e;
          rShoulderZ = -0.65 * e;
          lElbowX = -1.25 * e;
          rElbowX = -0.95 * e;
          lHipX = -0.32 * e;
          rHipX = 0.25 * e;
          lKneeX = 0.52 * e;
          rKneeX = 0.42 * e;
          venomSurge = 1.0 + e * 1.4;
        } else if (cycle < 1.75) {
          if (!slamTriggeredInCycle) {
            slamTriggeredInCycle = true;
            triggerGroundShockwave(0.0);
          }

          const tremor = Math.sin(animTime * 48) * 0.032;
          pelvisY = 11.45;
          torsoRotX = 0.22 + tremor;
          torsoRotY = 0.25;
          torsoScale = tierMuscleScale * 1.085 + Math.sin(animTime * 20) * 0.02;
          headRotX = -0.12 + tremor;
          headRotY = -0.22 + Math.sin(animTime * 8) * 0.08;

          lShoulderX = 0.45 + tremor;
          rShoulderX = -0.25 - tremor;
          lShoulderZ = 0.68;
          rShoulderZ = -0.78;
          lElbowX = -0.92;
          rElbowX = -0.58;

          lHipX = -0.28;
          rHipX = 0.24;
          lKneeX = 0.45;
          rKneeX = 0.35;

          venomSurge = 2.6 + Math.sin(animTime * 24) * 0.45;

          if (Math.random() < 0.78) {
            backManifold.getWorldPosition(tempWorldVec);
            spawnVenomVapor(tempWorldVec, 2.2, 4.5);
            leftArm.elbowPivot.getWorldPosition(tempWorldVec);
            spawnVenomVapor(tempWorldVec, 1.6, 3.8);
            rightArm.elbowPivot.getWorldPosition(tempWorldVec);
            spawnVenomVapor(tempWorldVec, 1.6, 3.8);
          }
        } else {
          const t = (cycle - 1.75) / 0.65;
          const e = t * t * (3 - 2 * t);
          pelvisY = THREE.MathUtils.lerp(11.45, 12.0, e);
          torsoRotX = THREE.MathUtils.lerp(0.22, 0.05, e);
          torsoRotY = THREE.MathUtils.lerp(0.25, -0.05, e);
          torsoScale = THREE.MathUtils.lerp(tierMuscleScale * 1.085, tierMuscleScale, e);
          headRotX = THREE.MathUtils.lerp(-0.12, 0.08, e);
          headRotY = THREE.MathUtils.lerp(-0.22, 0.04, e);
          lShoulderZ = THREE.MathUtils.lerp(0.68, 0.21, e);
          rShoulderZ = THREE.MathUtils.lerp(-0.78, -0.21, e);
          lElbowX = THREE.MathUtils.lerp(-0.92, -0.36, e);
          rElbowX = THREE.MathUtils.lerp(-0.58, -0.32, e);
          venomSurge = THREE.MathUtils.lerp(2.6, 1.1, e);
        }
      }

      pelvisPivot.position.y = damp(pelvisPivot.position.y, pelvisY, s, dt);
      pelvisPivot.rotation.x = damp(pelvisPivot.rotation.x, pelvisRotX, s, dt);
      pelvisPivot.rotation.y = damp(pelvisPivot.rotation.y, pelvisRotY, s, dt);
      pelvisPivot.rotation.z = damp(pelvisPivot.rotation.z, pelvisRotZ, s, dt);

      torsoPivot.rotation.x = damp(torsoPivot.rotation.x, torsoRotX, s, dt);
      torsoPivot.rotation.y = damp(torsoPivot.rotation.y, torsoRotY, s, dt);
      torsoPivot.rotation.z = damp(torsoPivot.rotation.z, torsoRotZ, s, dt);

      // Scale chestBulkGroup (chest + straps + pec plates + manifold together) and shift shoulders outward so nothing clips!
      const sc = damp(chestBulkGroup.scale.x, torsoScale, s, dt);
      const scY = 1 + (sc - 1) * 0.32;
      chestBulkGroup.scale.set(sc, scY, sc);
      lowerAbdomen.scale.set(1 + (sc - 1) * 0.72, 1.0, 1 + (sc - 1) * 0.72);
      headPivot.position.y = 11.2 + (scY - 1) * 3.8;

      const armBulkScale = 1 + (sc - 1) * 0.65;
      leftArm.shoulderPivot.position.x = 6.0 * sc;
      rightArm.shoulderPivot.position.x = -6.0 * sc;
      leftArm.upperArmBulk.scale.set(armBulkScale, 1, armBulkScale);
      rightArm.upperArmBulk.scale.set(armBulkScale, 1, armBulkScale);
      leftLeg.thighBulk.scale.set(1 + (sc - 1) * 0.45, 1, 1 + (sc - 1) * 0.45);
      rightLeg.thighBulk.scale.set(1 + (sc - 1) * 0.45, 1, 1 + (sc - 1) * 0.45);

      headPivot.rotation.x = damp(headPivot.rotation.x, headRotX, s, dt);
      headPivot.rotation.y = damp(headPivot.rotation.y, headRotY, s, dt);
      headPivot.rotation.z = damp(headPivot.rotation.z, headRotZ, s, dt);

      leftArm.shoulderPivot.rotation.x = damp(leftArm.shoulderPivot.rotation.x, lShoulderX, s, dt);
      leftArm.shoulderPivot.rotation.y = damp(leftArm.shoulderPivot.rotation.y, lShoulderY, s, dt);
      leftArm.shoulderPivot.rotation.z = damp(leftArm.shoulderPivot.rotation.z, lShoulderZ, s, dt);
      leftArm.elbowPivot.rotation.x = damp(leftArm.elbowPivot.rotation.x, lElbowX, s, dt);

      rightArm.shoulderPivot.rotation.x = damp(rightArm.shoulderPivot.rotation.x, rShoulderX, s, dt);
      rightArm.shoulderPivot.rotation.y = damp(rightArm.shoulderPivot.rotation.y, rShoulderY, s, dt);
      rightArm.shoulderPivot.rotation.z = damp(rightArm.shoulderPivot.rotation.z, rShoulderZ, s, dt);
      rightArm.elbowPivot.rotation.x = damp(rightArm.elbowPivot.rotation.x, rElbowX, s, dt);

      leftLeg.hipPivot.rotation.x = damp(leftLeg.hipPivot.rotation.x, lHipX, s, dt);
      leftLeg.hipPivot.rotation.z = damp(leftLeg.hipPivot.rotation.z, lHipZ, s, dt);
      leftLeg.kneePivot.rotation.x = damp(leftLeg.kneePivot.rotation.x, lKneeX, s, dt);

      rightLeg.hipPivot.rotation.x = damp(rightLeg.hipPivot.rotation.x, rHipX, s, dt);
      rightLeg.hipPivot.rotation.z = damp(rightLeg.hipPivot.rotation.z, rHipZ, s, dt);
      rightLeg.kneePivot.rotation.x = damp(rightLeg.kneePivot.rotation.x, rKneeX, s, dt);

      enforceGroundContact();
      updateDynamicHoseGeometry();
      updateVenomGlow(venomSurge, globalTime);

      if (shockwaveLife > 0) {
        shockwaveLife -= dt * 2.2;
        if (shockwaveLife <= 0) {
          shockwaveRing.visible = false;
        } else {
          const progress = 1 - shockwaveLife;
          const ringScale = 1 + progress * 9.5;
          shockwaveRing.scale.set(ringScale, ringScale, 1);
          shockwaveRing.material.opacity = shockwaveLife * 0.75;
        }
      }

      if (cameraShakeIntensity > 0) {
        cameraShakeIntensity = Math.max(0, cameraShakeIntensity - dt * 1.4);
      }

      for (let i = 0; i < vaporParticles.length; i++) {
        const p = vaporParticles[i];
        if (p.life > 0) {
          p.life -= dt;
          if (p.life <= 0) {
            p.mesh.visible = false;
          } else {
            p.mesh.position.addScaledVector(p.vel, dt);
            p.mesh.rotation.x += dt * 4;
            p.mesh.rotation.y += dt * 5;
            const ratio = p.life / p.maxLife;
            p.mesh.material.opacity = ratio * 0.75;
            const pScale = 0.55 + (1 - ratio) * 1.15;
            p.mesh.scale.set(pScale, pScale, pScale);
          }
        }
      }
    }

    const STEP = 1 / 60;
    let accumulator = 0;
    let lastTime = performance.now();
    let totalElapsed = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      const frameTime = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      accumulator += frameTime;

      while (accumulator >= STEP) {
        totalElapsed += STEP;
        updateCharacterAnimation(STEP, totalElapsed);
        accumulator -= STEP;
      }

      controls.update();

      if (cameraShakeIntensity > 0.001) {
        camera.position.y += Math.sin(totalElapsed * 55) * cameraShakeIntensity * 0.18;
      }

      renderer.render(scene, camera);
    }

    window.onload = function () {
      enforceGroundContact();
      updateDynamicHoseGeometry();
      updateStatusBadge();
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>

# Mod info read by NeoForge. The dollar-brace values are filled from gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="theking_logo.png"
authors="Sindicate team"
description='''
Sindicate: custom mobs, each one a 1:1 copy of its HTML viewer.
The King: a crowned troublemaker who dropkicks, punches, shouts voice lines and dances after every kill.
Homelander: grabs victims by the throat, throws them sky high, burns them with heat vision, smacks their ears ("I am god"),
smashes them flat, drags them by the ankles and flings them far. Neutral: he only fights back.
Spawn eggs in their own creative tabs. Settings: Mods -> Sindicate -> Config, or press K in game (client + server tabs, hover for help).
Updates: "Check for Updates" on the title screen / pause menu (also checks every 5 minutes).
'''

# Client mixin: victims of Homelander's Clap / Smash pose their arms (hands on ears, trailing while dragged)
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Gradle: memory and speed
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment = readable parameter names in the Minecraft code (https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft 1.21.1 + NeoForge. Built against 21.1.251 = the version of the user's Modrinth pack
# (a build against an older 21.1 runs on every newer 21.1 NeoForge; the 21.1.259 build refused to load on 21.1.251).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
neo_version_range=[21.1.251,)
loader_version_range=[1,)

# The mod
mod_id=sindicate
mod_name=Sindicate
mod_license=All Rights Reserved
# Release version: X.Y.Z-alpha, every part 0..99 (tools/release.ps1 counts it up and publishes the GitHub release)
mod_version=0.0.3-alpha
# Jar name: sindicate-<version>.jar
jar_name=sindicate
mod_group_id=com.custommobs

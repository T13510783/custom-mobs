<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Davy Jones — Vanilla+ 16x16 Model Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Three.js r128 + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e2e8f0;
        }
        #viewport-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 42%, #24303c 0%, #121820 58%, #090c10 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
        /* Sleek floating bottom pill bar */
        .pill-bar {
            background: rgba(15, 20, 26, 0.84);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(0, 0, 0, 0.45);
        }
        .anim-btn, .util-btn {
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            color: #94a3b8;
        }
        .anim-btn:hover, .util-btn:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.06);
        }
        .anim-btn.active, .util-btn.active {
            color: #fff7ed;
            background: linear-gradient(180deg, rgba(180, 68, 38, 0.68) 0%, rgba(110, 35, 20, 0.78) 100%);
            border: 1px solid rgba(251, 146, 60, 0.42);
            box-shadow: 0 2px 12px rgba(234, 88, 12, 0.25);
        }
        .reset-btn {
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            color: #94a3b8;
        }
        .reset-btn:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.08);
            transform: rotate(-15deg);
        }
        .reset-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body>
    <div id="viewport-container">
        <canvas id="model-canvas"></canvas>

        <!-- Subtle top-left badge -->
        <div class="fixed top-5 left-5 z-10 pointer-events-none hidden sm:flex items-center gap-2.5 px-3.5 py-1.5 rounded-full pill-bar text-xs text-slate-300/90">
            <span class="w-2 h-2 rounded-full bg-orange-400 animate-pulse"></span>
            <span class="font-medium tracking-wide text-slate-100">Davy Jones</span>
            <span class="text-slate-500">•</span>
            <span class="text-amber-300/90">Color-Graded Vanilla+ Rig</span>
        </div>

        <!-- Ultra-minimal bottom floating pill bar -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1 sm:gap-1.5 p-1.5 rounded-full pill-bar max-w-[95vw] overflow-x-auto">
            <button type="button" data-anim="idle" class="anim-btn active px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-medium tracking-wide border border-transparent whitespace-nowrap">
                Idle
            </button>
            <button type="button" data-anim="walk" class="anim-btn px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-medium tracking-wide border border-transparent whitespace-nowrap">
                Walk
            </button>
            <button type="button" data-anim="attack" class="anim-btn px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-medium tracking-wide border border-transparent whitespace-nowrap">
                Attack
            </button>
            <button type="button" data-anim="locket" class="anim-btn px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-medium tracking-wide border border-transparent whitespace-nowrap">
                Locket
            </button>
            <button type="button" data-anim="special" class="anim-btn px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-medium tracking-wide border border-transparent whitespace-nowrap">
                Kraken
            </button>

            <div class="w-px h-4 bg-white/10 mx-0.5 shrink-0"></div>

            <button id="toggle-deck-btn" type="button" title="Toggle Dutchman Deck & Dead Man's Chest" class="util-btn active px-2.5 py-1.5 rounded-full text-xs font-medium border border-transparent flex items-center gap-1 shrink-0">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span class="hidden md:inline">Deck</span>
            </button>

            <button id="reset-camera-btn" type="button" title="Reset Camera" aria-label="Reset Camera" class="reset-btn p-2 rounded-full flex items-center justify-center shrink-0">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        window.onload = function () {
            // Deterministic PRNG for consistent procedural pixel art across reloads
            let seed = 1337420;
            function rand() {
                seed = (seed * 16807) % 2147483647;
                return (seed - 1) / 2147483646;
            }

            // Color-Graded High-Contrast Palette matched directly to the Davy Jones reference figure
            const PALETTE = {
                // Warm fleshy peach-apricot, salmon-coral & golden-tan cephalopod skin
                skinBase: '#e09b72',
                skinLight: '#f3be99',
                skinMid: '#c77a52',
                skinDark: '#995233',
                skinDeep: '#612c1a',
                skinPinkTint: '#d97564',
                skinGreenTint: '#a88459',
                skinBlueVein: '#7d5a50',
                skinWetHighlight: '#fce0c5',
                suckerRing: '#f5c6a8',
                suckerRim: '#d17866',
                suckerHole: '#6e252f',
                eyeSocket: '#381812',
                eyeSclera: '#f5ece2',
                eyeIris: '#4a2518',
                eyePupil: '#140b08',
                eyeGleam: '#ffffff',

                // Rich crimson-maroon bandana under hat
                bandanaBase: '#7d2027',
                bandanaDark: '#4d1116',
                bandanaPattern: '#ad3b42',

                // Deep Prussian nautical blue-slate coat & hat with rich moss/algae & bright gold trim
                coatDarkest: '#121c24',
                coatDark: '#1b2c38',
                coatBase: '#274052',
                coatMid: '#37586e',
                coatLight: '#4e758f',
                coatMoss: '#4a6637',
                coatAlgae: '#6b8c49',
                coatKelpBright: '#84a65b',
                coatRot: '#29261e',
                hatTrimGold: '#cfa136',
                hatTrimLight: '#f2c957',
                hatTrimShadow: '#8f6b1c',
                brassButton: '#d4a63f',
                brassHighlight: '#fae588',
                linenCuffLight: '#ebe5d5',
                linenCuffMid: '#cfc6b0',
                linenCuffShadow: '#9c927e',

                // Mossy olive-green right thigh breeches & dark kelp left breeches
                breechesOliveDark: '#394727',
                breechesOliveBase: '#55693b',
                breechesOliveLight: '#738c52',
                breechesOliveHighlight: '#8fa868',

                // Barnacles, Royal Blue & Orange Shoulder Shells, Coral & Starfish
                barnacleShell: '#bfc4ba',
                barnacleLight: '#e6ebe1',
                barnacleHole: '#2d3630',
                shellRoyalBlue: '#1d4696',
                shellBrightBlue: '#3568c4',
                shellNavyEdge: '#0f234d',
                shellGoldOrange: '#d97e28',
                shellBrightOrange: '#f5a642',
                musselBlack: '#16202b',
                musselBlue: '#284566',
                musselRim: '#527ba6',
                coralPink: '#cc4b5a',
                coralLight: '#f07886',
                spongeTan: '#d4a84e',
                starfishOrange: '#d95b26',
                kelpDark: '#334724',
                kelpMid: '#526e3a',
                kelpLight: '#709150',

                // Crimson Waist Sash & Warm Mahogany Leather Belts / Baldric
                sashDark: '#521419',
                sashBase: '#852029',
                sashLight: '#b0303c',
                beltLeather: '#4a2c1d',
                beltDark: '#29170e',
                beltEdge: '#6e442f',
                buckleGold: '#c99e38',
                buckleBright: '#f5d061',

                // Dead Man's Chest Key & Heart Music Box Locket
                keySilver: '#a8b8c4',
                keyHighlight: '#e1ebf2',
                keyShadow: '#4d5b66',
                locketGold: '#cfa23c',
                locketBright: '#fae787',
                locketDark: '#705216',

                // VIVID Crimson-Vermilion & Burnt-Orange Left Crab Claw with Yellow Knuckle & Pitch-Black Tips
                clawDarkest: '#4a0e07',
                clawDark: '#871b0e',
                clawBase: '#bd2b16',
                clawCrimson: '#d63a1f',
                clawOrange: '#eb5828',
                clawHighlight: '#ff7b47',
                clawKnuckleYellow: '#f2c12e',
                clawKnuckleShadow: '#b58416',
                clawTooth: '#f2eadc',
                clawTipDark: '#261714',
                clawTipBlack: '#120d0c',

                // VIVID Red-Orange-to-Charred-Black Graded Right Peg Leg (matching reference figure!)
                pegSocketRed: '#8f1d10',
                pegCrimson: '#b82914',
                pegVermilion: '#d9441e',
                pegOrange: '#eb6834',
                pegAmberHighlight: '#f78c52',
                pegCharredMid: '#4f291d',
                pegTip: '#1a1311',

                // Broadsword & Barnacle-Encrusted Blade
                bladeDark: '#3f4b52',
                bladeBase: '#63737d',
                bladeLight: '#93a6b0',
                bladeEdge: '#d2e2eb',
                bladeRust: '#8c4627',
                hiltBronze: '#7d602b',
                hiltGold: '#bd9642',

                // Sculpted Barnacle/Crustacean Pipe
                pipeStemDark: '#181c21',
                pipeStemHighlight: '#3b434d',
                pipeBeadMid: '#362d26',
                pipeBeadRing: '#5c4d40',
                pipeBowlDark: '#26201b',
                pipeBowlMid: '#453a30',
                pipeBowlRidge: '#695849',
                pipeClawBase: '#786833',
                pipeClawLight: '#a38f48',
                pipeClawDark: '#473d1c',
                pipeEmber: '#5eead4'
            };

            function createPixelCanvas(w, h, drawFn) {
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(w));
                canvas.height = Math.max(1, Math.round(h));
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                drawFn(ctx, canvas.width, canvas.height);

                // Subtle top-to-bottom warm sunlight / deep sea ambient color-grading pass on every texture
                if (canvas.height >= 3) {
                    ctx.fillStyle = 'rgba(255, 232, 185, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, Math.max(1, Math.floor(canvas.height * 0.28)));
                    ctx.fillStyle = 'rgba(10, 18, 28, 0.08)';
                    ctx.fillRect(0, Math.floor(canvas.height * 0.75), canvas.width, Math.ceil(canvas.height * 0.25));
                }

                const texture = new THREE.CanvasTexture(canvas);
                texture.magFilter = THREE.NearestFilter;
                texture.minFilter = THREE.NearestFilter;
                texture.generateMipmaps = false;
                texture.needsUpdate = true;
                return texture;
            }

            function px(ctx, x, y, color, w = 1, h = 1) {
                ctx.fillStyle = color;
                ctx.fillRect(x, y, w, h);
            }

            // Fills a canvas with rich Vanilla+ pixel shading, directional highlights, and encrusted barnacle/moss speckles
            function fillWeatheredFabric(ctx, w, h, baseColors, addBarnacles = true, addButtons = false, goldBorderSide = null) {
                for (let y = 0; y < h; y++) {
                    const yRatio = y / Math.max(1, h - 1);
                    for (let x = 0; x < w; x++) {
                        const r = rand();
                        let col = baseColors[1];
                        if (r < 0.24) col = baseColors[0];
                        else if (r < 0.50) col = baseColors[2];
                        else if (r < 0.68 && baseColors[3]) col = baseColors[3];

                        // Vertical color grading: brighter upper catch-light, richer deep lower shadow
                        if (yRatio < 0.2 && baseColors[2] && r > 0.3) col = baseColors[2];
                        else if (yRatio > 0.82 && r > 0.35) col = baseColors[0];

                        // Crisp Vanilla+ bevel shading along borders
                        if (x === 0 || y === h - 1) col = baseColors[0];
                        else if (y === 0 && baseColors[2] && r > 0.3) col = baseColors[2];
                        px(ctx, x, y, col);
                    }
                }
                if (addBarnacles) {
                    const count = Math.max(1, Math.floor((w * h) / 9));
                    for (let i = 0; i < count; i++) {
                        const bx = Math.floor(rand() * w);
                        const by = Math.floor(rand() * h);
                        const br = rand();
                        let bCol = PALETTE.barnacleShell;
                        if (br < 0.35) bCol = PALETTE.coatMoss;
                        else if (br < 0.58) bCol = PALETTE.coatAlgae;
                        else if (br < 0.78) bCol = PALETTE.barnacleLight;
                        px(ctx, bx, by, bCol);
                    }
                }
                if (goldBorderSide === 'left') {
                    for (let y = 0; y < h; y++) px(ctx, 0, y, y % 2 === 0 ? PALETTE.hatTrimLight : PALETTE.hatTrimGold);
                } else if (goldBorderSide === 'right') {
                    for (let y = 0; y < h; y++) px(ctx, w - 1, y, y % 2 === 0 ? PALETTE.hatTrimLight : PALETTE.hatTrimGold);
                } else if (goldBorderSide === 'bottom') {
                    for (let x = 0; x < w; x++) px(ctx, x, h - 1, x % 2 === 0 ? PALETTE.hatTrimLight : PALETTE.hatTrimGold);
                }
                if (addButtons) {
                    for (let y = 1; y < h - 1; y += 3) {
                        px(ctx, Math.floor(w / 2), y, PALETTE.brassHighlight);
                    }
                }
            }

            // Specialized gradient painter for the vivid red-orange-to-black crab claw & carapace surfaces
            function fillCrabCarapace(ctx, w, h, verticalTipFade = false) {
                for (let y = 0; y < h; y++) {
                    const yNorm = y / Math.max(1, h - 1);
                    for (let x = 0; x < w; x++) {
                        const r = rand();
                        let col = PALETTE.clawCrimson;

                        if (verticalTipFade && yNorm > 0.72) {
                            col = yNorm > 0.86 ? PALETTE.clawTipBlack : (r > 0.4 ? PALETTE.clawTipDark : PALETTE.clawDarkest);
                        } else if (verticalTipFade && yNorm > 0.54) {
                            col = r > 0.45 ? PALETTE.clawDark : PALETTE.clawBase;
                        } else {
                            if (r < 0.22) col = PALETTE.clawBase;
                            else if (r < 0.52) col = PALETTE.clawOrange;
                            else if (r < 0.70) col = PALETTE.clawHighlight;
                            else if (r < 0.84) col = PALETTE.clawDark;

                            // Warm specular ridge along center-top
                            if (x > 0 && x < w - 1 && yNorm < 0.45 && r > 0.55) {
                                col = PALETTE.clawHighlight;
                            }
                        }
                        // Calcified white-cream tiny speckles on upper shell
                        if (!verticalTipFade && r > 0.92 && yNorm < 0.65) {
                            col = PALETTE.clawTooth;
                        }
                        px(ctx, x, y, col);
                    }
                }
            }

            function createVoxelBox(w, h, d, facePainters, options = {}) {
                const scale = options.texScale || 1;
                const txW = Math.max(1, Math.round(w * scale));
                const txH = Math.max(1, Math.round(h * scale));
                const txD = Math.max(1, Math.round(d * scale));

                const faces = ['right', 'left', 'top', 'bottom', 'front', 'back'];
                const dims = [
                    [txD, txH], // right (+x)
                    [txD, txH], // left (-x)
                    [txW, txD], // top (+y)
                    [txW, txD], // bottom (-y)
                    [txW, txH], // front (+z)
                    [txW, txH]  // back (-z)
                ];

                const materials = faces.map((faceName, idx) => {
                    const [fw, fh] = dims[idx];
                    const painter = facePainters[faceName] || facePainters.all || ((ctx, cw, ch) => {
                        fillWeatheredFabric(ctx, cw, ch, [PALETTE.coatDarkest, PALETTE.coatBase, PALETTE.coatMid, PALETTE.coatMoss], true);
                    });
                    const tex = createPixelCanvas(fw, fh, painter);
                    return new THREE.MeshStandardMaterial({
                        map: tex,
                        roughness: options.roughness !== undefined ? options.roughness : 0.72,
                        metalness: options.metalness !== undefined ? options.metalness : 0.08,
                        emissive: options.emissive ? new THREE.Color(options.emissive) : new THREE.Color(0x000000),
                        emissiveIntensity: options.emissiveIntensity || 0,
                        transparent: Boolean(options.transparent),
                        alphaTest: options.transparent ? 0.5 : 0
                    });
                });

                const geom = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geom, materials);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            const canvas = document.getElementById('model-canvas');
            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.26;

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d1218, 0.0095);

            const DEFAULT_CAM_POS = new THREE.Vector3(21, 22, 39);
            const DEFAULT_CAM_TARGET = new THREE.Vector3(0, 17.5, 0);

            const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 300);
            camera.position.copy(DEFAULT_CAM_POS);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.copy(DEFAULT_CAM_TARGET);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI * 0.515;
            controls.minDistance = 12;
            controls.maxDistance = 95;
            controls.update();

            // Rich Color-Graded Studio Lighting (Warm Golden Key + Vibrant Coral-Warm Fill + Deep Teal Rim)
            const ambientLight = new THREE.HemisphereLight(0xffe8cc, 0x1a2c38, 0.88);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xfff1d6, 1.38);
            keyLight.position.set(28, 50, 36);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 10;
            keyLight.shadow.camera.far = 120;
            const shadowBounds = 26;
            keyLight.shadow.camera.left = -shadowBounds;
            keyLight.shadow.camera.right = shadowBounds;
            keyLight.shadow.camera.top = shadowBounds;
            keyLight.shadow.camera.bottom = -shadowBounds;
            keyLight.shadow.bias = -0.0005;
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.68);
            rimLight.position.set(-30, 28, -28);
            scene.add(rimLight);

            // Warm coral-amber fill light from the front-left to bring out the red crab claw, warm tentacles, and gold trim
            const warmFillLight = new THREE.PointLight(0xff7e47, 0.58, 70);
            warmFillLight.position.set(16, 15, 22);
            scene.add(warmFillLight);

            const coolFillLight = new THREE.PointLight(0x2dd4bf, 0.36, 65);
            coolFillLight.position.set(-16, 12, 16);
            scene.add(coolFillLight);

            const shadowPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(160, 160),
                new THREE.ShadowMaterial({ opacity: 0.46 })
            );
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.y = 0;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);

            const deckGroup = new THREE.Group();
            scene.add(deckGroup);

            // 16x16 Flying Dutchman Weathered Ship Deck Planks Base
            const deckBase = createVoxelBox(22, 1.2, 22, {
                top: (ctx, w, h) => {
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const isSeam = x % 4 === 0 || (y === 11 && x % 8 < 4) || (y === 16 && x % 8 >= 4);
                            const r = rand();
                            let col = '#2c2620';
                            if (isSeam) col = '#171411';
                            else if (r < 0.25) col = '#383028';
                            else if (r < 0.42) col = '#3d4d32';
                            else if (r < 0.52) col = '#4a3d2e';
                            px(ctx, x, y, col);
                        }
                    }
                    px(ctx, 4, 5, '#3b6e5c', 2, 1);
                    px(ctx, 16, 17, '#3b6e5c', 2, 1);
                },
                all: (ctx, w, h) => fillWeatheredFabric(ctx, w, h, ['#171411', '#26211c', '#383028', PALETTE.coatMoss], true)
            }, { roughness: 0.85 });
            deckBase.position.set(0, -0.6, 0);
            deckGroup.add(deckBase);

            // Dead Man's Chest resting beside Davy Jones's left boot (matching the reference photo!)
            const deadMansChestGroup = new THREE.Group();
            deadMansChestGroup.position.set(6.4, 0.0, 2.2);
            deadMansChestGroup.rotation.y = -0.18;
            deckGroup.add(deadMansChestGroup);

            const chestBox = createVoxelBox(5.2, 3.2, 3.6, {
                front: (ctx, w, h) => {
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const isBand = (x === 0 || x === w - 1 || y === h - 1);
                            px(ctx, x, y, isBand ? '#2e241b' : '#59432e');
                        }
                    }
                    // Ornate bronze lock escutcheon & keyhole on front center
                    px(ctx, Math.floor(w / 2) - 1, 1, PALETTE.buckleGold, 2, 2);
                    px(ctx, Math.floor(w / 2), 1, '#14100c', 1, 1);
                },
                all: (ctx, w, h) => fillWeatheredFabric(ctx, w, h, ['#2b2118', '#473626', '#695038', PALETTE.buckleGold], false)
            }, { texScale: 2, roughness: 0.6, metalness: 0.25 });
            chestBox.position.set(0, 1.6, 0);
            deadMansChestGroup.add(chestBox);

            const chestLid = createVoxelBox(5.4, 1.2, 3.8, {
                front: (ctx, w, h) => {
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            px(ctx, x, y, x % 2 === 0 ? '#6e543b' : '#3d2e20');
                        }
                    }
                },

            let currentAnim = 'idle';
            let animTime = 0;

            function damp(current, target, lambda, dt) {
                return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
            }

            function updateAnimation(dt) {
                animTime += dt;
                const t = animTime;

                let pelvisY = 12;
                let pelvisRotX = 0, pelvisRotY = 0, pelvisRotZ = 0;
                let torsoRotX = 0, torsoRotY = 0, torsoRotZ = 0;
                let headRotX = 0, headRotY = 0, headRotZ = 0;
                let browY = 5.45, browRotZ = 0;

                let rArmX = 0.02, rArmY = 0.0, rArmZ = 0.05;
                let rForearmX = -0.06, rForearmY = 0.0, rForearmZ = 0.0;
                let lArmX = 0.02, lArmY = 0.0, lArmZ = -0.05;
                let lClawX = -0.05, lClawZ = 0.02;
                let pincerAngle = 0.14;
                let swordPitchX = 0.22;

                let rLegX = 0, rLegZ = -0.02;
                let lLegX = 0, lLegZ = 0.02;
                let tentacleWaveAmp = 1.0;
                let tentacleFreq = 2.2;
                let capeSwing = 0;
                let showLocket = false;

                if (currentAnim === 'idle') {
                    const breath = Math.sin(t * 2.0);
                    const slowSway = Math.sin(t * 0.95);

                    pelvisY = 12 + breath * 0.14;
                    pelvisRotZ = slowSway * 0.012;
                    torsoRotX = breath * 0.015;
                    torsoRotY = slowSway * 0.035;

                    headRotX = -breath * 0.015;
                    headRotY = Math.sin(t * 0.65) * 0.09;
                    headRotZ = slowSway * 0.018;
                    browY = 5.45 + Math.sin(t * 1.4) * 0.04;

                    rArmX = 0.02 + breath * 0.025;
                    rArmY = -0.03;
                    rArmZ = 0.05 + (breath * 0.5 + 0.5) * 0.02;
                    rForearmX = -0.06 + Math.cos(t * 2.0) * 0.02;
                    rForearmY = 0.0;
                    swordPitchX = 0.25;

                    lArmX = 0.02 - breath * 0.025;
                    lArmY = 0.03;
                    lArmZ = -0.05 - (breath * 0.5 + 0.5) * 0.02;
                    lClawX = -0.05;
                    lClawZ = 0.02;
                    pincerAngle = 0.14 + (Math.sin(t * 1.7) * 0.5 + 0.5) * 0.20;

                    rLegZ = -0.02 - slowSway * 0.01;
                    lLegZ = 0.02 - slowSway * 0.01;
                    capeSwing = Math.sin(t * 1.6 - 0.5) * 0.05;

                } else if (currentAnim === 'walk') {
                    const wSpeed = 4.2;
                    const phase = t * wSpeed;
                    const stride = Math.sin(phase);
                    const stepUp = Math.abs(Math.cos(phase));

                    const pegDip = Math.max(0, Math.sin(phase)) * 0.58;
                    pelvisY = 11.85 + stepUp * 0.55 - pegDip;
                    pelvisRotZ = stride * 0.08;
                    pelvisRotY = -stride * 0.13;

                    torsoRotX = 0.08 + Math.sin(phase * 2) * 0.035;
                    torsoRotY = stride * 0.16;
                    torsoRotZ = -stride * 0.05;

                    headRotY = -stride * 0.08;
                    headRotX = 0.02 + Math.cos(phase * 2) * 0.03;

                    rLegX = stride * 0.58;
                    lLegX = -stride * 0.52;

                    rArmX = -stride * 0.35 + 0.08;
                    rArmZ = 0.10;
                    rForearmX = -0.25 - Math.max(0, stride) * 0.18;
                    rForearmY = 0.08;
                    swordPitchX = 0.15;

                    lArmX = stride * 0.38 + 0.06;
                    lArmZ = -0.10;
                    lClawX = -0.20;
                    pincerAngle = 0.22 + Math.sin(phase * 2) * 0.16;

                    tentacleWaveAmp = 1.55;
                    tentacleFreq = 4.0;
                    capeSwing = Math.max(0, -stride) * 0.2 + 0.08;

                } else if (currentAnim === 'attack') {
                    const cycle = (t * 0.85) % 1.0;
                    browY = 5.32;
                    browRotZ = 0.05;
                    swordPitchX = 0.0;

                    if (cycle < 0.32) {
                        const p = THREE.MathUtils.smoothstep(cycle, 0.0, 0.32);
                        pelvisY = 12 - p * 0.4;
                        torsoRotY = -p * 0.52;
                        torsoRotX = -p * 0.12;
                        headRotY = p * 0.35;

                        rArmX = THREE.MathUtils.lerp(0.04, -1.35, p);
                        rArmY = THREE.MathUtils.lerp(-0.04, -0.45, p);
                        rArmZ = THREE.MathUtils.lerp(0.06, 0.48, p);
                        rForearmX = THREE.MathUtils.lerp(-0.08, -0.2, p);
                        rForearmY = 0.0;

                        lArmX = 0.35 * p;
                        pincerAngle = 0.55 * p;
                        rLegX = -0.22 * p;
                        lLegX = 0.25 * p;
                    } else if (cycle < 0.58) {
                        const p = THREE.MathUtils.smoothstep(cycle, 0.32, 0.46);
                        pelvisY = 11.4;
                        torsoRotY = THREE.MathUtils.lerp(-0.52, 0.58, p);
                        torsoRotX = THREE.MathUtils.lerp(-0.12, 0.26, p);
                        headRotY = THREE.MathUtils.lerp(0.35, -0.32, p);

                        rArmX = THREE.MathUtils.lerp(-1.35, 0.72, p);
                        rArmY = THREE.MathUtils.lerp(-0.45, 0.42, p);
                        rArmZ = THREE.MathUtils.lerp(0.48, -0.15, p);
                        rForearmX = -0.12;
                        rForearmY = 0.15;

                        lArmX = THREE.MathUtils.lerp(0.35, -0.45, p);
                        pincerAngle = 0.65;
                        rLegX = 0.28 * p;
                        lLegX = -0.32 * p;
                        capeSwing = 0.34 * p;
                    } else if (cycle < 0.82) {
                        const p = THREE.MathUtils.smoothstep(cycle, 0.58, 0.72);
                        torsoRotY = THREE.MathUtils.lerp(0.58, -0.48, p);
                        torsoRotX = 0.18;
                        headRotY = THREE.MathUtils.lerp(-0.32, 0.3, p);

                        rArmX = 0.35;
                        rArmZ = 0.22;
                        lArmX = THREE.MathUtils.lerp(-0.45, -1.05, p);
                        lArmY = THREE.MathUtils.lerp(0.05, -0.38, p);
                        lClawX = -0.22;
                        pincerAngle = cycle < 0.70 ? 0.78 : 0.01;
                        capeSwing = 0.4;
                    } else {
                        const p = THREE.MathUtils.smoothstep(cycle, 0.82, 1.0);
                        torsoRotY = THREE.MathUtils.lerp(-0.48, 0, p);
                        torsoRotX = THREE.MathUtils.lerp(0.18, 0.0, p);
                        rArmX = THREE.MathUtils.lerp(0.35, 0.02, p);
                        lArmX = THREE.MathUtils.lerp(-1.05, 0.02, p);
                        pincerAngle = THREE.MathUtils.lerp(0.01, 0.14, p);
                    }
                    tentacleWaveAmp = 2.2;
                    tentacleFreq = 6.0;

                } else if (currentAnim === 'locket') {
                    showLocket = true;
                    const breath = Math.sin(t * 1.5);
                    pelvisY = 11.95 + breath * 0.12;
                    torsoRotX = 0.12 + breath * 0.02;
                    torsoRotY = -0.12 + Math.sin(t * 0.8) * 0.05;

                    headRotX = 0.26 + Math.sin(t * 1.2) * 0.04;
                    headRotY = -0.22 + Math.cos(t * 0.9) * 0.06;
                    headRotZ = -0.06;
                    browY = 5.55;

                    rArmX = -0.58 + breath * 0.04;
                    rArmY = 0.32;
                    rArmZ = 0.08;
                    rForearmX = -0.88;
                    rForearmY = 0.35;

                    lArmX = -0.45 + breath * 0.03;
                    lArmY = -0.28;
                    lArmZ = -0.08;
                    lClawX = -0.55;
                    pincerAngle = 0.12 + Math.sin(t * 2.2) * 0.06;

                    tentacleWaveAmp = 1.3;
                    tentacleFreq = 2.6;
                    capeSwing = 0.05;

                } else if (currentAnim === 'special') {
                    pelvisY = 12.1 + Math.sin(t * 2.5) * 0.25;
                    torsoRotX = -0.15 + Math.sin(t * 2.5) * 0.05;
                    torsoRotY = Math.sin(t * 1.4) * 0.22;

                    headRotX = -0.18 + Math.cos(t * 3.0) * 0.06;
                    headRotY = Math.sin(t * 1.8) * 0.24;
                    browY = 5.3;

                    rArmX = -2.15 + Math.sin(t * 3.5) * 0.12;
                    rArmZ = 0.28;
                    rForearmX = -0.25;
                    rForearmY = 0.0;
                    swordPitchX = 0.0;

                    lArmX = -1.25 + Math.cos(t * 3.5) * 0.15;
                    lArmZ = -0.35;
                    lClawX = -0.3;
                    pincerAngle = 0.06 + Math.abs(Math.sin(t * 5.5)) * 0.68;

                    tentacleWaveAmp = 3.0;
                    tentacleFreq = 7.0;
                    capeSwing = 0.3 + Math.sin(t * 4.0) * 0.12;
                }

                rig.locketGroup.visible = showLocket;
                rig.swordGroup.visible = !showLocket;
                rig.locketGroup.rotation.y = t * 1.4;

                const s = 14;
                rig.pelvis.position.y = damp(rig.pelvis.position.y, pelvisY, s, dt);
                rig.pelvis.rotation.x = damp(rig.pelvis.rotation.x, pelvisRotX, s, dt);
                rig.pelvis.rotation.y = damp(rig.pelvis.rotation.y, pelvisRotY, s, dt);
                rig.pelvis.rotation.z = damp(rig.pelvis.rotation.z, pelvisRotZ, s, dt);

                rig.torso.rotation.x = damp(rig.torso.rotation.x, torsoRotX, s, dt);
                rig.torso.rotation.y = damp(rig.torso.rotation.y, torsoRotY, s, dt);
                rig.torso.rotation.z = damp(rig.torso.rotation.z, torsoRotZ, s, dt);

                rig.headPivot.rotation.x = damp(rig.headPivot.rotation.x, headRotX, s, dt);
                rig.headPivot.rotation.y = damp(rig.headPivot.rotation.y, headRotY, s, dt);
                rig.headPivot.rotation.z = damp(rig.headPivot.rotation.z, headRotZ, s, dt);

                rig.eyeBrows.position.y = damp(rig.eyeBrows.position.y, browY, s, dt);
                rig.eyeBrows.rotation.z = damp(rig.eyeBrows.rotation.z, browRotZ, s, dt);

                const siphonPulse = 1.0 + Math.sin(t * 3.2) * 0.15 * Math.max(1, tentacleWaveAmp * 0.6);
                rig.siphonGroup.scale.set(siphonPulse, 1.0 - (siphonPulse - 1.0) * 0.35, siphonPulse);

                rig.rightArmPivot.rotation.x = damp(rig.rightArmPivot.rotation.x, rArmX, s, dt);
                rig.rightArmPivot.rotation.y = damp(rig.rightArmPivot.rotation.y, rArmY, s, dt);
                rig.rightArmPivot.rotation.z = damp(rig.rightArmPivot.rotation.z, rArmZ, s, dt);

                rig.rightForearmPivot.rotation.x = damp(rig.rightForearmPivot.rotation.x, rForearmX, s, dt);
                rig.rightForearmPivot.rotation.y = damp(rig.rightForearmPivot.rotation.y, rForearmY, s, dt);
                rig.rightForearmPivot.rotation.z = damp(rig.rightForearmPivot.rotation.z, rForearmZ, s, dt);
                rig.swordGroup.rotation.x = damp(rig.swordGroup.rotation.x, swordPitchX, s, dt);

                rig.leftArmPivot.rotation.x = damp(rig.leftArmPivot.rotation.x, lArmX, s, dt);
                rig.leftArmPivot.rotation.y = damp(rig.leftArmPivot.rotation.y, lArmY, s, dt);
                rig.leftArmPivot.rotation.z = damp(rig.leftArmPivot.rotation.z, lArmZ, s, dt);

                rig.leftClawPivot.rotation.x = damp(rig.leftClawPivot.rotation.x, lClawX, s, dt);
                rig.leftClawPivot.rotation.z = damp(rig.leftClawPivot.rotation.z, lClawZ, s, dt);
                rig.clawLowerPincer.rotation.z = damp(rig.clawLowerPincer.rotation.z, -pincerAngle, 18, dt);

                rig.rightLegPivot.rotation.x = damp(rig.rightLegPivot.rotation.x, rLegX, s, dt);
                rig.rightLegPivot.rotation.z = damp(rig.rightLegPivot.rotation.z, rLegZ, s, dt);

                rig.leftLegPivot.rotation.x = damp(rig.leftLegPivot.rotation.x, lLegX, s, dt);
                rig.leftLegPivot.rotation.z = damp(rig.leftLegPivot.rotation.z, lLegZ, s, dt);

                const clampedAmp = Math.min(tentacleWaveAmp, 2.0);
                rig.tentacles.forEach((tent) => {
                    const sideSign = tent.tx < 0 ? -1 : 1;
                    const waveX = Math.sin(t * tentacleFreq + tent.phase) * 0.028 * clampedAmp;
                    const waveZ = Math.cos(t * tentacleFreq * 0.85 + tent.phase) * 0.022 * clampedAmp * sideSign;
                    const midWaveX = Math.sin(t * tentacleFreq - 0.7 + tent.phase) * 0.042 * clampedAmp;
                    const lowerWaveX = Math.sin(t * tentacleFreq - 1.4 + tent.phase) * 0.055 * clampedAmp;

                    tent.upperPivot.rotation.x = tent.baseUX + waveX;
                    tent.upperPivot.rotation.z = tent.baseUZ + waveZ;
                    tent.midPivot.rotation.x = tent.baseMX + midWaveX;
                    tent.midPivot.rotation.z = tent.baseMZ + waveZ * 0.35;
                    tent.lowerPivot.rotation.x = tent.baseLX + lowerWaveX;
                    tent.lowerPivot.rotation.z = tent.baseLZ - waveZ * 0.45;
                });

                // Iterative 3D Segment-to-Segment Non-Clipping Repulsion Solver
                const tentCount = rig.tentacles.length;
                const chainPts = new Array(tentCount);

                function computeTentacleChain(tent) {
                    const uz = tent.upperPivot.rotation.z;
                    const ux = tent.upperPivot.rotation.x;
                    const mz = uz + tent.midPivot.rotation.z;
                    const mx = ux + tent.midPivot.rotation.x;
                    const lz = mz + tent.lowerPivot.rotation.z;
                    const lx = mx + tent.lowerPivot.rotation.x;

                    const p0 = { x: tent.tx, y: tent.ty, z: tent.tz };
                    const p1 = {
                        x: p0.x + tent.uh * Math.sin(uz),
                        y: p0.y - tent.uh * Math.cos(uz) * Math.cos(ux),
                        z: p0.z - tent.uh * Math.sin(ux)
                    };
                    const p2 = {
                        x: p1.x + tent.mh * Math.sin(mz),
                        y: p1.y - tent.mh * Math.cos(mz) * Math.cos(mx),
                        z: p1.z - tent.mh * Math.sin(mx)
                    };
                    const p3 = {
                        x: p2.x + tent.lh * Math.sin(lz),
                        y: p2.y - tent.lh * Math.cos(lz) * Math.cos(lx),
                        z: p2.z - tent.lh * Math.sin(lx) + 0.18
                    };

                    return [
                        { x: (p0.x + p1.x) * 0.5, y: (p0.y + p1.y) * 0.5, z: (p0.z + p1.z) * 0.5, r: tent.ur, stage: 0 },
                        { x: p1.x,                y: p1.y,                z: p1.z,                r: tent.ur, stage: 0 },
                        { x: (p1.x + p2.x) * 0.5, y: (p1.y + p2.y) * 0.5, z: (p1.z + p2.z) * 0.5, r: tent.mr, stage: 1 },
                        { x: p2.x,                y: p2.y,                z: p2.z,                r: tent.mr, stage: 1 },
                        { x: (p2.x + p3.x) * 0.5, y: (p2.y + p3.y) * 0.5, z: (p2.z + p3.z) * 0.5, r: tent.lr, stage: 2 },
                        { x: p3.x,                y: p3.y,                z: p3.z,                r: tent.lr, stage: 2 }
                    ];
                }

                for (let iter = 0; iter < 3; iter++) {
                    for (let i = 0; i < tentCount; i++) {
                        chainPts[i] = computeTentacleChain(rig.tentacles[i]);
                    }
                    for (let i = 0; i < tentCount; i++) {
                        const ti = rig.tentacles[i];
                        const ptsI = chainPts[i];
                        for (let j = i + 1; j < tentCount; j++) {
                            const tj = rig.tentacles[j];
                            const ptsJ = chainPts[j];

                            for (let si = 0; si < ptsI.length; si++) {
                                const a = ptsI[si];
                                for (let sj = 0; sj < ptsJ.length; sj++) {
                                    const b = ptsJ[sj];
                                    const dy = a.y - b.y;
                                    if (Math.abs(dy) > 1.8) continue;

                                    const dx = a.x - b.x;
                                    const dz = a.z - b.z;
                                    const distSq = dx * dx + dy * dy * 0.35 + dz * dz;
                                    const minDist = a.r + b.r + 0.02;

                                    if (distSq < minDist * minDist) {
                                        const dist = Math.max(0.001, Math.sqrt(distSq));
                                        const overlap = (minDist - dist) * 0.55;
                                        const nx = dx / dist;
                                        const nz = dz / dist;

                                        if (a.stage === 0) {
                                            ti.upperPivot.rotation.z += (nx * overlap) / ti.uh;
                                            ti.upperPivot.rotation.x -= (nz * overlap) / ti.uh;
                                        } else if (a.stage === 1) {
                                            ti.midPivot.rotation.z += (nx * overlap) / ti.mh;
                                            ti.midPivot.rotation.x -= (nz * overlap) / ti.mh;
                                        } else {
                                            ti.lowerPivot.rotation.z += (nx * overlap) / ti.lh;
                                            ti.lowerPivot.rotation.x -= (nz * overlap) / ti.lh;
                                        }

                                        if (b.stage === 0) {
                                            tj.upperPivot.rotation.z -= (nx * overlap) / tj.uh;
                                            tj.upperPivot.rotation.x += (nz * overlap) / tj.uh;
                                        } else if (b.stage === 1) {
                                            tj.midPivot.rotation.z -= (nx * overlap) / tj.mh;
                                            tj.midPivot.rotation.x += (nz * overlap) / tj.mh;
                                        } else {
                                            tj.lowerPivot.rotation.z -= (nx * overlap) / tj.lh;
                                            tj.lowerPivot.rotation.x += (nz * overlap) / tj.lh;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

                const keyLift = currentAnim === 'locket' ? 0.65 : 0.0;
                rig.chestKeyGroup.position.z = damp(rig.chestKeyGroup.position.z, 0.58 + keyLift, 8, dt);
                rig.chestKeyGroup.rotation.z = Math.sin(t * 2.2) * 0.12;
                rig.chestKeyGroup.rotation.y = Math.cos(t * 1.7) * 0.25 + (currentAnim === 'locket' ? 0.4 : 0);

                rig.pipeGroup.rotation.x = Math.sin(t * 2.0) * 0.035;
                rig.pipeGroup.rotation.z = Math.cos(t * 1.6) * 0.025;
                rig.pipeFeederTendril.rotation.z = Math.sin(t * 2.4) * 0.06;

                smokePuffs.forEach((sp, i) => {
                    const cycle = (t * 0.42 + sp.offset) % 1.0;
                    sp.mesh.position.set(
                        1.08 + Math.sin(t * 2.0 + i) * 0.32 * cycle,
                        -1.45 + cycle * 4.4,
                        1.48 + Math.cos(t * 1.6 + i) * 0.25 * cycle
                    );
                    const sc = 0.48 + cycle * 0.92;
                    sp.mesh.scale.set(sc, sc, sc);
                    sp.mesh.material.opacity = Math.sin(cycle * Math.PI) * 0.36;
                });

                rig.leftCapePivot.rotation.z = damp(rig.leftCapePivot.rotation.z, capeSwing, 10, dt);
                rig.leftCapePivot.rotation.x = damp(rig.leftCapePivot.rotation.x, Math.sin(t * 2.2) * 0.04 + capeSwing * 0.3, 10, dt);
                rig.leftCapeLowerPivot.rotation.z = damp(rig.leftCapeLowerPivot.rotation.z, capeSwing * 0.65 + Math.sin(t * 3.0 - 1.0) * 0.06 * tentacleWaveAmp, 10, dt);

                rig.coatTails.forEach((tail) => {
                    const flutter = Math.sin(t * (tentacleFreq * 0.9) + tail.phase) * 0.05 * tentacleWaveAmp;
                    tail.pivot.rotation.x = tail.baseRx + capeSwing * 0.65 + Math.abs(flutter);
                    tail.pivot.rotation.z = tail.baseRz + flutter * 0.5;
                });

                particles.forEach((p, idx) => {
                    if (currentAnim === 'special') {
                        p.mesh.visible = true;
                        const a = p.angle + t * p.speed;
                        const hCycle = ((t * 5.0 + p.yOffset) % 24);
                        const r = p.radius + Math.sin(t * 2 + idx) * 1.2;
                        p.mesh.position.set(
                            Math.cos(a) * r,
                            1.0 + hCycle,
                            Math.sin(a) * r
                        );
                        p.mesh.rotation.x += dt * 2.5;
                        p.mesh.rotation.y += dt * 3.0;
                        p.mesh.material.opacity = Math.sin((hCycle / 24) * Math.PI) * 0.72;
                    } else {
                        p.mesh.material.opacity = damp(p.mesh.material.opacity, 0, 10, dt);
                        if (p.mesh.material.opacity < 0.02) p.mesh.visible = false;
                    }
                });
            }

            const animButtons = document.querySelectorAll('.anim-btn');
            animButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    animButtons.forEach((b) => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentAnim = btn.getAttribute('data-anim');
                });
            });

            const toggleDeckBtn = document.getElementById('toggle-deck-btn');
            toggleDeckBtn.addEventListener('click', () => {
                deckGroup.visible = !deckGroup.visible;
                toggleDeckBtn.classList.toggle('active', deckGroup.visible);
            });

            let resettingCamera = false;
            document.getElementById('reset-camera-btn').addEventListener('click', () => {
                resettingCamera = true;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            controls.addEventListener('start', () => {
                resettingCamera = false;
            });

            let lastTime = performance.now();
            function animateLoop(now) {
                requestAnimationFrame(animateLoop);

                const rawDt = (now - lastTime) / 1000;
                lastTime = now;
                const dt = Math.min(rawDt, 0.05);

                if (resettingCamera) {
                    camera.position.lerp(DEFAULT_CAM_POS, 1 - Math.exp(-10 * dt));
                    controls.target.lerp(DEFAULT_CAM_TARGET, 1 - Math.exp(-10 * dt));
                    if (camera.position.distanceTo(DEFAULT_CAM_POS) < 0.08) {
                        camera.position.copy(DEFAULT_CAM_POS);
                        controls.target.copy(DEFAULT_CAM_TARGET);
                        resettingCamera = false;
                    }
                }

                updateAnimation(dt);
                controls.update();
                renderer.render(scene, camera);
            }

            requestAnimationFrame(animateLoop);
        };
    </script>
</body>
</html>

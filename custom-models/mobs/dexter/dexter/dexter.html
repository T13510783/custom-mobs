<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dexter Morgan — Vanilla+ 16x16 3D Model Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Three.js r128 and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f1115;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e5e7eb;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 42%, #191d24 0%, #0f1115 72%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Ultra-minimal floating bottom pill bar */
    .pill-bar {
      background: rgba(18, 21, 27, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .pill-btn {
      position: relative;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      color: #9ca3af;
    }
    .pill-btn:hover {
      color: #f3f4f6;
      background: rgba(255, 255, 255, 0.05);
    }
    .pill-btn.active-anim {
      color: #ffffff;
      background: rgba(185, 28, 28, 0.85);
      box-shadow: 0 2px 12px rgba(185, 28, 28, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .pill-btn.active-fit {
      color: #f3f4f6;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .pill-btn.active-shield {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.16);
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.35);
    }
    .pill-btn.active-hood {
      color: #e2e8f0;
      background: rgba(148, 163, 184, 0.22);
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.38);
    }
    .reset-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      color: #9ca3af;
    }
    .reset-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.09);
      transform: rotate(-25deg);
    }
    .reset-btn:active {
      transform: scale(0.92) rotate(-45deg);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Sleek Floating Bottom Pill Bar (Fits + Animations + Camera Reset) -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 max-w-[96vw]">
    <div class="pill-bar rounded-full px-2 py-1.5 flex items-center gap-1 overflow-x-auto no-scrollbar">
      <!-- Outfit / Fit Selector Pills (All Reference Fits) -->
      <div class="flex items-center gap-0.5 pr-1" role="group" aria-label="Outfit Selection">
        <button data-fit="henley" class="pill-btn active-fit text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap" title="Olive Henley & Cargo Pants (Ref 1-3)">
          Henley
        </button>
        <button data-fit="killroom" class="pill-btn text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap" title="Kill Room Butcher Apron & Visor (Ref 4, 6, 7)">
          Kill Room
        </button>
        <button data-fit="darkpassenger" class="pill-btn text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap" title="Dark Passenger Trench Coat, Cowl Hood & Fingerless Gloves (Ref 5, 10-12)">
          Dark Passenger
        </button>
        <button data-fit="miamimetro" class="pill-btn text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap" title="Miami Metro Lab Shirt & Blood Slide (Ref 8, 9)">
          Lab Fit
        </button>
        <button data-fit="santa" class="pill-btn text-xs font-medium px-3 py-1.5 rounded-full whitespace-nowrap" title="Miami Holiday Santa Suit & Shades (Ref 13)">
          Santa
        </button>
      </div>

      <!-- Kill Room Face Shield 3-Stage Selector (Only shown when Kill Room Fit is active) -->
      <div id="shield-controls-wrapper" class="hidden items-center">
        <div class="w-px h-5 bg-white/10 mx-0.5 shrink-0"></div>
        <div id="shield-controls" class="flex items-center gap-0.5 px-1" role="group" aria-label="Kill Room Face Shield Stage">
          <span class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold px-1.5 select-none">Shield</span>
          <button data-shield="on" class="pill-btn text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap" title="Face Shield Flipped Down Over Face (On)">
            On
          </button>
          <button data-shield="mid" class="pill-btn active-shield text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap" title="Face Shield Flipped Up on Forehead (Mid - Ref 4)">
            Mid
          </button>
          <button data-shield="off" class="pill-btn text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap" title="No Face Shield (Off - Ref 6 & 7)">
            Off
          </button>
        </div>
      </div>

      <!-- Dark Passenger Hood 3-Stage Selector (Only shown when Dark Passenger Fit is active) -->
      <div id="hood-controls-wrapper" class="hidden items-center">
        <div class="w-px h-5 bg-white/10 mx-0.5 shrink-0"></div>
        <div id="hood-controls" class="flex items-center gap-0.5 px-1" role="group" aria-label="Dark Passenger Hood Stage">
          <span class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold px-1.5 select-none">Hood</span>
          <button data-hood="on" class="pill-btn active-hood text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap" title="Peaked Dark Passenger Cowl Pulled Over Eyes (On - Ref 10 & 12)">
            On
          </button>
          <button data-hood="mid" class="pill-btn text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap" title="Leather-Lined Hood Resting Midway Around Head & Neck (Mid - Ref 5 & 11)">
            Mid
          </button>
          <button data-hood="off" class="pill-btn text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap" title="Hood Down & Hanging Against Upper Back (Off)">
            Off
          </button>
        </div>
      </div>

      <!-- Subtle Vertical Divider -->
      <div class="w-px h-5 bg-white/10 mx-0.5 shrink-0"></div>

      <!-- 4 Animation Selector Pills -->
      <div class="flex items-center gap-0.5 pl-1" role="group" aria-label="Animation Selection">
        <button data-anim="idle" class="pill-btn active-anim text-xs font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap">
          Idle
        </button>
        <button data-anim="walk" class="pill-btn text-xs font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap">
          Walk
        </button>
        <button data-anim="attack" class="pill-btn text-xs font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap">
          Attack
        </button>
        <button data-anim="special" class="pill-btn text-xs font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap">
          Special
        </button>
      </div>

      <!-- Subtle Vertical Divider -->
      <div class="w-px h-5 bg-white/10 mx-0.5 shrink-0"></div>

      <!-- Small Camera Reset Button -->
      <button id="reset-camera-btn" class="reset-btn w-8 h-8 rounded-full flex items-center justify-center shrink-0" title="Reset Camera" aria-label="Reset Camera">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ============================================================================
      // 1. SCENE, CAMERA, RENDERER & ORBIT CONTROLS SETUP
      // ============================================================================
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();

      // In our Blockbench space: 1 pixel = 1 unit, 16 units = 1 Minecraft block.
      // Total humanoid height is ~32 units (2 blocks).
      const camera = new THREE.PerspectiveCamera(
        36,
        window.innerWidth / window.innerHeight,
        0.5,
        300
      );
      const DEFAULT_CAM_POS = new THREE.Vector3(24, 24, 52);
      const DEFAULT_CAM_TARGET = new THREE.Vector3(0, 16.5, 0);
      camera.position.copy(DEFAULT_CAM_POS);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.copy(DEFAULT_CAM_TARGET);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.minDistance = 18;
      controls.maxDistance = 110;
      controls.maxPolarAngle = Math.PI / 2 + 0.06;
      controls.minPolarAngle = 0.15;
      controls.update();

      const ambientLight = new THREE.HemisphereLight(0xdbe4f0, 0x181a20, 0.72);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.15);
      keyLight.position.set(28, 48, 36);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 10;
      keyLight.shadow.camera.far = 120;
      const d = 26;
      keyLight.shadow.camera.left = -d;
      keyLight.shadow.camera.right = d;
      keyLight.shadow.camera.top = d;
      keyLight.shadow.camera.bottom = -d;
      keyLight.shadow.bias = -0.0005;
      keyLight.shadow.radius = 3.5;
      scene.add(keyLight);

      // Cool rim light for dark silhouettes
      const rimLight = new THREE.DirectionalLight(0x7dd3fc, 0.45);
      rimLight.position.set(-30, 28, -28);
      scene.add(rimLight);

      // Subtle warm-crimson fill light from below-right ("Blood Spatter" mood accent)
      const moodLight = new THREE.PointLight(0xdc2626, 0.28, 65);
      moodLight.position.set(-16, 8, 18);
      scene.add(moodLight);

      // Crisp 16x16 Blockbench floor pedestal texture with radial alpha falloff
      function createFloorGridTexture() {
        const size = 64; // 4x4 blocks (64x64 texels)
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const dx = x - cx + 0.5;
            const dy = y - cy + 0.5;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 30) continue;
            const alpha = Math.max(0, 1 - Math.pow(dist / 30, 1.7));
            const isBlockBorder = (x % 16 === 0) || (y % 16 === 0);
            const isSubPixel = ((x + y) % 2 === 0);
            if (isBlockBorder) {
              ctx.fillStyle = `rgba(255, 255, 255, ${(0.075 * alpha).toFixed(3)})`;
            } else {
              const v = isSubPixel ? 26 : 22;
              ctx.fillStyle = `rgba(${v}, ${v + 3}, ${v + 9}, ${(0.45 * alpha).toFixed(3)})`;
            }
            ctx.fillRect(x, y, 1, 1);
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        return tex;
      }

      const groundGeo = new THREE.PlaneGeometry(64, 64);
      const groundMat = new THREE.MeshStandardMaterial({
        map: createFloorGridTexture(),
        transparent: true,
        roughness: 0.95,
        metalness: 0.05,
        depthWrite: false
      });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = 0.01;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.ShadowMaterial({ opacity: 0.42 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = 0.02;
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      // ============================================================================
      // 2. STRICT 16x16 PIXEL-ART TEXTURE ENGINE (BLOCKBENCH VANILLA+ STYLE)
      // ============================================================================

      // Deterministic pseudo-random for consistent Vanilla+ texel noise
      function hash2D(x, y, seed = 1) {
        let n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
        return n - Math.floor(n);
      }

      // Adjust hex color brightness by factor (-40 to +40)
      function shadeHex(hex, amt) {
        let col = hex.replace('#', '');
        let num = parseInt(col, 16);
        let r = Math.min(255, Math.max(0, (num >> 16) + amt));
        let g = Math.min(255, Math.max(0, ((num >> 8) & 0x00ff) + amt));
        let b = Math.min(255, Math.max(0, (num & 0x0000ff) + amt));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }

      // Draw a single crisp pixel on a 2D context
      function px(ctx, x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
      }

      // Draw a rectangle of pixels
      function rect(ctx, x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
      }

      // Fill a face with cohesive Vanilla+ textured shading (subtle edge AO + micro-grain)
      function fillVanillaFabric(ctx, w, h, baseHex, seed = 1, grain = 7, waffle = false) {
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const n = (hash2D(x, y, seed) - 0.5) * grain * 2;
            // Subtle vertical gradient & edge darkening like Vanilla+ skins
            const edgeX = (x === 0 || x === w - 1) ? -5 : 0;
            const edgeY = (y === h - 1) ? -6 : (y === 0 ? 3 : 0);
            const waffleDelta = waffle ? (((x + y) % 2 === 0) ? 3 : -3) : 0;
            px(ctx, x, y, shadeHex(baseHex, Math.round(n + edgeX + edgeY + waffleDelta)));
          }
        }
      }

      /**
       * Creates a Three.js Mesh with strict 1:1 texel-to-unit BoxGeometry.
       * Face order in Three.js BoxGeometry:
       * 0: Right (+x, d x h), 1: Left (-x, d x h),
       * 2: Top (+y, w x d),   3: Bottom (-y, w x d),
       * 4: Front (+z, w x h), 5: Back (-z, w x h)
       */
      function createVoxelBox(w, h, d, painters, options = {}) {
        const inflate = options.inflate || 0;
        const transparent = options.transparent || false;
        const roughness = options.roughness !== undefined ? options.roughness : 0.86;
        const metalness = options.metalness !== undefined ? options.metalness : 0.04;

        const faceSpecs = [
          { name: 'right',  pw: Math.max(1, Math.round(d)), ph: Math.max(1, Math.round(h)) },
          { name: 'left',   pw: Math.max(1, Math.round(d)), ph: Math.max(1, Math.round(h)) },
          { name: 'top',    pw: Math.max(1, Math.round(w)), ph: Math.max(1, Math.round(d)) },
          { name: 'bottom', pw: Math.max(1, Math.round(w)), ph: Math.max(1, Math.round(d)) },
          { name: 'front',  pw: Math.max(1, Math.round(w)), ph: Math.max(1, Math.round(h)) },
          { name: 'back',   pw: Math.max(1, Math.round(w)), ph: Math.max(1, Math.round(h)) }
        ];

        const materials = faceSpecs.map((spec) => {
          const canvas = document.createElement('canvas');
          canvas.width = spec.pw;
          canvas.height = spec.ph;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;

          if (painters && painters[spec.name]) {
            painters[spec.name](ctx, spec.pw, spec.ph);
          } else if (painters && painters.all) {
            painters.all(ctx, spec.pw, spec.ph, spec.name);
          }

          const texture = new THREE.CanvasTexture(canvas);
          texture.magFilter = THREE.NearestFilter;
          texture.minFilter = THREE.NearestFilter;
          texture.generateMipmaps = false;
          texture.encoding = THREE.sRGBEncoding;
          texture.needsUpdate = true;

          return new THREE.MeshStandardMaterial({
            map: texture,
            transparent: transparent,
            alphaTest: transparent ? 0.08 : 0,
            roughness: roughness,
            metalness: metalness,
            side: transparent ? THREE.DoubleSide : THREE.FrontSide
          });
        });

        const geo = new THREE.BoxGeometry(
          w + inflate * 2,
          h + inflate * 2,
          d + inflate * 2
        );
        const mesh = new THREE.Mesh(geo, materials);
        mesh.castShadow = !options.noShadow;
        mesh.receiveShadow = true;
        return mesh;
      }

      // ============================================================================
      // 3. COLOR PALETTES (1:1 FROM DEXTER REFERENCE IMAGES)
      // ============================================================================
      const PAL = {
        // Skin & Facial Features (Michael C. Hall natural fair-warm complexion + subtle sandy-ginger stubble)
        skinBase: '#ecc6ae',
        skinLight: '#f6d8c5',
        skinMid: '#dfb59b',
        skinShade: '#cca085',
        skinDeep: '#b5866b',
        stubble: '#d4a68c',
        stubbleDark: '#c39378',
        lipUpper: '#b5796b',
        lipCenter: '#a3685a',
        lipCorner: '#c48979',
        lipLower: '#d69d8c',
        eyeWhite: '#f8fafc',
        eyeIris: '#583e2a', // Warm hazel-brown eyes
        eyePupil: '#18100a',
        brow: '#6b442b',
        browLight: '#825539',

        // Tousled Warm Chestnut / Sandy Auburn-Brown Hair (Refs 1, 2, 3, 8, 9)
        hairBase: '#684128',
        hairLight: '#7e5134',
        hairHighlight: '#946242',
        hairDark: '#4d2e1b',

        // Fit 1: Iconic Olive-Brown Thermal Waffle Henley & Cargo Pants (Refs 1, 2, 3)
        henleyBase: '#544e39',
        henleyDark: '#3f3b2a',
        henleyLight: '#635c44',
        henleyPlacket: '#484330',
        buttonPearl: '#e5e5dc',
        cargoBase: '#454832',
        cargoDark: '#333624',
        cargoLight: '#54583e',
        bootBrown: '#251c16',
        bootSole: '#14100d',

        // Fit 2: Kill Room Apron, Sage Henley, Vinyl Sleeves & Latex Gloves (Refs 4, 6, 7)
        sageHenley: '#696e52',
        apronBlack: '#1f2226',
        apronSheen: '#32373d',
        apronStrap: '#c4c1b7',
        vinylSleeve: '#78685c',
        vinylSleeveLight: '#8c7a6d',
        latexGlove: '#dfd9cc',
        latexShade: '#c4bdb0',
        rubberBoot: '#17191c',

        // Fit 3: Dark Passenger Black Trench Coat, Hoodie & Fingerless Gloves (Ref 5)
        trenchBlack: '#17181c',
        trenchShade: '#101114',
        trenchHighlight: '#25272e',
        leatherPant: '#1b1d22',
        gloveKnit: '#191a1f',

        // Fit 4: Miami Metro Forensic Lab Shirt & Chinos (Refs 8, 9)
        labShirt: '#c6d6e3',
        labShirtShade: '#adc0d1',
        labShirtLight: '#dde9f2',
        khakiBase: '#8a775f',
        khakiDark: '#705f4a',
        badgeGold: '#eab308',
        badgeBlue: '#1d4ed8',

        // Fit 5: Miami Holiday Santa Suit & Sunglasses (Ref 13: image_f49502.jpg)
        santaRed: '#9e1b1b',
        santaRedLight: '#b92525',
        santaRedDark: '#781212',
        santaFur: '#f5f6f8',
        santaFurShade: '#dfe3ea',
        santaFurWhite: '#ffffff',
        buckleGold: '#e5c158',
        buckleGoldLight: '#fef08a',
        beltBlack: '#14161a'
      };

      // ============================================================================
      // 4. HIERARCHICAL RIG & ARTICULATED PIVOT STRUCTURE
      // ============================================================================
      const characterRoot = new THREE.Group();
      scene.add(characterRoot);

      // Pelvis / Hips center at y = 12 (top of 12-unit legs)
      const pelvisGroup = new THREE.Group();
      pelvisGroup.position.set(0, 12, 0);
      characterRoot.add(pelvisGroup);

      // Torso group pivots from waist (y = 0 relative to pelvis, so world y = 12)
      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(0, 0, 0);
      pelvisGroup.add(torsoGroup);

      // Head group pivots from neck (y = 12 relative to torso, so world y = 24)
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 12, 0);
      torsoGroup.add(headGroup);

      // Left & Right Arm pivots at shoulders (y = 11 relative to torso, x = +-6)
      // Pivot is placed at top-center of arm (2 units below top of 12-unit torso)
      const rightArmGroup = new THREE.Group();
      rightArmGroup.position.set(-6, 11, 0);
      torsoGroup.add(rightArmGroup);

      const leftArmGroup = new THREE.Group();
      leftArmGroup.position.set(6, 11, 0);
      torsoGroup.add(leftArmGroup);

      // Hand sockets at the bottom of each arm (y = -9.5 relative to shoulder pivot)
      const rightHandSocket = new THREE.Group();
      rightHandSocket.position.set(0, -9.5, 0.5);
      rightArmGroup.add(rightHandSocket);

      const leftHandSocket = new THREE.Group();
      leftHandSocket.position.set(0, -9.5, 0.5);
      leftArmGroup.add(leftHandSocket);

      // Left & Right Leg pivots at hips (y = 0 relative to pelvis, x = +-2)
      const rightLegGroup = new THREE.Group();
      rightLegGroup.position.set(-2, 0, 0);
      pelvisGroup.add(rightLegGroup);

      const leftLegGroup = new THREE.Group();
      leftLegGroup.position.set(2, 0, 0);
      pelvisGroup.add(leftLegGroup);

      // ============================================================================
      // 5. HEAD & 3D LAYERED HAIR (SHARED ACROSS FITS, WITH KILL-ROOM VISOR LAYER)
      // ============================================================================
      function buildDexterHead() {
        const headContainer = new THREE.Group();

        // Base 8x8x8 Head Cube (centered at y = 4 above neck)
        const headMesh = createVoxelBox(8, 8, 8, {
          front: (ctx, w, h) => {
            // Clean, natural fair-warm skin base
            fillVanillaFabric(ctx, w, h, PAL.skinBase, 10, 3);

            // Forehead warmth & subtle temple shading
            rect(ctx, 1, 1, 6, 1, PAL.skinLight);
            px(ctx, 0, 1, PAL.skinMid);

            all: (ctx, w, h, face) => {
              if (face === 'top') {
                fillVanillaFabric(ctx, w, h, PAL.santaRed, 520 + idx, 5);
                return;
              }
              if (face === 'bottom') {
                fillVanillaFabric(ctx, w, h, PAL.skinMid, 522 + idx, 4);
                return;
              }
              // Rows 0..6: Crimson red velvet sleeve
              fillVanillaFabric(ctx, w, h, PAL.santaRed, 524 + idx, 6);
              rect(ctx, 0, 5, w, 1, PAL.santaRedDark); // Velvet sleeve crease
              // Rows 7..8: Plush white faux-fur wrist cuff
              rect(ctx, 0, 7, w, 2, PAL.santaFur);
              rect(ctx, 0, 7, w, 1, PAL.santaFurWhite);
              // Rows 9..11: Bare wrist & hand
              for (let y = 9; y < 12; y++) {
                for (let x = 0; x < w; x++) {
                  px(ctx, x, y, y === 11 ? PAL.skinMid : PAL.skinBase);
                }
              }
              // Silver wristwatch on Dexter's left wrist (row 9) just below white fur cuff (Ref image_f49502.jpg)
              if (isLeftArm) {
                rect(ctx, 0, 9, w, 1, '#94a3b8');
                if (face === 'front' || face === 'left') {
                  px(ctx, 1, 9, '#f8fafc'); // Watch dial face
                  px(ctx, 2, 9, '#cbd5e1');
                }
              }
            }
          }, { roughness: 0.78 });
          arm.position.set(0, -5, 0);
          registerFitMesh('santa', armGrp, arm);

          // 3D Plush White Faux-Fur Cuff Ring around wrist
          const furCuff = createVoxelBox(4, 2.4, 4, {
            all: (ctx, w, h, face) => {
              if (face === 'top' || face === 'bottom') return;
              fillVanillaFabric(ctx, w, h, PAL.santaFurWhite, 530 + idx, 6);
              rect(ctx, 0, h - 1, w, 1, PAL.santaFurShade);
            }
          }, { inflate: 0.32, transparent: true, roughness: 0.92 });
          furCuff.position.set(0, -5.8, 0);
          registerFitMesh('santa', armGrp, furCuff);
        });

        // 4. LEGS: Matching Crimson Red Velvet Santa Trousers & Dark Boots
        [rightLegGroup, leftLegGroup].forEach((legGrp, idx) => {
          const leg = createVoxelBox(4, 12, 4, {
            all: (ctx, w, h, face) => {
              if (face === 'top' || face === 'bottom') {
                fillVanillaFabric(ctx, w, h, PAL.bootSole, 540, 3);
                return;
              }
              fillVanillaFabric(ctx, w, h, PAL.santaRed, 541 + idx, 6);
              // White fur coat skirt overhang at very top of thigh (row 0)
              rect(ctx, 0, 0, w, 1, PAL.santaFur);
              if (face === 'front') {
                // Soft velvet trouser crease highlight
                rect(ctx, 1, 2, 1, 6, PAL.santaRedLight);
              }
              // Dark boots at bottom (rows 10..11)
              rect(ctx, 0, 10, w, 2, PAL.bootBrown);
              rect(ctx, 0, 11, w, 1, PAL.bootSole);
            }
          }, { roughness: 0.78 });
          leg.position.set(0, -6, 0);
          registerFitMesh('santa', legGrp, leg);
        });
      })();

      // ============================================================================
      // 9. STATE MANAGEMENT FOR FITS, PROPS & ANIMATIONS
      // ============================================================================
      let currentFit = 'henley';
      let currentAnim = 'idle';
      let shieldStage = 'mid'; // 'on' | 'mid' | 'off' (for Kill Room)
      let hoodStage = 'on';    // 'on' | 'mid' | 'off' (for Dark Passenger)
      let animTime = 0;

      // Subtle mouse pointer head tracking target
      const pointerNDC = new THREE.Vector2(0, 0);
      window.addEventListener('pointermove', (e) => {
        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      function updateFitAndProps() {
        // Toggle outfit meshes
        Object.keys(fitMeshes).forEach((key) => {
          const visible = (key === currentFit);
          fitMeshes[key].forEach((m) => { m.visible = visible; });
        });

        // Toggle Kill Room Face Shield Visor ONLY when Kill Room fit is selected and shieldStage !== 'off'
        visorGroup.visible = (currentFit === 'killroom' && shieldStage !== 'off');

        // Toggle Dark Passenger 3-Stage Hood ONLY when Dark Passenger fit is selected
        Object.keys(darkPassengerHoodStages).forEach((stageKey) => {
          const showStage = (currentFit === 'darkpassenger' && hoodStage === stageKey);
          darkPassengerHoodStages[stageKey].forEach((m) => {
            m.visible = showStage;
          });
        });

        // Hide protruding 3D hair locks when Dark Passenger Hood is pulled 'on' or when wearing the Santa Hat so zero hair clips through
        if (dexterHeadMeshGroup && dexterHeadMeshGroup.userData.hairVolumes) {
          const hideAllHairVolumes = (currentFit === 'darkpassenger' && hoodStage === 'on');
          const isSanta = (currentFit === 'santa');
          dexterHeadMeshGroup.userData.hairVolumes.forEach((hMesh, idx) => {
            // For Santa fit, keep idx 0 (sideburns/temple hair layer) visible under the hat brim like image_f49502.jpg, but hide top crown/bangs boxes (idx 1..3)
            if (hideAllHairVolumes) {
              hMesh.visible = false;
            } else if (isSanta) {
              hMesh.visible = (idx === 0);
            } else {
              hMesh.visible = true;
            }
          });
        }

        // Show Shield controls only on Kill Room fit, and Hood controls only on Dark Passenger fit
        const shieldWrapper = document.getElementById('shield-controls-wrapper');
        if (shieldWrapper) {
          shieldWrapper.classList.toggle('hidden', currentFit !== 'killroom');
          shieldWrapper.classList.toggle('flex', currentFit === 'killroom');
        }
        const hoodWrapper = document.getElementById('hood-controls-wrapper');
        if (hoodWrapper) {
          hoodWrapper.classList.toggle('hidden', currentFit !== 'darkpassenger');
          hoodWrapper.classList.toggle('flex', currentFit === 'darkpassenger');
        }

        // Determine active props based on Fit & Animation (Drill removed as requested)
        props.syringe.visible = false;
        props.knife.visible = false;
        props.bloodSlide.visible = false;
        props.slideBox.visible = false;

        if (currentAnim === 'special') {
          // In Special ("Tonight's the Night" Trophy Inspection / Visor Ritual)
          if (currentFit === 'killroom') {
            props.bloodSlide.visible = true;
          } else {
            props.bloodSlide.visible = true;
            props.slideBox.visible = true;
          }
        } else if (currentAnim === 'attack') {
          if (currentFit === 'henley') props.syringe.visible = true;
          else if (currentFit === 'killroom') props.knife.visible = true;
          else if (currentFit === 'darkpassenger') props.knife.visible = true;
          else if (currentFit === 'miamimetro') props.syringe.visible = true;
          else if (currentFit === 'santa') props.syringe.visible = true;
        } else {
          // In Idle / Walk: Kill Room is hands-free (like Ref 6 & 7); Dark Passenger holds his ritual knife
          if (currentFit === 'darkpassenger') props.knife.visible = true;
        }
      }

      updateFitAndProps();

      // ============================================================================
      // 10. PROCEDURAL ANIMATION ENGINE (IDLE, WALK, ATTACK, SPECIAL)
      // ============================================================================
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function dampEuler(euler, tx, ty, tz, speed, dt) {
        const factor = 1 - Math.exp(-speed * dt);
        euler.x = lerp(euler.x, tx, factor);
        euler.y = lerp(euler.y, ty, factor);
        euler.z = lerp(euler.z, tz, factor);
      }

      function dampVec3(vec, tx, ty, tz, speed, dt) {
        const factor = 1 - Math.exp(-speed * dt);
        vec.x = lerp(vec.x, tx, factor);
        vec.y = lerp(vec.y, ty, factor);
        vec.z = lerp(vec.z, tz, factor);
      }

      function updateAnimation(dt) {
        animTime += dt;
        const t = animTime;

        // Target transforms for each joint
        let pelvisPos = { x: 0, y: 12, z: 0 };
        let pelvisRot = { x: 0, y: 0, z: 0 };
        let torsoRot  = { x: 0, y: 0, z: 0 };
        let headRot   = { x: 0, y: 0, z: 0 };
        let rArmPos   = { x: -6, y: 11, z: 0 };
        let lArmPos   = { x: 6, y: 11, z: 0 };
        let rArmRot   = { x: 0, y: 0, z: 0 };
        let lArmRot   = { x: 0, y: 0, z: 0 };
        let rLegRot   = { x: 0, y: 0, z: 0 };
        let lLegRot   = { x: 0, y: 0, z: 0 };

        // Base visor angle from user's 3-stage selection:
        // 'on' = flipped down over face (0.04 rad), 'mid' = flipped up on forehead (-0.88 rad, Ref 4)
        let visorRotX = (shieldStage === 'on') ? 0.04 : -0.88;

        // Subtle cursor head-tracking offset
        const lookYaw = THREE.MathUtils.clamp(pointerNDC.x * 0.28, -0.35, 0.35);
        const lookPitch = THREE.MathUtils.clamp(-pointerNDC.y * 0.18, -0.25, 0.25);

        if (currentAnim === 'idle') {
          // ------------------------------------------------------------------
          // IDLE: Cycles smoothly between Ref 1 Crossed-Arms Stare & Analytical Stance
          // ------------------------------------------------------------------
          const breath = Math.sin(t * 2.1);
          const slowCycle = Math.sin(t * 0.55);
          const foldBlend = currentFit === 'henley'
            ? THREE.MathUtils.smoothstep(slowCycle, -0.2, 0.4)
            : 0; // In Henley mode, smoothly folds arms like Ref 1 (`image_f333eb.jpg`)!

          pelvisPos.y = 12 + breath * 0.08;
          torsoRot.x = breath * 0.025;
          torsoRot.y = Math.sin(t * 0.8) * 0.06;

          // Intense Dexter head tilt + subtle cursor tracking
          // When Dark Passenger hood is ON, keep head level so lower nose, mouth & chin sit clearly in the cowl opening
          const hoodChinTilt = (currentFit === 'darkpassenger' && hoodStage === 'on') ? 0.03 : 0.04;
          headRot.x = hoodChinTilt + breath * 0.02 + lookPitch;
          headRot.y = Math.sin(t * 0.9) * 0.14 + lookYaw;
          headRot.z = Math.sin(t * 0.65) * 0.045;

          if (currentFit === 'killroom') {
            // Composed Kill Room butcher stance from Ref 6 (`image_f334e0.png`) & Ref 7 (`image_f33788.png`)
            rArmRot.x = -0.10 + breath * 0.03;
            rArmRot.z = 0.09;
            lArmRot.x = -0.08 - breath * 0.03;
            lArmRot.z = -0.09;
          } else if (currentFit === 'darkpassenger') {
            // Brooding Dark Passenger stance from Ref 5 (`image_f33485.jpg`) & Ref 10 (`image_f419ba.png`)
            rArmRot.x = -0.14 + breath * 0.03;
            rArmRot.z = 0.11;
            lArmRot.x = -0.12 - breath * 0.03;
            lArmRot.z = -0.11;
          } else {
            // Interpolate between relaxed analytical stance and iconic Ref 1 Crossed Arms
            rArmPos.z = lerp(0, 1.4, foldBlend);
            lArmPos.z = lerp(0, 1.5, foldBlend);
            rArmPos.x = lerp(-6, -4.8, foldBlend);
            lArmPos.x = lerp(6, 4.8, foldBlend);

            rArmRot.x = lerp(0.06 + breath * 0.03, -1.18, foldBlend);
            rArmRot.y = lerp(0, -0.55, foldBlend);
            rArmRot.z = lerp(0.06, -0.52, foldBlend);

            lArmRot.x = lerp(-0.05 - breath * 0.03, -1.12, foldBlend);
            lArmRot.y = lerp(0, 0.58, foldBlend);
            lArmRot.z = lerp(-0.06, 0.50, foldBlend);
          }

          // Subtle wide-stance leg weight shift (Ref 1 & 2)
          rLegRot.z = -0.04;
          lLegRot.z = 0.04;
          rLegRot.y = -0.05;
          lLegRot.y = 0.05;

        } else if (currentAnim === 'walk') {
          // ------------------------------------------------------------------
          // WALK: Predatory Stalking Stride (Ref 3 `image_f33429.png`)
          // ------------------------------------------------------------------
          const speed = 4.6;
          const phase = t * speed;
          const stride = Math.sin(phase);
          const bounce = Math.abs(Math.cos(phase));

          pelvisPos.y = 12 - bounce * 0.45;
          pelvisPos.x = Math.cos(phase) * 0.25;
          pelvisRot.y = -stride * 0.08;
          pelvisRot.z = Math.cos(phase) * 0.03;

          // Predatory slight forward lean & shoulder counter-rotation
          torsoRot.x = 0.08 + bounce * 0.03;
          torsoRot.y = stride * 0.14;

          // Head stays locked forward on target while body stalks
          const walkChinTilt = (currentFit === 'darkpassenger' && hoodStage === 'on') ? 0.06 : -0.04;
          headRot.x = walkChinTilt + lookPitch * 0.6;
          headRot.y = -stride * 0.10 + lookYaw * 0.7;
          headRot.z = Math.sin(phase * 0.5) * 0.03;

          // Leg stride with natural knee-lift asymmetry
          rLegRot.x = stride * 0.62;
          lLegRot.x = -stride * 0.62;
          rLegRot.z = -0.02;
          lLegRot.z = 0.02;

          // Arm swing with elbow follow-through
          rArmRot.x = -stride * 0.48 - 0.08;
          lArmRot.x = stride * 0.48 - 0.08;
          rArmRot.z = 0.07;
          lArmRot.z = -0.07;

        } else if (currentAnim === 'attack') {
          // ------------------------------------------------------------------
          // ATTACK: M99 Syringe / Ritual Knife Precision Lunge
          // ------------------------------------------------------------------
          const cycle = (t * 1.35) % 1; // 0..1 loop

          if (cycle < 0.32) {
            // Phase 1: Stealthy coiled wind-up
            const p = THREE.MathUtils.smoothstep(cycle, 0, 0.32);
            pelvisPos.y = lerp(12, 10.9, p);
            pelvisPos.z = lerp(0, -1.2, p);
            torsoRot.x = lerp(0, 0.22, p);
            torsoRot.y = lerp(0, -0.48, p);
            headRot.y = lerp(0, 0.42, p);
            headRot.x = lerp(0, -0.12, p);

            // Right hand coils weapon high; left hand reaches out to grab/subdue
            rArmRot.x = lerp(0, -2.05, p);
            rArmRot.y = lerp(0, -0.28, p);
            rArmRot.z = lerp(0, -0.28, p);

            lArmRot.x = lerp(0, -1.15, p);
            lArmRot.y = lerp(0, 0.30, p);

            rLegRot.x = lerp(0, 0.38, p);
            lLegRot.x = lerp(0, -0.35, p);

          } else if (cycle < 0.56) {
            // Phase 2: Explosive precision strike forward!
            const p = THREE.MathUtils.smoothstep(cycle, 0.32, 0.52);
            pelvisPos.y = lerp(10.9, 11.4, p);
            pelvisPos.z = lerp(-1.2, 2.2, p);
            torsoRot.x = lerp(0.22, 0.32, p);
            torsoRot.y = lerp(-0.48, 0.52, p);
            headRot.y = lerp(0.42, -0.45, p);
            headRot.x = -0.15;

            // Right arm drives weapon forward and down into target neck/chest
            rArmRot.x = lerp(-2.05, -0.78, p);
            rArmRot.y = lerp(-0.28, 0.42, p);
            rArmRot.z = lerp(-0.28, 0.12, p);
            rArmPos.z = lerp(0, 1.2, p);

            // Left arm pulls back for torque
            lArmRot.x = lerp(-1.15, 0.35, p);
            lArmRot.z = -0.22;

            rLegRot.x = lerp(0.38, -0.42, p);
            lLegRot.x = lerp(-0.35, 0.45, p);

          } else {
            // Phase 3: Composed recovery & cold analytical head tilt
            const p = THREE.MathUtils.smoothstep(cycle, 0.56, 1.0);
            pelvisPos.y = lerp(11.4, 12, p);
            pelvisPos.z = lerp(2.2, 0, p);
            torsoRot.x = lerp(0.32, 0, p);
            torsoRot.y = lerp(0.52, 0, p);
            headRot.y = lerp(-0.45, 0, p);
            headRot.z = Math.sin(p * Math.PI) * 0.12;

            rArmRot.x = lerp(-0.82, 0, p);
            rArmRot.y = lerp(0.42, 0, p);
            lArmRot.x = lerp(0.35, 0, p);

            rLegRot.x = lerp(-0.42, 0, p);
            lLegRot.x = lerp(0.45, 0, p);
          }

        } else if (currentAnim === 'special') {
          // ------------------------------------------------------------------
          // SPECIAL: "Tonight's the Night" — Blood Slide Trophy Inspection / Visor Ritual
          // ------------------------------------------------------------------
          const cycle = (t * 0.45) % 1;
          const lift = Math.sin(cycle * Math.PI);

          pelvisPos.y = 12 + Math.sin(t * 2.0) * 0.07;
          torsoRot.x = -0.06 * lift;
          torsoRot.y = Math.sin(cycle * Math.PI * 2) * 0.12;

          if (currentFit === 'killroom') {
            // Left hand raised to forehead adjusting the clear surgical visor while right hand holds up a fresh Blood Slide trophy
            lArmRot.x = -2.25 - Math.sin(t * 3.0) * 0.06;
            lArmRot.y = 0.35;
            lArmRot.z = 0.28;
            lArmPos.z = 1.1;

            rArmRot.x = lerp(-0.85, -1.55, lift);
            rArmRot.y = lerp(-0.18, -0.35, lift);
            rArmRot.z = -0.15;
            rArmPos.z = 1.1;

            headRot.x = -0.10;
            headRot.y = 0.15 * Math.sin(t * 1.4);
            headRot.z = -0.06;
            if (shieldStage === 'mid') {
              visorRotX = -0.82 + Math.sin(t * 2.2) * 0.12;
            }
          } else {
            // Left hand holds open the Wooden Blood Slide Box;
            // Right hand lifts the crimson Glass Blood Slide up to eye level (Ref 9 `image_f33c46.jpg`)
            lArmRot.x = -1.05;
            lArmRot.y = 0.38;
            lArmRot.z = 0.15;
            lArmPos.z = 1.0;

            rArmRot.x = lerp(-0.9, -1.68, lift);
            rArmRot.y = lerp(-0.2, -0.42, lift);
            rArmRot.z = -0.18;
            rArmPos.z = 1.2;

            // Head tilts to admire the blood slide at eye level
            headRot.x = lerp(0.12, -0.08, lift);
            headRot.y = -0.18 * lift;
            headRot.z = 0.09 * lift;
          }
        }

        // Apply smooth exponential damping to all rig joints
        const dampSpeed = 14.0;
        dampVec3(pelvisGroup.position, pelvisPos.x, pelvisPos.y, pelvisPos.z, dampSpeed, dt);
        dampEuler(pelvisGroup.rotation, pelvisRot.x, pelvisRot.y, pelvisRot.z, dampSpeed, dt);
        dampEuler(torsoGroup.rotation, torsoRot.x, torsoRot.y, torsoRot.z, dampSpeed, dt);
        dampEuler(headGroup.rotation, headRot.x, headRot.y, headRot.z, dampSpeed, dt);

        dampVec3(rightArmGroup.position, rArmPos.x, rArmPos.y, rArmPos.z, dampSpeed, dt);
        dampVec3(leftArmGroup.position, lArmPos.x, lArmPos.y, lArmPos.z, dampSpeed, dt);
        dampEuler(rightArmGroup.rotation, rArmRot.x, rArmRot.y, rArmRot.z, dampSpeed, dt);
        dampEuler(leftArmGroup.rotation, lArmRot.x, lArmRot.y, lArmRot.z, dampSpeed, dt);

        dampEuler(rightLegGroup.rotation, rLegRot.x, rLegRot.y, rLegRot.z, dampSpeed, dt);
        dampEuler(leftLegGroup.rotation, lLegRot.x, lLegRot.y, lLegRot.z, dampSpeed, dt);

        if (visorGroup.userData.visorPivot) {
          const vp = visorGroup.userData.visorPivot;
          vp.rotation.x = lerp(vp.rotation.x, visorRotX, 1 - Math.exp(-12 * dt));
        }
      }

      // ============================================================================
      // 11. UI EVENT LISTENERS & CAMERA RESET
      // ============================================================================
      const animButtons = document.querySelectorAll('[data-anim]');
      const fitButtons = document.querySelectorAll('[data-fit]');
      const shieldButtons = document.querySelectorAll('[data-shield]');
      const hoodButtons = document.querySelectorAll('[data-hood]');
      const resetCamBtn = document.getElementById('reset-camera-btn');

      animButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          currentAnim = btn.getAttribute('data-anim');
          animTime = 0;
          animButtons.forEach((b) => b.classList.remove('active-anim'));
          btn.classList.add('active-anim');
          updateFitAndProps();
        });
      });

      fitButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          currentFit = btn.getAttribute('data-fit');
          fitButtons.forEach((b) => b.classList.remove('active-fit'));
          btn.classList.add('active-fit');
          updateFitAndProps();
        });
      });

      shieldButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          shieldStage = btn.getAttribute('data-shield');
          shieldButtons.forEach((b) => b.classList.remove('active-shield'));
          btn.classList.add('active-shield');
          // Automatically switch to Kill Room fit if user clicks a Shield stage while in another fit
          if (currentFit !== 'killroom') {
            currentFit = 'killroom';
            fitButtons.forEach((b) => {
              b.classList.toggle('active-fit', b.getAttribute('data-fit') === 'killroom');
            });
          }
          updateFitAndProps();
        });
      });

      hoodButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          hoodStage = btn.getAttribute('data-hood');
          hoodButtons.forEach((b) => b.classList.remove('active-hood'));
          btn.classList.add('active-hood');
          // Automatically switch to Dark Passenger fit if user clicks a Hood stage while in another fit
          if (currentFit !== 'darkpassenger') {
            currentFit = 'darkpassenger';
            fitButtons.forEach((b) => {
              b.classList.toggle('active-fit', b.getAttribute('data-fit') === 'darkpassenger');
            });
          }
          updateFitAndProps();
        });
      });

      let isResettingCamera = false;
      resetCamBtn.addEventListener('click', () => {
        isResettingCamera = true;
      });

      controls.addEventListener('start', () => {
        isResettingCamera = false;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ============================================================================
      // 12. LOCKED 60 FPS DELTA-TIME RENDER LOOP
      // ============================================================================
      let lastFrameTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);

        const rawDt = (now - lastFrameTime) / 1000;
        lastFrameTime = now;
        const dt = Math.min(rawDt, 0.05); // Clamp delta time to prevent jumps on tab switch

        if (isResettingCamera) {
          const factor = 1 - Math.exp(-8.5 * dt);
          camera.position.lerp(DEFAULT_CAM_POS, factor);
          controls.target.lerp(DEFAULT_CAM_TARGET, factor);
          if (
            camera.position.distanceTo(DEFAULT_CAM_POS) < 0.05 &&
            controls.target.distanceTo(DEFAULT_CAM_TARGET) < 0.05
          ) {
            camera.position.copy(DEFAULT_CAM_POS);
            controls.target.copy(DEFAULT_CAM_TARGET);
            isResettingCamera = false;
          }
        }

        controls.update();
        updateAnimation(dt);
        renderer.render(scene, camera);
      }

      window.onload = function () {
        lastFrameTime = performance.now();
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
